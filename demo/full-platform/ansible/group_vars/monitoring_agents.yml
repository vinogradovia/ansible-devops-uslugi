---
# monitoring_agent — systemd-режим на всех VM, кроме platform (не нужна ещё одна
# docker-зависимость ради пары экспортёров, тот же выбор, что demo/mysql-ha-platform §4).
# node_exporter — единственный экспортёр, общий для всех агентских хостов; per-host экспортёры
# (mysqld_exporter, postgres_exporter) включены в group_vars/mysql_primary.yml и
# group_vars/postgresql_primary.yml соответственно.
monitoring_agent_orchestrator: systemd

monitoring_agent_node_exporter_enabled: true
