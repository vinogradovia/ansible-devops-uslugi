---
# Общие для нескольких групп/плеев значения — вынесены сюда, чтобы не дублировать один и тот же
# пароль/имя в group_vars нескольких хостов (тот же паттерн, что demo/mysql-ha-platform,
# demo/postgresql-ha-platform).

# proxysql_monitor_user/_password (роль proxysql, health-check backend'ов) нужны и на хосте
# proxysql (сама роль), и на mysql (site.yml, ad hoc задача "Create proxysql_monitor user") —
# mysql никогда не применяет роль proxysql, поэтому её defaults/main.yml там не резолвятся.
proxysql_monitor_user: proxysql_monitor
proxysql_monitor_password: "demo-proxysql-monitor-password-CHANGE-ME"

# Пароль приложенческого MySQL-пользователя — нужен и на mysql (реальный backend-юзер), и на
# proxysql (group_vars/proxysql_hosts.yml, proxysql_mysql_users).
demo_app_mysql_password: "demo-app-mysql-password-CHANGE-ME"

# odyssey_backend_user/_password — тот же пользователь, которым Odyssey одновременно
# аутентифицирует клиентов db-write-pg/db-read-pg и подключается к backend'у
# (roles/odyssey/README.md, "Учётная запись на backend'ах — забота оператора"). Нужны и на
# odyssey (сама роль), и на postgresql (site.yml, ad hoc задача "Create odyssey backend
# application user").
odyssey_backend_user: demo_app
odyssey_backend_password: "demo-app-postgres-password-CHANGE-ME"

# odyssey_write_database_name/_read_database_name — см. roles/odyssey/README.md: Odyssey
# подключается к backend'у с тем же именем БД, что запросил клиент, поэтому имя маршрута обязано
# совпадать с реальным именем БД на postgresql. Нужны и на odyssey (сама роль), и на postgresql
# (ad hoc-задачи создания демо-БД/грантов).
odyssey_write_database_name: demo_app
odyssey_read_database_name: postgres
