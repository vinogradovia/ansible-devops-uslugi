---
# ADR-0006 §4: monitoring_agent — везде systemd-режим (не docker), хосты с базами/ProxySQL не
# нуждаются в лишней docker-зависимости ради пары экспортёров.
monitoring_agent_orchestrator: systemd

monitoring_agent_node_exporter_enabled: true

# ADR-0006 §5: Promtail на всех агентских хостах, шлёт логи в Loki (loki_gateway, host-порт 3100
# на monitoring-server — см. group_vars/monitoring_servers.yml и
# roles/monitoring_server/templates/compose-monitoring-server.yml.j2).
monitoring_agent_promtail_enabled: true
monitoring_agent_promtail_loki_addr: "http://10.66.6.10:3100"
