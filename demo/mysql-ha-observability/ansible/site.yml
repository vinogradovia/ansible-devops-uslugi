---
# ADR-0006 §6: запуск вручную —
#   ansible-playbook -i inventory.yml site.yml
#
# Порядок плеев важен:
#  1. monitoring_server — не зависит от остальных, можно первым.
#  2. monitoring_agent — независим от mysql_replication/proxysql (просто ставит экспортёры).
#  3. mysql_replication на mysql_primary ДО реплик (roles/mysql_replication/README.md,
#     "Discovery версии" — реплики читают mysql_replication_discovered_version через hostvars).
#  4. Ad hoc DB-пользователи (proxysql_monitor, mysqld-exporter, приложенческий) — заводятся
#     здесь, а не в ролях (ADR-0004 §11, композиция на уровне плейбука-оркестратора, не
#     meta-зависимость), ПОСЛЕ primary, но ДО proxysql (иначе backend'ы будут не ONLINE).
#  5. proxysql — нужны живые backend'ы (mysql_primary/mysql_read_replica) и monitor-пользователь.
#  6. infra_dns — не зависит от остальных по порядку, но логически "точка входа последней мили".
#  7. load_generator — нужен весь стек живым (DNS → ProxySQL → MySQL).

- name: monitoring_server (docker)
  hosts: monitoring_servers
  become: true
  roles:
    - monitoring_server

- name: monitoring_agent (systemd) — node_exporter + promtail на всех агентских хостах
  hosts: monitoring_agents
  become: true
  roles:
    - monitoring_agent

- name: mysql_replication — primary
  hosts: mysql_primary
  become: true
  roles:
    - mysql_replication

- name: mysql_replication — реплики
  hosts: mysql_read_replica:mysql_dr_replica
  become: true
  vars:
    mysql_replication_target_version: >-
      {{ hostvars[groups['mysql_primary'][0]].mysql_replication_discovered_version }}
  roles:
    - mysql_replication

- name: Ad hoc DB-пользователи на primary (композиция, не зона ответственности ролей)
  hosts: mysql_primary
  become: true
  vars:
    mysql_login_unix_socket: /var/run/mysqld/mysqld.sock
  tasks:
    - name: Create proxysql_monitor user (health-check, roles/proxysql/README.md)
      ansible.mysql.mysql_user:
        login_unix_socket: "{{ mysql_login_unix_socket }}"
        name: "{{ proxysql_monitor_user }}"
        host: '%'
        password: "{{ proxysql_monitor_password }}"
        priv: "*.*:REPLICATION CLIENT"
        state: present

    - name: Create mysqld_exporter user (стандартные права prometheus/mysqld_exporter)
      ansible.mysql.mysql_user:
        login_unix_socket: "{{ mysql_login_unix_socket }}"
        name: "{{ monitoring_agent_mysqld_exporter_user }}"
        host: "{{ monitoring_agent_mysqld_exporter_hosts }}"
        password: "{{ monitoring_agent_mysqld_exporter_password }}"
        priv: "*.*:PROCESS,REPLICATION CLIENT,SELECT"
        state: present

    - name: Create demo schema for load-generator
      ansible.mysql.mysql_db:
        login_unix_socket: "{{ mysql_login_unix_socket }}"
        name: loadgen_demo
        state: present

    - name: Create demo table for load-generator
      ansible.mysql.mysql_query:
        login_unix_socket: "{{ mysql_login_unix_socket }}"
        login_db: loadgen_demo
        query: >-
          CREATE TABLE IF NOT EXISTS pings (
            id BIGINT AUTO_INCREMENT PRIMARY KEY,
            created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
            source VARCHAR(64) NOT NULL
          )

    # proxysql_mysql_users (group_vars/proxysql_hosts.yml) настраивает, каким пользователям
    # ProxySQL разрешает подключаться К СЕБЕ — но сам backend-сервер должен знать того же
    # пользователя с тем же паролем (ProxySQL не транслирует креды при проксировании).
    - name: Create loadgen application user on the real backend
      ansible.mysql.mysql_user:
        login_unix_socket: "{{ mysql_login_unix_socket }}"
        name: loadgen
        host: '%'
        password: "{{ demo_loadgen_mysql_password }}"
        priv: "loadgen_demo.*:ALL"
        state: present

- name: proxysql
  hosts: proxysql_hosts
  become: true
  roles:
    - proxysql

- name: infra_dns
  hosts: infra_dns
  become: true
  roles:
    - infra_dns

- import_playbook: load-generator.yml
