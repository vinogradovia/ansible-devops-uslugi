---
# ADR-0006 §4/§5: monitoring_server, docker-оркестратор — нужен для Loki+MinIO.
#
# Пароли — открытым текстом (не Ansible Vault). Осознанное упрощение ТОЛЬКО для этого демо-стенда
# (ADR-0006 §9): стенд не подключён к внешней сети, реальных данных не хранит. НЕ переносить этот
# паттерн на роли коллекции — там (mysql_replication, proxysql, postgresql_replication/odyssey)
# обязательный Vault остаётся в силе.

monitoring_server_orchestrator: docker

# ADR-0008 (infra_panel) добавил reverse_proxy_traefik в этот кейс (site.yml — играется ДО
# monitoring_server) — теперь сеть "proxy" создаёт и владеет ею reverse_proxy_traefik, а не
# monitoring_server сам (было external: false, пока в кейсе вообще не было ни одной
# reverse-proxy роли — см. историю коммитов). Grafana/VictoriaMetrics по-прежнему остаются
# доступны напрямую по host-портам (3000/8428) в дополнение к домену через Traefik.
monitoring_server_docker_proxy_network_external: true

monitoring_server_victoria_metrics_enabled: true

monitoring_server_grafana_enabled: true
monitoring_server_grafana_security_admin_password: "demo-grafana-admin-CHANGE-ME"

# Реальный домен зоны mysql-ha-platform.demo (group_vars/infra_dns.yml), а не дефолт роли
# (.docker.localhost) — нужен и для собственного traefik-роута Grafana, и для авто-ссылки на
# Grafana в infra_panel (ADR-0008 §3, читает именно эту переменную).
monitoring_server_grafana_server_domain: grafana.mysql-ha-platform.demo
monitoring_server_grafana_server_root_url: "https://grafana.mysql-ha-platform.demo"

# ADR-0006 §5: Loki требует local_storage_s3_enabled (Loki хардкодит object_store: s3, локальной
# файловой альтернативы не реализовано, roles/monitoring_server/tasks/
# check-and-install-requirements.docker.yml). Внешний S3 не нужен — роль сама поднимает MinIO.
monitoring_server_local_storage_s3_enabled: true
monitoring_server_local_storage_s3:
  access_key: demo-minio-access-key
  secret_key: demo-minio-secret-key-CHANGE-ME

monitoring_server_grafana_loki_enabled: true

# Дашборд-группы (ADR-0007 §2.4/§8) — все monitoring_server_grafana_dashboards_group_defaults_*
# по умолчанию enable: false, без явного override здесь ни одна не провижинится (найдено
# реальным прогоном — Grafana была пуста, хотя датасорсы VictoriaMetrics/Loki уже были здоровы).
# "mysql" — про mysqld_exporter на трёх MySQL-хостах. "node_exporter" — про node_exporter,
# включённый на ВСЕХ агентских хостах (group_vars/monitoring_agents.yml). Остальные (nginx/pve1/
# blackbox/php_fpm/redis/freeipa/prom_client) — не про этот кейс, не включаем.
monitoring_server_grafana_dashboards_group_install:
  mysql:
    enable: true
  node_exporter:
    enable: true

# --- reverse_proxy_traefik (ADR-0008) ---------------------------------------------------------
# Владеет docker-сетью "proxy" в этом кейсе (см. комментарий выше про
# monitoring_server_docker_proxy_network_external). Реальный домен зоны, а не дефолт роли
# (docker.localhost) — чтобы whoami/дашборд Traefik тоже резолвились через infra_dns.
reverse_proxy_traefik_internal_domain: mysql-ha-platform.demo
reverse_proxy_traefik_dashboard_users:
  - name: monitor
    password: "demo-traefik-dashboard-CHANGE-ME"

# --- infra_panel (ADR-0008) --------------------------------------------------------------------
infra_panel_domain: infra-panel.mysql-ha-platform.demo
infra_panel_users:
  - name: admin
    password: "demo-infra-panel-admin-CHANGE-ME"

# Авто-блок (ADR-0008 §3) добавит только Grafana (единственный компонент monitoring_server с
# собственным доменом в docker-пути) — VictoriaMetrics/MinIO своего домена/traefik-роута не
# имеют (technical debt, см. ADR), поэтому заведены сюда вручную по прямым host-портам того же
# хоста monitoring-server.
infra_panel_extra_services:
  - name: Storage
    icon: "mdi mdi-database"
    items:
      - name: VictoriaMetrics
        icon: "mdi mdi-chart-line"
        url: "http://monitoring-server.mysql-ha-platform.demo:8428/vmui/"
        target: _blank
      - name: MinIO Console
        icon: "mdi mdi-bucket"
        url: "http://monitoring-server.mysql-ha-platform.demo:9001/"
        target: _blank
