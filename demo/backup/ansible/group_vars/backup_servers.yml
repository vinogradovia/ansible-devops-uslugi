---
# ADR-0006 §9: пароли открытым текстом — допустимо только в демо-стенде (изолированная локальная
# сеть, без Vault). НЕ переносить этот паттерн в production inventory.

backup_server_director_password: demo-backup-director-password
backup_server_storage_password: demo-backup-storage-password
backup_server_catalog_db_password: demo-backup-catalog-password
backup_server_self_backup_client_password: demo-backup-selffd-password

# Пароли должны совпадать с backup_agent_client_password в group_vars/client_a.yml/client_b.yml —
# интеграция backup_server <-> backup_agent вручную, без кросс-ролевого автообнаружения (см.
# roles/backup_agent/README.md).
backup_server_clients:
  - name: client-a-fd
    address: 10.66.11.20
    password: demo-backup-client-a-password
    fileset: client-a-files
  - name: client-b-fd
    address: 10.66.11.21
    password: demo-backup-client-b-password
    fileset: client-b-files

backup_server_filesets:
  - name: client-a-files
    content: |
      Include {
        Options { Signature = XXH128 }
        File = /var/www/app-a
      }
  - name: client-b-files
    content: |
      Include {
        Options { Signature = XXH128 }
        File = /var/lib/app-b-data
      }

# --- Web UI (docs/adr/0009-backup-server-role.md §9/§10) ------------------------------------------
backup_server_webui_enabled: true
backup_server_webui_console_password: demo-backup-webui-console-password
backup_server_webui_reverse_proxy_server_name: backup-webui.backup.demo
# Отключено осознанно (запрос пользователя) — у bareos-webui-new есть собственный логин (Console,
# см. выше), доп. слой basic-auth избыточен для этого демо-стенда (изолированная локальная сеть).
backup_server_webui_reverse_proxy_basic_auth_enabled: false

# --- reverse_proxy_traefik (ADR-0008) — владеет docker-сетью "proxy" в этом кейсе -----------------
reverse_proxy_traefik_internal_domain: backup.demo
reverse_proxy_traefik_dashboard_users:
  - name: monitor
    password: demo-traefik-dashboard-CHANGE-ME

# --- infra_panel (ADR-0008) — ссылка на веб-UI backup_server --------------------------------------
infra_panel_domain: infra-panel.backup.demo
infra_panel_users:
  - name: admin
    password: demo-infra-panel-admin-CHANGE-ME
infra_panel_extra_services:
  - name: Backup
    icon: "mdi mdi-backup-restore"
    items:
      - name: Bareos WebUI
        icon: "mdi mdi-server"
        url: "https://{{ backup_server_webui_reverse_proxy_server_name }}/bareos-webui-new/"
        target: _blank
