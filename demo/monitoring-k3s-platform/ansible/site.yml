---
# ADR-0006 §6 / ADR-0007 §6/§11: запуск вручную —
#   ansible-playbook -i inventory.yml site.yml --tags all,init
#
# --tags all,init обязателен для k3s-пути: roles/monitoring_server/meta/main.yml объявляет
# зависимость на xanmanning.k3s с tags: [init, never] — "never" исключает роль из ЛЮБОГО прогона,
# если явно не запросить тег "init"; но один только "--tags init" отфильтровал бы и все обычные
# (без тегов) таски самой роли monitoring_server — нужна именно комбинация "all,init"
# (эмпирически проверено, см. extensions/molecule/monitoring_server_k3s/molecule.yml,
# provisioner.options.tags).
#
# Плеи независимы друг от друга (monitoring_agent просто ставит node_exporter, ни от чего не
# зависит) — порядок не принципиален.

- name: monitoring_server (k3s) + infra_panel (ADR-0008)
  hosts: monitoring_servers
  become: true
  roles:
    # infra_panel ДО monitoring_server при infra_panel_orchestrator: k3s — роль только рендерит
    # values-файл релиза homer на control-хосте, применяет его следующий "Helmwave up"
    # (см. roles/infra_panel/README.md, "k3s: переменные").
    - infra_panel
    - monitoring_server

- name: monitoring_agent (systemd) — только node_exporter
  hosts: monitoring_agents
  become: true
  roles:
    - monitoring_agent
