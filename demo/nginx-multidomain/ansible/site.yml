---
# ADR-0006 §6: запуск вручную —
#   ansible-playbook -i inventory.yml site.yml
#
# Демонстрирует связку nginx_multidomain + fail2ban (ROADMAP Backlog №47): реальный вхост с
# rate-limit-зоной (nginx_multidomain) банится через штатный filter: nginx-limit-req самого
# пакета fail2ban — bundled-фильтр здесь не нужен (см. roles/fail2ban/README.md, "Известные
# интеграции"). fail2ban_ui поверх — веб-панель для наблюдения за банами.
#
# Порядок ролей важен: nginx_multidomain — первая (ставит nginx, создаёт vhost и rate-limit-зону,
# без которых fail2ban-jail из group_vars нечего было бы банить и не на что смотреть в error-логе);
# fail2ban — вторая (ставит сам Fail2Ban и настраивает jail); fail2ban_ui — третья (её
# nginx-reverse-proxy путь пишет ОТДЕЛЬНЫЙ файл в conf.d, не трогает vhost'ы nginx_multidomain —
# оба сосуществуют на одном nginx через разные server_name).

- name: nginx-multidomain
  hosts: nginx_multidomain_hosts
  become: true
  pre_tasks:
    # Без ожидания cloud-init мог ещё держать /var/lib/apt/lists/lock своим собственным
    # package_update — apt-задачи ролей ниже падают "No package matching ... is available"
    # (гонка, найдено реальным прогоном на свежесозданной VM в demo/fail2ban-ui, ныне этот
    # кейс). Тот же паттерн, что extensions/molecule/*/prepare.yml.
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    # nginx_multidomain не создаёт содержимое сайта (только vhost-конфиг, docs/adr/
    # 0003-ginx-multidomain-role.md) — root-каталог и index.html заводим ad hoc, тот же принцип
    # композиции, что и demo-схема в других кейсах (роль отвечает только за свою зону
    # ответственности).
    - name: Создать root-каталог демо-домена
      ansible.builtin.file:
        path: /var/www/app.nginx-multidomain.demo/public
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Создать index.html демо-домена
      ansible.builtin.copy:
        dest: /var/www/app.nginx-multidomain.demo/public/index.html
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <!doctype html>
          <html><body><h1>nginx_multidomain demo (rate-limited)</h1></body></html>

  roles:
    - nginx_multidomain
    - fail2ban
    - fail2ban_ui
