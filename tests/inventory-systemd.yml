---
all:
  vars:
    ansible_user: ansible
    ansible_ssh_password: ansible
    ansible_become_password: "{{ ansible_ssh_password }}"
  hosts:
    test-host:
      # ansible_host: 10.20.30.240
      ansible_host: 192.168.89.21
  children:
    fail2ban_ui:
      hosts:
        test-host:
          fail2ban_ui_orchestrator: systemd
          fail2ban_ui_bind_address: 0.0.0.0
          fail2ban_ui_callback_url: https://fail2ban.example.com:8443
          fail2ban_ui_reverse_proxy_server_name: fail2ban.example.com
          fail2ban_ui_reverse_proxy: nginx
          fail2ban_ui_reverse_proxy_http_port: 88
          fail2ban_ui_reverse_proxy_https_port: 8443
    monitoring_agents:
      hosts:
        test-host:
          monitoring_agent_orchestrator: systemd
          # monitoring_agent_ipa_exporter_enabled: true
          # monitoring_agent_redis_exporter_enabled: true
          # monitoring_agent_nginx_exporter_enabled: true
          # monitoring_agent_nginxlog_exporter_enabled: true
          # monitoring_agent_nginxlog_exporter_parser: "json"
          monitoring_agent_mysqld_exporter_enabled: true
          monitoring_agent_mysqld_exporter_password: mmhpaw76
