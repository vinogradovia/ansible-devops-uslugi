---
all:
  children:
    monitoring_agents:
      hosts:
        test-host:
          ansible_host: 10.20.30.240
          # ansible_host: 192.168.89.93
          ansible_user: ansible
          # ansible_ssh_password: ansible
          # ansible_become_password: "{{ ansible_ssh_password }}"
          monitoring_agent_orchestrator: docker
          monitoring_agent_ipa_exporter_enabled: true
          monitoring_agent_redis_exporter_enabled: true
          monitoring_agent_nginx_exporter_enabled: true
          monitoring_agent_nginxlog_exporter_enabled: true
          monitoring_agent_nginxlog_exporter_parser: "json"
          monitoring_agent_mysqld_exporter_enabled: true
          monitoring_agent_mysqld_exporter_password: mmhpaw76
          infra_dns_listen_on:
            - 10.20.30.240
          infra_dns_allow_query:
            - 10.20.30.0/24
            - 10.20.31.0/24
          infra_dns_forwarders:
            - 8.8.8.8
            - 8.8.4.4
          infra_dns_zones:
            - name: in.moon.ru
              soa_ns: sl-dns-01.in.moon.ru
              ns_records:
                - "sl-dns-01.in.moon.ru."
              records:
                - {name: sl-dns-01, type: A, value: 10.20.30.240}
                - {name: fd-mon-01, type: A, value: 10.20.30.15}
                - {name: fd-logs-01, type: A, value: 10.20.30.16}
                - {name: sl-proxy-01, type: A, value: 10.20.30.110}
                - {name: fd-zabbix-server-01, type: A, value: 10.20.30.3}
                - {name: fd-mysql-01, type: A, value: 10.20.30.229}
                - {name: fd-backend-moon-01, type: A, value: 10.20.30.11}
                - {name: sl-ldap-01, type: A, value: 10.20.30.13}
                - {name: sl-react-01, type: A, value: 10.20.30.14}
            - name: 30.20.10.in-addr.arpa
              soa_ns: sl-dns-01.in.moon.ru
              soa_contact: hostmaster.in.moon.ru
              ns_records:
                - "sl-dns-01.in.moon.ru."
              records:
                - {name: "240", type: PTR, value: "sl-dns-01.in.moon.ru."}
                - {name: "15", type: PTR, value: "fd-mon-01.in.moon.ru."}
                - {name: "16", type: PTR, value: "fd-logs-01.in.moon.ru."}
                - {name: "110", type: PTR, value: "sl-proxy-01.in.moon.ru."}
                - {name: "3", type: PTR, value: "fd-zabbix-server-01.in.moon.ru."}
                - {name: "229", type: PTR, value: "fd-mysql-01.in.moon.ru."}
                - {name: "11", type: PTR, value: "fd-backend-moon-01.in.moon.ru."}
                - {name: "13", type: PTR, value: "sl-ldap-01.in.moon.ru."}
                - {name: "14", type: PTR, value: "sl-react-01.in.moon.ru."}
              include_hosts: false
    monitoring_servers:
      hosts:
        test-host:
          # ansible_host: 10.20.30.240
          # ansible_host: 192.168.89.93
          ansible_user: ansible
          # ansible_ssh_password: ansible
          # ansible_become_password: "{{ ansible_ssh_password }}"
          # monitoring_server_orchestrator: k3s
          monitoring_server_helmwave_dir: /opt/integrus_local/kube-devops-uslugi/
          monitoring_server_docker_proxy_network_external: false
          monitoring_server_victoria_metrics_enabled: true
          monitoring_server_grafana_enabled: true
          monitoring_server_grafana_security_admin_password: admin
          monitoring_server_grafana_dashboards_group_install:
            mysql:
              enable: true
            nginx:
              enable: true
