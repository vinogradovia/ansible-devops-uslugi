# Схема-пример анкеты клиента. Значения ниже — заглушки для документации, НЕ копировать как
# есть. Реальный заполненный файл живёт ТОЛЬКО в целевом (клиентском) репозитории, никогда в
# этой коллекции и никогда внутри .claude/skills/client-onboarding/.

client: example                     # slug клиента: [a-z0-9-]+, используется как имя релиза/сети/пула
domain_internal: infra.example.com  # внутренний домен для DNS/TLS-CN клиентских ВМ

# Host Naming Policy (ADR-0025 §6) — ОТДЕЛЬНОЕ от `client` поле: `client` может быть длиннее и
# используется для релиза/сети/домена, `site_code` — короткий код площадки (2-3 символа, до 6,
# если внутри площадки нужно уточнить регион), входит в hostname каждой ВМ ниже
# ([site_code]-[env]-[сервис][nn]). Только [a-z0-9], без дефисов внутри самого кода (дефис —
# разделитель шаблона).
site_code: ex

provider: proxmox                   # proxmox | libvirt — определяет, какой terraform-modules/site-* используется

# Присутствует только если provider: proxmox (см. terraform-modules/site-proxmox/README.md
# «Предусловия» — cloud-init шаблон и API-токен должны существовать ДО первого apply).
proxmox:
  node: proxmox-node-name
  datastore_id: local-lvm
  network_bridge: vmbr1
  gateway: 10.0.0.1
  template_vmid: 9000               # уже подготовленный cloud-init шаблон, terraform его не создаёт

# Присутствует только если provider: libvirt (см. terraform-modules/site-libvirt/README.md).
# libvirt:
#   libvirt_uri: qemu:///system
#   network_cidr: 10.66.30.0/24
#   base_images:
#     default: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-generic-amd64.qcow2

ssh_public_key_path: ~/.ssh/id_ed25519.pub
ansible_user: ansible

# Список ВМ клиента. `name` — НЕ свободный текст: собирается скиллом по шаблону Host Naming
# Policy (ADR-0025 §6) — [site_code]-[env]-[сервис][nn]. `env` по умолчанию "p" (prod), КРОМЕ
# dns/ipa/gitlab — у них дефолт "i" (infra: обслуживают саму инфраструктуру клиента, не прямая
# бизнес-нагрузка). Можно переопределить на уровне ВМ в любую сторону (см. k3s-agent ниже —
# явный "i", служебный узел, не prod-нагрузка). Код сервиса выводится из `role` (закрытый
# словарь ADR-0025 §6: dns/ipa/db/cache/doc/stor/gitlab/srv/k8s/prx), не задаётся отдельно.
# Порядковый номер — в рамках одной пары site_code+env+сервис, не сквозной.
#
# `role` — что заводит Ansible поверх ВМ:
#   - devops.uslugi.<role> — уже существующая роль коллекции, применяется как есть
#   - stub:<name> — роли нет, ВМ поднимается и получает только базовый hardening
#     (devops.uslugi.fail2ban), установка софта — TODO в сгенерированном site.yml
#   - k3s_server / k3s_agent_tainted — не роль, отдельный k3s-bootstrap play (см. SKILL.md §4)
#   - none — голая ВМ без единой прикладной задачи (например, будущий gitlab-хост "просто ВМ")
vms:
  - name: ex-i-dns01            # env "i" — DNS обслуживает саму инфраструктуру клиента
    role: devops.uslugi.infra_dns
    cores: 1
    memory: 1024
    disk_gb: 10
    ip_cidr: 10.0.0.10/24

  - name: ex-i-ipa01            # env "i" — каталог (LDAP/Kerberos/CA), та же логика
    role: devops.uslugi.freeipa
    # template_vmid переопределяет дефолтный proxmox.template_vmid клиента ТОЛЬКО для этой ВМ —
    # freeipa требует RHEL-семейство (dnf), пакета freeipa-server для Ubuntu/Debian не
    # существует (roles/freeipa/README.md, «Целевая ОС»). Значение — VMID отдельного Rocky 9
    # cloud-init шаблона (docs/proxmox-templates.md часть 2), подготовленного на том же node
    # ДО apply; без этого поля ВМ молча получит Ubuntu-шаблон клиента и роль freeipa упадёт на
    # первом же реальном ansible-playbook (не ловится --syntax-check).
    template_vmid: 9001
    cores: 2
    memory: 2048
    disk_gb: 20
    ip_cidr: 10.0.0.11/24

  - name: ex-p-db01
    role: devops.uslugi.postgresql
    cores: 2
    memory: 4096
    disk_gb: 40
    ip_cidr: 10.0.0.12/24

  - name: ex-p-cache01
    role: stub:redis
    cores: 1
    memory: 2048
    disk_gb: 15
    ip_cidr: 10.0.0.13/24

  - name: ex-p-stor01
    role: stub:minio
    cores: 2
    memory: 2048
    disk_gb: 100
    ip_cidr: 10.0.0.14/24

  - name: ex-p-prx01
    role: devops.uslugi.nginx_multidomain   # reverse-proxy / shared-hosting nginx
    cores: 2
    memory: 2048
    disk_gb: 20
    ip_cidr: 10.0.0.16/24

  - name: ex-p-srv01
    role: none
    cores: 4
    memory: 8192
    disk_gb: 60
    ip_cidr: 10.0.0.15/24

  - name: ex-p-k8s01            # присутствие этой роли в анкете запускает генерацию helm/ в
    role: k3s_server            # целевом репозитории (SKILL.md §4a, ADR-0025 §4a)
    cores: 2
    memory: 4096
    disk_gb: 40
    ip_cidr: 10.0.0.20/24

  - name: ex-i-k8s02             # env "i", не "p" — служебный узел под мониторинг, не prod-нагрузка
    role: k3s_agent_tainted
    taint: monitoring
    cores: 2
    memory: 4096
    disk_gb: 40
    ip_cidr: 10.0.0.21/24

# Открытый вопрос, не решается этим файлом (см. ADR-0025) — оставить как есть до отдельного
# решения, не менять молча внутри скилла.
integration_with_platform: undecided
