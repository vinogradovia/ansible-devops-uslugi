---
# Molecule-сценарий для samba_server. driver: vagrant/libvirt (единое требование для всех
# molecule-сценариев коллекции, см. CLAUDE.md, «Molecule-тесты») — полноценная одноразовая ВМ,
# полностью уничтожается на destroy.
driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: samba-server
    box: cloud-image/ubuntu-24.04
    memory: 1024
    cpus: 1

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

shared_state: false

ansible:
  executor:
    args:
      ansible_playbook: []
