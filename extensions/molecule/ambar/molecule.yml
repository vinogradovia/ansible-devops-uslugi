---
# Molecule-сценарий для ambar — driver: vagrant/libvirt (единое требование для всех
# molecule-сценариев коллекции, см. CLAUDE.md, «Molecule-тесты»): полноценная одноразовая ВМ,
# полностью уничтожается на destroy.
#
# Развёртывает ambar как single-node cluster (master + volume + S3 gateway на одном хосте).

driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: ambar
    box: cloud-image/ubuntu-24.04
    memory: 2048
    cpus: 2

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

shared_state: false

ansible:
  executor:
    args:
      ansible_playbook: []
  cfg:
    defaults:
      host_key_checking: false
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..:${MOLECULE_PROJECT_DIRECTORY}/roles
  env:
    ANSIBLE_FORCE_COLOR: "true"
