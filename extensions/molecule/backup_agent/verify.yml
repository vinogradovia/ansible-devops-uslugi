---
- name: Verify (backup_agent_clients)
  hosts: backup_agent_clients
  become: true
  gather_facts: false
  tasks:
    - name: Собрать service_facts
      ansible.builtin.service_facts:

    - name: bareos-filedaemon должен быть running
      ansible.builtin.assert:
        that:
          - "'bareos-filedaemon.service' in ansible_facts.services"
          - ansible_facts.services['bareos-filedaemon.service'].state == 'running'
        quiet: true

    - name: bareos-fd -t
      ansible.builtin.command: bareos-fd -t -c /etc/bareos
      changed_when: false

- name: Verify (backup_servers)
  hosts: backup_servers
  become: true
  gather_facts: false
  tasks:
    - name: Собрать service_facts
      ansible.builtin.service_facts:

    - name: bareos-director/bareos-storage должны быть running
      ansible.builtin.assert:
        that:
          - "'bareos-director.service' in ansible_facts.services"
          - ansible_facts.services['bareos-director.service'].state == 'running'
          - "'bareos-storage.service' in ansible_facts.services"
          - ansible_facts.services['bareos-storage.service'].state == 'running'
        quiet: true

    - name: bareos-dir -t
      become_user: bareos
      ansible.builtin.command: bareos-dir -t -c /etc/bareos
      changed_when: false

    - name: bareos-sd -t
      ansible.builtin.command: bareos-sd -t -c /etc/bareos
      changed_when: false

    # Реальная проверка: director реально бекапит УДАЛЁННЫЙ file daemon (вторая ВМ) — не
    # self-backup, как в extensions/molecule/backup_server/. Имя job'а — "backup-<client-name>",
    # см. roles/backup_server/templates/bareos-dir.d/job/client-job.conf.j2.
    - name: Запустить job backup-backup-agent-client-fd через bconsole и дождаться завершения
      ansible.builtin.shell: |
        set -o pipefail
        printf 'run job=backup-backup-agent-client-fd level=Full yes\nwait\nmessages\nquit\n' | bconsole -c /etc/bareos/bconsole.conf
      args:
        executable: /bin/bash
      register: molecule_bconsole_run
      changed_when: true

    - name: Вывод bconsole должен подтвердить успешное завершение job'а
      ansible.builtin.assert:
        that:
          - "'Backup OK' in molecule_bconsole_run.stdout or 'Termination:            Backup OK' in molecule_bconsole_run.stdout"
        quiet: true
        fail_msg: "bconsole run job=backup-backup-agent-client-fd не завершился успешно, вывод: {{ molecule_bconsole_run.stdout }}"

    - name: Найти файлы томов в storage-каталоге
      ansible.builtin.find:
        paths: /var/lib/bareos/storage
        file_type: file
      register: molecule_storage_volumes

    - name: Storage daemon должен реально записать хотя бы один непустой том с данными удалённого клиента
      ansible.builtin.assert:
        that:
          - molecule_storage_volumes.matched > 0
          - molecule_storage_volumes.files | map(attribute='size') | max > 0
        quiet: true
