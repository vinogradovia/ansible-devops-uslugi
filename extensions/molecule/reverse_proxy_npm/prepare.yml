---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Дождаться готовности systemd внутри контейнера
      ansible.builtin.command: systemctl is-system-running
      register: molecule_systemd_status
      changed_when: false
      failed_when: false
      until: molecule_systemd_status.stdout in ['running', 'degraded']
      retries: 15
      delay: 2

    - name: Обновить apt-кэш
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # --- Docker Engine (docker-in-docker) — роль reverse_proxy_npm сама Docker не ставит
    # (см. molecule.yml), поэтому для сценария это готовим здесь, как внешний провижининг хоста.
    - name: Установить пакеты, нужные для добавления apt-репозитория Docker
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - curl
          - gnupg

    - name: Создать каталог для ключей apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Скачать GPG-ключ репозитория Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Подключить apt-репозиторий Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
          signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Установить Docker Engine + docker compose plugin
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Заставить вложенный dockerd использовать storage-driver vfs
      # Тестовый контейнер сам работает поверх overlay2 (host Docker), а нативный overlay2
      # внутри overlay2 ломается на "failed to mount ... invalid argument" — классическое
      # ограничение docker-in-docker, не имеющее отношения к роли reverse_proxy_npm. vfs медленнее,
      # но не зависит от файловой системы хоста и всегда работает во вложенном контейнере.
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: |
          {"storage-driver": "vfs"}
        mode: '0644'

    - name: Перезапустить docker с storage-driver vfs и убедиться, что служба включена
      # restarted (не started): apt уже мог запустить dockerd с дефолтным overlay2 до того,
      # как выше появился daemon.json — нужен рестарт, чтобы vfs реально применился.
      ansible.builtin.systemd:
        name: docker
        state: restarted
        enabled: true

    - name: Установить python3-docker (нужен community.docker.docker_container для fixture-бэкенда)
      ansible.builtin.apt:
        pkg:
          - python3-docker

    # --- Fixture-бэкенд для тестового proxy-host'а (whoami.molecule.test, см. group_vars/all.yml).
    # К docker-сети reverse_proxy_npm подключается отдельно в converge.yml (после роли — сеть
    # создаёт сама роль). Публикация порта 18080 — только для ручной отладки docker exec/curl
    # с хоста; NPM обращается к бэкенду по имени контейнера внутри общей сети, а не через этот порт.
    - name: Запустить fixture-бэкенд (traefik/whoami)
      community.docker.docker_container:
        name: reverse-proxy-npm-fixture-backend
        image: traefik/whoami
        state: started
        restart_policy: unless-stopped
        ports:
          - "18080:80"
