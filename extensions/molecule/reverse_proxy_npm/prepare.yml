---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Обновить apt-кэш
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # --- Docker Engine — роль reverse_proxy_npm сама Docker не ставит (см. molecule.yml), поэтому
    # для сценария это готовим здесь, как внешний провижининг хоста.
    - name: Установить пакеты, нужные для добавления apt-репозитория Docker
      ansible.builtin.apt:
        pkg:
          - ca-certificates
          - curl
          - gnupg

    - name: Создать каталог для ключей apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Скачать GPG-ключ репозитория Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Подключить apt-репозиторий Docker
      # ansible_distribution | lower (тот же приём, что roles/docker/tasks/install-repo.yml) —
      # box сценария Ubuntu (см. molecule.yml), а не Debian, поэтому путь репозитория должен быть
      # linux/ubuntu, а не захардкоженный linux/debian.
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
          signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        state: present
        filename: docker

    - name: Установить Docker Engine + docker compose plugin
      ansible.builtin.apt:
        update_cache: true
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin

    - name: Убедиться, что служба docker включена и запущена
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Установить python3-docker (нужен community.docker.docker_container для fixture-бэкенда)
      ansible.builtin.apt:
        pkg:
          - python3-docker

    # --- Fixture-бэкенд для тестового proxy-host'а (whoami.molecule.test, см. group_vars/all.yml).
    # К docker-сети reverse_proxy_npm подключается отдельно в converge.yml (после роли — сеть
    # создаёт сама роль). Публикация порта 18080 — только для ручной отладки docker exec/curl
    # с хоста; NPM обращается к бэкенду по имени контейнера внутри общей сети, а не через этот порт.
    - name: Запустить fixture-бэкенд (traefik/whoami)
      community.docker.docker_container:
        name: reverse-proxy-npm-fixture-backend
        image: traefik/whoami
        state: started
        restart_policy: unless-stopped
        ports:
          - "18080:80"
