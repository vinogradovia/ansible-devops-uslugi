---
# Molecule-сценарий для reverse_proxy_npm — см. docs/adr/0001-reverse-proxy-npm-role.md, §11.
# driver: vagrant/libvirt (единое требование для всех molecule-сценариев коллекции, см. CLAUDE.md,
# «Molecule-тесты» — раньше был driver: docker, одноразовый systemd-контейнер) — полноценная
# одноразовая ВМ, полностью уничтожается на destroy.
# Роль сама разворачивает docker-контейнер (NPM), поэтому prepare.yml дополнительно устанавливает
# Docker Engine на ВМ — сама роль (как и reverse_proxy_traefik, monitoring_server) Docker не
# ставит, это ответственность внешнего провижининга хоста, см. defaults roles/reverse_proxy_npm/README.md.
#
# ansible.executor.args.ansible_playbook обнуляется, как в nginx_multidomain/molecule.yml, чтобы
# не подмешивать статический inventory monitoring_servers/monitoring_agents из ../config.yml.
driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: reverse-proxy-npm
    box: cloud-image/ubuntu-24.04
    memory: 2048
    cpus: 1

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

shared_state: false

ansible:
  executor:
    args:
      ansible_playbook: []
