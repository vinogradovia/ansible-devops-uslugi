---
# Molecule-сценарий для reverse_proxy_npm — см. docs/adr/0001-reverse-proxy-npm-role.md, §11 +
# ревизию ниже. driver: vagrant/libvirt (полноценная ВМ), как extensions/molecule/monitoring_server —
# НЕ driver: docker, как раньше: старый docker-driver сценарий (одноразовый systemd-контейнер,
# docker-in-docker для самой роли + storage-driver: vfs workaround, см. git history) сознательно
# не проверял reverse_proxy_npm_admin_ui_expose_host: true — этот путь дёргает Let's Encrypt
# HTTP-01, а у контейнера нет ни публичной сети, ни DNS. Полноценная ВМ на libvirt эту проблему
# сама по себе НЕ решает (та же приватная NAT-сеть без публичного DNS) — реальное решение：
# проверять этот путь через custom/self-signed сертификат (см. роль, README "Custom/self-signed
# сертификат"), не через настоящий ACME. Переход на ВМ попутно убирает и docker-in-docker.
#
# Роль (в отличие от monitoring_server) сама Docker не ставит (meta/main.yml: dependencies: []) —
# поэтому prepare.yml по-прежнему устанавливает Docker Engine как внешний провижининг хоста, как и
# раньше в docker-driver сценарии, но уже без storage-driver: vfs (на настоящей ВМ overlay2
# работает нативно, конфликта docker-в-docker нет).
#
# box — тот же, что уже провалидирован для libvirt-провайдера в monitoring_server
# (cloud-image/ubuntu-24.04). Память/cpu заметно меньше: NPM — SQLite + один nginx-процесс +
# один fixture-контейнер, а не многосервисный observability-стек.
#
# ansible.executor.args.ansible_playbook обнуляется, как и в остальных сценариях, чтобы не
# подмешивать статический inventory monitoring_servers/monitoring_agents из ../config.yml.
driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: reverse-proxy-npm
    box: cloud-image/ubuntu-24.04
    memory: 1536
    cpus: 1

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

shared_state: false

ansible:
  executor:
    args:
      ansible_playbook: []
