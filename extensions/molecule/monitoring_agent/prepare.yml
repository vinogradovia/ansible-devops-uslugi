---
- name: Prepare (все хосты)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Обновить apt-кэш
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

- name: Prepare (systemd-хост — зависимости pve-exporter)
  hosts: monitoring_agent_systemd
  become: true
  gather_facts: false
  tasks:
    # systemd-pve-exporter.yml ставит prometheus-pve-exporter через pip в venv
    # (virtualenv_command: "python3 -m venv") — python3-venv роль сама не ставит, это внешний
    # провижининг хоста (комментарий в самой задаче: "the correct python*-venv package must be
    # installed to use the venv module").
    - name: Установить python3-venv (нужен для pve-exporter systemd-пути)
      ansible.builtin.apt:
        name: python3-venv
        state: present

- name: Prepare (docker-хост)
  hosts: monitoring_agent_docker
  become: true
  gather_facts: false
  tasks:
    # verify.yml использует community.docker.docker_container_info — модулям community.docker
    # нужен python-пакет docker (зависит от requests) на ЦЕЛЕВОМ хосте, тот же паттерн, что
    # extensions/molecule/reverse_proxy_npm/prepare.yml.
    - name: Установить python3-docker (нужен community.docker.docker_container_info в verify.yml)
      ansible.builtin.apt:
        name: python3-docker
        state: present
