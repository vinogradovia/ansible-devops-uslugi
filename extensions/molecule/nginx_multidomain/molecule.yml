---
# Единственный (пока) molecule-сценарий для роли nginx_multidomain — см. ROADMAP.md,
# таблица P4, и roles/nginx_multidomain/docs/nginx_multidomain_role_architecture.md, §8.5.
#
# В отличие от extensions/molecule/{default,reverse_proxy_traefik}, которые гоняются против
# статического реального хоста из extensions/molecule/inventory/hosts.yml (driver по умолчанию,
# create/destroy — no-op), этот сценарий изолирован: driver: docker поднимает одноразовый
# systemd-контейнер и полностью его уничтожает на destroy. Поэтому явно обнуляем
# ansible.executor.args.ansible_playbook, унаследованный из ../config.yml — там лежит
# "--inventory=.../extensions/molecule/inventory/", а это статические реальные хосты
# (группы monitoring_servers/monitoring_agents); слияние списков в molecule — это replace,
# а не extend (см. molecule.util.merge_dicts), так что достаточно переопределить список здесь.
driver:
  name: docker

platforms:
  - name: nginx-multidomain
    image: "docker.io/geerlingguy/docker-debian12-ansible:latest"
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: ${MOLECULE_DOCKER_COMMAND:-""}

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

shared_state: false

ansible:
  executor:
    args:
      ansible_playbook: []
