---
# Molecule-сценарий для роли docker — см. docs/adr/0002-docker-role.md, §8.
#
# Намеренно НЕ использует driver: docker (как nginx_multidomain/reverse_proxy_npm): те сценарии
# гоняются в образе geerlingguy/docker-debian12-ansible, у которого Docker Engine уже предустановлен
# для запуска вложенных контейнеров — устанавливать поверх него ещё один Docker (сама роль) означало
# бы Docker-in-Docker и конфликт версий с тем, что уже запечено в базовый образ, а не чистую
# проверку установки с нуля. Поэтому test_sequence ограничен syntax/create/destroy (driver:
# default, без реального хоста) — реальная установка проверяется вручную (`molecule converge`)
# против целевого хоста, заданного в inventory (группа docker_hosts), вне автоматического CI-контура.

scenario:
  test_sequence:
    - syntax
    - create
    - destroy
