---
- name: Prepare
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Обновить dnf-кэш
      ansible.builtin.dnf:
        update_cache: true
