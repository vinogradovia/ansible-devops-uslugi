---
- name: Converge
  hosts: all
  become: true
  collections:
    - devops.uslugi
  tasks:
    - name: Прогнать роль freeipa (сервер — предусловие, переменные см. group_vars/all.yml)
      ansible.builtin.import_role:
        name: freeipa

    - name: Прогнать роль freeipa_directory (группы/пользователи каталога)
      ansible.builtin.import_role:
        name: freeipa_directory
