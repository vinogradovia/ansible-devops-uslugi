---
# Molecule-сценарий для reverse_proxy_traefik — см. ROADMAP.md P4 («собрать сценарий с нуля»).
# driver: vagrant/libvirt (единое требование для всех molecule-сценариев коллекции, см. CLAUDE.md,
# «Molecule-тесты» — раньше был driver: docker, одноразовый systemd-контейнер) — раньше рабочего
# сценария не было вообще (нерабочий untracked-каркас удалён, см. ROADMAP.md P3 №27).
#
# reverse_proxy_traefik/meta/main.yml безусловно зависит от роли docker (сама ставит Docker Engine
# из download.docker.com пинненой версией), поэтому prepare.yml здесь НЕ ставит Docker Engine
# вручную — это делает зависимость роли при converge. На полноценной ВМ (в отличие от прежнего
# docker-in-docker контейнера) overlay2-driver дочернего dockerd монтируется без проблем, поэтому
# group_vars/all.yml больше не передаёт storage-driver: vfs.
#
# ansible.executor.args.ansible_playbook обнуляется, как в nginx_multidomain/molecule.yml, чтобы
# не подмешивать статический inventory monitoring_servers/monitoring_agents из ../config.yml.
driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: reverse-proxy-traefik
    box: cloud-image/ubuntu-24.04
    memory: 2048
    cpus: 1

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

shared_state: false

ansible:
  executor:
    args:
      ansible_playbook: []
