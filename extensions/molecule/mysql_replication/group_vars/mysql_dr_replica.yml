---
mysql_replication_role: dr_replica
mysql_replication_server_id: 3
mysql_replication_primary_host: 192.168.56.10
mysql_replication_repl_password: molecule-test-repl-password

# Бэкапы: реальный путь bareos (ROADMAP №48, Фаза 2, docs/adr/0010-backup-agent-role.md) —
# единственный практично проверяемый в molecule без внешнего S3-эндпоинта (xtrabackup+rclone+S3
# путь остаётся вне scope этого сценария). backup_agent подключается условной meta-зависимостью
# роли (см. roles/mysql_replication/meta/main.yml) — эта ВМ становится реальным клиентом
# backup_servers-группы (mysql-backup-server, см. molecule.yml/group_vars/backup_servers.yml).
mysql_replication_backup_enabled: true
mysql_replication_backup_tool: bareos
mysql_replication_backup_agent_client_name: mysql-dr-replica-fd
mysql_replication_backup_agent_client_password: molecule-test-backup-agent-password
