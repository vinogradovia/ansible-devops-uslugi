#version=RHEL9
# Kickstart для сборки собственного vagrant/libvirt box Rocky Linux 9 (extensions/molecule/freeipa/
# packer/rocky9.pkr.hcl) — см. подробное обоснование в extensions/molecule/freeipa/molecule.yml
# («История подбора бокса», п.4). Собирается из Rocky-9-latest-x86_64-minimal.iso (только BaseOS
# на самом ISO), поэтому источник установки — сам диск (cdrom), без сети.

lang en_US.UTF-8
keyboard us
timezone UTC --utc
text
cdrom
reboot

# Партиционирование БЕЗ LVM (--type=plain) — намеренно: подозреваемая причина dracut-таймаута у
# официального box rockylinux/9 5.0.0 (см. molecule.yml) — активация LVM внутри initramfs. Прямые
# партиции убирают этот шаг из цепочки загрузки целиком.
zerombr
clearpart --all --initlabel
autopart --type=plain --fstype=xfs --nohome
bootloader --location=mbr --timeout=1

network --bootproto=dhcp --device=link --activate --onboot=on --hostname=rockylinux9-freeipa-vagrant
firewall --disabled
selinux --enforcing
skipx

rootpw --lock
user --name=vagrant --groups=wheel --lock

# Стандартный vagrant insecure keypair (~/.vagrant.d/insecure_private_key) — тот самый, который
# генерирует Vagrantfile molecule-plugins/vagrant по умолчанию (c.ssh.insert_key = true заменит
# его на одноразовый после первого логина, но первый логин обязан пройти именно по этому ключу).
sshkey --username=vagrant "ssh-rsa "

%packages --ignoremissing --excludedocs
@core
-plymouth
%end

%post --log=/root/ks-post.log
echo 'vagrant ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/vagrant
chmod 440 /etc/sudoers.d/vagrant
systemctl enable sshd
# machine-id/host-key заново сгенерируются при первом реальном boot (freeipa-сценарий крутит одну
# одноразовую ВМ за прогон, но так корректнее для любого клона этого box).
truncate -s 0 /etc/machine-id
rm -f /etc/ssh/ssh_host_*
%end
