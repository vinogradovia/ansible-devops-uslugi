---
# Molecule-сценарий для freeipa. driver: vagrant/libvirt (единое требование для всех
# molecule-сценариев коллекции, см. CLAUDE.md, «Molecule-тесты»). memory/cpus заметно больше,
# чем у остальных одно-сервисных сценариев (1024/1) — ipa-server-install разворачивает
# LDAP+Kerberos KDC+httpd+собственный CA одновременно и требует минимум ~4GB RAM/2 vCPU
# (рекомендация upstream FreeIPA), меньше — падает или зависает на дирректорисервере.
#
# box: rockylinux/9 (не cloud-image/ubuntu-24.04, как у остальных сценариев коллекции) —
# freeipa-server не существует пакетом для Ubuntu/Debian вообще, см. roles/freeipa/README.md,
# «Целевая ОС».
#
# box_version зафиксирован на 5.0.0 (Rocky 9.5) — последняя версия (6.0.0, Rocky 9.6) 404-ит
# при скачивании у апстрима (dl.rockylinux.org, не наша конфигурация). generic/rocky9 (другая
# сборка, roboxes/generic project) проверялась как альтернатива — её текущая версия (4.3.12)
# тоже 404-ит при скачивании, хуже, чем rockylinux/9 5.0.0.
#
# ИЗВЕСТНАЯ ПРОБЛЕМА ОКРУЖЕНИЯ (перепроверено 2026-08-20, воспроизводится): гостевая ВМ
# (rockylinux/9 5.0.0) не доходит до `create` — не бесконечное молчаливое зависание, как
# предполагалось раньше, а конкретный сбой initramfs: ядро грузится, virtio_blk корректно видит
# диск (5.00 GiB, совпадает с диском бокса), пробинг ata_piix (легаси PATA-контроллер, обычный
# для machine type i440fx, диск при этом всё равно virtio) отрабатывает штатно, но затем dracut не
# успевает смонтировать root в течение rd.timeout и печатает
# «Generating "/run/initramfs/rdsosreport.txt"» → «Entering emergency mode» (подтверждено
# скриншотом консоли, `virsh screenshot`). DHCP-адрес после этого не появляется никогда, `vagrant
# up`/`molecule create` висят до собственного таймаута.
#
# Проверенные и НЕ сработавшие обходы:
#   - Смена machine_type на q35 (вместо дефолтного i440fx) — зависание просто сдвигается на
#     AHCI-probe вместо PATA-probe, то есть проблема не в конкретном чипсете.
#   - `provider_options: {cpu_mode: custom, cpu_model: qemu64}` — гипотеза была в том, что
#     дефолтный host-passthrough (хост — AMD EPYC «Genoa», видно в логе `vagrant up`) как-то
#     причастен к сбою. Модель qemu64 применяется (подтверждено `virsh dumpxml`), но приводит к
#     ДРУГОМУ, более раннему и более жёсткому сбою — kernel panic «Attempted to kill init!» на
#     первых же секундах загрузки (systemd/init получает SIGSEGV) — согласуется с тем, что RHEL9/
#     Rocky9 собраны под baseline x86-64-v2, а модель qemu64 не предоставляет нужный набор
#     инструкций (нет SSE4.2 и т.п.). Не использовать этот cpu_model для RHEL9-based боксов.
#   - Альтернативные боксы с провайдером libvirt для Rocky 9: `generic/rocky9` (4.3.12) и
#     `eurolinux-vagrant/rocky-9` (9.4.5, последняя на момент проверки) — у обоих сам
#     `.box`-файл для libvirt/amd64 отдаёт 404 с vagrantcloud.com (не наша конфигурация,
#     проверено напрямую `curl -IL` на реальный download-URL). `rockylinux/9` 6.0.0 (новее
#     используемой 5.0.0) — тоже 404. Только `rockylinux/9` 5.0.0 реально скачивается.
#   - `bento/rockylinux-9` — не имеет провайдера `libvirt` вообще (только parallels/utm/
#     vmware_desktop/virtualbox), не подходит по требованию CLAUDE.md (driver: vagrant +
#     provider: libvirt).
#
# Ubuntu-боксы (cloud-image/ubuntu-24.04) на этом же хосте грузятся нормально — похоже на
# специфику именно RHEL/Rocky-initramfs (dracut) на этом конкретном хосте/версии
# QEMU/libvirt (QEMU 10.2.1, libvirt 12.0.0 на момент проверки), а не на баг роли/сценария.
# `molecule test -s freeipa` на этом хосте сейчас не проходит дальше `create` — роль и сценарий
# линтуются и синтаксически верны, но не верифицированы реальным прогоном. Если апстрим/хост
# поменяются (новая версия бокса с рабочим libvirt-провайдером, обновление QEMU/libvirt на хосте),
# стоит убрать этот комментарий и просто перепроверить.
driver:
  name: vagrant
  provider:
    name: libvirt

platforms:
  - name: freeipa
    box: rockylinux/9
    box_version: "5.0.0"
    memory: 4096
    cpus: 2

scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

shared_state: false

ansible:
  executor:
    args:
      ansible_playbook: []
