---
# Официальный репозиторий apt.postgresql.org (PGDG), signed-by keyring — тот же паттерн, что
# roles/docker/tasks/install-repo.yml и roles/postgresql_replication/tasks/install-repo.yml, НЕ
# apt_key.

- name: "[repo] Установить пакеты, необходимые для подключения репозитория"
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: "[repo] Создать каталог для apt keyring'ов"
  ansible.builtin.file:
    path: "{{ postgresql_apt_keyring_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "[repo] Скачать GPG-ключ apt.postgresql.org (PGDG)"
  ansible.builtin.get_url:
    url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
    dest: "{{ postgresql_apt_keyring_path }}"
    owner: root
    group: root
    mode: '0644'

- name: "[repo] Подключить репозиторий apt.postgresql.org (PGDG)"
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ postgresql_apt_keyring_path }}]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_distribution_release }}-pgdg main
    state: present
    filename: pgdg
    update_cache: true
