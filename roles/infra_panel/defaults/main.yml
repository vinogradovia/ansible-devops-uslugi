---
# defaults file for infra_panel

infra_panel_enabled: true

# docker, k3s
infra_panel_orchestrator: docker

infra_panel_config_dir: /opt/infra-panel

infra_panel_docker_proxy_network_external: true
infra_panel_docker_proxy_network_name: proxy

# k3s (ADR-0008 §6) — homer НЕ разворачивается этой ролью: он уже часть общего Helmwave-стека
# (helm/envs/<infra_panel_helmwave_k8s_cluster>.yaml, релиз "{{ infra_panel_kubernetes_release_name }}",
# тот же env-файл, что использует monitoring_server_orchestrator: k3s). Роль только рендерит его
# values-файл (basic-auth/домен/ссылки) на control-хосте, delegate_to: localhost — Helmwave
# запускается ТОЛЬКО с control-хоста (roles/monitoring_server/tasks/monitoring-server.k3s.yml).
# Изменения применяются следующим "Helmwave up" — в плее роль infra_panel должна идти РАНЬШЕ
# monitoring_server при infra_panel_orchestrator: k3s (иначе рендер появится, но не применится
# до следующего прогона).
infra_panel_helmwave_dir: "{{ role_path | dirname | dirname }}/helm"
infra_panel_helmwave_k8s_cluster: k3s-monitoring
infra_panel_kubernetes_namespace: monitoring
# Постоянный (не tempfile) путь на control-хосте — community.general.htpasswd идемпотентен
# только когда ПЕРЕЗАПИСЫВАЕТ уже существующий файл: он сверяет пароль с уже сохранённым хэшем
# через passlib.verify, а не строкой (у apr_md5_crypt/bcrypt каждый расчёт — новая случайная
# соль, даже для того же пароля). Одноразовый tempfile, удаляемый в конце каждого прогона (как
# делает monitoring_server с kubeconfig), ломает эту идемпотентность — на каждом прогоне файл
# пуст, хэш каждый раз пересчитывается заново → homer каждый раз лишний раз перезапускается
# (найдено реальным прогоном: "changed" на второй подряд запуск с теми же переменными).
infra_panel_htpasswd_cache_path: "{{ infra_panel_helmwave_dir }}/tmp/infra-panel-htpasswd"
# Буквальное имя релиза homer в helm/helmwave.yml — совпадает с чарт-конвенцией именования
# k8s-объектов внутри values-файла (helper.fullname = "<release>-<key>"), поэтому меняется
# только вместе с самим helmwave.yml, не независимо.
infra_panel_kubernetes_release_name: homer

infra_panel_image_registry: docker.io
infra_panel_image_repository: b4bz/homer
infra_panel_image_version: v26.4.2
infra_panel_image: >-
  {{ infra_panel_image_registry }}/{{ infra_panel_image_repository }}:{{ infra_panel_image_version }}

infra_panel_domain: infra-panel.example.com

infra_panel_title: "Infra Panel"
infra_panel_subtitle: "MontiSphere"
infra_panel_columns: 3

# infra-panel агрегирует ссылки на весь внутренний инструментарий платформы (Grafana,
# VictoriaMetrics и т.п.) — анонимный доступ недопустим, basic-auth обязателен.
# Пароль по умолчанию специально невалиден: check-and-install-requirements.docker.yml падает,
# если хотя бы у одного пользователя с state: present пароль всё ещё равен дефолтному (см.
# аналогичный fail-fast в roles/reverse_proxy_traefik).
infra_panel_default_password: "PleAse_Change_ME!"
infra_panel_users:
  - {name: 'admin', password: "{{ infra_panel_default_password }}"}

# Автогенерация ссылок на уже включённые компоненты monitoring_server, если та роль применена
# к этому же хосту в том же play (переменные читаются как обычные vars, а не через hostvars —
# если monitoring_server не применялась, monitoring_server_grafana_enabled просто не определена
# и default(false) ниже отключает автодобавление, без ошибки).
infra_panel_auto_monitoring_group_name: "Monitoring"
infra_panel_auto_monitoring_group_icon: "mdi mdi-monitor-dashboard"

# Ручные дополнительные группы/пункты — мёржатся с автосгенерированной группой Monitoring.
# Формат — как в services: у homer, https://github.com/bastienwirtz/homer#configuration.
infra_panel_extra_services: []
