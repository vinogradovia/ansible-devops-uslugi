---

- name: Install ipa-exporter
  notify:
    - Reload systemd daemon
    - Restart service ipa-exporter
  block:
    - name: Add the user for ipa-exporter
      ansible.builtin.user:
        name: "{{ monitoring_agent_ipa_exporter_systemd_name }}"
        create_home: false
        shell: /bin/false
        state: "{{ 'present' if monitoring_agent_ipa_exporter_enabled else 'absent' }}"

    - name: Download ipa-exporter
      no_log: true
      ansible.builtin.get_url:
        url: "{{ monitoring_agent_ipa_exporter_binary_download_url }}"
        checksum: "{{ monitoring_agent_ipa_exporter_binary_checksum }}"
        dest: "{{ monitoring_agent_dist_dir }}"
        tmp_dest: "{{ monitoring_agent_dist_dir }}"
        owner: root
        group: root
        mode: '0644'
        # default(omit, true) — а не просто default(omit): пустая строка (дефолт переменных
        # ниже) сама по себе "определена", обычный default сработал бы только на undefined.
        # Нужно для внутренних артефакт-репозиториев без anonymous access (см. комментарий у
        # переменных в defaults/main.yml) — публичные источники вроде GitHub releases не задают
        # эти переменные вовсе, get_url не отправляет Authorization-заголовок.
        url_username: "{{ monitoring_agent_ipa_exporter_binary_download_username | default(omit, true) }}"
        url_password: "{{ monitoring_agent_ipa_exporter_binary_download_password | default(omit, true) }}"
        force_basic_auth: "{{ monitoring_agent_ipa_exporter_binary_download_username | length > 0 }}"
      register: monitoring_agent_ipa_exporter_binary_download_url_result

    - name: Unarchive ipa-exporter
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ monitoring_agent_ipa_exporter_binary_download_url_result.dest }}"
        include:
          - "*/freeipa-exporter"
        extra_opts:
          - "--strip-component=1"
          - "--wildcards"
        dest: "{{ monitoring_agent_ipa_exporter_binary_install_path | dirname }}"

- name: Configure service ipa-exporter
  notify:
    - Reload systemd daemon
    - Restart service ipa-exporter
  block:
    - name: Render ipa-exporter systemd service
      ansible.builtin.template:
        src: "systemd/ipa-exporter/{{ monitoring_agent_ipa_exporter_systemd_name }}.service.j2"
        dest: "{{ monitoring_agent_systemd_unit_dir }}/{{ monitoring_agent_ipa_exporter_systemd_name }}.service"
        owner: root
        group: root
        mode: '0600'
      no_log: true

    - name: State service ipa-exporter
      ansible.builtin.systemd:
        name: "{{ monitoring_agent_ipa_exporter_systemd_name }}"
        enabled: "{{ monitoring_agent_ipa_exporter_enabled }}"
        state: "{{ 'started' if monitoring_agent_ipa_exporter_enabled else 'stopped' }}"
