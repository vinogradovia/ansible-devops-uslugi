---

- name: Install redis-exporter
  notify:
    - Reload systemd daemon
    - Restart service redis-exporter
  block:
    - name: Add the user for redis-exporter
      ansible.builtin.user:
        name: "{{ monitoring_agent_redis_exporter_systemd_name }}"
        create_home: false
        shell: /bin/false
        state: "{{ 'present' if monitoring_agent_redis_exporter_enabled else 'absent' }}"

    - name: Download redis-exporter
      ansible.builtin.get_url:
        url: "{{ monitoring_agent_redis_exporter_binary_download_url }}"
        dest: "{{ monitoring_agent_dist_dir }}"
        tmp_dest: "{{ monitoring_agent_dist_dir }}"
        owner: root
        group: root
        mode: '0644'
      register: monitoring_agent_redis_exporter_binary_download_url_result

    - name: Unarchive redis-exporter
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ monitoring_agent_redis_exporter_binary_download_url_result.dest }}"
        include:
          - "*/redis_exporter"
        extra_opts:
          - "--strip-component=1"
          - "--wildcards"
        dest: "{{ monitoring_agent_redis_exporter_binary_install_path | dirname }}"

- name: Configure service redis-exporter
  notify:
    - Reload systemd daemon
    - Restart service redis-exporter
  block:
    - name: Render redis-exporter systemd service
      ansible.builtin.template:
        src: "systemd/redis-exporter/{{ monitoring_agent_redis_exporter_systemd_name }}.service.j2"
        dest: "{{ monitoring_agent_systemd_unit_dir }}/{{ monitoring_agent_redis_exporter_systemd_name }}.service"
        owner: root
        group: root
        mode: '0644'

    - name: State service redis-exporter
      ansible.builtin.systemd:
        name: "{{ monitoring_agent_redis_exporter_systemd_name }}"
        enabled: "{{ monitoring_agent_redis_exporter_enabled }}"
        state: "{{ 'started' if monitoring_agent_redis_exporter_enabled else 'stopped' }}"
