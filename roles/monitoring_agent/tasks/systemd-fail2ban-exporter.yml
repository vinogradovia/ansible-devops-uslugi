---

- name: Prepare fail2ban socket access
  notify:
    - Reload systemd daemon
    - Restart service fail2ban
  block:
    - name: Create socket group for fail2ban-exporter
      ansible.builtin.group:
        name: "{{ monitoring_agent_fail2ban_exporter_socket_group }}"
        state: present
        system: true

    - name: Create fail2ban systemd override dir
      ansible.builtin.file:
        path: "{{ monitoring_agent_systemd_unit_dir }}/fail2ban.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Render fail2ban systemd override for socket permissions
      ansible.builtin.template:
        src: systemd/fail2ban-exporter/fail2ban.service.d/socket-permissions.conf.j2
        dest: "{{ monitoring_agent_systemd_unit_dir }}/fail2ban.service.d/socket-permissions.conf"
        owner: root
        group: root
        mode: '0644'

- name: Flush handlers to apply fail2ban override before starting exporter
  ansible.builtin.meta: flush_handlers

- name: Install fail2ban-exporter
  notify:
    - Reload systemd daemon
    - Restart service fail2ban-exporter
  block:
    - name: Add the user for fail2ban-exporter
      ansible.builtin.user:
        name: "{{ monitoring_agent_fail2ban_exporter_systemd_name }}"
        groups: "{{ monitoring_agent_fail2ban_exporter_socket_group }}"
        append: true
        create_home: false
        shell: /bin/false
        state: "{{ 'present' if monitoring_agent_fail2ban_exporter_enabled else 'absent' }}"

    - name: Download fail2ban-exporter
      ansible.builtin.uri:
        url: "{{ monitoring_agent_fail2ban_exporter_binary_download_url }}"
        dest: "{{ monitoring_agent_dist_dir }}/{{ monitoring_agent_fail2ban_exporter_binary_download_url | basename }}"
        follow_redirects: all
        status_code: [200, 304]
        mode: '0644'
        owner: root
        group: root

    - name: Unarchive fail2ban-exporter
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ monitoring_agent_dist_dir }}/{{ monitoring_agent_fail2ban_exporter_binary_download_url | basename }}"
        include:
          - "fail2ban_exporter"
        dest: "{{ monitoring_agent_fail2ban_exporter_binary_install_path | dirname }}"

- name: Configure service fail2ban-exporter
  notify:
    - Reload systemd daemon
    - Restart service fail2ban-exporter
  block:
    - name: Render fail2ban-exporter systemd service
      ansible.builtin.template:
        src: "systemd/fail2ban-exporter/{{ monitoring_agent_fail2ban_exporter_systemd_name }}.service.j2"
        dest: "{{ monitoring_agent_systemd_unit_dir }}/{{ monitoring_agent_fail2ban_exporter_systemd_name }}.service"
        owner: root
        group: root
        mode: '0644'

    - name: State service fail2ban-exporter
      ansible.builtin.systemd:
        name: "{{ monitoring_agent_fail2ban_exporter_systemd_name }}"
        enabled: "{{ monitoring_agent_fail2ban_exporter_enabled }}"
        state: "{{ 'started' if monitoring_agent_fail2ban_exporter_enabled else 'stopped' }}"
