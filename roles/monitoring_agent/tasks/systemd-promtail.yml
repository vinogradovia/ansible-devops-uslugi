---

- name: Install unzip (grafana/loki releases — promtail тоже .zip, а не .tar.gz, как у остальных экспортеров)
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Install promtail
  notify:
    - Reload systemd daemon
    - Restart service promtail
  block:
    - name: Add the user for promtail
      ansible.builtin.user:
        name: "{{ monitoring_agent_promtail_systemd_name }}"
        create_home: false
        shell: /bin/false
        groups: "{{ monitoring_agent_promtail_log_group }}"
        append: true
        state: "{{ 'present' if monitoring_agent_promtail_enabled else 'absent' }}"

    - name: Download promtail
      ansible.builtin.get_url:
        url: "{{ monitoring_agent_promtail_binary_download_url }}"
        checksum: "{{ monitoring_agent_promtail_binary_checksum }}"
        dest: "{{ monitoring_agent_dist_dir }}"
        tmp_dest: "{{ monitoring_agent_dist_dir }}"
        owner: root
        group: root
        mode: '0644'
      register: monitoring_agent_promtail_binary_download_url_result

    # Архив плоский (один файл promtail-linux-amd64 в корне, без вложенной директории — как у
    # alloy), поэтому распаковывается напрямую в dist_dir, а не через include/extra_opts.
    - name: Unarchive promtail
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ monitoring_agent_promtail_binary_download_url_result.dest }}"
        dest: "{{ monitoring_agent_dist_dir }}"

    - name: Install promtail binary
      ansible.builtin.copy:
        remote_src: true
        src: "{{ monitoring_agent_dist_dir }}/promtail-linux-amd64"
        dest: "{{ monitoring_agent_promtail_binary_install_path }}"
        owner: root
        group: root
        mode: '0755'

- name: Configure service promtail
  notify:
    - Reload systemd daemon
    - Restart service promtail
  block:
    - name: Render promtail systemd service
      ansible.builtin.template:
        src: "systemd/promtail/{{ monitoring_agent_promtail_systemd_name }}.service.j2"
        dest: "{{ monitoring_agent_systemd_unit_dir }}/{{ monitoring_agent_promtail_systemd_name }}.service"
        owner: root
        group: root
        mode: '0644'

- name: State service promtail
  ansible.builtin.systemd:
    name: "{{ monitoring_agent_promtail_systemd_name }}"
    enabled: "{{ monitoring_agent_promtail_enabled }}"
    state: "{{ 'started' if monitoring_agent_promtail_enabled else 'stopped' }}"
