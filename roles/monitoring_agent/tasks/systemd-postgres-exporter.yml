---

- name: Install postgres-exporter
  notify:
    - Reload systemd daemon
    - Restart service postgres-exporter
  block:
    - name: Add the user for postgres-exporter
      ansible.builtin.user:
        name: "{{ monitoring_agent_postgres_exporter_systemd_name }}"
        create_home: false
        shell: /bin/false
        state: "{{ 'present' if monitoring_agent_postgres_exporter_enabled else 'absent' }}"

    - name: Download postgres-exporter
      ansible.builtin.get_url:
        url: "{{ monitoring_agent_postgres_exporter_binary_download_url }}"
        checksum: "{{ monitoring_agent_postgres_exporter_binary_checksum }}"
        dest: "{{ monitoring_agent_dist_dir }}"
        tmp_dest: "{{ monitoring_agent_dist_dir }}"
        owner: root
        group: root
        mode: '0644'
      register: monitoring_agent_postgres_exporter_binary_download_url_result

    - name: Unarchive postgres-exporter
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ monitoring_agent_postgres_exporter_binary_download_url_result.dest }}"
        include:
          - "*/postgres_exporter"
        extra_opts:
          - "--strip-component=1"
          - "--wildcards"
        dest: "{{ monitoring_agent_postgres_exporter_binary_install_path | dirname }}"

- name: Configure service postgres-exporter
  notify:
    - Reload systemd daemon
    - Restart service postgres-exporter
  block:
    - name: Render DATA_SOURCE_NAME env file for postgres-exporter
      # group: postgres_exporter (не root, в отличие от .mysqld_exporter_my.cnf) — служба
      # запускается как User={{ monitoring_agent_postgres_exporter_systemd_name }} (см. systemd
      # unit ниже), непривилегированный процесс не смог бы прочитать файл при 0600 root:root.
      register: monitoring_agent_postgres_exporter_env_stat
      no_log: true
      ansible.builtin.template:
        src: exporters/postgres-exporter/postgres_exporter.env.j2
        dest: "{{ monitoring_agent_config_dir }}/.postgres_exporter.env"
        owner: root
        group: "{{ monitoring_agent_postgres_exporter_systemd_name }}"
        mode: '0640'

    - name: Render postgres-exporter systemd service
      ansible.builtin.template:
        src: "exporters/postgres-exporter/systemd/{{ monitoring_agent_postgres_exporter_systemd_name }}.service.j2"
        dest: "{{ monitoring_agent_systemd_unit_dir }}/{{ monitoring_agent_postgres_exporter_systemd_name }}.service"
        owner: root
        group: root
        mode: '0644'

    - name: Force all notified handlers to run at this point, not waiting for normal sync points
      ansible.builtin.meta: flush_handlers

- name: State service postgres-exporter
  ansible.builtin.systemd:
    name: "{{ monitoring_agent_postgres_exporter_systemd_name }}"
    enabled: "{{ monitoring_agent_postgres_exporter_enabled }}"
    state: "{{ 'started' if monitoring_agent_postgres_exporter_enabled else 'stopped' }}"
