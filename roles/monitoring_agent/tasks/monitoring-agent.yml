---
- name: Create monitoring-agent config dir
  ansible.builtin.file:
    path: "{{ monitoring_agent_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Promtail config dirs
  when: monitoring_agent_promtail_enabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ monitoring_agent_promtail_config_dir }}"

- name: Provisioning promtail config
  notify:
    - Restart service promtail
  block:
    - name: Provisioning promtail config remove
      when: not monitoring_agent_promtail_enabled
      ansible.builtin.file:
        owner: root
        group: root
        mode: '0644'
        state: absent
        dest: "{{ monitoring_agent_promtail_config_dir }}/promtail-config.yaml"
    - name: Provisioning promtail config copy
      when: monitoring_agent_promtail_enabled
      ansible.builtin.template:
        src: promtail-config.yaml
        dest: "{{ monitoring_agent_promtail_config_dir }}/promtail-config.yaml"
        owner: root
        group: root
        mode: '0644'

# nginxlog-exporter config (needed for both docker and systemd)
- name: Create nginxlog-exporter config dirs
  when: monitoring_agent_nginxlog_exporter_enabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ monitoring_agent_nginxlog_exporter_config_dir }}"

- name: Provisioning nginxlog-exporter config
  notify:
    - Restart service nginxlog-exporter
  block:
    - name: Provisioning nginxlog-exporter config remove
      when: not monitoring_agent_nginxlog_exporter_enabled
      ansible.builtin.file:
        owner: root
        group: root
        mode: '0644'
        state: absent
        dest: "{{ monitoring_agent_nginxlog_exporter_config_dir }}/config.hcl"
    - name: Provisioning nginxlog-exporter config copy
      when: monitoring_agent_nginxlog_exporter_enabled
      ansible.builtin.template:
        src: nginxlog-exporter-config.hcl.j2
        dest: "{{ monitoring_agent_nginxlog_exporter_config_dir }}/config.hcl"
        owner: root
        group: root
        mode: '0644'

# alloy config (needed for both docker and systemd) — только self-мониторинг (embedded exporter,
# ROADMAP.md Backlog №34), config.alloy без компонентов.
- name: Create alloy config dirs
  when: monitoring_agent_alloy_enabled
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ monitoring_agent_alloy_config_dir }}"

- name: Provisioning alloy config
  notify:
    - Restart service alloy
  block:
    - name: Provisioning alloy config remove
      when: not monitoring_agent_alloy_enabled
      ansible.builtin.file:
        owner: root
        group: root
        mode: '0644'
        state: absent
        dest: "{{ monitoring_agent_alloy_config_dir }}/config.alloy"
    - name: Provisioning alloy config copy
      when: monitoring_agent_alloy_enabled
      ansible.builtin.template:
        src: alloy-config.alloy.j2
        dest: "{{ monitoring_agent_alloy_config_dir }}/config.alloy"
        owner: root
        group: root
        mode: '0644'

# mysqld-exporter
# Под systemd сервис работает под User={{ monitoring_agent_mysqld_exporter_systemd_name }} (не
# root, systemd-mysqld-exporter.yml) и без владения этим пользователем падает с PermissionError,
# читая --config.my-cnf (тот же баг и фикс, что у pve-exporter, найдено при сборке
# extensions/molecule/monitoring_agent). Под docker пользователь не существует (создаётся только
# в systemd-ветке) — там файл монтируется в контейнер, root:root корректен, как и раньше.
# Пользователь должен существовать ДО рендера (иначе template не может резолвить owner) —
# создаётся здесь заранее для systemd, а не только позже в systemd-mysqld-exporter.yml (там тот же
# вызов идемпотентен и вдобавок отвечает за удаление пользователя при disable).
- name: Add the user for mysqld-exporter (нужен заранее для владения .my.cnf под systemd)
  when: monitoring_agent_mysqld_exporter_enabled and monitoring_agent_orchestrator == 'systemd'
  ansible.builtin.user:
    name: "{{ monitoring_agent_mysqld_exporter_systemd_name }}"
    create_home: false
    shell: /bin/false
    state: present

- name: Render .my.cnf for mysqld-exporter
  when: monitoring_agent_mysqld_exporter_enabled
  register: monitoring_agent_mysqld_exporter_my_cnf_stat
  no_log: true
  ansible.builtin.template:
    src: exporters/mysqld-exporter/mysqld_exporter_my.cnf.j2
    dest: "{{ monitoring_agent_config_dir }}/.mysqld_exporter_my.cnf"
    owner: >-
      {{ monitoring_agent_mysqld_exporter_systemd_name if monitoring_agent_orchestrator == 'systemd' else 'root' }}
    group: >-
      {{ monitoring_agent_mysqld_exporter_systemd_name if monitoring_agent_orchestrator == 'systemd' else 'root' }}
    mode: '0600'

# monitoring-agent in docker
- name: Block for monitoring_server_orchestrator docker
  when: monitoring_agent_orchestrator == "docker"
  block:
    # docker-metrics: metrics-addr в /etc/docker/daemon.json теперь ставит роль docker
    # (docs/adr/0002-docker-role.md §6), см. monitoring_agent_docker_daemon_json_options
    # в defaults и зависимость в meta/main.yml.

    - name: Render monitoring-agent compose.yml
      ansible.builtin.template:
        src: compose-monitoring-agent.yml.j2
        dest: "{{ monitoring_agent_config_dir }}/compose.yml"
        owner: root
        group: root
        mode: '0600'
        validate: docker compose -f %s config
      no_log: true
      tags: debug

    - name: Create and start services
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring_agent_config_dir }}"
        remove_orphans: true
        wait: true
      register: monitoring_agent_start_result

    - name: Show monitoring_agent_start_result
      ansible.builtin.debug:
        var: monitoring_agent_start_result.stderr_lines

# monitoring-agent in systemd
- name: Block for monitoring_server_orchestrator systemd
  when: monitoring_agent_orchestrator == "systemd"
  block:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Create monitoring-agent dist dir
      ansible.builtin.file:
        path: "{{ monitoring_agent_dist_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0777'

    - name: Include systemd-node-exporter tasks
      when: monitoring_agent_node_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-node-exporter.yml

    - name: Include systemd-redis-exporter tasks
      when: monitoring_agent_redis_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-redis-exporter.yml

    - name: Include systemd-nginx-exporter tasks
      when: monitoring_agent_nginx_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-nginx-exporter.yml

    - name: Include systemd-nginxlog-exporter tasks
      when: monitoring_agent_nginxlog_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-nginxlog-exporter.yml

    - name: Include systemd-php-fpm-exporter tasks
      when: monitoring_agent_php_fpm_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-php-fpm-exporter.yml

    - name: Include systemd-ipa-exporter tasks
      when: monitoring_agent_ipa_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-ipa-exporter.yml

    - name: Include systemd-alloy tasks
      when: monitoring_agent_alloy_enabled
      ansible.builtin.include_tasks:
        file: systemd-alloy.yml

    - name: Include systemd-promtail tasks
      when: monitoring_agent_promtail_enabled
      ansible.builtin.include_tasks:
        file: systemd-promtail.yml

    # ВАЖНО: mysqld-exporter/postgres-exporter должны идти последними среди
    # "Include systemd-*-exporter tasks" в этом блоке. Оба форсируют meta: flush_handlers для
    # СВОЕГО рестарта — а flush_handlers не умеет флашить выборочно, он сбрасывает ВСЕ отложенные
    # хендлеры разом, включая уже notify'нутые из общей (не systemd-only) части файла выше
    # (nginxlog/alloy/promtail — их config рендерится безусловно для обоих оркестраторов, до
    # ветвления docker/systemd). Если чей-то systemd-юнит на момент этого flush ещё не создан
    # (Include-таск идёт позже в списке), хендлер падает "Could not find the requested service"
    # (найдено реальным прогоном site.yml с чистого хоста, ADR-0006/ADR-0005 — обе комбинации
    # оркестраторов/экспортёров ни разу не были протестированы целиком до этого).
    - name: Include systemd-mysqld-exporter tasks
      when: monitoring_agent_mysqld_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-mysqld-exporter.yml

    - name: Include systemd-postgres-exporter tasks
      when: monitoring_agent_postgres_exporter_enabled
      ansible.builtin.include_tasks:
        file: systemd-postgres-exporter.yml

# New Style of Exporters Definotions
# pve_exporter
- name: Include pve-exporter tasks
  ansible.builtin.include_tasks:
    file: exporters-pve-exporter.yml
