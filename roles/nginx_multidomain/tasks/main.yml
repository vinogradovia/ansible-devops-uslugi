---
# ============================================================================
# nginx_multidomain — установка nginx (package|repo) + rate-limit зоны +
#   vhost'ы type: static, proxy
#
# Ещё не реализовано (см. документ по архитектуре / backlog):
#   - validate_domains.yml (проверка дублей server_name по группе инвентаря)
#   - certificates_letsencrypt.yml
#   - basic_auth.yml (генерация htpasswd через community.general.htpasswd)
#   - logrotate.yml
#   - vhost/php_fpm.conf.j2
#   - nginx.conf.j2 (в т.ч. log_format nginx_json для json-логов — главный nginx.conf
#     этой ролью пока не управляется)
# ============================================================================

- name: Проверить, что nginx_domains — список
  ansible.builtin.assert:
    that:
      - nginx_domains is sequence
    fail_msg: "nginx_domains должен быть списком (list) доменов"
    quiet: true

# type: php_fpm заявлен в схеме переменных (defaults/main.yml), но не реализован — циклы ниже
# фильтруют только ['static', 'proxy'], поэтому без этой проверки домен с неподдерживаемым type
# (php_fpm, опечатка и т.п.) молча пропускался бы вообще без vhost'а и без единой ошибки/warning'а.
- name: "Проверить domain.type"
  ansible.builtin.assert:
    that:
      - item.type in ['static', 'proxy']
    fail_msg: >-
      nginx_domains[{{ item.name }}].type == '{{ item.type }}' не поддерживается — реализованы
      только static и proxy (php_fpm заявлен в схеме defaults/main.yml, но ещё не реализован, см.
      docs/adr/0003-ginx-multidomain-role.md §8.5). Без этой проверки домен молча пропускался бы.
    quiet: true
  loop: "{{ nginx_domains }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Установка Nginx: {{ nginx_install_method }}"
  ansible.builtin.include_tasks: install_package.yml
  when: nginx_install_method == "package"

- name: "Установка Nginx: {{ nginx_install_method }}"
  ansible.builtin.include_tasks: install_repo.yml
  when: nginx_install_method == "repo"

# Роль не рендерит главный nginx.conf сама и полагается на то, что стоковый конфиг уже подключает
# sites-enabled/* (docs/adr/0003-ginx-multidomain-role.md §9.4) — раньше это никак не проверялось,
# и без такого include все задеплоенные vhost'ы молча не читались бы nginx, хотя роль отработала
# бы "успешно".
- name: Прочитать главный nginx.conf
  ansible.builtin.slurp:
    path: "{{ nginx_conf_dir }}/nginx.conf"
  register: nginx_multidomain_main_conf_raw

- name: "Проверить, что nginx.conf подключает sites-enabled (см. §9.4 архитектурного документа)"
  ansible.builtin.assert:
    that:
      - "'sites-enabled' in (nginx_multidomain_main_conf_raw.content | b64decode)"
    fail_msg: >-
      {{ nginx_conf_dir }}/nginx.conf не содержит "sites-enabled" — эта роль не рендерит главный
      nginx.conf сама и полагается на то, что он уже подключает sites-enabled/* (стоковый конфиг
      Debian/Ubuntu это делает по умолчанию). См. docs/adr/0003-ginx-multidomain-role.md §9.4.
    quiet: true

- name: Создать базовые директории (sites-*, conf.d, логи)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ nginx_sites_available_dir }}"
    - "{{ nginx_sites_enabled_dir }}"
    - "{{ nginx_confd_dir }}"
    - "{{ nginx_log_dir }}"

- name: Собрать и разложить rate-limit зоны
  ansible.builtin.include_tasks: rate_limit_zones.yml

- name: Собрать и разложить proxy_cache зоны
  ansible.builtin.include_tasks: proxy_cache_zones.yml

- name: Разложить произвольные conf.d файлы
  ansible.builtin.include_tasks: conf_d_files.yml
  when: nginx_conf_d_files | length > 0

- name: "Разложить custom-сертификаты (ssl.mode: custom, ssl.cert_src/key_src)"
  ansible.builtin.include_tasks: certificates_custom.yml

- name: Отрендерить stub_status
  ansible.builtin.include_tasks: stub_status.yml

- name: "Сгенерировать vhost'ы (type: static, proxy)"
  ansible.builtin.include_tasks: vhosts.yml
  loop: "{{ nginx_domains }}"
  loop_control:
    loop_var: domain
    label: "{{ domain.name }}"
  when:
    - domain.enabled | default(true)
    - domain.type in ['static', 'proxy']

- name: "Убрать vhost'ы для доменов с enabled: false"
  ansible.builtin.include_tasks: vhost_absent.yml
  loop: "{{ nginx_domains }}"
  loop_control:
    loop_var: domain
    label: "{{ domain.name }}"
  when:
    - not (domain.enabled | default(true))
    - domain.type in ['static', 'proxy']

- name: Убедиться, что финальный reload/validate отработал в конце плея
  ansible.builtin.meta: flush_handlers
