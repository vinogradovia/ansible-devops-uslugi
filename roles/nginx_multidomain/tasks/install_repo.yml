---
# Подключение официального репозитория nginx.org для Ubuntu/Debian.
# NB: ansible.builtin.apt_key устарел в пользу подхода signed-by + keyring-файл —
# можно заменить в следующей итерации, здесь оставлен для простоты первого среза.

- name: "[repo] Установить пакеты, необходимые для подключения репозитория"
  ansible.builtin.apt:
    name:
      - curl
      - gnupg2
      - ca-certificates
      - lsb-release
    state: present
    update_cache: true

- name: "[repo] Добавить GPG-ключ nginx.org"
  ansible.builtin.apt_key:
    url: https://nginx.org/keys/nginx_signing.key
    state: present

- name: "[repo] Добавить репозиторий nginx.org (канал: {{ nginx_repo_release_channel }})"
  ansible.builtin.apt_repository:
    repo: >-
      deb https://nginx.org/packages/{{ 'mainline/' if nginx_repo_release_channel == 'mainline' else '' }}{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} nginx
    state: present
    filename: nginx
    update_cache: true

- name: "[repo] Установить пакет nginx из nginx.org"
  ansible.builtin.apt:
    name: nginx
    state: present
  register: nginx_install_result
