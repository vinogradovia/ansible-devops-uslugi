---
# ==========================================================================
# nginx_multidomain — установка
# ==========================================================================
nginx_install_method: "package"          # package | repo
nginx_repo_release_channel: "stable"     # stable | mainline (актуально при install_method: repo)

nginx_service_name: "nginx"

nginx_user: "www-data"
nginx_group: "www-data"

nginx_conf_dir: "/etc/nginx"
nginx_sites_available_dir: "{{ nginx_conf_dir }}/sites-available"
nginx_sites_enabled_dir: "{{ nginx_conf_dir }}/sites-enabled"
nginx_confd_dir: "{{ nginx_conf_dir }}/conf.d"
nginx_htpasswd_dir: "{{ nginx_confd_dir }}/htpasswd"

nginx_log_dir: "/var/log/nginx"

nginx_default_index_files:
  - index.html
  - index.htm

nginx_default_log_formats:
  - plain
  # - json   # для json-логов нужен log_format 'nginx_json' в http{} (следующий срез — nginx.conf.j2)

# ==========================================================================
# Домены
# ==========================================================================
nginx_domains: []
#
# Полная схема одного элемента (в этом срезе реализован только type: static):
#
# - name: example.com
#   aliases: [www.example.com]
#   type: static                 # static | proxy | php_fpm
#   enabled: true                # по умолчанию true, если не указано
#   root: /var/www/example.com/public
#   index_files: ["index.html"]  # опционально, иначе nginx_default_index_files
#
#   ssl:
#     enabled: true
#     mode: letsencrypt          # letsencrypt | custom
#     cert_file: ""              # обязателен при mode: custom
#     key_file: ""               # обязателен при mode: custom
#     redirect_https: true
#     hsts: true
#
#   logs:
#     format: [plain, json]      # любой набор из [plain, json]
#
#   rate_limit:
#     zone_name: "shared_web"    # общая зона может использоваться несколькими доменами
#     rate: "10r/s"
#     burst: 20
#     nodelay: true
#
#   basic_auth:
#     enabled: false
#     users: []                  # [{username: admin, password: "{{ vault_... }}"}]
#                                 # генерация htpasswd — отдельная задача (следующий срез)
#
#   custom_locations: []
#   # - path: /health
#   #   override: true           # true = заменяет дефолтный location с тем же path
#   #   config: |
#   #     access_log off;
#   #     return 200 "ok";

# ==========================================================================
# Rate limiting
# ==========================================================================
nginx_rate_limit_zone_size: "10m"

# ==========================================================================
# Let's Encrypt / certbot (путь используется в шаблоне для ACME-challenge)
# ==========================================================================
nginx_certbot_webroot_path: "/var/www/_letsencrypt"
nginx_certbot_email: ""
