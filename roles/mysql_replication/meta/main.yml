---
galaxy_info:
  author: Ivan Vinogradov <vinogradovia@gmail.com>
  description: install/adopt MySQL, configure GTID replication (primary/read-replica/DR-replica), physical backups
  license: WTFPL
  min_ansible_version: "2.2"
  galaxy_tags:
    - mysql
    - replication
    - database
# ROADMAP №48, Фаза 2 (docs/adr/0010-backup-agent-role.md "Дальнейшие шаги") — mysql_replication_
# backup_tool: bareos без установленного/настроенного file daemon не работает в принципе, поэтому
# meta-зависимость (тот же паттерн, что docker у monitoring_agent/reverse_proxy_traefik,
# docs/adr/0002-docker-role.md §2), а не композиция на уровне плейбука.
dependencies:
  - role: backup_agent
    when: >-
      mysql_replication_backup_enabled and
      mysql_replication_backup_tool == 'bareos' and
      mysql_replication_role == mysql_replication_backup_source_role
    vars:
      backup_agent_director_name: "{{ mysql_replication_backup_agent_director_name }}"
      backup_agent_client_name: "{{ mysql_replication_backup_agent_client_name }}"
      backup_agent_client_password: "{{ mysql_replication_backup_agent_client_password }}"
      backup_agent_install_percona_xtrabackup_plugin: true
