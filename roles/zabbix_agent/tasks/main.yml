---
- name: Install the Zabbix agent
  when: zabbix_agent_enabled
  block:
    - name: Install the Linux agent
      when: ansible_os_family != "Windows"
      block:
        - name: Remove the static-agent unit
          ansible.builtin.file:
            path: /etc/systemd/system/zabbix-agent2.service
            state: absent
          tags:
            - install

        - name: Download the Zabbix repository package
          ansible.builtin.get_url:
            url: https://repo.zabbix.com/zabbix/7.0/debian/pool/main/z/zabbix-release/zabbix-release_latest_7.0+debian13_all.deb
            dest: /tmp/zabbix-release.deb
            mode: "0644"
          tags:
            - install

        - name: Install the Zabbix repository and agent
          ansible.builtin.shell: |
            set -eu
            dpkg -i /tmp/zabbix-release.deb
            list=$(ls /etc/apt/sources.list.d/zabbix*.list | head -1)
            apt-get update -o Dir::Etc::sourcelist="$list" -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
            apt-get install -y zabbix-agent2
          args:
            creates: /usr/sbin/zabbix_agent2
          tags:
            - install

        - name: Point the agent at the Zabbix server
          ansible.builtin.lineinfile:
            path: /etc/zabbix/zabbix_agent2.conf
            regexp: "^{{ item.key }}="
            line: "{{ item.key }}={{ item.value }}"
          loop:
            - { key: Server, value: "{{ zabbix_agent_server }}" }
            - { key: ServerActive, value: "{{ zabbix_agent_server }}" }
            - { key: Hostname, value: "{{ zabbix_agent_hostname }}" }
          tags:
            - config

        - name: Start the agent
          ansible.builtin.systemd:
            name: zabbix-agent2
            state: restarted
            enabled: true
            daemon_reload: true
          tags:
            - config

    - name: Install the Windows agent
      when: ansible_os_family == "Windows"
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $service = Get-Service -Name 'Zabbix Agent 2' -ErrorAction SilentlyContinue
        if ($service) { exit 0 }
        $msi = "$env:TEMP\zabbix-agent2.msi"
        $url = 'https://cdn.zabbix.com/zabbix/binaries/stable/7.0/{{ zabbix_agent_version }}/zabbix_agent2-{{ zabbix_agent_version }}-windows-amd64-openssl.msi'
        Invoke-WebRequest -Uri $url -OutFile $msi
        $args = '/i "{0}" /qn SERVER={1} SERVERACTIVE={1} HOSTNAME={2} /l*v {3}' -f $msi, '{{ zabbix_agent_server }}', '{{ zabbix_agent_hostname }}', "$env:TEMP\zabbix-agent2.log"
        $proc = Start-Process msiexec.exe -ArgumentList $args -Wait -PassThru
        if ($proc.ExitCode -ne 0) { throw "msiexec exit $($proc.ExitCode)" }
      tags:
        - install
