---
# vars file for ambar — внутренние константы и «магические» значения.

# Архитектура бинарника для загрузки с GitHub.
ambar_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}"
ambar_os: "{{ ansible_os_family | lower | replace('linux', 'linux') }}"
# GitHub releases используют linux/amd64, linux/arm64 — не debian/ubuntu.
ambar_github_os: linux

# URL загрузки бинарника.
ambar_download_url: "https://github.com/seaweedfs/seaweedfs/releases/download/{{ ambar_version }}/{{ ambar_github_os }}_{{ ambar_arch }}.tar.gz"

# SHA256 хэш бинарника — обновлять при смене версии.
# Для 4.48 linux/amd64 — актуальное значение:
#   https://github.com/seaweedfs/seaweedfs/releases/download/4.48/sha256sum.txt
ambar_checksum_linux_amd64: "4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124"
ambar_checksum: "{{ {'linux_amd64': ambar_checksum_linux_amd64}.get(ambar_github_os ~ '_' ~ ambar_arch, '') }}"
