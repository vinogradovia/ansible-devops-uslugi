---
- name: Create fail2ban-ui config dir
  ansible.builtin.file:
    path: "{{ fail2ban_ui_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

# fail2ban-ui in docker
- name: Block for monitoring_server_orchestrator docker
  when: fail2ban_ui_orchestrator == "docker"
  block:
    - name: Render fail2ban-ui compose.yml
      ansible.builtin.template:
        src: compose-fail2ban-ui.yml.j2
        dest: "{{ fail2ban_ui_config_dir }}/compose.yml"
        owner: root
        group: root
        mode: '0644'
        validate: docker compose -f %s config
      tags: debug

    - name: Create and start compose services
      community.docker.docker_compose_v2:
        project_src: "{{ fail2ban_ui_config_dir }}"
        remove_orphans: true
        wait: true
      register: fail2ban_ui_start_result

    - name: Show fail2ban_ui_start_result
      ansible.builtin.debug:
        var: fail2ban_ui_start_result.stderr_lines

# fail2ban-ui in systemd
- name: Block for fail2ban_ui_orchestrator systemd
  when: fail2ban_ui_orchestrator == "systemd"
  notify:
    - Reload systemd daemon
    - Restart service fail2ban-ui.service
  block:
    - name: Populate service facts
      ansible.builtin.service_facts:

    - name: Create fail2ban-ui dist dir
      ansible.builtin.file:
        path: "{{ fail2ban_ui_dist_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Download crane
      ansible.builtin.get_url:
        url: "{{ fail2ban_ui_crane_binary_download_url }}"
        checksum: "{{ fail2ban_ui_crane_binary_checksum }}"
        dest: "{{ fail2ban_ui_dist_dir }}"
        tmp_dest: "{{ fail2ban_ui_dist_dir }}"
        owner: root
        group: root
        mode: '0644'
      register: fail2ban_ui_crane_download_result

    - name: Unarchive crane
      ansible.builtin.unarchive:
        remote_src: true
        src: "{{ fail2ban_ui_crane_download_result.dest }}"
        include:
          - crane
        dest: "{{ fail2ban_ui_crane_install_path | dirname }}"
        owner: root
        group: root
        mode: '0755'

    - name: Stat installed fail2ban-ui version marker
      ansible.builtin.stat:
        path: "{{ fail2ban_ui_config_dir }}/.fail2ban_ui_version"
      register: fail2ban_ui_installed_version_stat

    - name: Read installed fail2ban-ui version marker
      when: fail2ban_ui_installed_version_stat.stat.exists
      ansible.builtin.slurp:
        src: "{{ fail2ban_ui_config_dir }}/.fail2ban_ui_version"
      register: fail2ban_ui_installed_version_raw

    # crane export потоково разворачивает файловую систему уже собранного апстримом
    # multi-arch образа (см. defaults/main.yml) — без Docker-демона на хосте. Гейт по
    # version-маркеру — сам shell-таск не умеет сравнить "уже установлена нужная версия",
    # без него каждый прогон заново тянул бы образ и перезаписывал бинарник (никогда не был бы
    # идемпотентным).
    - name: Install fail2ban-ui binary from the upstream image
      when: >-
        not fail2ban_ui_installed_version_stat.stat.exists or
        (fail2ban_ui_installed_version_raw.content | b64decode | trim) != fail2ban_ui_version
      block:
        - name: Extract fail2ban-ui image filesystem (app/) with crane
          ansible.builtin.shell: >-
            set -o pipefail &&
            {{ fail2ban_ui_crane_install_path }} export {{ fail2ban_ui_image }} - |
            tar -x -C {{ fail2ban_ui_config_dir }} --strip-components=1 app
          changed_when: true
          args:
            executable: /bin/bash

        - name: Make fail2ban-ui binary executable
          ansible.builtin.file:
            path: "{{ fail2ban_ui_binary_install_path }}"
            owner: root
            group: root
            mode: '0755'

        - name: Write installed fail2ban-ui version marker
          ansible.builtin.copy:
            content: "{{ fail2ban_ui_version }}"
            dest: "{{ fail2ban_ui_config_dir }}/.fail2ban_ui_version"
            owner: root
            group: root
            mode: '0644'

    - name: Render fail2ban-ui systemd service
      ansible.builtin.template:
        src: "systemd/fail2ban-ui/{{ fail2ban_ui_systemd_name }}.service.j2"
        dest: "{{ fail2ban_ui_systemd_unit_dir }}/{{ fail2ban_ui_systemd_name }}.service"
        owner: root
        group: root
        mode: '0644'

    - name: State service fail2ban-ui
      ansible.builtin.systemd:
        name: "{{ fail2ban_ui_systemd_name }}"
        enabled: "{{ fail2ban_ui_enabled }}"
        state: "{{ 'started' if fail2ban_ui_enabled else 'stopped' }}"

- name: Configure reverse_proxy nginx
  when: fail2ban_ui_reverse_proxy == 'nginx'
  notify:
    - Reload Nginx service
  block:
    - name: Create nginx addons dir's
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: root
        group: root
      with_items:
        - "{{ fail2ban_ui_reverse_proxy_users_auth_file | dirname }}"
        - "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certs_path }}"
        - "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate | dirname }}"
        - "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate_key | dirname }}"

    - name: Get stat the nginx ssl_certificate
      ansible.builtin.stat:
        path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate }}"
      register: fail2ban_ui_reverse_proxy_nginx_ssl_certificate_status

    - name: Get stat the nginx ssl_certificate_key
      ansible.builtin.stat:
        path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate_key }}"
      register: fail2ban_ui_reverse_proxy_nginx_ssl_certificate_key_status


    - name: Generate a Self Signed OpenSSL certificate
      when: not fail2ban_ui_reverse_proxy_nginx_ssl_certificate_status.stat.exists and not fail2ban_ui_reverse_proxy_nginx_ssl_certificate_key_status.stat.exists
      block:
        - name: Generate an OpenSSL private key with the default values (4096 bits, RSA)
          community.crypto.openssl_privatekey:
            path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate_key }}"
            size: 4096

        - name: Generate an OpenSSL Certificate Signing Request
          community.crypto.openssl_csr:
            path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate_csr }}"
            privatekey_path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate_key }}"
            common_name: "{{ fail2ban_ui_reverse_proxy_server_name }}"

        - name: Generate a Self Signed OpenSSL certificate
          community.crypto.x509_certificate:
            path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate }}"
            privatekey_path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate_key }}"
            csr_path: "{{ fail2ban_ui_reverse_proxy_nginx_ssl_certificate_csr }}"
            provider: selfsigned

    - name: Ensure fail2ban-ui htpasswd cache dir exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ fail2ban_ui_reverse_proxy_users_auth_cache_path | dirname }}"
        state: directory
        mode: '0700'

    # Постоянный файл на control-хосте (не одноразовый tempfile) — иначе htpasswd не может
    # сверить пароль с уже сохранённым хэшем (apr_md5_crypt каждый раз даёт новую случайную
    # соль) и считается "changed" на каждом прогоне, даже когда пароль не менялся (см.
    # fail2ban_ui_reverse_proxy_users_auth_cache_path в defaults/main.yml).
    - name: Add a user to a password file dashboard-users
      delegate_to: localhost
      become: false
      community.general.htpasswd:
        path: "{{ fail2ban_ui_reverse_proxy_users_auth_cache_path }}"
        name: "{{ item.name }}"
        password: "{{ item.password }}"
        mode: '0600'
        state: "{{ item.state | default('present') }}"
      with_items:
        - "{{ fail2ban_ui_reverse_proxy_users_auth }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Upload password file dashboard-users
      ansible.builtin.copy:
        src: "{{ fail2ban_ui_reverse_proxy_users_auth_cache_path }}"
        dest: "{{ fail2ban_ui_reverse_proxy_users_auth_file }}"
        owner: root
        group: root
        mode: '0644'

    - name: Render reverse_proxy config nginx
      ansible.builtin.template:
        src: "nginx/{{ fail2ban_ui_systemd_name }}-site.conf.j2"
        dest: "{{ fail2ban_ui_reverse_proxy_nginx_config_path }}/{{ fail2ban_ui_reverse_proxy_nginx_config_name }}"
        mode: "0644"
        owner: root
        group: root
        # validate: bash -c 'nginx -t -c /dev/stdin <<< "events {worker_connections 1;} http { include %s; }"'
        validate: bash -c 'echo "events { worker_connections 100; } http { include %s; }" > /tmp/nginx.conf; sudo nginx -T -c /tmp/nginx.conf; ec=$?; rm -f /tmp/nginx.conf; exit $ec'

# openssl req -x509 -newkey rsa:4096 -keyout /etc/nginx/ssl/fail2ban.test.io/privkey.pem -out /etc/nginx/ssl/fail2ban.test.io/fullchain.pem -sha256 -days 3650 -nodes -subj "/CN=fail2ban.test.io"
