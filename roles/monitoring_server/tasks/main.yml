---
# tasks file for monitoring-server

- name: Run checks for monitoring_server_orchestrator docker
  ansible.builtin.include_tasks:
    file: check-and-install-requirements.docker.yml

- name: Run checks for monitoring_server_orchestrator k3s
  when: monitoring_server_orchestrator == 'k3s'
  ansible.builtin.include_tasks:
    file: check-and-install-requirements.k3s.yml

- name: Include tasks for monitoring_server_orchestrator docker
  when: monitoring_server_orchestrator == 'docker'
  ansible.builtin.include_tasks:
    file: monitoring-server.docker.yml

- name: Include tasks for monitoring_server_orchestrator k3s
  when: monitoring_server_orchestrator == 'k3s'
  ansible.builtin.include_tasks:
    file: monitoring-server.k3s.yml

- name: Provisioning victoria-metrics exporters scrape_config/targets
  ansible.builtin.include_tasks: victoria-metrics-provisioning-exporter-targets.yaml
  loop_control:
    loop_var: monitoring_server_victoria_metrics_exporters_target_item
  with_items:
    - src: victoria-metrics-scrape-node-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/node_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_node_exporter }}"
      name: node-exporter
    - src: victoria-metrics-scrape-docker-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/docker_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_docker_exporter }}"
      name: docker-exporter
    - src: victoria-metrics-scrape-cadvisor-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/cadvisor_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_cadvisor }}"
      name: cadvisor
    - src: victoria-metrics-scrape-ipa-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/ipa_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_ipa_exporter }}"
      name: ipa-exporter
    - src: victoria-metrics-scrape-redis-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/redis_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_redis_exporter }}"
      name: redis-exporter
    - src: victoria-metrics-scrape-nginx-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/nginx_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_nginx_exporter }}"
      name: nginx-exporter
    - src: victoria-metrics-scrape-php-fpm-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/php_fpm_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_php_fpm_exporter }}"
      name: php-fpm-exporter
    - src: victoria-metrics-scrape-nginxlog-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/nginxlog_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_nginxlog_exporter }}"
      name: nginxlog-exporter
    - src: victoria-metrics-scrape-mysqld-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/mysqld_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_mysqld_exporter }}"
      name: mysqld-exporter
    - src: victoria-metrics-scrape-pve-exporter-targets.json.j2
      dest: "{{ monitoring_server_victoria_metrics_config_dir }}/scrape_config/pve_exporter_targets.json"
      state: "{{ monitoring_server_victoria_metrics_scrape_pve_exporter }}"
      name: pve-exporter

- name: GrafanaDashboards
  when: monitoring_server_grafana_dashboard_provisioning
  block:
    - name: Get data from monitoring_server_grafana_dashboards_group_
      ansible.builtin.set_fact:
        monitoring_server_grafana_dashboards_groups_default: "{{ lookup('community.general.merge_variables', 'monitoring_server_grafana_dashboards_group_default', pattern_type='prefix') }}"
        monitoring_server_grafana_dashboards_groups_install: "{{ lookup('community.general.merge_variables', 'monitoring_server_grafana_dashboards_group_install', pattern_type='prefix') }}"
    - name: Merge data from monitoring_server_grafana_dashboards_groups_
      ansible.builtin.set_fact:
        monitoring_server_grafana_dashboards_groups: "{{ monitoring_server_grafana_dashboards_groups_default | ansible.builtin.combine(monitoring_server_grafana_dashboards_groups_install, recursive=true) }}"
    # - name: Debug
    #   ansible.builtin.debug:
    #     msg:
    #       - "{{ monitoring_server_grafana_dashboards_groups_default }}"
    #       - "{{ monitoring_server_grafana_dashboards_groups_install }}"
    #       - "{{ monitoring_server_grafana_dashboards_groups }}"
    - name: Render GrafanaDashboards Group
      loop_control:
        label: "group: {{ monitoring_server_grafana_dashboards_group_item.key }}"
        loop_var: monitoring_server_grafana_dashboards_group_item
      with_dict:
        - "{{ monitoring_server_grafana_dashboards_groups }}"
      ansible.builtin.include_tasks:
        file: grafana-provisioning-dashboards_group.yaml
