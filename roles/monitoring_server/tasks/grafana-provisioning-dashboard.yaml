---

# TODO: Clean disabled Dashboards
# TODO: Custom dashboards from inventory vars ?

- name: Block for monitoring_server_orchestrator docker
  when: monitoring_server_orchestrator == 'docker'
  block:
    # Дашборды в ADDONS/grafana_dashboards/ — экспорт с Grafana.com, используют __inputs-плейсхолдеры
    # ${DS_VICTORIAMETRICS}/${DS_PROMETHEUS} (см. templating.list[datasource].current.value и
    # panel.datasource.uid в самих JSON) — эта подстановка штатно происходит только при
    # интерактивном Import через UI Grafana. У file-based provisioning (docker-путь) такого шага
    # нет вообще: ansible.builtin.copy просто копировал JSON байт-в-байт, и панели получали
    # buквально строку "${DS_VICTORIAMETRICS}" как datasource uid — "DS_VICTORIAMETRICS was not
    # found" в UI (найдено реальным использованием demo-стенда, ADR-0006). k3s-путь ниже эту же
    # проблему уже решает через spec.datasources grafana-operator'а — здесь тот же результат
    # текстовой подстановкой на uid датасорса VictoriaMetrics, зафиксированный в
    # monitoring-server.docker.yml (uid: victoriametrics).
    - name: Provisioning GrafanaDashboard {{ monitoring_server_grafana_dashboard_item.name }}
      ansible.builtin.copy:
        content: >-
          {{ lookup('file', role_path + '/' + monitoring_server_grafana_dashboard_item.src)
             | replace('${DS_VICTORIAMETRICS}', 'victoriametrics')
             | replace('${DS_PROMETHEUS}', 'victoriametrics') }}
        dest: "{{ monitoring_server_config_dir }}/grafana/provisioning/dashboards/{{ monitoring_server_grafana_dashboard_item.src | basename }}"
        mode: "0644"
        owner: root
        group: root

# TODO: Check grafana-operator (crd) exists

- name: Include tasks for monitoring_server_orchestrator k3s
  when: monitoring_server_orchestrator == 'k3s'
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true
  block:
    # - name: Debug monitoring_server_grafana_dashboard_item
    #   ansible.builtin.debug:
    #     var: monitoring_server_grafana_dashboard_item

    - name: Deploy ConfigMap grafana-dashboard-definition for {{ monitoring_server_grafana_dashboard_item.name }}
      kubernetes.core.k8s:
        # state: "{{ 'present' if monitoring_server_grafana_dashboard_item.state else 'absent' }}"
        state: present
        namespace: "{{ monitoring_server_kubernetes_namespace }}"
        kubeconfig: "{{ monitoring_server_orchestrator_context.dest }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "grafana-dashboard-definition-{{ monitoring_server_grafana_dashboards_group_item.key | lower | replace('_', '-') }}-{{ monitoring_server_grafana_dashboard_item.uid | lower }}"  #  yamllint disable-line rule:line-length
          data:
            json: "{{ lookup('file', role_path + '/' + monitoring_server_grafana_dashboard_item.src) | string }}"

    - name: Deploy GrafanaDashboard {{ monitoring_server_grafana_dashboard_item.name }}
      kubernetes.core.k8s:
        # state: "{{ 'present' if monitoring_server_grafana_dashboard_item.state else 'absent' }}"
        state: present
        namespace: "{{ monitoring_server_kubernetes_namespace }}"
        kubeconfig: "{{ monitoring_server_orchestrator_context.dest }}"
        definition:
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaDashboard
          metadata:
            name: "{{ monitoring_server_grafana_dashboards_group_item.key | lower | replace('_', '-') }}-{{ monitoring_server_grafana_dashboard_item.uid | lower }}"
          spec:
            folderRef: "{{ monitoring_server_grafana_dashboards_group_item.value.folder | default(monitoring_server_grafana_dashboard_default_folder) | lower }}"
            datasources:
              - datasourceName: VictoriaMetrics
                inputName: DS_PROMETHEUS
              - datasourceName: VictoriaMetrics
                inputName: DS_VICTORIAMETRICS
            instanceSelector:
              matchLabels:
                dashboards: "grafana"
            configMapRef:
              name: "grafana-dashboard-definition-{{ monitoring_server_grafana_dashboards_group_item.key | lower | replace('_', '-') }}-{{ monitoring_server_grafana_dashboard_item.uid | lower }}"  #  yamllint disable-line rule:line-length
              key: json
