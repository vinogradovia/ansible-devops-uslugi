---
# defaults file for docker
#
# Только Debian/Ubuntu (apt) — см. docs/adr/0002-docker-role.md §4.

docker_repo_channel: stable

docker_repo_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, ansible_architecture) }}"

# Версии зафиксированы явно (ADR §5) — apt-суффикс версии Docker CE различается по
# дистрибутиву/релизу (например: 5:27.5.1-1~ubuntu.24.04~noble или 5:27.5.1-1~debian.12~bookworm).
# При обновлении docker_ce_version проверить доступность через:
#   apt-cache madison docker-ce
docker_apt_version_suffix: "{{ ansible_distribution | lower }}.{{ ansible_distribution_version }}~{{ ansible_distribution_release }}"

docker_ce_version: "27.5.1"
docker_ce_package_version: "5:{{ docker_ce_version }}-1~{{ docker_apt_version_suffix }}"

docker_compose_plugin_version: "2.32.4"
docker_compose_plugin_package_version: "{{ docker_compose_plugin_version }}-1~{{ docker_apt_version_suffix }}"

docker_service_enabled: true
docker_service_state: started

# Пользователи, добавляемые в группу docker (доступ без root, ADR §7). Пусто по умолчанию —
# остальные роли коллекции работают через become/root.
docker_users: []

# Роль — единственный владелец файла (ADR §6). Роли-потребители передают свои опции через
# docker_daemon_json_options (dict), а не пишут в файл напрямую.
docker_daemon_json_path: /etc/docker/daemon.json
docker_daemon_json_options: {}
