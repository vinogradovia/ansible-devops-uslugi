---
# Подключение официального репозитория download.docker.com для Debian/Ubuntu (ADR §3, §4).
# Используем keyring signed-by, а не устаревший apt_key (в отличие от
# roles/nginx_multidomain/tasks/install_repo.yml, где apt_key оставлен как техдолг).

- name: "[repo] Установить пакеты, необходимые для подключения репозитория"
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: "[repo] Создать каталог для apt keyring'ов"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "[repo] Скачать GPG-ключ download.docker.com"
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: '0644'

- name: "[repo] Подключить репозиторий download.docker.com (канал: {{ docker_repo_channel }})"
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_repo_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} {{ docker_repo_channel }}
    state: present
    filename: docker
    update_cache: true

- name: "[repo] Установить Docker Engine и compose-плагин"
  ansible.builtin.apt:
    name:
      - "docker-ce={{ docker_ce_package_version }}"
      - docker-ce-cli
      - containerd.io
      - "docker-compose-plugin={{ docker_compose_plugin_package_version }}"
    state: present
    update_cache: true

- name: "[repo] Включить и запустить сервис docker"
  ansible.builtin.systemd:
    name: docker
    enabled: "{{ docker_service_enabled }}"
    state: "{{ docker_service_state }}"
