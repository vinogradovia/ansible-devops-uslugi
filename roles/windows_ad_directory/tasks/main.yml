---
- name: Create the office directory
  when: windows_ad_directory_enabled
  block:
    - name: Create the company OU
      microsoft.ad.ou:
        name: RUSAGRICOM
        path: "DC=ad,DC=rusagricom,DC=ru"
        state: present
      tags:
        - config

    - name: Create the child OUs
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "OU=RUSAGRICOM,DC=ad,DC=rusagricom,DC=ru"
        state: present
      loop: "{{ windows_ad_directory_ous }}"
      tags:
        - config

    - name: Refuse an account without a password
      when: windows_ad_directory_passwords[item.sam] | default('') | length == 0
      ansible.builtin.fail:
        msg: "No password for {{ item.sam }}"
      loop: "{{ windows_ad_directory_users }}"
      tags:
        - config

    - name: Create office accounts
      microsoft.ad.user:
        identity: "{{ item.sam }}"
        name: "{{ item.sam }}"
        sam_account_name: "{{ item.sam }}"
        surname: "{{ item.display }}"
        display_name: "{{ item.display }}"
        description: "{{ item.display }}"
        upn: "{{ item.sam }}@{{ windows_ad_directory_domain }}"
        password: "{{ windows_ad_directory_passwords[item.sam] }}"
        update_password: on_create
        password_never_expires: false
        state: present
        path: "OU=Users,{{ windows_ad_directory_base }}"
      loop: "{{ windows_ad_directory_users }}"
      tags:
        - config
