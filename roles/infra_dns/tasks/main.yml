---
- name: Install bind9 packages
  ansible.builtin.apt:
    name: "{{ infra_dns_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install

- name: Ensure bind9 zone directory exists
  ansible.builtin.file:
    path: "{{ infra_dns_zone_dir }}"
    state: directory
    owner: bind
    group: bind
    mode: "0750"
  tags:
    - install

- name: Deploy bind9 named.conf.options
  ansible.builtin.template:
    src: named.conf.options.j2
    dest: /etc/bind/named.conf.options
    owner: root
    group: bind
    mode: "0640"
    validate: "named-checkconf %s"
  notify:
    - Restart bind9
  tags:
    - config

- name: Deploy bind9 named.conf.local
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf.local
    owner: root
    group: bind
    mode: "0640"
  notify:
    - Restart bind9
  tags:
    - config

- name: Ensure include hosts file exists
  ansible.builtin.copy:
    content: "; Ansible managed — additional host records\n"
    dest: "{{ infra_dns_zone_dir }}/{{ infra_dns_zone_name }}.hosts"
    owner: bind
    group: bind
    mode: "0640"
    force: false
  when: infra_dns_zone_include_hosts
  tags:
    - deploy

- name: Pre-validate new bind9 zone file
  ansible.builtin.template:
    src: zone.j2
    dest: "/tmp/{{ infra_dns_zone_name }}_test"
    owner: bind
    group: bind
    mode: "0640"
    validate: "named-checkzone -k fail {{ infra_dns_zone_name }} %s"
  vars:
    serial_number: 1234567890
  changed_when: false
  tags:
    - validate

- name: Remove temporary bind9 zone file
  ansible.builtin.file:
    path: "/tmp/{{ infra_dns_zone_name }}_test"
    state: absent
  changed_when: false
  tags:
    - validate

- name: Check if zone file already exists
  ansible.builtin.stat:
    path: "{{ infra_dns_zone_dir }}/{{ infra_dns_zone_name }}"
  register: zone_file_stat
  tags:
    - deploy

- name: Find current bind9 zone file serial number
  ansible.builtin.shell: |
    awk '/@ IN SOA/ {getline; print $1}' {{ infra_dns_zone_dir }}/{{ infra_dns_zone_name }}
  args:
    executable: /bin/bash
  register: current_serial_info
  changed_when: false
  check_mode: false
  when: zone_file_stat.stat.exists
  tags:
    - deploy
    - increment_serial

- name: Set initial serial number for new zone
  ansible.builtin.set_fact:
    _infra_dns_serial: >-
      {{ current_serial_info.stdout | default(ansible_date_time.date | replace('-','') ~ '01', true) }}
  tags:
    - deploy

- name: Deploy bind9 zone file
  ansible.builtin.template:
    src: zone.j2
    dest: "{{ infra_dns_zone_dir }}/{{ infra_dns_zone_name }}"
    owner: bind
    group: bind
    mode: "0640"
    validate: "named-checkzone -k fail {{ infra_dns_zone_name }} %s"
  vars:
    serial_number: "{{ _infra_dns_serial }}"
  register: deploy_task
  tags:
    - deploy
  notify:
    - Reload bind9

- name: Increment bind9 zone file serial number on host  # noqa: no-handler
  ansible.builtin.replace:
    path: "{{ infra_dns_zone_dir }}/{{ infra_dns_zone_name }}"
    regexp: '(^@ IN SOA .*\n).*[0-9]+'
    replace: '\1  {{ _infra_dns_serial | int + 1 }}'
  when: deploy_task.changed
  tags:
    - deploy
    - increment_serial
  notify:
    - Reload bind9

- name: Ensure bind9 is enabled and started
  ansible.builtin.systemd:
    name: named
    state: started
    enabled: true
  tags:
    - install
