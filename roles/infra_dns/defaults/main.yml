---
# defaults file for infra_dns

infra_dns_enabled: false

infra_dns_packages:
  - bind9
  - bind9-utils

infra_dns_zone_dir: /etc/bind/master

infra_dns_listen_on:
  - any

infra_dns_listen_on_v6:
  - none

infra_dns_allow_query:
  - any

infra_dns_allow_transfer:
  - none

infra_dns_forwarders:
  - 8.8.8.8
  - 8.8.4.4

infra_dns_recursion: true

infra_dns_dnssec_validation: auto

# Per-zone defaults (can be overridden in each zone)
infra_dns_zone_default_ttl: 600
infra_dns_zone_default_soa_refresh: 3H
infra_dns_zone_default_soa_retry: 15M
infra_dns_zone_default_soa_expire: 2W
infra_dns_zone_default_soa_minimum: 10M
infra_dns_zone_default_include_hosts: true

# List of zones to serve
#
# soa_contact is optional for forward zones (defaults to "hostmaster.<zone.name>"), но
# ОБЯЗАТЕЛЕН для reverse-зон (*.in-addr.arpa / *.ip6.arpa) — дефолт для них собрал бы
# несуществующий домен вида "hostmaster.30.20.10.in-addr.arpa". Роль явно падает
# assert'ом в deploy_zone.yml, если soa_contact не задан для такой зоны.
#
# infra_dns_zones:
#   - name: example.com
#     soa_ns: sl-dns-01.example.com
#     soa_contact: hostmaster.example.com      # optional
#     ttl: 600                                 # optional, uses infra_dns_zone_default_ttl
#     ns_records:
#       - sl-dns-01.example.com.
#     records:
#       - { name: sl-dns-01, type: A, value: 10.20.30.240 }
#       - { name: web-01,    type: A, value: 10.20.30.50 }
#     include_hosts: true                      # optional, uses infra_dns_zone_default_include_hosts
#
#   - name: another.example.com
#     soa_ns: ns1.another.example.com
#     ns_records:
#       - ns1.another.example.com.
#     records:
#       - { name: ns1, type: A, value: 10.20.31.1 }
#
#   - name: 30.20.10.in-addr.arpa               # reverse-зона — soa_contact ОБЯЗАТЕЛЕН
#     soa_ns: sl-dns-01.example.com
#     soa_contact: hostmaster.example.com
#     ns_records:
#       - sl-dns-01.example.com.
#     records:
#       - { name: "240", type: PTR, value: sl-dns-01.example.com. }

infra_dns_zones: []
