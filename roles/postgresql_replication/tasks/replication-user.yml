---
# Репликационный и repmgr-пользователи + БД repmgr на primary (ADR §4). Используется обеими
# репликами (read_replica, dr_replica) для streaming-репликации (repl_user) и командами repmgr
# (repmgr_user/repmgr_db).
#
# Аутентификация к самому PostgreSQL — через unix-сокет с peer-auth от имени OS-пользователя
# postgres (become_user), как это принято для локального administrative-доступа на Debian/Ubuntu
# пакетах PostgreSQL (запись "local all postgres peer" в pg_hba.conf по умолчанию).

- name: Create replication user (REPLICATION privilege)
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    login_unix_socket: /var/run/postgresql
    name: "{{ postgresql_replication_repl_user }}"
    password: "{{ postgresql_replication_repl_password }}"
    role_attr_flags: LOGIN,REPLICATION
    state: present

- name: Create repmgr user (SUPERUSER — required by repmgr itself, ADR §4)
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    login_unix_socket: /var/run/postgresql
    name: "{{ postgresql_replication_repmgr_user }}"
    password: "{{ postgresql_replication_repmgr_password }}"
    role_attr_flags: LOGIN,SUPERUSER
    state: present

- name: Create repmgr database owned by repmgr user
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    login_unix_socket: /var/run/postgresql
    name: "{{ postgresql_replication_repmgr_db }}"
    owner: "{{ postgresql_replication_repmgr_user }}"
    state: present

- name: Render repmgr.conf
  ansible.builtin.template:
    src: repmgr.conf.j2
    dest: /etc/repmgr.conf
    owner: postgres
    group: postgres
    mode: '0600'

- name: Check whether this node is already registered with repmgr
  become: true
  become_user: postgres
  ansible.builtin.command: repmgr -f /etc/repmgr.conf node check --role
  register: postgresql_replication_primary_node_check
  changed_when: false
  failed_when: false

# ROADMAP.md P2 №46 — register пропускается, если node check --role уже успешен, но фактически
# зарегистрированный node_id в repmgr.nodes никогда не сверялся с postgresql_replication_node_id.
# repmgr.conf при этом перетемплейтится безусловно на каждом прогоне (задача выше) — если
# group_vars поправили задним числом уже после первичной регистрации, локальный конфиг молча
# расходится с тем, что реально числится в кластере. Воспроизведено на реальном инциденте
# (docs/runbooks/postgresql-failover.md, раздел 3, шаг 3) — repmgr node rejoin/standby register
# падал "unable to retrieve node record for the local node" в разгар аварии, а не сразу.
- name: Query registered node_id for this node_name from repmgr metadata
  when: postgresql_replication_primary_node_check.rc == 0
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    login_unix_socket: /var/run/postgresql
    login_db: "{{ postgresql_replication_repmgr_db }}"
    query: SELECT node_id FROM repmgr.nodes WHERE node_name = %(node_name)s
    named_args:
      node_name: "{{ postgresql_replication_node_name }}"
  register: postgresql_replication_primary_registered_node

- name: Fail if repmgr.nodes node_id has drifted from postgresql_replication_node_id
  when: postgresql_replication_primary_node_check.rc == 0
  ansible.builtin.assert:
    that:
      - postgresql_replication_primary_registered_node.query_result | length > 0
      - postgresql_replication_primary_registered_node.query_result[0].node_id | int == postgresql_replication_node_id | int
    fail_msg: >-
      Узел {{ postgresql_replication_node_name }} уже зарегистрирован в repmgr, но node_id в
      repmgr.nodes ({{ postgresql_replication_primary_registered_node.query_result[0].node_id
      | default('запись не найдена') }}) не совпадает с postgresql_replication_node_id
      ({{ postgresql_replication_node_id }}) — конфигурация разошлась с кластером (ROADMAP.md
      P2 №46). Приведите group_vars в соответствие с repmgr.nodes или перерегистрируйте узел
      вручную (repmgr primary/standby unregister + register) — автоматически это не чинится.
    quiet: true

- name: Register primary with repmgr
  when: postgresql_replication_primary_node_check.rc != 0
  become: true
  become_user: postgres
  ansible.builtin.command: repmgr -f /etc/repmgr.conf primary register
  changed_when: true
