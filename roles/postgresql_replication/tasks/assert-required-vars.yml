---
# Fail-fast на обязательные переменные без дефолтов — тот же паттерн, что уже используется в
# mysql_replication/tasks/assert-required-vars.yml (ADR §9).

- name: Assert postgresql_replication_role is valid
  ansible.builtin.assert:
    that:
      - postgresql_replication_role in ['primary', 'read_replica', 'dr_replica']
    fail_msg: >-
      postgresql_replication_role must be one of: primary, read_replica, dr_replica
      (got: {{ postgresql_replication_role }})

- name: Assert postgresql_replication_node_id is set
  ansible.builtin.assert:
    that:
      - postgresql_replication_node_id | string | length > 0
    fail_msg: >-
      postgresql_replication_node_id is required and must be unique per host — set it explicitly
      in host_vars, it has no default (repmgr requires a unique integer node_id per cluster node).

- name: Assert repmgr password is set
  ansible.builtin.assert:
    that:
      - postgresql_replication_repmgr_password | length > 0
    fail_msg: >-
      postgresql_replication_repmgr_password is required on every node — set it via Ansible Vault
      (see ADR §9), it has no default.

- name: Assert replication user password is set (primary)
  when: postgresql_replication_role == 'primary'
  ansible.builtin.assert:
    that:
      - postgresql_replication_repl_password | length > 0
    fail_msg: >-
      postgresql_replication_repl_password is required on the primary — set it via Ansible Vault
      (see ADR §9), it has no default.

- name: Assert primary connection details are set (replicas)
  when: postgresql_replication_role in ['read_replica', 'dr_replica']
  ansible.builtin.assert:
    that:
      - postgresql_replication_primary_host | length > 0
      - postgresql_replication_repl_password | length > 0
    fail_msg: >-
      postgresql_replication_primary_host and postgresql_replication_repl_password are required
      on replicas (the latter is the same credential provisioned on the primary — see ADR §4, §9).

- name: Assert S3 backup credentials are set (backup source host)
  when:
    - postgresql_replication_backup_enabled
    - postgresql_replication_role == postgresql_replication_backup_source_role
    - postgresql_replication_backup_tool != 'bareos'
  ansible.builtin.assert:
    that:
      - postgresql_replication_backup_s3_endpoint | length > 0
      - postgresql_replication_backup_s3_bucket | length > 0
      - postgresql_replication_backup_s3_access_key | length > 0
      - postgresql_replication_backup_s3_secret_key | length > 0
    fail_msg: >-
      postgresql_replication_backup_enabled=true requires S3 endpoint/bucket/credentials
      (Vault, see ADR §9).

- name: Assert backup_agent client password is set (bareos backup tool, backup source host)
  when:
    - postgresql_replication_backup_enabled
    - postgresql_replication_role == postgresql_replication_backup_source_role
    - postgresql_replication_backup_tool == 'bareos'
  ansible.builtin.assert:
    that:
      - postgresql_replication_backup_agent_client_password | length > 0
    fail_msg: >-
      postgresql_replication_backup_tool == 'bareos' requires
      postgresql_replication_backup_agent_client_password (must match the password field of the
      corresponding backup_server_clients entry) — no default (ROADMAP №48, Фаза 3,
      roles/backup_agent/README.md).

# DB-роль создаётся на primary, не на backup_source_role хосте (CREATE ROLE не работает на
# standby, см. tasks/backup-bareos-db-role.yml) — поэтому этот ассерт на primary, не там.
- name: Assert backup_agent DB role password is set (bareos backup tool, primary)
  when:
    - postgresql_replication_role == 'primary'
    - postgresql_replication_backup_enabled
    - postgresql_replication_backup_tool == 'bareos'
  ansible.builtin.assert:
    that:
      - postgresql_replication_backup_agent_db_password | length > 0
    fail_msg: >-
      postgresql_replication_backup_tool == 'bareos' requires
      postgresql_replication_backup_agent_db_password on primary (CREATE ROLE runs there, see
      tasks/backup-bareos-db-role.yml) — no default (ROADMAP №48, Фаза 3).
