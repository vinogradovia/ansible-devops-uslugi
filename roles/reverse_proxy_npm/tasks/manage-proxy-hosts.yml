---
# ADR §3 (management-слой) + §8 (self-proxied admin UI вместо проброса порта 81 наружу).

# ansible_host/inventory_hostname может быть уже FQDN (в реальном inventory частая практика —
# именовать хосты полным доменным именем, а не короткой меткой) — вставлять его as-is перед
# reverse_proxy_npm_admin_ui_domain даёт мусорный "npm-ui-host.example.com.example.com". Берём
# только первую метку (до первой точки), кроме IPv4-адреса — там точки значимы для уникальности
# (192.168.1.5 → "192" был бы совсем не уникален), поэтому его оставляем целиком.
- name: Compute short hostname label for self-managed admin UI domain
  ansible.builtin.set_fact:
    reverse_proxy_npm_admin_ui_host_label: >-
      {{ (ansible_host | default(inventory_hostname))
         if ((ansible_host | default(inventory_hostname)) | regex_search('^(\d{1,3}\.){3}\d{1,3}$'))
         else (ansible_host | default(inventory_hostname)).split('.')[0] }}
  when:
    - reverse_proxy_npm_admin_ui_expose_host
    - reverse_proxy_npm_admin_ui_domain | length > 0

- name: Compute self-managed admin UI proxy-host (if exposed)
  ansible.builtin.set_fact:
    reverse_proxy_npm_admin_ui_host:
      domain_name: "npm-ui-{{ reverse_proxy_npm_admin_ui_host_label }}.{{ reverse_proxy_npm_admin_ui_domain }}"
      host: "127.0.0.1"
      host_port: "{{ reverse_proxy_npm_admin_ui_port }}"
      ssl_forced: true
      letsencrypt_email: "{{ reverse_proxy_npm_admin_ui_letsencrypt_email | default(reverse_proxy_npm_admin_email, true) }}"
      ssl_provider: "{{ reverse_proxy_npm_admin_ui_ssl_provider }}"
      ssl_certificate_path: "{{ reverse_proxy_npm_admin_ui_ssl_certificate_path }}"
      ssl_certificate_key_path: "{{ reverse_proxy_npm_admin_ui_ssl_certificate_key_path }}"
      state: present
  when:
    - reverse_proxy_npm_admin_ui_expose_host
    - reverse_proxy_npm_admin_ui_domain | length > 0

- name: Fail if admin UI exposure requested without reverse_proxy_npm_admin_ui_domain
  ansible.builtin.fail:
    msg: >-
      reverse_proxy_npm_admin_ui_expose_host: true требует непустой
      reverse_proxy_npm_admin_ui_domain (см. ADR §8).
  when:
    - reverse_proxy_npm_admin_ui_expose_host
    - reverse_proxy_npm_admin_ui_domain | length == 0

# Custom/self-signed сертификаты (ssl_provider: custom, альтернатива Let's Encrypt) должны быть
# созданы/загружены в NPM ДО создания proxy-хостов, которые на них ссылаются — отсюда include
# именно здесь, после вычисления reverse_proxy_npm_admin_ui_host выше, но перед циклом ниже.
- name: Include manage-custom-certificates tasks
  ansible.builtin.include_tasks:
    file: manage-custom-certificates.yml

- name: Manage proxy hosts via NPM API
  devops.uslugi.npm_proxy:
    url: "{{ reverse_proxy_npm_api_url }}"
    token: "{{ reverse_proxy_npm_login.json.token }}"
    domain: "{{ item.domain_name }}"
    host: "{{ item.host }}"
    host_port: "{{ item.host_port | default(80) }}"
    ssl_forced: "{{ item.ssl_forced | default(false) }}"
    letsencrypt_email: "{{ item.letsencrypt_email | default('') }}"
    certificate_id: "{{ (reverse_proxy_npm_custom_certificate_ids | default({}))[item.domain_name] | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  throttle: 1
  no_log: true
  loop: >-
    {{ reverse_proxy_npm_proxy_hosts
       + ([reverse_proxy_npm_admin_ui_host] if reverse_proxy_npm_admin_ui_host is defined else []) }}
  loop_control:
    label: "{{ item.domain_name }} ({{ item.state | default('present') }})"
