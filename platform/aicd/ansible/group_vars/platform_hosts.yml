---
# docs/adr/0017-platform-cicd-default-addons.md — стандартный набор Helm-релизов на k3s-ноде
# platform/aicd и возможность его переопределить. Тот же принцип, что
# roles/monitoring_server/defaults/main.yml (monitoring_server_helmwave_tags/_other_tags):
# каждый релиз в helmwave уже автоматически тегируется своим именем
# (helm/helmwave.yml.tpl:76-78), поэтому выборочная установка — это просто список имён релизов,
# переданный в `helmwave up --tags` (platform/aicd/ansible/site.yml).

# Обязательные релизы платформы — не являются "аддонами", всегда ставятся.
# authelia (ADR-0013) — единая авторизация, foundational-инфраструктура (как openbao), а не
# опциональный инструмент, поэтому здесь, а не в default_addons ниже. Найдено реальным прогоном:
# без этого --tags второго helmwave up вообще не включал релиз authelia (описан в envs/platform.yaml,
# но никогда не попадал в фильтр) — Traefik не знал маршрута на sso.aicd.platform, из-за чего
# Gitea/Semaphore при попытке OIDC-discovery получали TLS-сертификат дефолтного хоста Traefik.
platform_aicd_core_releases:
  - openbao
  # nexus (docs/adr/0018-internal-caching-proxy.md) — кеширующий прокси, инфраструктурная
  # зависимость для остальных релизов (снижает частоту обращений наружу за их образами), поэтому
  # тоже здесь, а не в опциональных аддонах — и до gitea/semaphore ниже.
  - nexus
  - authelia
  - gitea
  - semaphore
  - flux2

# Стандартный набор дополнительных инструментов, ставится по умолчанию.
# vm/grafana-operator — третий аддон (мониторинг, урезанная версия референсного k3s-пути
# roles/monitoring_server, см. docs/adr/0017-platform-cicd-default-addons.md).
platform_aicd_default_addons:
  - radar
  - infra-panel
  - vm
  - grafana-operator

# Оверрайды: добавить аддон сверх дефолтного набора / исключить аддон из дефолтного набора.
platform_aicd_extra_addons: []
platform_aicd_disabled_addons: []

platform_aicd_enabled_addons: >-
  {{ (platform_aicd_default_addons + platform_aicd_extra_addons)
     | unique | difference(platform_aicd_disabled_addons) }}

# Дашборды Grafana для экспортёров roles/monitoring_agent, стоящих на хостах ВНЕ k3s-кластера —
# зеркало platform/aicd-devops-labs-ru/ansible/group_vars/platform_hosts.yml (там же полное
# обоснование, почему это ansible-задача, а не helm-values чарта vm). Модель дашборда берётся из
# ADDONS/grafana_dashboards/, сюда попадает только имя файла, а не копия JSON.
#
# Пусто в этом окружении: ipa_exporter здесь пока не включён (monitoring_agent_ipa_exporter_enabled:
# false в site.yml — ВМ окружения выключены, живой прогон отложен), поэтому дашборд показывал бы
# "No data". Тот же приём, что закомментированный таргет 9189 в
# helm/values/platform/namespaces/monitoring/vm/extra-objects.yaml — включать обе половины вместе,
# по факту живого прогона.
# Содержимое после включения (зеркало aicd-devops-labs-ru):
#   - name: freeipa-exporter
#     file: freeipa_exporter.json
platform_aicd_grafana_addons_dashboards: []
