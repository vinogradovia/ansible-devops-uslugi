---
# platform/aicd — ROADMAP.md, «Предлагаемая последовательность работ», пункт 7, Фаза 0
# (docs/adr/0014-platform-controller-architecture.md; docs/adr/0012-cicd-platform-architecture.md
# §4/§5). Одна K3s-нода, Gitea + Semaphore UI — оба Helm-релизами через Helmwave, тем же
# способом, что roles/monitoring_server/tasks/monitoring-server.k3s.yml
# (docs/adr/0007-monitoring-server-role.md §6), но без monitoring-специфичных задач
# (namespace/secret для Grafana) — здесь не нужны: helmwave.yml.tpl уже создаёт namespace на
# каждый релиз сам (create_namespace: true в .options), а bootstrap-креды Gitea/Semaphore задаются
# прямо в values (helm/values/platform/namespaces/platform/{gitea,semaphore}/values.yaml).
#
# В отличие от monitoring_server (k3s_server.disable: [local-storage] + собственный
# custom-local-storage.yaml) — здесь штатный k3s local-path provisioner НЕ переопределяется:
# причины использовать другой storage class для Gitea/Semaphore пока не было.
#
# Запуск вручную: ansible-playbook -i inventory.yml site.yml

- name: Platform CI/CD infra (K3s + Gitea + Semaphore UI)
  hosts: platform_hosts
  become: true
  pre_tasks:
    # Тот же паттерн, что demo/*/ansible/site.yml — без ожидания cloud-init apt-задачи
    # xanmanning.k3s (скачивание бинарника/checksum) могут упереться в ещё не снятую
    # cloud-init'ом блокировку.
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

  tasks:
    # docs/adr/0018-internal-caching-proxy.md — если Nexus (кеширующий прокси) уже поднят и
    # отвечает, k3s-бинарь+checksum тянутся через его raw-proxy, а не напрямую с
    # release-assets.githubusercontent.com (заблокирован на части сетей, ADR §1). На самом первом
    # прогоне (Nexus ещё не существует) — короткий таймаут + failed_when: false, запрос просто не
    # проходит, роль ниже использует штатный прямой URL. status_code сознательно БЕЗ 404: реальный
    # прогон показал, что Nexus отвечает 404 "Repository not found", когда repo k3s-releases-proxy
    # ещё не создан (bootstrap-задача Nexus ниже по этому же файлу создаёт его позже, во втором
    # play) — считать такой 404 признаком «прокси готов» неверно, это именно признак «ещё не
    # готов», и k3s должен в этом случае идти напрямую в GitHub, а не пытаться дёрнуть
    # несуществующий repo.
    - name: "Проверить доступность Nexus raw-proxy (для k3s-бинаря)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus-cache.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus-cache.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus-cache.aicd.platform/repository/k3s-releases-proxy/"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        status_code: [200, 403]
        timeout: 5
      register: platform_aicd_nexus_cache_check
      failed_when: false
      ignore_errors: true

    # Реальный прогон platform/aicd-devops-labs-ru (2026-08-28), та же причина и здесь: роль
    # xanmanning.k3s ниже качает hashsum/бинарь k3s С САМОЙ ноды cicd (без delegate_to), а не с
    # control-хоста — если k3s_github_download_url указал на nexus-cache (проверка выше прошла
    # успешно), нода должна доверять внутреннему PKI CA САМА, иначе "Ensure the k3s hashsum is
    # downloaded" падает с "self-signed certificate in certificate chain".
    # .kube-tmp/aicd-platform-ca.pem — тот же файл, что ca_path проверки выше: на повторных
    # прогонах уже оставлен предыдущим успешным проходом задачи "Записать внутренний PKI CA
    # локально..." (play ниже, после того как OpenBao становится доступен). На самом первом
    # бутстрапе (курица-яйцо — см. комментарий у k3s_github_download_url ниже) файла ещё нет:
    # проверка выше и так не прошла (Nexus ещё не поднят), а эта пара задач — no-op.
    - name: "Проверить наличие сохранённого внутреннего PKI CA (для доверия k3s-releases-proxy)"
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
      register: platform_aicd_pki_ca_pem_cached

    - name: "Установить внутренний PKI CA в системный trust store cicd (доверие к Nexus)"
      when: platform_aicd_pki_ca_pem_cached.stat.exists
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        dest: /usr/local/share/ca-certificates/aicd-platform-ca.crt
        owner: root
        group: root
        mode: '0644'
      notify: "Обновить системный trust store cicd"

    # Handler должен отработать ДО скачивания k3s несколькими задачами ниже, а не в конце play
    # (штатное время срабатывания handler'ов) — форсируем немедленно.
    - name: Применить обновление CA немедленно (нужно до загрузки k3s ниже)
      ansible.builtin.meta: flush_handlers

    # Версия — тот же пин, что roles/monitoring_server/meta/main.yml, чтобы не плодить второй
    # независимый источник правды о версии k3s в коллекции.
    - name: Установить K3s (single-node)
      ansible.builtin.include_role:
        name: xanmanning.k3s
      vars:
        k3s_state: installed
        k3s_release_version: v1.35.1+k3s1
        k3s_build_cluster: false
        k3s_become: true
        # k3s_binary_url/k3s_hash_url НЕ переопределяются напрямую — xanmanning.k3s
        # (tasks/ensure_downloads.yml) безусловно пересчитывает их через set_fact из
        # k3s_github_download_url при каждом прогоне, любое прямое значение будет затёрто. Верная
        # точка переопределения — сам k3s_github_download_url (базовый URL, роль сама достраивает
        # "/<version>/<файл>"). Nexus raw-proxy настроен как зеркало https://github.com/ целиком
        # (site.yml, play ниже) — не проверено эмпирически, следует ли Nexus за редиректом
        # github.com → release-assets.githubusercontent.com для raw-формата.
        #
        # Найдено реальным прогоном: "else omit" здесь НЕ работает так, как в module-параметрах —
        # резолвился в пустую строку (не в "переменная не задана"), роль подставляла URL без
        # хоста ("unknown url type: '/v1.35.1+k3s1/sha256sum-amd64.txt'"). Фикс — явный
        # дефолт-URL, тот же https://github.com/k3s-io/k3s/releases/download, что жёстко
        # прописан как дефолт k3s_github_url+k3s_github_download_url в самой роли
        # (defaults/main.yml, vars/main.yml), а не omit.
        k3s_github_download_url: >-
          {{ 'https://nexus-cache.aicd.platform/repository/k3s-releases-proxy/k3s-io/k3s/releases/download'
             if (platform_aicd_nexus_cache_check.status | default(0)) in [200, 403]
             else 'https://github.com/k3s-io/k3s/releases/download' }}

    - name: Снять kubeconfig с control-хоста
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/.kube-tmp/"
      register: platform_aicd_kubeconfig
      changed_when: false

    # kubeconfig, который отдаёт k3s, содержит "server: https://127.0.0.1:6443" — годится только
    # для запуска kubectl прямо на самой ноде. helmwave выполняется на control-хосте
    # (delegate_to: localhost ниже), поэтому адрес нужно подменить на реальный IP ноды — тот же
    # приём, что roles/monitoring_server/tasks/monitoring-server.k3s.yml.
    - name: Подставить реальный IP вместо 127.0.0.1 в снятый kubeconfig
      when: "'dest' in platform_aicd_kubeconfig"
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.lineinfile:
        path: "{{ platform_aicd_kubeconfig.dest }}"
        regexp: '    server: https://127.0.0.1:6443'
        line: '    server: https://{{ ansible_facts["default_ipv4"]["address"] }}:6443'

    # Найдено реальным прогоном: k3s разворачивает встроенный Traefik (и его CRD,
    # ingressroutes.traefik.io) асинхронно через собственный HelmChart-контроллер — сразу после
    # того, как xanmanning.k3s отчитывается об успехе, CRD может ещё не существовать. Chart
    # helm/localrepo/universal-chart (Semaphore) рендерит IngressRoute только если
    # $.Capabilities.APIVersions.Has "traefik.io/v1alpha1" — без ожидания релиз применяется БЕЗ
    # IngressRoute и без ошибки (Helm просто пропускает ресурс), обнаруживается только руками
    # позже. Ждём появления CRD перед helmwave up, а не просто готовности API-сервера.
    - name: Дождаться регистрации Traefik CRD (встроенный в k3s, разворачивается асинхронно)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: ingressroutes.traefik.io
      register: platform_aicd_traefik_crd
      until: platform_aicd_traefik_crd.resources | length > 0
      retries: 30
      delay: 5

    # ADR-0013 — найдено реальным прогоном (первое подключение Authelia): под Gitea (init-контейнер
    # configure-gitea, gitea admin auth add-oauth --auto-discover-url https://sso.aicd.platform/...)
    # падал в CrashLoopBackOff — "dial tcp: lookup sso.aicd.platform on 10.43.0.10:53: no such host".
    # Хосты платформы (aicd.platform) существуют только во внешнем /etc/hosts операторов — внутри
    # k3s-кластера (CoreDNS) их никто не резолвит, а изнутри кластера к ним всё равно обращаются
    # (сейчас — Gitea при настройке OIDC-источника, в перспективе — Semaphore при обмене токеном).
    # Проще и надёжнее один раз научить резолвить их весь кластер, чем чинить это отдельно в каждом
    # values.yaml-потребителе (hostAliases) — используется штатный k3s-приём "coredns-custom"
    # ConfigMap (k3s Corefile уже содержит `import /etc/coredns/custom/*.override`, см. `kubectl get
    # configmap coredns -n kube-system`). IP — ClusterIP встроенного в k3s Traefik: тот же путь,
    # которым снаружи резолвятся все Ingress/IngressRoute-хосты платформы, поэтому изнутри кластера
    # запрос идёт через тот же Traefik → тот же SNI/Host-based роутинг, что и у настоящего браузера
    # (важно для Authelia — issuer в OIDC-токене вычисляется из Host-заголовка запроса, должен
    # совпадать что при discovery, что при реальном логине).
    - name: Определить ClusterIP встроенного в k3s Traefik (для coredns-custom ниже)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: traefik
        namespace: kube-system
      register: platform_aicd_traefik_svc
      until: platform_aicd_traefik_svc.resources | length > 0
      retries: 30
      delay: 5

    - name: Опубликовать ClusterIP Traefik как факт
      ansible.builtin.set_fact:
        platform_aicd_traefik_cluster_ip: "{{ platform_aicd_traefik_svc.resources[0].spec.clusterIP }}"

    - name: "CoreDNS: резолвить хосты платформы (aicd.platform) внутри кластера через Traefik"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: coredns-custom
            namespace: kube-system
            labels:
              app.kubernetes.io/managed-by: ansible
          data:
            # Найдено реальным прогоном: дефолтный k3s Corefile уже содержит один плагин `hosts`
            # (/etc/coredns/NodeHosts) — второй `hosts {}` в этом же Server Block роняет CoreDNS
            # в CrashLoopBackOff ("this plugin can only be used once per Server Block", в отличие
            # от `template`, который такого ограничения не имеет).
            aicd-platform.override: |
              template IN A aicd.platform {
                match "^(gitea|semaphore|radar|infra-panel|docs|openbao|sso)\.aicd\.platform\.$"
                answer "{{ '{{' }} .Name {{ '}}' }} 60 IN A {{ platform_aicd_traefik_cluster_ip }}"
                fallthrough
              }
              # freeipa (ADR-0013 §1) — не за Traefik, отдельная VM в той же libvirt-сети (см.
              # platform/aicd/terraform/freeipa-target.tf); свой IP, не ClusterIP Traefik. Найдено
              # реальным прогоном: Authelia падает на startup-проверке LDAP-провайдера с той же
              # "no such host", что раньше ловили Gitea/Semaphore для sso.aicd.platform.
              template IN A aicd.platform {
                match "^ipa\.aicd\.platform\.$"
                answer "{{ '{{' }} .Name {{ '}}' }} 60 IN A {{ hostvars['freeipa'].ansible_host }}"
                fallthrough
              }
              # docs/adr/0023-postgresql-standalone-role.md — standalone PostgreSQL, тот же принцип,
              # что ipa выше: отдельная VM, свой статический IP, не ClusterIP Traefik (нет Ingress,
              # трафик — сырой TCP на 5432, не HTTP).
              template IN A aicd.platform {
                match "^postgresql-infra-1\.aicd\.platform\.$"
                answer "{{ '{{' }} .Name {{ '}}' }} 60 IN A {{ hostvars['postgresql-infra-1'].ansible_host }}"
                fallthrough
              }
              # Найдено реальным прогоном (ADR-0013, forwardAuth Authelia молча пропускал все
              # запросы без проверки): шаблоны выше отвечают только на IN A — запрос AAAA для тех
              # же имён проваливался через fallthrough в forward-плагин, который отвечал
              # авторитетным NXDOMAIN (имя вообще не существует, апстрим о aicd.platform не
              # слышал). NXDOMAIN — это "имени не существует", а не "нет записи такого типа" —
              # строгие резолверы (в частности, встроенный резолвер Go, которым пользуется
              # Traefik) на NXDOMAIN одной из записей выбрасывают ВЕСЬ результат целиком, включая
              # уже полученный успешный A-ответ, из-за чего исходящий HTTPS-вызов Traefik→Authelia
              # (forwardAuth) не мог подключиться вовсе — и, что опаснее всего, Traefik в этой
              # ситуации пропускал запрос к бэкенду без auth-проверки, а не блокировал его.
              # rcode NOERROR без answer — корректный пустой ответ ("имя есть, IPv6-записи нет"),
              # а не NXDOMAIN.
              template IN AAAA aicd.platform {
                match "^(gitea|semaphore|radar|infra-panel|docs|openbao|sso|ipa|postgresql-infra-1)\.aicd\.platform\.$"
                rcode NOERROR
                fallthrough
              }
      register: platform_aicd_coredns_custom

    # kubelet синхронизирует изменённый ConfigMap-volume пода CoreDNS не мгновенно (штатный период
    # до ~60-90с), плюс собственный интервал перечитывания Corefile CoreDNS (плагин reload) — пауза
    # только при первом создании/изменении ConfigMap, чтобы Gitea/Semaphore ниже не словили тот же
    # CrashLoopBackOff на ещё не подхваченной записи.
    - name: Подождать, пока CoreDNS подхватит coredns-custom (kubelet sync + reload plugin)  # noqa: no-handler
      when: platform_aicd_coredns_custom.changed
      ansible.builtin.pause:
        seconds: 90

    # namespace platform заводится здесь явно (а не полагаемся на create_namespace: true
    # helmwave-релиза) — Secret openbao-server-tls ниже должен существовать ДО первого
    # `helmwave up --tags openbao`, а тот намespace ещё не создан на этом шаге.
    - name: "Namespace platform (для openbao-server-tls до первого helmwave up)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Namespace
        name: platform

    # Тот же приём и причина, что у namespace platform выше — grafana-tls/nexus-tls/
    # nexus-cache-tls (TLS-цикл ниже по этому же play) сохраняются Secret'ами в monitoring/cache
    # ДО того, как Helmwave создаст эти namespace как побочный эффект релизов vm/grafana-operator/
    # nexus (реальная ошибка живого прогона 2026-08-28 на aicd-devops-labs-ru: "namespaces
    # \"monitoring\" not found" — идентичная структура здесь, фикс применён превентивно).
    - name: "Namespace monitoring (для grafana-tls до Helmwave up)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Namespace
        name: monitoring

    - name: "Namespace cache (для nexus-tls/nexus-cache-tls до Helmwave up)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Namespace
        name: cache

    # docs/adr/0016-openbao-secrets-pki.md §5 — bootstrap self-signed сертификат для listener'а
    # самого OpenBao (не для клиентов Gitea/Semaphore — те получают сертификаты из PKI engine
    # ПОСЛЕ инициализации, см. tasks/issue-tls-cert.yml). Курица/яйцо: чтобы выпустить
    # сертификат из pki/issue, нужен уже распечатанный OpenBao с включённым PKI, а слушать TLS
    # он обязан с самого первого старта (helm/values/.../openbao/values.yaml,
    # global.tlsDisable: false) — поэтому здесь отдельный, не связанный с PKI engine
    # самоподписанный сертификат. SAN покрывает и cluster-DNS имя (для будущего доступа изнутри
    # кластера), и реальный IP ноды (текущий способ доступа control-хоста — NodePort по IP, тот
    # же приём, что и для kube-apiserver/OpenBao API выше). Файлы — на control-хосте рядом с
    # kubeconfig, community.crypto-модули идемпотентны сами по себе (не перегенерируют
    # ключ/сертификат, если существующие уже соответствуют параметрам).
    - name: "OpenBao server TLS: приватный ключ"
      delegate_to: localhost
      become: false
      run_once: true
      community.crypto.openssl_privatekey:
        path: "{{ playbook_dir }}/.kube-tmp/openbao-server.key"
        size: 4096

    - name: "OpenBao server TLS: CSR"
      delegate_to: localhost
      become: false
      run_once: true
      community.crypto.openssl_csr:
        path: "{{ playbook_dir }}/.kube-tmp/openbao-server.csr"
        privatekey_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.key"
        common_name: openbao.platform.svc.cluster.local
        subject_alt_name:
          - DNS:openbao
          - DNS:openbao.platform
          - DNS:openbao.platform.svc
          - DNS:openbao.platform.svc.cluster.local
          - "IP:{{ ansible_facts['default_ipv4']['address'] }}"

    - name: "OpenBao server TLS: самоподписанный сертификат (10 лет)"
      delegate_to: localhost
      become: false
      run_once: true
      community.crypto.x509_certificate:
        path: "{{ playbook_dir }}/.kube-tmp/openbao-server.crt"
        privatekey_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.key"
        csr_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.csr"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
      register: platform_aicd_openbao_server_cert

    - name: "OpenBao server TLS: сохранить Secret openbao-server-tls"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: openbao-server-tls
        namespace: platform
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: kubernetes.io/tls
          stringData:
            tls.crt: "{{ lookup('ansible.builtin.file', playbook_dir + '/.kube-tmp/openbao-server.crt') }}"
            tls.key: "{{ lookup('ansible.builtin.file', playbook_dir + '/.kube-tmp/openbao-server.key') }}"
      no_log: true

    # docs/adr/0016-openbao-secrets-pki.md §2 — Gitea/Semaphore values (следующий блок ниже)
    # читают admin-пароли/TLS через gomplate-датасорс vault://, который должен достучаться до
    # УЖЕ поднятого и распечатанного OpenBao в момент рендера — helmwave/gomplate работают на
    # control-хосте до всякого apply, поэтому OpenBao поднимается и наполняется первым, отдельным
    # `helmwave up --tags openbao` (тег объявлен в helm/envs/platform.yaml), а Gitea/Semaphore/
    # Flux — вторым, уже безусловным вызовом ниже.
    - name: Helmwave up (OpenBao only, helm/envs/platform.yaml)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        K8S_CLUSTER: platform
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      # --file helmwave.platform.yml (не дефолтный helmwave.yml) — тот дефолтный файл уже
      # закоммичен как референсный рендер для K8S_CLUSTER=k3s-monitoring
      # (roles/monitoring_server), --yml безусловно перезаписывает его под ТЕКУЩИЙ K8S_CLUSTER —
      # найдено вручную при отладке этого плейбука: ручной запуск с K8S_CLUSTER=platform
      # перезаписал чужой референс, пришлось откатывать через git checkout.
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../../../helm"
        argv:
          - helmwave
          - up
          - --build
          - --yml
          - --templater
          - gomplate
          - --file
          - helmwave.platform.yml
          - --tags
          - openbao
      register: platform_aicd_helmwave_up_openbao
      changed_when: true

    # Найдено реальным прогоном: чарт openbao/openbao ставит StatefulSet
    # updateStrategy: OnDelete (осознанно апстримом — raft-кластеру нельзя просто
    # RollingUpdate-нуть все реплики сразу) — смена ConfigMap (например, включение TLS листенера
    # выше) НЕ перезапускает уже существующий под сама по себе, несмотря на
    # server.configAnnotation: true (та аннотация появляется в шаблоне STS, но применяется к
    # живому поду только при его пересоздании). Без этой проверки под молча продолжает работать
    # со СТАРЫМ конфигом (например, http вместо https) до ручного вмешательства.
    - name: "OpenBao: пересоздать под openbao-0 при дрейфе конфига (StatefulSet updateStrategy: OnDelete)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      block:
        - name: Прочитать checksum конфига из шаблона StatefulSet
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: StatefulSet
            namespace: platform
            name: openbao
          register: platform_aicd_openbao_sts

        - name: Прочитать checksum конфига из живого пода (если существует)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: platform
            name: openbao-0
          register: platform_aicd_openbao_pod_before

        - name: Удалить под openbao-0, если его конфиг устарел
          when: >-
            platform_aicd_openbao_pod_before.resources | length > 0
            and platform_aicd_openbao_sts.resources | length > 0
            and (
              (platform_aicd_openbao_pod_before.resources[0].metadata.annotations | default({}))
              .get('openbao.hashicorp.com/config-checksum', '')
            ) != (
              (platform_aicd_openbao_sts.resources[0].spec.template.metadata.annotations | default({}))
              .get('openbao.hashicorp.com/config-checksum', '')
            )
          kubernetes.core.k8s:
            kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
            state: absent
            kind: Pod
            namespace: platform
            name: openbao-0

    - name: Дождаться Running пода openbao-0
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: platform
        name: openbao-0
      register: platform_aicd_openbao_pod
      until: >-
        platform_aicd_openbao_pod.resources | length > 0
        and platform_aicd_openbao_pod.resources[0].status.phase == 'Running'
      retries: 30
      delay: 5

    # docs/adr/0016-openbao-secrets-pki.md §3 — control-хост не имеет маршрута к ClusterIP
    # k3s-сервисов (только к реальному IP ноды, см. подмену 127.0.0.1 выше для kube-apiserver),
    # поэтому OpenBao опубликован через NodePort (helm/values/.../openbao/values.yaml,
    # server.service.nodePort: 30820) — весь HTTP API OpenBao ниже адресуется через
    # "<реальный IP ноды>:30820", не через service DNS. Единый блок с общими delegate_to/
    # environment (NO_PROXY — тот же found, что и для kube-apiserver/helmwave: прокси
    # control-хоста иначе уводит запросы к приватному IP через себя, "connection timed out").
    - name: "OpenBao: bootstrap (init/unseal/engines/секреты/TLS)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      block:
        # https — docs/adr/0016-openbao-secrets-pki.md §5, bootstrap self-signed сертификат
        # (сгенерирован и смонтирован в под ДО этого блока, см. задачи "OpenBao server TLS: ..."
        # выше). ca_path указывает на тот же файл — self-signed лист используется как собственный
        # доверенный якорь (basicConstraints CA:true для этого не требуется ни одному TLS-стеку,
        # он проверяется только для промежуточных звеньев цепочки, не для самого якоря доверия).
        - name: Определить адрес OpenBao API (NodePort, TLS) и путь до его CA
          ansible.builtin.set_fact:
            platform_aicd_openbao_addr: "https://{{ ansible_facts['default_ipv4']['address'] }}:30820"
            platform_aicd_openbao_ca_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.crt"

        - name: Проверить существование Secret openbao-init (идемпотентность init)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: platform
            name: openbao-init
          register: platform_aicd_openbao_init_secret

        # Инициализация — один-единственный раз за всю жизнь стенда: повторный init на уже
        # инициализированном OpenBao необратимо ошибается ("Vault is already initialized"), а
        # Secret openbao-init — единственное место, где root token/unseal-ключ вообще существуют,
        # поэтому именно его наличие — маркер "уже инициализирован", не запрос к самому OpenBao.
        - name: Инициализировать OpenBao (только при первом прогоне)
          when: platform_aicd_openbao_init_secret.resources | length == 0
          no_log: true
          block:
            - name: "OpenBao: sys/init (secret_shares=1, secret_threshold=1 — однодольный ключ, single-node стенд)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_openbao_addr }}/v1/sys/init"
                ca_path: "{{ platform_aicd_openbao_ca_path }}"
                method: POST
                body_format: json
                body:
                  secret_shares: 1
                  secret_threshold: 1
                status_code: [200]
              register: platform_aicd_openbao_init

            - name: "OpenBao: сохранить root_token/unseal-ключ в Secret openbao-init"
              kubernetes.core.k8s:
                kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
                state: present
                kind: Secret
                name: openbao-init
                namespace: platform
                definition:
                  apiVersion: v1
                  metadata:
                    labels:
                      app.kubernetes.io/managed-by: ansible
                  type: Opaque
                  stringData:
                    root_token: "{{ platform_aicd_openbao_init.json.root_token }}"
                    # .json.keys[0] коллизирует с Python dict.keys() (builtin-метод, а не
                    # JSON-ключ "keys") — Jinja резолвит .keys как атрибут раньше, чем как item
                    # lookup, отсюда "builtin_function_or_method object has no element 0"; нужна
                    # явная bracket-нотация.
                    unseal_key: "{{ platform_aicd_openbao_init.json['keys'][0] }}"

            # register в отдельную переменную, НЕ platform_aicd_openbao_init_secret — задача
            # внутри when-block, пропущенная (Secret уже существовал), тоже пишет в свой register
            # skip-результат ({"skipped": true}, без .resources) и тем самым затирала бы валидное
            # значение из самой первой "Проверить существование" (реальный найденный баг: "object
            # of type 'dict' has no attribute 'resources'" в задаче ниже).
            - name: Перечитать только что созданный Secret
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Secret
                namespace: platform
                name: openbao-init
              register: platform_aicd_openbao_init_secret_fresh

        - name: Обновить Secret-результат данными после инициализации (если она выполнялась)
          when: >-
            platform_aicd_openbao_init_secret_fresh is defined
            and platform_aicd_openbao_init_secret_fresh.resources is defined
          ansible.builtin.set_fact:
            platform_aicd_openbao_init_secret: "{{ platform_aicd_openbao_init_secret_fresh }}"

        - name: Прочитать root_token/unseal-ключ из Secret
          no_log: true
          ansible.builtin.set_fact:
            platform_aicd_openbao_root_token: >-
              {{ platform_aicd_openbao_init_secret.resources[0].data.root_token | b64decode }}
            platform_aicd_openbao_unseal_key: >-
              {{ platform_aicd_openbao_init_secret.resources[0].data.unseal_key | b64decode }}

        # Безусловно на каждом прогоне — под мог перезапуститься между прогонами, raft-хранилище
        # не авто-распечатывается (нет auto-unseal), sealed-под отвечает на /v1/sys/seal-status,
        # но не на большинство остальных путей API.
        - name: "OpenBao: проверить seal-status"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/sys/seal-status"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            status_code: [200]
          register: platform_aicd_openbao_seal_status

        - name: "OpenBao: распечатать (unseal), если sealed"
          when: platform_aicd_openbao_seal_status.json.sealed | bool
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/sys/unseal"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            body_format: json
            body:
              key: "{{ platform_aicd_openbao_unseal_key }}"
            status_code: [200]

        - name: "OpenBao: проверить включённые secrets engines"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/sys/mounts"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_mounts
          no_log: true

        - name: "OpenBao: включить KV v2 (secret/)"
          when: "'secret/' not in platform_aicd_openbao_mounts.json.data"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/sys/mounts/secret"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              type: kv
              options:
                version: "2"
            status_code: [200, 204]
          no_log: true

        - name: "OpenBao: включить PKI (pki/) и выпустить root CA + role aicd-platform"
          when: "'pki/' not in platform_aicd_openbao_mounts.json.data"
          no_log: true
          block:
            - name: "OpenBao: sys/mounts/pki (type=pki)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_openbao_addr }}/v1/sys/mounts/pki"
                ca_path: "{{ platform_aicd_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
                body_format: json
                body:
                  type: pki
                  config:
                    max_lease_ttl: "87600h"
                status_code: [200, 204]

            - name: "OpenBao: pki/root/generate/internal (root CA aicd.platform)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_openbao_addr }}/v1/pki/root/generate/internal"
                ca_path: "{{ platform_aicd_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
                body_format: json
                body:
                  common_name: aicd.platform
                  ttl: "87600h"
                status_code: [200]

            - name: "OpenBao: pki/roles/aicd-platform (allowed_domains: aicd.platform)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_openbao_addr }}/v1/pki/roles/aicd-platform"
                ca_path: "{{ platform_aicd_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
                body_format: json
                body:
                  allowed_domains: aicd.platform
                  allow_subdomains: true
                  max_ttl: "2160h"
                status_code: [200, 204]

        # Идемпотентность здесь критична — пере-генерация паролей при каждом прогоне сломала бы
        # уже созданные сессии/данные в Gitea/Semaphore (docs/adr/0016-openbao-secrets-pki.md §3).
        - name: "OpenBao: проверить наличие secret/gitea"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/gitea"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_gitea
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/gitea (только при первом прогоне)"
          when: platform_aicd_openbao_secret_gitea.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/gitea"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: проверить наличие secret/semaphore"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/semaphore"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_semaphore
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/semaphore (только при первом прогоне)"
          when: platform_aicd_openbao_secret_semaphore.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/semaphore"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
                cookie_hash: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
                cookie_encryption: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
                access_key_encryption: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
            status_code: [200, 204]

        # docs/adr/0018-internal-caching-proxy.md — Nexus (кеширующий прокси): реальный
        # admin-пароль (заменяет auto-generated при первом старте пода, см. play ниже после
        # Helmwave up) и LDAP bind-пароль для svc-nexus (тот же принцип, что ldap_bind_password
        # у secret/authelia) — генерируются здесь заранее, ДО того как под Nexus вообще
        # существует: аккаунт svc-nexus заводится в play freeipa_hosts ниже, которому нужен
        # пароль уже сейчас.
        - name: "OpenBao: проверить наличие secret/nexus"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_nexus
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/nexus (только при первом прогоне)"
          when: platform_aicd_openbao_secret_nexus.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
                ldap_bind_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) }}"
                internal_releases_reader_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) }}"
                docs_site_publisher_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/nexus (ldap_bind_password нужен play freeipa_hosts ниже)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_nexus_read
          no_log: true

        # Ретрофит для уже забутстрапленного secret/nexus — тот же приём, что
        # grafana_client_secret у secret/authelia.
        - name: "OpenBao: добавить internal_releases_reader_password в существующий secret/nexus"
          when: "'internal_releases_reader_password' not in platform_aicd_openbao_secret_nexus_read.json.data.data"
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data: >-
                {{
                  platform_aicd_openbao_secret_nexus_read.json.data.data
                  | combine({'internal_releases_reader_password': lookup('ansible.builtin.password', '/dev/null', length=32)})
                }}
            status_code: [200, 204]

        - name: "OpenBao: перечитать secret/nexus (после возможного ретрофита выше)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_nexus_read
          no_log: true

        # docs/adr/0024-platform-docs-site.md — пароль svc-docs-site-publisher (write-доступ к
        # новому raw-hosted репозиторию docs-site, не к internal-releases выше — разные репозитории,
        # разные политики записи, ADR §"Ключевое архитектурное решение..."). Тот же ретрофит-приём,
        # ПОСЛЕ перечитывания выше — иначе `combine()` уйдёт от устаревшего снимка без только что
        # добавленного internal_releases_reader_password и молча потеряет его при записи.
        - name: "OpenBao: добавить docs_site_publisher_password в существующий secret/nexus"
          when: "'docs_site_publisher_password' not in platform_aicd_openbao_secret_nexus_read.json.data.data"
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data: >-
                {{
                  platform_aicd_openbao_secret_nexus_read.json.data.data
                  | combine({'docs_site_publisher_password': lookup('ansible.builtin.password', '/dev/null', length=32)})
                }}
            status_code: [200, 204]

        - name: "OpenBao: перечитать secret/nexus (после ретрофита docs_site_publisher_password)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_nexus_read
          no_log: true

        - name: Опубликовать ldap_bind_password Nexus как факт хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_nexus_ldap_bind_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.ldap_bind_password }}"
          no_log: true

        # roles/monitoring_agent — bind-аккаунт svc-monitoring для ipa_exporter (метрики самого
        # FreeIPA), тот же приём, что secret/nexus выше.
        - name: "OpenBao: проверить наличие secret/monitoring-agent"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/monitoring-agent"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_monitoring_agent
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/monitoring-agent (только при первом прогоне)"
          when: platform_aicd_openbao_secret_monitoring_agent.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/monitoring-agent"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                ldap_bind_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/monitoring-agent (ldap_bind_password нужен play freeipa_hosts ниже)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/monitoring-agent"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_monitoring_agent_read
          no_log: true

        - name: Опубликовать ldap_bind_password monitoring_agent как факт хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_monitoring_agent_ldap_bind_password: "{{ platform_aicd_openbao_secret_monitoring_agent_read.json.data.data.ldap_bind_password }}"
          no_log: true

        # docs/adr/0017-platform-cicd-default-addons.md — пароль basic-auth для Radar (первый
        # стандартный аддон), тем же идемпотентным приёмом, что secret/gitea/secret/semaphore
        # выше: генерируется только при первом прогоне, не меняется при повторных (иначе htpasswd
        # ниже перевыпускался бы на каждом прогоне без необходимости).
        - name: "OpenBao: проверить наличие secret/radar"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/radar"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_radar
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/radar (только при первом прогоне)"
          when: platform_aicd_openbao_secret_radar.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/radar"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        # docs/adr/0017-platform-cicd-default-addons.md §3 — пароль basic-auth для infra-panel
        # (второй стандартный аддон), тот же идемпотентный приём, что secret/radar выше.
        - name: "OpenBao: проверить наличие secret/infra-panel"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/infra-panel"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_infra_panel
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/infra-panel (только при первом прогоне)"
          when: platform_aicd_openbao_secret_infra_panel.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/infra-panel"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        # docs/adr/0017-platform-cicd-default-addons.md — третий аддон (мониторинг): admin-пароль
        # Grafana, тот же идемпотентный приём, что secret/radar/secret/infra-panel выше. В отличие
        # от них — потребляется не basic-auth htpasswd, а напрямую k8s Secret
        # grafana-admin-credentials-custom (ниже по playbook, GF_SECURITY_ADMIN_PASSWORD).
        - name: "OpenBao: проверить наличие secret/grafana"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/grafana"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_grafana
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/grafana (только при первом прогоне)"
          when: platform_aicd_openbao_secret_grafana.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/grafana"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_user: admin
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/grafana (значение нужно ниже по playbook)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/grafana"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_grafana_read
          no_log: true

        # ADR-0013 §1 — пароли Directory Manager/admin для persistent freeipa (единый каталог
        # для Authelia), тот же идемпотентный приём, что secret/gitea/secret/radar выше.
        - name: "OpenBao: проверить наличие secret/freeipa"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/freeipa"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_freeipa
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/freeipa (только при первом прогоне)"
          when: platform_aicd_openbao_secret_freeipa.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/freeipa"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                dm_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/freeipa (пароли нужны play freeipa_hosts ниже)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/freeipa"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_freeipa_read
          no_log: true

        - name: Опубликовать пароли freeipa как факты хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_freeipa_dm_password: "{{ platform_aicd_openbao_secret_freeipa_read.json.data.data.dm_password }}"
            platform_aicd_freeipa_admin_password: "{{ platform_aicd_openbao_secret_freeipa_read.json.data.data.admin_password }}"
          no_log: true

        # docs/adr/0023-postgresql-standalone-role.md — единственный секрет standalone Postgres в
        # этом заходе: пароль служебного пользователя мониторинга (postgres_exporter, LOGIN +
        # GRANT pg_monitor) — НЕ прикладной БД/пользователь litellm/grafana (те в этом заходе не
        # заводятся вообще, см. ADR-0023 §3/«Открытые вопросы»). Тот же идемпотентный приём, что
        # secret/freeipa выше.
        - name: "OpenBao: проверить наличие secret/postgresql"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/postgresql"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_postgresql
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/postgresql (только при первом прогоне)"
          when: platform_aicd_openbao_secret_postgresql.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/postgresql"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                postgres_exporter_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/postgresql (пароль нужен play postgresql_infra_hosts ниже)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/postgresql"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_postgresql_read
          no_log: true

        - name: Опубликовать пароль postgres_exporter как факт хоста (для play postgresql_infra_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_postgres_exporter_password: "{{ platform_aicd_openbao_secret_postgresql_read.json.data.data.postgres_exporter_password }}"
          no_log: true

        # ADR-0013 §3 — секреты Authelia: JWT/сессия/шифрование БД-хранилища, HMAC OIDC-провайдера,
        # RSA-ключ подписи OIDC-токенов (community.crypto.openssl_privatekey_pipe — генерирует в
        # памяти, не пишет на диск control-хоста, тот же принцип, что и остальные секреты этого
        # блока), пароль LDAP-bind-аккаунта svc-authelia (используется и здесь секретом Authelia, и
        # play freeipa_hosts ниже для реального создания аккаунта в каталоге), и client secret на
        # каждого нативного OIDC-потребителя (Semaphore, Gitea, §5). Один check-404-then-generate
        # блок на все поля сразу — секрет должен быть создан атомарно один раз, иначе повторный
        # прогон подставил бы новые OIDC/LDAP секреты поверх уже настроенных потребителей.
        - name: "OpenBao: проверить наличие secret/authelia"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_authelia
          no_log: true

        - name: "Сгенерировать RSA-ключ подписи OIDC (только при первом прогоне)"
          when: platform_aicd_openbao_secret_authelia.status == 404
          community.crypto.openssl_privatekey_pipe:
            size: 4096
            type: RSA
          register: platform_aicd_authelia_oidc_issuer_key
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/authelia (только при первом прогоне)"
          when: platform_aicd_openbao_secret_authelia.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                jwt_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                session_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                storage_encryption_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                oidc_hmac_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                oidc_issuer_private_key: "{{ platform_aicd_authelia_oidc_issuer_key.privatekey }}"
                ldap_bind_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) }}"
                gitea_client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48) }}"
                semaphore_client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48) }}"
                grafana_client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48) }}"
            status_code: [200, 204]

        # Ретрофит для уже забутстрапленного secret/authelia (наш реальный случай — окружение
        # работает не первую неделю) — блок выше срабатывает только при status==404 (secret ещё
        # не существует вовсе) и никогда не перезапустится на уже существующем secret/authelia,
        # даже если в нём не хватает одного нового поля. Отдельная идемпотентная проверка
        # "поле отсутствует" — тот же принцип, что уже применяется ниже для *_client_secret_hash.
        - name: "OpenBao: добавить grafana_client_secret в существующий secret/authelia (docs/adr/0017)"
          when: >-
            platform_aicd_openbao_secret_authelia.status == 200
            and 'grafana_client_secret' not in platform_aicd_openbao_secret_authelia.json.data.data
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data: >-
                {{
                  platform_aicd_openbao_secret_authelia.json.data.data
                  | combine({'grafana_client_secret': lookup('ansible.builtin.password', '/dev/null', length=48)})
                }}
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/authelia (значения нужны ниже по playbook)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_authelia_read
          no_log: true

        - name: Опубликовать секреты Authelia как факты хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_authelia_ldap_bind_password: "{{ platform_aicd_openbao_secret_authelia_read.json.data.data.ldap_bind_password }}"
          no_log: true

        # Authelia требует client_secret OIDC-клиента в конфиге в ВИДЕ ХЭША (pbkdf2-sha512), не
        # plaintext — сервис отказывается стартовать с plaintext-значением в этом поле (проверено
        # по офиц. интеграционным примерам authelia.com/integration/openid-connect/clients/
        # {semaphore,gitea}/). Plaintext-значения (gitea_client_secret/semaphore_client_secret,
        # уже сгенерированы выше) отдаются самим потребителям (Gitea CLI, SEMAPHORE_OIDC_PROVIDERS)
        # как есть — хэш нужен только в конфиге Authelia. Считается тем же бинарём/образом, что и
        # сама Authelia (`authelia crypto hash generate`), на control-хосте через docker (тот же
        # принцип "не писать секрет на диск" — вывод команды сразу разбирается в память, не
        # сохраняется в файл). Требует Docker на control-хосте (см. README, «Требования»).
        - name: "Authelia: посчитать pbkdf2-хэши client_secret для Gitea/Semaphore (только при первом прогоне)"
          when: "'gitea_client_secret_hash' not in platform_aicd_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - "authelia/authelia:4.39.20"
              - authelia
              - crypto
              - hash
              - generate
              - pbkdf2
              - --variant
              - sha512
              - --password
              - "{{ item }}"
          register: platform_aicd_authelia_client_secret_hash_raw
          changed_when: false
          loop:
            - "{{ platform_aicd_openbao_secret_authelia_read.json.data.data.gitea_client_secret }}"
            - "{{ platform_aicd_openbao_secret_authelia_read.json.data.data.semaphore_client_secret }}"

        - name: "Authelia: сохранить посчитанные хэши в secret/authelia (только при первом прогоне)"
          when: "'gitea_client_secret_hash' not in platform_aicd_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              # regex_search с lookbehind вместо backreference-группы ('\1') — избегает
              # неоднозначности экранирования backslash внутри YAML block scalar + Jinja-строки
              # одновременно (полноценная capture-группа потребовала бы '\\1', легко перепутать).
              data: >-
                {{
                  platform_aicd_openbao_secret_authelia_read.json.data.data
                  | combine({
                      'gitea_client_secret_hash': platform_aicd_authelia_client_secret_hash_raw.results[0].stdout | regex_search('(?<=Digest: ).+'),
                      'semaphore_client_secret_hash': platform_aicd_authelia_client_secret_hash_raw.results[1].stdout | regex_search('(?<=Digest: ).+'),
                  })
                }}
            status_code: [200, 204]

        # Ретрофит для Grafana (docs/adr/0017) — своя пара задач, а не третий loop-элемент выше:
        # задача выше гейтится на отсутствие gitea_client_secret_hash, которое на уже
        # забутстрапленном secret/authelia (наш случай) никогда больше не станет true — общий
        # `when` не перезапустился бы для добавления только недостающего поля grafana.
        - name: "Authelia: посчитать pbkdf2-хэш client_secret для Grafana (только пока его нет)"
          when: "'grafana_client_secret_hash' not in platform_aicd_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - "authelia/authelia:4.39.20"
              - authelia
              - crypto
              - hash
              - generate
              - pbkdf2
              - --variant
              - sha512
              - --password
              - "{{ platform_aicd_openbao_secret_authelia_read.json.data.data.grafana_client_secret }}"
          register: platform_aicd_authelia_grafana_client_secret_hash_raw
          changed_when: false

        - name: "Authelia: сохранить посчитанный хэш Grafana в secret/authelia (только пока его нет)"
          when: "'grafana_client_secret_hash' not in platform_aicd_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data: >-
                {{
                  platform_aicd_openbao_secret_authelia_read.json.data.data
                  | combine({
                      'grafana_client_secret_hash': platform_aicd_authelia_grafana_client_secret_hash_raw.stdout | regex_search('(?<=Digest: ).+'),
                  })
                }}
            status_code: [200, 204]

        # ADR-0019 §3/§8 п.1 — пароль первого реального человека в каталоге (platform-admins).
        # Тот же check-404-then-generate паттерн, что secret/authelia выше — пароль генерируется
        # один раз; повторный прогон не должен подставлять новое значение (роль freeipa_directory
        # и так не перезаписывает пароль существующего аккаунта, update_password: on_create, но
        # ЗДЕСЬ, до роли, важно не генерировать новый секрет и не потерять уже читаемый человеком
        # исходный пароль первого входа).
        - name: "OpenBao: проверить наличие secret/freeipa-directory"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/freeipa-directory"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_openbao_secret_freeipa_directory
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/freeipa-directory (только при первом прогоне)"
          when: platform_aicd_openbao_secret_freeipa_directory.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/freeipa-directory"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                ivan_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/freeipa-directory (значение нужно play freeipa_hosts ниже)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/freeipa-directory"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_openbao_secret_freeipa_directory_read
          no_log: true

        - name: Опубликовать пароль Ivan как факт хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_freeipa_directory_password_ivan: "{{ platform_aicd_openbao_secret_freeipa_directory_read.json.data.data.ivan_password }}"
          no_log: true

        # TLS-сертификаты — перевыпускаются автоматически при приближении к сроку истечения
        # (docs/adr/0016-openbao-secrets-pki.md §4, аннотация renew-after-epoch в
        # tasks/issue-tls-cert.yml), TTL 2160h (90 дней), renew за 30 дней до истечения.
        # openbao.aicd.platform/openbao-ingress-tls — docs/adr/0017-platform-cicd-default-addons.md
        # §3, внешний Ingress-сертификат OpenBao (отдельный от внутреннего bootstrap-сертификата
        # openbao-server-tls самого listener'а).
        - name: "OpenBao: выпустить/перевыпустить TLS-сертификаты (gitea, semaphore, radar, infra-panel, docs-site, openbao, authelia, grafana, nexus)"
          no_log: true
          ansible.builtin.include_tasks: tasks/issue-tls-cert.yml
          loop:
            - {host: gitea.aicd.platform, secret: gitea-tls}
            - {host: semaphore.aicd.platform, secret: semaphore-tls}
            - {host: radar.aicd.platform, secret: radar-tls}
            - {host: infra-panel.aicd.platform, secret: infra-panel-tls}
            - {host: docs.aicd.platform, secret: docs-site-tls}
            - {host: openbao.aicd.platform, secret: openbao-ingress-tls}
            - {host: sso.aicd.platform, secret: authelia-tls}
            # namespace: monitoring/cache — Secret обязан жить там же, где IngressRoute/Ingress,
            # который его использует (найдено реальным прогоном именно на grafana-tls, см.
            # комментарий в tasks/issue-tls-cert.yml — раньше уходил в platform по умолчанию).
            - {host: grafana.aicd.platform, secret: grafana-tls, namespace: monitoring}
            - {host: nexus.aicd.platform, secret: nexus-tls, namespace: cache}
            - {host: nexus-cache.aicd.platform, secret: nexus-cache-tls, namespace: cache}
          loop_control:
            label: "{{ item.host }}"

        # Scoped VAULT_TOKEN вместо root — docs/adr/0016-openbao-secrets-pki.md §5, «Не
        # проработано» (первая итерация ADR-0016). Только read на секреты, которые реально нужны
        # gomplate-датасорсу vault:// в values.yaml Gitea/Semaphore — ни sys/*, ни pki/*, ни
        # write. Root token остаётся только внутри самого этого ansible-блока (init/unseal/
        # engines/PKI/генерация секретов), наружу (в environment внешнего процесса helmwave) не
        # передаётся.
        # ADR-0013 — найдено реальным прогоном: Authelia values.yaml тоже читает секреты через
        # gomplate vault:// (тот же приём, что gitea/semaphore) — без отдельного path здесь
        # scoped render-token получал 403 Permission denied на secret/data/authelia (Radar/
        # infra-panel сюда не входят — их пароли передаются иначе, через ansible/htpasswd, а не
        # напрямую через vault:// в их values.yaml).
        - name: "OpenBao: policy aicd-platform-render (read-only secret/gitea, secret/semaphore, secret/authelia)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_openbao_addr }}/v1/sys/policies/acl/aicd-platform-render"
            ca_path: "{{ platform_aicd_openbao_ca_path }}"
            method: PUT
            headers:
              X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
            body_format: json
            body:
              policy: |
                path "secret/data/gitea" {
                  capabilities = ["read"]
                }
                path "secret/data/semaphore" {
                  capabilities = ["read"]
                }
                path "secret/data/authelia" {
                  capabilities = ["read"]
                }
            status_code: [200, 204]

        - name: "OpenBao: проверить наличие Secret openbao-render-token (идемпотентность выпуска)"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: platform
            name: openbao-render-token
          register: platform_aicd_openbao_render_token_secret

        # Токен выпускается один раз — повторный прогон не должен плодить новые токены (старые
        # не отзываются автоматически, это был бы утечка токенов при каждом ansible-playbook).
        - name: "OpenBao: выпустить render-token (только при первом прогоне)"
          when: platform_aicd_openbao_render_token_secret.resources | length == 0
          no_log: true
          block:
            - name: "OpenBao: auth/token/create (policy aicd-platform-render)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_openbao_addr }}/v1/auth/token/create"
                ca_path: "{{ platform_aicd_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
                body_format: json
                body:
                  policies: [aicd-platform-render]
                  ttl: "87600h"
                  renewable: true
                  display_name: aicd-platform-render
                status_code: [200]
              register: platform_aicd_openbao_render_token

            - name: "OpenBao: сохранить render-token в Secret openbao-render-token"
              kubernetes.core.k8s:
                kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
                state: present
                kind: Secret
                name: openbao-render-token
                namespace: platform
                definition:
                  apiVersion: v1
                  metadata:
                    labels:
                      app.kubernetes.io/managed-by: ansible
                  type: Opaque
                  stringData:
                    token: "{{ platform_aicd_openbao_render_token.json.auth.client_token }}"

            # Отдельное имя register + промежуточный set_fact — тот же приём, что уже применён
            # выше для openbao-init (найденный реальным прогоном баг: register в то же имя
            # переменной внутри пропущенного when-блока затирает валидный более ранний результат).
            - name: Перечитать только что созданный Secret с render-token
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Secret
                namespace: platform
                name: openbao-render-token
              register: platform_aicd_openbao_render_token_secret_fresh

        - name: Обновить Secret-результат render-token данными после выпуска (если он выполнялся)
          when: >-
            platform_aicd_openbao_render_token_secret_fresh is defined
            and platform_aicd_openbao_render_token_secret_fresh.resources is defined
          ansible.builtin.set_fact:
            platform_aicd_openbao_render_token_secret: "{{ platform_aicd_openbao_render_token_secret_fresh }}"

        - name: Прочитать render-token из Secret
          no_log: true
          ansible.builtin.set_fact:
            platform_aicd_openbao_render_token_value: >-
              {{ platform_aicd_openbao_render_token_secret.resources[0].data.token | b64decode }}

  handlers:
    # docs/adr/0018-internal-caching-proxy.md — containerd (embedded в k3s) кэширует
    # registries.yaml только на своём старте, тот же класс находки, что кэш CA у containerd
    # (ADR-0015) — простой перезапись файла недостаточно без рестарта.
    - name: "Перезапустить k3s (подхватить registries.yaml)"
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: "Обновить системный trust store cicd"
      ansible.builtin.command: update-ca-certificates
      changed_when: true

# ADR-0013 §1 — persistent freeipa, единый каталог для Authelia. Отдельный play (не часть play
# выше): другой хост (freeipa_hosts, не platform_hosts). Намеренно идёт СРАЗУ ПОСЛЕ play выше (не
# в конце файла) — найдено реальным прогоном: Authelia (устанавливается в следующем play,
# "...продолжение: Helmwave up потребителей Authelia") на старте делает LDAP startup-check к
# freeipa, поэтому каталог и bind-аккаунт svc-authelia обязаны существовать уже к этому моменту.
# Пароли (secret/freeipa, secret/authelia) уже сгенерированы и опубликованы как факты хоста "cicd"
# в блоке "OpenBao: bootstrap" play выше, читаются здесь через hostvars.
- name: "Единая авторизация (ADR-0013): persistent freeipa"
  hosts: freeipa_hosts
  become: true
  vars:
    freeipa_dm_password: "{{ hostvars['cicd'].platform_aicd_freeipa_dm_password }}"
    freeipa_admin_password: "{{ hostvars['cicd'].platform_aicd_freeipa_admin_password }}"

  pre_tasks:
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

  roles:
    - freeipa

  tasks:
    # Найдено реальным прогоном: firewalld на этом образе Rocky 9 не запущен и не enabled по
    # умолчанию (systemctl is-active firewalld → inactive) — ansible.posix.firewalld с
    # immediate: true требует реально работающий демон, иначе падает "firewall is not currently
    # running". Раз уж на persistent-хосте (не одноразовая molecule-VM) заводим сервис,
    # разумнее сначала включить сам firewalld, чем оставлять хост вовсе без файрвола.
    - name: "Firewalld: запустить и включить автозапуск"
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    # ipa-server-install не открывает LDAP-порты в firewalld сам (roles/freeipa/README.md,
    # подтверждённое поведение апстрима) — роль тоже этого не делает, открывается здесь,
    # оркестрацией окружения (не размывает границы роли, ADR-0011 §3).
    - name: "Firewalld: разрешить LDAP/LDAPS для клиентов каталога (Authelia)"
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - freeipa-ldap
        - freeipa-ldaps

    - name: "Kinit admin (нужен валидный тикет Kerberos для ipa CLI ниже)"
      ansible.builtin.command:
        cmd: kinit admin
        stdin: "{{ freeipa_admin_password }}\n"
      changed_when: false
      no_log: true

    - name: "Проверить наличие сервисного bind-аккаунта svc-authelia"
      ansible.builtin.command: ipa user-show svc-authelia
      register: platform_aicd_ipa_svc_authelia_check
      changed_when: false
      failed_when: false

    # ADR-0011 §3 — заведение пользователей каталога сознательно не входит в саму роль freeipa
    # (только провижининг сервера), поэтому bind-аккаунт для Authelia заводится здесь,
    # оркестрацией окружения. Обычный непривилегированный IPA-пользователь — этого достаточно
    # для simple bind + чтения атрибутов пользователей/групп (дефолтные ACI FreeIPA разрешают это
    # любому аутентифицированному пользователю каталога, отдельные права не нужны).
    # --password-expiration далеко в будущем — без этого FreeIPA помечает пароль, заданный
    # админом при создании, как "требует смены при первом входе" (обычное поведение для
    # интерактивных пользователей); для сервисного аккаунта, который никогда не логинится
    # интерактивно, это привело бы к тому, что Authelia перестала бы проходить bind сразу после
    # первой примененной политики истечения пароля.
    - name: "Создать сервисный bind-аккаунт svc-authelia (только при первом прогоне)"
      when: platform_aicd_ipa_svc_authelia_check.rc != 0
      ansible.builtin.command:
        cmd: >-
          ipa user-add svc-authelia
          --first=Service --last=Authelia
          --password-expiration=20351231235959Z
          --password
        # Двойные кавычки обязательны: только в них YAML раскрывает \n как настоящий перенос
        # строки (в folded ">-"/литеральном "|" стиле \n остался бы буквальным текстом) — ipa
        # user-add --password интерактивно запрашивает пароль дважды, оба раза читает из stdin.
        stdin: "{{ hostvars['cicd'].platform_aicd_authelia_ldap_bind_password }}\n{{ hostvars['cicd'].platform_aicd_authelia_ldap_bind_password }}\n"
      # Задача только под when: ...rc != 0 (только первый прогон, реально создаёт аккаунт) —
      # changed_when: true корректен, тот же приём, что helmwave up (always-changed по design).
      changed_when: true
      no_log: true

    # docs/adr/0018-internal-caching-proxy.md — LDAP bind-аккаунт для Nexus (кеширующий прокси):
    # тот же приём, что svc-authelia выше, второй независимый bind-аккаунт в том же каталоге.
    - name: "Проверить наличие сервисного bind-аккаунта svc-nexus"
      ansible.builtin.command: ipa user-show svc-nexus
      register: platform_aicd_ipa_svc_nexus_check
      changed_when: false
      failed_when: false

    - name: "Создать сервисный bind-аккаунт svc-nexus (только при первом прогоне)"
      when: platform_aicd_ipa_svc_nexus_check.rc != 0
      ansible.builtin.command:
        cmd: >-
          ipa user-add svc-nexus
          --first=Service --last=Nexus
          --password-expiration=20351231235959Z
          --password
        stdin: "{{ hostvars['cicd'].platform_aicd_nexus_ldap_bind_password }}\n{{ hostvars['cicd'].platform_aicd_nexus_ldap_bind_password }}\n"
      changed_when: true
      no_log: true

    # roles/monitoring_agent — bind-аккаунт для ipa_exporter (метрики самого FreeIPA), тот же
    # приём, что svc-nexus выше.
    - name: "Проверить наличие сервисного bind-аккаунта svc-monitoring"
      ansible.builtin.command: ipa user-show svc-monitoring
      register: platform_aicd_ipa_svc_monitoring_check
      changed_when: false
      failed_when: false

    - name: "Создать сервисный bind-аккаунт svc-monitoring (только при первом прогоне)"
      when: platform_aicd_ipa_svc_monitoring_check.rc != 0
      ansible.builtin.command:
        cmd: >-
          ipa user-add svc-monitoring
          --first=Service --last=Monitoring
          --password-expiration=20351231235959Z
          --password
        stdin: "{{ hostvars['cicd'].platform_aicd_monitoring_agent_ldap_bind_password }}\n{{ hostvars['cicd'].platform_aicd_monitoring_agent_ldap_bind_password }}\n"
      changed_when: true
      no_log: true

    # ADR-0019 §3/§8 п.1 — ролевая модель: три платформенные группы-персоны и первый реальный
    # человек в каталоге (platform-admins). Пароль сгенерирован и опубликован как факт хоста
    # "cicd" в блоке "OpenBao: bootstrap" play выше (secret/freeipa-directory), читается здесь
    # через hostvars — тот же приём, что пароли svc-*-аккаунтов выше. freeipa_directory_ipa_host
    # явно = freeipa_hostname (не дефолтный ansible_fqdn роли) — роль freeipa парой задач выше по
    # этому же play меняет системный hostname хоста на freeipa_hostname, факты gather_facts
    # заново после этого не собираются, ansible_fqdn был бы устаревшим (см.
    # roles/freeipa_directory/README.md, «Куда играть роль»).
    - name: "Ролевая модель (ADR-0019): группы и первый реальный человек в каталоге"
      ansible.builtin.include_role:
        name: freeipa_directory
      vars:
        freeipa_directory_ipa_host: "{{ freeipa_hostname }}"
        freeipa_directory_ipa_pass: "{{ freeipa_admin_password }}"
        freeipa_directory_groups:
          - name: platform-admins
            description: "Полные права на все компоненты платформы (ADR-0019 §1)"
          - name: platform-engineers
            description: "Обычный пользователь/деплой; без администрирования сервисов"
          - name: platform-viewers
            description: "Read-only доступ там, где он предусмотрен (ADR-0019 §6)"
        freeipa_directory_users:
          - name: ivan
            first: Ivan
            last: Vinogradov
            email: ivan@aicd.platform
            password: "{{ hostvars['cicd'].platform_aicd_freeipa_directory_password_ivan }}"
            groups: [platform-admins]

    # ADR-0017/monitoring_agent — node_exporter (базовые метрики хоста) + ipa_exporter (метрики
    # самого FreeIPA) как systemd-сервисы (этот хост не в k3s-кластере). В отличие от
    # platform/aicd-devops-labs-ru здесь нет GPU-ноды вне кластера — только этот один внешний
    # хост. Метрики собираются в VictoriaMetrics через VMScrapeConfig/staticConfigs (см.
    # helm/values/platform/namespaces/monitoring/vm/extra-objects.yaml).
    - name: "Firewalld: разрешить порты экспортёров monitoring_agent (node_exporter/ipa_exporter)"
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - "9100/tcp"
        - "9189/tcp"

    # Доверие к внутреннему PKI CA OpenBao — нужно freeipa-хосту, чтобы скачать бинарь ipa_exporter
    # с nexus-cache (TLS выпущен из этого CA). RHEL/Rocky-путь (ADR-0011), не Debian/Ubuntu-путь
    # остальных потребителей в этом файле (cicd): /etc/pki/ca-trust/source/anchors +
    # update-ca-trust extract (тот же приём, что platform/aicd-devops-labs-ru/ansible/site.yml).
    # meta: flush_handlers сразу после — обновление доверия должно синхронно отработать до задачи
    # ниже, которая реально качает файл.
    - name: "Установить внутренний PKI CA в системный trust store freeipa (доверие к Nexus)"
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        dest: /etc/pki/ca-trust/source/anchors/aicd-platform-ca.pem
        owner: root
        group: root
        mode: '0644'
      notify: "CA обновлён на freeipa"

    - name: Форсировать выполнение хендлера CA прямо сейчас
      ansible.builtin.meta: flush_handlers

    # nexus-cache.aicd.platform — приватный домен без реального DNS, тот же приём, что остальные
    # /etc/hosts-записи в этом файле.
    - name: "/etc/hosts: nexus-cache.aicd.platform (для скачивания ipa_exporter с Nexus)"
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ hostvars['cicd']['ansible_host'] }} nexus-cache.aicd.platform"
        regexp: '\snexus-cache\.aicd\.platform$'

    # ROADMAP.md P0-57/P0-58 — бинарь freeipa-exporter из GitHub-релиза v1.0.0 требовал
    # GLIBC_2.35+, Rocky 9 (ADR-0011) даёт только glibc 2.34; пересобран под glibc 2.34
    # (ADDONS/exporters/freeipa_exporter/Dockerfile, target pyinstaller-artifact) и опубликован в
    # internal-releases (Nexus raw hosted, docs/adr/0018 §9) — тот же артефакт (v1.0.2, с фиксом
    # numSubordinates/_count_users), что уже верифицирован на platform/aicd-devops-labs-ru,
    # пересобран локально и залит сюда отдельным разовым шагом (не автоматизировано в этом
    # плейбуке — та же логика, что публикация артефакта вообще, ADR-0018 §9). Найдено живым
    # прогоном (2026-09-03): roles/monitoring_agent/tasks/systemd-ipa-exporter.yml ждёт бинарь
    # ВНУТРИ поддиректории архива (unarchive include: "*/freeipa-exporter" + --strip-component=1,
    # тот же формат, что типичный `goreleaser`-тарбол) — архив с бинарём прямо в корне
    # (`tar -czf ... freeipa-exporter`, первая попытка) распаковывался в "Not found in archive";
    # исправлено переупаковкой (`tar -czf ... freeipa-exporter-1.0.2-linux-amd64/`, бинарь внутри
    # каталога) — checksum ниже соответствует ИМЕННО этой, второй, версии архива.
    #
    # block/rescue — та же логика бутстрап-порядка, что apt-cache fallback в roles/
    # k3s_gpu_node/tasks/{nvidia,gvisor}.yml: сам пользователь svc-ipa-exporter-reader создаётся в
    # play "Platform CI/CD infra (продолжение)" НИЖЕ по файлу (Nexus не готов к REST-конфигурации
    # до Authelia/freeipa) — на первом прогоне после появления этой фичи здесь будет 401, а без
    # rescue такая ошибка аварийно останавливает весь дальнейший прогон плейбука. node_exporter
    # (первая роль внутри include_role) успевает отработать до этой точки в любом случае.
    - name: "Monitoring_agent: node_exporter + ipa_exporter (systemd)"
      block:
        - name: "Monitoring_agent: node_exporter + ipa_exporter (systemd)"
          ansible.builtin.include_role:
            name: monitoring_agent
          vars:
            monitoring_agent_orchestrator: systemd
            monitoring_agent_node_exporter_enabled: true
            monitoring_agent_ipa_exporter_enabled: true
            monitoring_agent_ipa_exporter_hosts: "{{ freeipa_hostname }}"
            monitoring_agent_ipa_exporter_domain: "{{ freeipa_domain }}"
            monitoring_agent_ipa_exporter_user: "uid=svc-monitoring,cn=users,cn=accounts,dc=aicd,dc=platform"
            monitoring_agent_ipa_exporter_password: "{{ hostvars['cicd'].platform_aicd_monitoring_agent_ldap_bind_password }}"
            monitoring_agent_ipa_exporter_binary_download_url: "https://nexus-cache.aicd.platform/repository/internal-releases/freeipa-exporter/freeipa-exporter-1.0.2.linux-amd64.tar.gz"
            monitoring_agent_ipa_exporter_binary_checksum: "sha256:f5e76bdce8046057194a1388b5572c5adba0b159fd7eb06231c9539a65f7973e"
            monitoring_agent_ipa_exporter_binary_download_username: svc-ipa-exporter-reader
            monitoring_agent_ipa_exporter_binary_download_password: "{{ hostvars['cicd'].platform_aicd_openbao_secret_nexus_read.json.data.data.internal_releases_reader_password }}"
      rescue:
        - name: "Ipa_exporter: Nexus internal-releases-reader ещё не создан на этом прогоне (см. play ниже) — не блокировать остальной прогон"
          ansible.builtin.debug:
            msg: >-
              Скачивание ipa_exporter не удалось (Nexus internal-releases-reader создаётся позже
              в этом же файле, play "Platform CI/CD infra (продолжение)") — ожидаемо на первом
              прогоне после включения фичи, повторный прогон должен пройти без rescue.

  handlers:
    - name: Обновить системный trust store freeipa
      listen: "CA обновлён на freeipa"
      ansible.builtin.command: update-ca-trust extract
      changed_when: true

# Play-продолжение (тот же хост platform_hosts/cicd, но ОТДЕЛЬНЫЙ play) — намеренно идёт
# ПОСЛЕ play freeipa_hosts ниже: Authelia (первый релиз, который поднимает Helmwave up тут)
# на старте делает LDAP startup-check к freeipa — каталог и bind-аккаунт svc-authelia должны
# существовать уже к этому моменту, не позже. Факты, установленные set_fact в предыдущем play
# на этом же хосте (platform_aicd_kubeconfig, platform_aicd_openbao_*, ...), остаются доступны
# как обычные переменные — hostvars персистентны для хоста в рамках всего прогона плейбука,
# независимо от границ между play.
- name: "Platform CI/CD infra (продолжение): Helmwave up потребителей Authelia"
  hosts: platform_hosts
  become: true

  tasks:

    # ADR-0013 — найдено реальным прогоном: init-контейнер configure-gitea (gitea admin auth
    # add-oauth --auto-discover-url https://sso.aicd.platform/...) падал с "certificate signed by
    # unknown authority" — Go-клиент внутри образа Gitea не доверяет внутреннему PKI CA OpenBao
    # (тот же CA, из которого выпущен authelia-tls). CA-сертификат публичный (не секрет) —
    # pki/ca/pem отдаёт его без токена, но токен передаём — не мешает. Secret с CA монтируется в
    # Gitea (values.yaml, extraVolumes/extraInit/ContainerVolumeMounts) — и в init-контейнер (где
    # настраивается OAuth-источник), и в основной контейнер (реальный обмен токеном при логине
    # пользователя тоже идёт через HTTPS к Authelia).
    - name: "OpenBao: получить PEM внутреннего Root CA (для доверия Gitea к Authelia)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.uri:
        url: "{{ platform_aicd_openbao_addr }}/v1/pki/ca/pem"
        ca_path: "{{ platform_aicd_openbao_ca_path }}"
        method: GET
        return_content: true
        status_code: [200]
      register: platform_aicd_pki_ca_pem

    - name: "Secret aicd-platform-ca (CA сертификат для доверия Gitea к Authelia)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: aicd-platform-ca
        namespace: platform
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            ca.pem: "{{ platform_aicd_pki_ca_pem.content }}"

    # docs/adr/0017-platform-cicd-default-addons.md — третий аддон (мониторинг). Namespace
    # monitoring создаётся раньше (см. "Namespace monitoring (для grafana-tls до Helmwave up)"
    # в начале play выше) — здесь только Secret'ы.
    # Secret'ы — namespace-scoped: aicd-platform-ca выше существует только в namespace "platform",
    # Grafana (namespace "monitoring") нуждается в собственной копии для доверия к
    # https://sso.aicd.platform при обмене OIDC-токеном (тот же CA, тот же приём, что у
    # Gitea/Semaphore).
    - name: "Secret aicd-platform-ca в namespace monitoring (для OIDC-обмена Grafana с Authelia)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: aicd-platform-ca
        namespace: monitoring
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            ca.pem: "{{ platform_aicd_pki_ca_pem.content }}"

    - name: "Secret grafana-admin-credentials-custom (пароль из secret/grafana в OpenBao)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: grafana-admin-credentials-custom
        namespace: monitoring
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            GF_SECURITY_ADMIN_USER: "{{ platform_aicd_openbao_secret_grafana_read.json.data.data.admin_user }}"
            GF_SECURITY_ADMIN_PASSWORD: "{{ platform_aicd_openbao_secret_grafana_read.json.data.data.admin_password }}"

    # docs/adr/0017-platform-cicd-default-addons.md — --tags ограничивает второй helmwave up
    # обязательными релизами (platform_aicd_core_releases) плюс включённым набором аддонов
    # (platform_aicd_default_addons/_extra_addons/_disabled_addons,
    # platform/aicd/ansible/group_vars/platform_hosts.yml). Каждый релиз в helmwave уже
    # автоматически тегируется своим именем (helm/helmwave.yml.tpl:76-78) — отдельный tags: в
    # envs/platform.yaml не нужен.
    - name: Helmwave up (Gitea + Semaphore + Flux + аддоны, helm/envs/platform.yaml)
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        K8S_CLUSTER: platform
        # Прокси control-хоста иначе уводит запросы к приватному IP kube-apiserver через себя —
        # таймаут "Kubernetes cluster unreachable" вместо ошибки роли/helmwave, тот же found,
        # что в roles/monitoring_server/tasks/monitoring-server.k3s.yml.
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        # Читаются gomplate-датасорсом vault:// в values.yaml Gitea/Semaphore (docs/adr/
        # 0016-openbao-secrets-pki.md §2) — scoped render-token (policy aicd-platform-render,
        # только read secret/gitea|semaphore), не root token (§5).
        VAULT_ADDR: "{{ platform_aicd_openbao_addr }}"
        VAULT_TOKEN: "{{ platform_aicd_openbao_render_token_value }}"
        # Найдено реальным прогоном после включения TLS на самом OpenBao (§5): datasource
        # vault:// внутри gomplate использует свой собственный HTTP-клиент (hashicorp/vault/api),
        # не ansible.builtin.uri — ca_path, заданный для ansible-задач, на него не действует.
        # Клиент честно проверяет сертификат и падает ("x509: certificate signed by unknown
        # authority") без явного доверенного CA — VAULT_CACERT это тот же стандартный env var,
        # что понимает Vault/OpenBao CLI.
        VAULT_CACERT: "{{ platform_aicd_openbao_ca_path }}"
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../../../helm"
        argv:
          - helmwave
          - up
          - --build
          - --yml
          - --templater
          - gomplate
          - --file
          - helmwave.platform.yml
          - --tags
          - "{{ (platform_aicd_core_releases + platform_aicd_enabled_addons) | join(',') }}"
      register: platform_aicd_helmwave_up
      changed_when: true

    # Дашборды экспортёров monitoring_agent — см. развёрнутое обоснование в
    # group_vars/platform_hosts.yml (platform_aicd_grafana_addons_dashboards; список там пока пуст,
    # задача — no-op до включения ipa_exporter в этом окружении). Строго после Helmwave up: и CRD
    # grafanadashboards.grafana.integreatly.org, и GrafanaFolder "addons", на который ссылается
    # folderRef, создаёт релиз grafana-operator.
    #
    # datasources — штатный механизм подстановки `__inputs` дашборда grafana-operator'ом:
    # экспортированный из Grafana JSON ссылается на датасорс плейсхолдером ${DS_VICTORIAMETRICS},
    # его нужно смапить на реальное имя датасорса. "VictoriaMetrics" — то, что заводит чарт vm
    # (defaultDatasources.victoriametrics, helm/values/.../monitoring/vm/grafana.yaml).
    - name: "GrafanaDashboard для экспортёров monitoring_agent (модель из ADDONS/grafana_dashboards)"
      loop: "{{ platform_aicd_grafana_addons_dashboards }}"
      loop_control:
        label: "{{ item.name }}"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        definition:
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaDashboard
          metadata:
            name: "{{ item.name }}"
            namespace: monitoring
            labels:
              app.kubernetes.io/managed-by: ansible
          spec:
            instanceSelector:
              matchLabels:
                dashboards: grafana
            folderRef: addons
            datasources:
              - inputName: DS_VICTORIAMETRICS
                datasourceName: VictoriaMetrics
            json: >-
              {{ lookup('ansible.builtin.file',
                        playbook_dir ~ '/../../../ADDONS/grafana_dashboards/' ~ item.file) }}

    # docs/adr/0022-new-component-requirements.md §12, docs/adr/0012-cicd-platform-architecture.md
    # §4 — раннер Gitea Actions (helm/values/platform/namespaces/platform/gitea-actions-runner/
    # values.yaml). Токен регистрации выдаёт САМ Gitea (в отличие от secret/radar/secret/nexus
    # выше, где пароль генерирует ansible вслепую до существования пода) — поэтому этот блок
    # обязан идти ПОСЛЕ Helmwave up (Gitea + Semaphore + ...) выше, а сам релиз раннера — отдельным
    # `helmwave up --tags gitea-actions-runner` в конце этого блока, не в общем combined-вызове
    # (helm/envs/platform.yaml, комментарий у release gitea-actions-runner — полное обоснование).
    - name: "Дождаться готовности пода Gitea (нужен для generate-runner-token)"
      when: platform_aicd_gitea_actions_runner_enabled | default(true)
      delegate_to: localhost
      become: false
      run_once: true
      kubernetes.core.k8s_info:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        api_version: v1
        kind: Pod
        namespace: platform
        label_selectors:
          - "app.kubernetes.io/instance=gitea"
      register: platform_aicd_gitea_pod
      until: >-
        platform_aicd_gitea_pod.resources | length > 0 and
        (platform_aicd_gitea_pod.resources[0].status.containerStatuses | default([])
          | selectattr('ready', 'equalto', true) | list | length > 0)
      retries: 60
      delay: 10

    - name: "OpenBao: прочитать secret/gitea (проверить наличие actions_runner_token)"
      when: platform_aicd_gitea_actions_runner_enabled | default(true)
      ansible.builtin.uri:
        url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/gitea"
        ca_path: "{{ platform_aicd_openbao_ca_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
        status_code: [200]
      register: platform_aicd_openbao_secret_gitea_for_runner
      no_log: true

    # Путь к app.ini — конвенция gitea-rootless-образа (chart gitea-charts/gitea монтирует
    # персистентный том на /data, см. gitea.com/gitea/helm-actions#automating-the-token-generation
    # для контекста), НЕ проверено реальным прогоном — при первом живом прогоне сверить
    # (kubectl exec ... -- printenv GITEA_APP_INI) и поправить при расхождении.
    - name: "Gitea: сгенерировать registration-token для Actions-раннера (если ещё нет в secret/gitea)"
      when:
        - platform_aicd_gitea_actions_runner_enabled | default(true)
        - "'actions_runner_token' not in platform_aicd_openbao_secret_gitea_for_runner.json.data.data"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        namespace: platform
        pod: "{{ platform_aicd_gitea_pod.resources[0].metadata.name }}"
        command: gitea --config /data/gitea/conf/app.ini actions generate-runner-token
      register: platform_aicd_gitea_runner_token_generated
      no_log: true

    # Ретрофит в существующий secret/gitea — тот же приём, что internal_releases_reader_password
    # у secret/nexus выше. Токен переиспользуемый (docs.gitea.com/usage/actions/act-runner/:
    # "valid for registering multiple runners, until... revoked") — записывается один раз, не
    # перевыпускается на каждом прогоне.
    - name: "OpenBao: добавить actions_runner_token в существующий secret/gitea"
      when:
        - platform_aicd_gitea_actions_runner_enabled | default(true)
        - "'actions_runner_token' not in platform_aicd_openbao_secret_gitea_for_runner.json.data.data"
      no_log: true
      ansible.builtin.uri:
        url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/gitea"
        ca_path: "{{ platform_aicd_openbao_ca_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
        body_format: json
        body:
          data: >-
            {{
              platform_aicd_openbao_secret_gitea_for_runner.json.data.data
              | combine({'actions_runner_token': platform_aicd_gitea_runner_token_generated.stdout | trim})
            }}
        status_code: [200, 204]

    - name: Helmwave up (Gitea Actions Runner, helm/envs/platform.yaml)
      when: platform_aicd_gitea_actions_runner_enabled | default(true)
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        K8S_CLUSTER: platform
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        VAULT_ADDR: "{{ platform_aicd_openbao_addr }}"
        VAULT_TOKEN: "{{ platform_aicd_openbao_render_token_value }}"
        VAULT_CACERT: "{{ platform_aicd_openbao_ca_path }}"
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../../../helm"
        argv:
          - helmwave
          - up
          - --build
          - --yml
          - --templater
          - gomplate
          - --file
          - helmwave.platform.yml
          - --tags
          - gitea-actions-runner
      register: platform_aicd_helmwave_up_gitea_actions_runner
      changed_when: true

    # docs/adr/0018-internal-caching-proxy.md — bootstrap Nexus (кеширующий прокси): реальный
    # admin-пароль вместо auto-generated при первом старте пода, три proxy-repo, LDAP-realm.
    # Все запросы — delegate_to: localhost через Ingress (https://nexus.aicd.platform), тот же
    # принцип, что остальные REST-bootstrap'ы этого site.yml, требует TLS-сертификат nexus-tls
    # (issue-tls-cert.yml ниже в этом же файле) и наличие nexus.aicd.platform в /etc/hosts
    # оператора (README, «/etc/hosts операторов»).
    - name: "Записать внутренний PKI CA локально (для запросов к REST API Nexus)"
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        content: "{{ platform_aicd_pki_ca_pem.content }}"
        mode: '0644'

    - name: "Дождаться готовности пода Nexus"
      delegate_to: localhost
      become: false
      run_once: true
      kubernetes.core.k8s_info:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        api_version: v1
        kind: Pod
        namespace: cache
        label_selectors:
          - "app.kubernetes.io/instance=nexus"
      register: platform_aicd_nexus_pod
      until: >-
        platform_aicd_nexus_pod.resources | length > 0 and
        (platform_aicd_nexus_pod.resources[0].status.containerStatuses | default([])
          | selectattr('ready', 'equalto', true) | list | length > 0)
      retries: 60
      delay: 10

    # Пароль в secret/nexus УЖЕ финальный (сгенерирован заранее, до этого play) — проверяем, что
    # Nexus реально его принимает: если нет (под ещё со своим auto-generated паролем при самом
    # первом старте), меняем через REST API. Идемпотентно без привязки к номеру прогона —
    # работает и если secret/nexus существовал давно, а под пересоздался (PVC сохранил /nexus-data,
    # но теоретически не всегда).
    - name: "Nexus: проверить, актуален ли admin-пароль"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # Без force_basic_auth модуль сперва шлёт запрос БЕЗ Basic Auth и добавляет его только
        # увидев 401 (штатное поведение ansible.builtin.uri). GET на анонимно читаемые эндпоинты
        # Nexus (например, этот) из-за этого "проходит" 200 ещё до реальной проверки пароля — сам
        # факт успеха такого GET ничего не доказывает про корректность admin_password. Хуже того,
        # POST/PUT с телом в этой схеме падали 401 Unauthorized (повторная отправка запроса с
        # телом после challenge ненадёжна) — живой прогон platform/aicd-devops-labs-ru 2026-08-28.
        # force_basic_auth здесь и во всех остальных Nexus REST-задачах ниже заставляет слать
        # креды сразу, при первой попытке.
        force_basic_auth: true
        status_code: [200, 401]
      register: platform_aicd_nexus_auth_check
      no_log: true

    # Найдено живым прогоном (2026-09-03, первый реальный прогон этого окружения, README §«Кеширующий
    # прокси» — «не проверено реальным прогоном»): в отличие от остальных Nexus REST-задач (uri,
    # обычный HTTPS) и от kubernetes.core.k8s_info/k8s (Python kubernetes client, не ходит через
    # системный прокси), kubernetes.core.k8s_exec использует websocket-подключение к API-серверу —
    # оно ЧЕСТНО уважает системный HTTP(S)_PROXY и без явного NO_PROXY уходит в локальный прокси
    # (здесь — 127.0.0.1:8118), который не умеет CONNECT для вебсокетов ("failed CONNECT via proxy
    # status: 503"). У platform/aicd-devops-labs-ru та же задача исторически "работала" без этого
    # блока только потому, что её сеть (10.10.10.0/24) уже входит в глобальный NO_PROXY control-хоста
    # — совпадение, а не гарантия; тот файл исправлен тем же приёмом отдельно.
    - name: "Nexus: прочитать сгенерированный при первом старте admin-пароль"
      when: platform_aicd_nexus_auth_check.status == 401
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        namespace: cache
        pod: "{{ platform_aicd_nexus_pod.resources[0].metadata.name }}"
        command: cat /nexus-data/admin.password
      register: platform_aicd_nexus_initial_password
      no_log: true

    - name: "Nexus: сменить admin-пароль на сгенерированный в secret/nexus"
      when: platform_aicd_nexus_auth_check.status == 401
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/users/admin/change-password"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: PUT
        url_username: admin
        url_password: "{{ platform_aicd_nexus_initial_password.stdout }}"
        force_basic_auth: true
        body_format: raw
        headers:
          Content-Type: text/plain
        body: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        status_code: [204]

    - name: "Nexus: получить список существующих repositories"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: platform_aicd_nexus_repos
      no_log: true

    - name: "Nexus: создать docker-hub-proxy (если ещё нет)"
      when: "'docker-hub-proxy' not in (platform_aicd_nexus_repos.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories/docker/proxy"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: docker-hub-proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
          docker:
            v1Enabled: false
            forceBasicAuth: false
            httpPort: 8083
          # dockerProxy — обязательный блок специально для docker-формата proxy-repo (в отличие
          # от docker hosted/group), найдено реальным прогоном (400 Bad Request без него) через
          # схему /service/rest/swagger.json самого Nexus: DockerProxyRepositoryApiRequest
          # требует dockerProxy.indexType. HUB — тип индекса для Docker Hub (remoteUrl ниже),
          # Nexus сам подставляет индекс-URL Docker Hub, indexUrl не нужен.
          dockerProxy:
            indexType: HUB
          proxy:
            remoteUrl: https://registry-1.docker.io
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
        status_code: [201]

    - name: "Nexus: создать k3s-releases-proxy (если ещё нет)"
      when: "'k3s-releases-proxy' not in (platform_aicd_nexus_repos.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories/raw/proxy"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: k3s-releases-proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: false
          proxy:
            remoteUrl: https://github.com/
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
        status_code: [201]

    # apt-формат — не проверено эмпирически (известны истории проблем Nexus apt-proxy именно с
    # HTTPS-бэкендами, ADR-0018 §6) — не блокирует остальное (docker/raw), если не заведётся.
    - name: "Nexus: создать nvidia-toolkit-apt-proxy (если ещё нет)"
      when: "'nvidia-toolkit-apt-proxy' not in (platform_aicd_nexus_repos.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      failed_when: false
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories/apt/proxy"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: nvidia-toolkit-apt-proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
          apt:
            distribution: stable
            flat: false
          proxy:
            remoteUrl: https://nvidia.github.io/libnvidia-container
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
        status_code: [201]

    - name: "Nexus: создать gvisor-apt-proxy (если ещё нет)"
      when: "'gvisor-apt-proxy' not in (platform_aicd_nexus_repos.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      failed_when: false
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories/apt/proxy"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: gvisor-apt-proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
          apt:
            distribution: release
            flat: false
          proxy:
            remoteUrl: https://storage.googleapis.com/gvisor/releases
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
        status_code: [201]

    # Raw-hosted репозиторий для внутренних артефактов, которые не проксируются откуда-то извне
    # (в отличие от трёх repo выше) — платформа сама владеет содержимым. Первый потребитель —
    # freeipa-exporter, пересобранный под glibc 2.34 (ROADMAP.md P0-57: оригинальный релиз
    # GitHub требовал GLIBC_2.35, падал на Rocky 9). Сам артефакт заливается сюда не этим
    # плейбуком (см. README ADDONS/exporters/freeipa_exporter — одноразовая публикация, тот же
    # принцип, что сборка/push dcgm-exporter в Gitea, ADR-0017) — здесь только идемпотентное
    # создание самого репозитория, чтобы он гарантированно существовал к моменту, когда
    # ipa_exporter ниже попытается с него скачать бинарь.
    - name: "Nexus: создать internal-releases (raw hosted, если ещё нет)"
      when: "'internal-releases' not in (platform_aicd_nexus_repos.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories/raw/hosted"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: internal-releases
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
            # ALLOW_ONCE — загруженный путь неизменяем после первой публикации (как GitHub
            # releases, откуда раньше брался freeipa-exporter): новая версия — новый путь/имя
            # файла, а не перезапись существующего, чтобы уже закешированный на хостах бинарь и
            # его checksum не разъезжались молча.
            writePolicy: ALLOW_ONCE
        status_code: [201]

    # docs/adr/0024-platform-docs-site.md — второй raw-hosted репозиторий, отдельный от
    # internal-releases выше: docs-site пересобирается CI-джобой (.gitea/workflows/docs-site.yml)
    # при КАЖДОМ push в main и публикуется по фиксированному пути docs-site/latest.tar.gz — этому
    # принципиально нужен ALLOW (перезаписываемый путь), а не ALLOW_ONCE у internal-releases
    # (там путь неизменяем после первой публикации, годится только для версионированных релизов
    # вроде freeipa-exporter). Смешивать оба паттерна записи в одном репозитории не стали.
    - name: "Nexus: создать docs-site (raw hosted, если ещё нет)"
      when: "'docs-site' not in (platform_aicd_nexus_repos.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/repositories/raw/hosted"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          name: docs-site
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
            writePolicy: ALLOW
        status_code: [201]

    # Найдено живым прогоном на platform/aicd-devops-labs-ru (2026-09-02): anonymous access в
    # этом Nexus глобально выключен (security/anonymous: enabled=false) — по умолчанию у свежей
    # Community Edition, не наш осознанный выбор. Значит "нет forwardAuth" из ADR-0018 для
    # nexus-cache — не то же самое, что "без всякой аутентификации": скоуп-аккаунт с правом
    # только на чтение internal-releases, а не общее включение anonymous на весь Nexus (по
    # согласованию — уже так исторически принято в этом репозитории, ср. scoped VAULT_TOKEN
    # policy для gomplate/helmwave вместо root-токена). Privileges
    # nx-repository-view-raw-internal-releases-{read,browse} — автосоздаются Nexus'ом для
    # каждого репозитория (не нужно заводить их отдельным REST-вызовом).
    - name: "Nexus: получить список существующих ролей"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/roles"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: platform_aicd_nexus_roles
      no_log: true

    - name: "Nexus: создать роль internal-releases-reader (если ещё нет)"
      when: "'internal-releases-reader' not in (platform_aicd_nexus_roles.json | map(attribute='id') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/roles"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          id: internal-releases-reader
          name: internal-releases-reader
          description: "Только чтение internal-releases (roles/monitoring_agent, ipa_exporter)"
          privileges:
            - nx-repository-view-raw-internal-releases-read
            - nx-repository-view-raw-internal-releases-browse
        status_code: [200]

    # docs/adr/0024-platform-docs-site.md — write-роль для CI-джобы (.gitea/workflows/docs-site.yml),
    # публикующей собранный сайт в docs-site/latest.tar.gz. add/edit (не только read/browse, как у
    # internal-releases-reader выше) — единственный сегодня консьюмер, которому реально нужна запись,
    # не просто чтение.
    - name: "Nexus: создать роль docs-site-publisher (если ещё нет)"
      when: "'docs-site-publisher' not in (platform_aicd_nexus_roles.json | map(attribute='id') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/roles"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          id: docs-site-publisher
          name: docs-site-publisher
          description: "Публикация docs-site/latest.tar.gz (.gitea/workflows/docs-site.yml)"
          privileges:
            - nx-repository-view-raw-docs-site-read
            - nx-repository-view-raw-docs-site-browse
            - nx-repository-view-raw-docs-site-add
            - nx-repository-view-raw-docs-site-edit
        status_code: [200]

    # docs/adr/0019-platform-rbac-model.md §6 — маппинг platform-*-групп в роли Nexus. Публичный
    # REST не создаёт "external role mapping" отдельным объектом (POST .../security/roles с
    # "source": "ldap" молча игнорируется — подтверждено официально Sonatype, community.sonatype.com,
    # см. ссылку в ADR) — вместо этого Nexus сопоставляет LDAP-группу с ролью ПО СОВПАДЕНИЮ id:
    # обычная роль с id, равным имени группы каталога, тем же REST-вызовом, что уже создаёт
    # internal-releases-reader выше. platform-admins — вложенная роль nx-admin (не копируем её
    # привилегии вручную — nx-admin: nx-all, встроенная роль Nexus, id стабилен между версиями).
    # platform-engineers/platform-viewers — явные privileges (в ADR только словесно "publish/
    # deploy"/"read-only", точный список — решение на этапе реализации): *-add/-edit дают
    # публикацию поверх *-read/-browse у engineers, viewers — только browse/read (тот же набор,
    # что встроенная nx-anonymous, но НЕ анонимный доступ — привязан к LDAP-группе).
    - name: "Nexus: создать роль platform-admins (если ещё нет)"
      when: "'platform-admins' not in (platform_aicd_nexus_roles.json | map(attribute='id') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/roles"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          id: platform-admins
          name: platform-admins
          description: "ADR-0019 §6 — маппинг LDAP-группы platform-admins (по совпадению id)"
          privileges: []
          roles:
            - nx-admin
        status_code: [200]

    - name: "Nexus: создать роль platform-engineers (если ещё нет)"
      when: "'platform-engineers' not in (platform_aicd_nexus_roles.json | map(attribute='id') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/roles"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          id: platform-engineers
          name: platform-engineers
          description: "ADR-0019 §6 — маппинг LDAP-группы platform-engineers (по совпадению id): publish/deploy"
          privileges:
            - nx-repository-view-*-*-browse
            - nx-repository-view-*-*-read
            - nx-repository-view-*-*-add
            - nx-repository-view-*-*-edit
          roles: []
        status_code: [200]

    - name: "Nexus: создать роль platform-viewers (если ещё нет)"
      when: "'platform-viewers' not in (platform_aicd_nexus_roles.json | map(attribute='id') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/roles"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          id: platform-viewers
          name: platform-viewers
          description: "ADR-0019 §6 — маппинг LDAP-группы platform-viewers (по совпадению id): read-only"
          privileges:
            - nx-repository-view-*-*-browse
            - nx-repository-view-*-*-read
          roles: []
        status_code: [200]

    - name: "Nexus: получить список существующих пользователей"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/users?userId=svc-ipa-exporter-reader"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: platform_aicd_nexus_users
      no_log: true

    - name: "Nexus: создать пользователя svc-ipa-exporter-reader (если ещё нет)"
      when: platform_aicd_nexus_users.json | length == 0
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/users"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          userId: svc-ipa-exporter-reader
          firstName: Service
          lastName: "Artifact Reader"
          emailAddress: svc-ipa-exporter-reader@aicd.platform
          password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.internal_releases_reader_password }}"
          status: active
          roles:
            - internal-releases-reader
        status_code: [200]

    - name: "Nexus: получить список существующих пользователей (docs-site-publisher)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/users?userId=svc-docs-site-publisher"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: platform_aicd_nexus_docs_site_users
      no_log: true

    - name: "Nexus: создать пользователя svc-docs-site-publisher (если ещё нет)"
      when: platform_aicd_nexus_docs_site_users.json | length == 0
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/users"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          userId: svc-docs-site-publisher
          firstName: Service
          lastName: "Docs Site Publisher"
          emailAddress: svc-docs-site-publisher@aicd.platform
          password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.docs_site_publisher_password }}"
          status: active
          roles:
            - docs-site-publisher
        status_code: [200]

    - name: "Nexus: получить список существующих LDAP-серверов"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/ldap"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: platform_aicd_nexus_ldap_servers
      no_log: true

    # host/port/searchBase/authUsername — те же значения, что уже применены в
    # authelia/values.yaml (identity_providers.oidc.authentication_backend.ldap) для того же
    # FreeIPA (ADR-0013 §3), только под другой bind-аккаунт (svc-nexus, play freeipa_hosts выше).
    - name: "Nexus: создать LDAP-сервер freeipa (если ещё нет)"
      when: "'freeipa' not in (platform_aicd_nexus_ldap_servers.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/ldap"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: freeipa
          protocol: LDAP
          host: ipa.aicd.platform
          port: 389
          searchBase: "DC=aicd,DC=platform"
          authScheme: SIMPLE
          authUsername: "UID=svc-nexus,CN=users,CN=accounts,DC=aicd,DC=platform"
          authPassword: "{{ hostvars['cicd'].platform_aicd_nexus_ldap_bind_password }}"
          connectionTimeoutSeconds: 30
          connectionRetryDelaySeconds: 30
          maxIncidentsCount: 3
          userBaseDn: "CN=users,CN=accounts"
          userSubtree: true
          userObjectClass: person
          userLdapFilter: ""
          userIdAttribute: uid
          userRealNameAttribute: cn
          userEmailAddressAttribute: mail
          userPasswordAttribute: ""
          # ldapGroupsAsRoles: true — реально главный переключатель (найдено живым прогоном,
          # ADR-0019 §6): без него Nexus вообще не резолвит LDAP-группы пользователя (ни в
          # roles, ни в externalRoles GET .../security/users?userId=X — пусто), groupType/
          # userMemberOfAttribute ниже сами по себе не включают маппинг. Схема
          # CreateLdapServerXo (/service/rest/swagger.json) явно требует его для groupType.
          ldapGroupsAsRoles: true
          # DYNAMIC (не dynamic) — найдено сверкой со схемой /service/rest/swagger.json:
          # CreateLdapServerXo.groupType — enum [DYNAMIC, STATIC], регистрозависимо.
          groupType: DYNAMIC
          userMemberOfAttribute: memberOf
        status_code: [201]

    # Ретрофит для уже забутстрапленного LDAP-сервера freeipa (наш реальный случай — сервер был
    # создан задачей выше ДО того, как в неё добавили ldapGroupsAsRoles/groupType/
    # userMemberOfAttribute для ADR-0019 §6, задача-создание гейтится "если ещё нет" и никогда не
    # перезапустится на уже существующем сервере). Найдено живым прогоном: GET .../security/ldap/
    # freeipa у уже развёрнутого стенда отдавал ldapGroupsAsRoles: false, groupType: null —
    # LDAP-пользователь reallly аутентифицировался (401 на неверный пароль, значит бинд работал),
    # но roles/externalRoles оставались пустыми при любом реальном членстве в platform-*-группах.
    # PUT — полная замена объекта (не merge), поэтому переданы все поля, не только недостающие.
    - name: "Nexus: обновить LDAP-сервер freeipa (ldapGroupsAsRoles/groupType, если рассинхронизировано)"
      when: >-
        not platform_aicd_nexus_ldap_servers.json
        | selectattr('name', 'equalto', 'freeipa')
        | selectattr('ldapGroupsAsRoles', 'defined')
        | selectattr('ldapGroupsAsRoles', 'equalto', true)
        | list | length > 0
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/ldap/freeipa"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: PUT
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        body_format: json
        body:
          # id — внутренний UUID уже существующего сервера (не имя!), обязателен для PUT в
          # отличие от POST/создания (найдено живым прогоном: без него — 400 "PARAMETER id must
          # not be empty", PUT — full-resource-replace, а не merge по имени).
          id: "{{ platform_aicd_nexus_ldap_servers.json | selectattr('name', 'equalto', 'freeipa') | map(attribute='id') | first }}"
          name: freeipa
          protocol: LDAP
          host: ipa.aicd.platform
          port: 389
          searchBase: "DC=aicd,DC=platform"
          authScheme: SIMPLE
          authUsername: "UID=svc-nexus,CN=users,CN=accounts,DC=aicd,DC=platform"
          authPassword: "{{ hostvars['cicd'].platform_aicd_nexus_ldap_bind_password }}"
          connectionTimeoutSeconds: 30
          connectionRetryDelaySeconds: 30
          maxIncidentsCount: 3
          userBaseDn: "CN=users,CN=accounts"
          userSubtree: true
          userObjectClass: person
          userLdapFilter: ""
          userIdAttribute: uid
          userRealNameAttribute: cn
          userEmailAddressAttribute: mail
          userPasswordAttribute: ""
          ldapGroupsAsRoles: true
          groupType: DYNAMIC
          userMemberOfAttribute: memberOf
        status_code: [204]

    - name: "Nexus: очистить LDAP-кэш (после обновления ldapGroupsAsRoles/groupType)"
      when: >-
        not platform_aicd_nexus_ldap_servers.json
        | selectattr('name', 'equalto', 'freeipa')
        | selectattr('ldapGroupsAsRoles', 'defined')
        | selectattr('ldapGroupsAsRoles', 'equalto', true)
        | list | length > 0
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/ldap/cache"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: DELETE
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        force_basic_auth: true
        status_code: [204]

    - name: "Nexus: активировать LDAP-realm"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.platform"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.platform/service/rest/v1/security/realms/active"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: PUT
        url_username: admin
        url_password: "{{ platform_aicd_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        # НЕ NexusAuthorizingRealm — в Nexus 3.95.3 такого realmId не существует вовсе (реальный
        # прогон platform/aicd-devops-labs-ru 2026-08-28: "Unknown realmIds:
        # [NexusAuthorizingRealm]"; полный список доступных — GET /v1/security/realms/available:
        # AnsibleGalaxyToken, ConanToken, DefaultRole, DockerToken, HuggingFaceToken, LdapRealm,
        # NexusAuthenticatingRealm, NpmToken, NuGetApiKey, OciBearerToken, PubToken, rutauth-realm,
        # TerraformToken — устаревшая рекомендация из старой документации Sonatype, актуальная
        # схема разделяет аутентификацию и авторизацию иначе).
        body: ["NexusAuthenticatingRealm", "LdapRealm"]
        status_code: [204]

    # docs/adr/0018-internal-caching-proxy.md — containerd/k3s зеркалирует docker.io через
    # docker-hub-proxy Nexus (нативный механизм registries.yaml, ничего не изобретается). Пишется
    # только сюда, на control-plane — это единственный узел этого окружения (в
    # aicd-devops-labs-ru тот же файл пишется и на llm1, отдельной задачей в его play).
    - name: "Containerd: зеркалировать docker.io через Nexus (registries.yaml)"
      ansible.builtin.template:
        src: templates/registries.yaml.j2
        dest: /etc/rancher/k3s/registries.yaml
        owner: root
        group: root
        mode: '0644'
      notify: "Перезапустить k3s (подхватить registries.yaml)"

    # gitops-git-auth (flux-system) — basic-auth для Flux GitRepository "gitops"
    # (platform/aicd/flux/gitrepository.yaml), тот же admin-аккаунт Gitea. Секрет заведён вручную
    # (platform/aicd/flux/git-credentials-secret.yaml, флейс-README «Не проработано») ДО OpenBao,
    # с плейсхолдером "PleAse_Change_ME!" — найдено реальным прогоном: при переезде
    # gitea.admin.password на OpenBao (docs/adr/0016-openbao-secrets-pki.md) этот Secret не
    # синхронизировали, GitRepository ушёл в authentication required на часы незамеченным.
    # Синхронизируется здесь безусловно на каждом прогоне (идемпотентно — Secret не меняется,
    # если пароль тот же), после helmwave up выше — только тогда гарантированно существует
    # namespace flux-system (создаётся релизом flux2, create_namespace: true).
    - name: "Flux: прочитать текущий admin_password secret/gitea (для gitops-git-auth)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.uri:
        url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/gitea"
        ca_path: "{{ platform_aicd_openbao_ca_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
        status_code: [200]
      register: platform_aicd_openbao_secret_gitea_current

    - name: "Flux: синхронизировать gitops-git-auth (flux-system) с текущим admin_password"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: gitops-git-auth
        namespace: flux-system
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            username: gitea_admin
            password: "{{ platform_aicd_openbao_secret_gitea_current.json.data.data.admin_password }}"

    # docs/adr/0017-platform-cicd-default-addons.md — Radar сам никого не аутентифицирует
    # (auth.mode: none, дефолт чарта), доступ гейтится Traefik Middleware (тот же приём, что уже
    # применён для infra_panel/reverse_proxy_traefik: community.general.htpasswd на
    # control-хосте + Secret с готовым htpasswd-содержимым). Пароль — из уже наполненного OpenBao
    # (secret/radar), не хардкод. Блок безусловный — при отсутствии релиза radar в
    # platform_aicd_enabled_addons Middleware/Ingress просто не на что ссылаться, задачи
    # остаются безвредным идемпотентным no-op.
    - name: "Radar: прочитать текущий admin_password secret/radar (для basic-auth)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.uri:
        url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/radar"
        ca_path: "{{ platform_aicd_openbao_ca_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
        status_code: [200]
      register: platform_aicd_openbao_secret_radar_current

    # community.general.htpasswd идемпотентен сам по себе (тот же приём, что
    # roles/infra_panel/tasks/infra-panel.k3s.yml) — перезаписывает файл только если хэш
    # действительно меняется, поэтому пересчёт на каждом прогоне безопасен.
    - name: "Radar: посчитать htpasswd для basic-auth (control-хост)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      community.general.htpasswd:
        path: "{{ playbook_dir }}/.kube-tmp/radar-htpasswd"
        name: admin
        password: "{{ platform_aicd_openbao_secret_radar_current.json.data.data.admin_password }}"
        mode: '0600'

    - name: "Radar: прочитать рендернутый htpasswd обратно"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      ansible.builtin.set_fact:
        platform_aicd_radar_htpasswd: "{{ lookup('ansible.builtin.file', playbook_dir + '/.kube-tmp/radar-htpasswd') }}"

    - name: "Radar: сохранить Secret radar-basic-auth"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: radar-basic-auth
        namespace: platform
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            users: "{{ platform_aicd_radar_htpasswd }}"

    # Middleware CRD Traefik (traefik.io/v1alpha1) — Radar сам такой ресурс не создаёт (обычный
    # k8s Ingress в helm/values/platform/namespaces/platform/radar/values.yaml, не IngressRoute).
    # Ingress ссылается на него аннотацией
    # "traefik.ingress.kubernetes.io/router.middlewares: platform-radar-basic-auth@kubernetescrd"
    # (формат <namespace>-<имя>@kubernetescrd).
    - name: "Radar: Middleware radar-basic-auth (Traefik)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: radar-basic-auth
            namespace: platform
            labels:
              app.kubernetes.io/managed-by: ansible
          spec:
            basicAuth:
              secret: radar-basic-auth

    # docs/adr/0017-platform-cicd-default-addons.md §3 — infra-panel (homer) сам никого не
    # аутентифицирует (в отличие от Gitea/Semaphore/OpenBao), тот же приём basic-auth через
    # Traefik Middleware, что уже применён для Radar выше — 1:1 повтор с заменой имён.
    - name: "Infra Panel: прочитать текущий admin_password secret/infra-panel (для basic-auth)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.uri:
        url: "{{ platform_aicd_openbao_addr }}/v1/secret/data/infra-panel"
        ca_path: "{{ platform_aicd_openbao_ca_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ platform_aicd_openbao_root_token }}"
        status_code: [200]
      register: platform_aicd_openbao_secret_infra_panel_current

    - name: "Infra Panel: посчитать htpasswd для basic-auth (control-хост)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      community.general.htpasswd:
        path: "{{ playbook_dir }}/.kube-tmp/infra-panel-htpasswd"
        name: admin
        password: "{{ platform_aicd_openbao_secret_infra_panel_current.json.data.data.admin_password }}"
        mode: '0600'

    - name: "Infra Panel: прочитать рендернутый htpasswd обратно"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      ansible.builtin.set_fact:
        platform_aicd_infra_panel_htpasswd: "{{ lookup('ansible.builtin.file', playbook_dir + '/.kube-tmp/infra-panel-htpasswd') }}"

    - name: "Infra Panel: сохранить Secret infra-panel-basic-auth"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: infra-panel-basic-auth
        namespace: platform
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            users: "{{ platform_aicd_infra_panel_htpasswd }}"

    - name: "Infra Panel: Middleware infra-panel-basic-auth (Traefik)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: infra-panel-basic-auth
            namespace: platform
            labels:
              app.kubernetes.io/managed-by: ansible
          spec:
            basicAuth:
              secret: infra-panel-basic-auth

    # ADR-0013 §4 — единый forwardAuth-шлюз перед панелями без собственного логина. Заменяет
    # basic-auth Middleware у infra-panel/radar (values обеих ingressroutes переключены на этот
    # Middleware, secret/Middleware *-basic-auth не удалены — просто больше ни на что не влияют,
    # тот же принцип, что уже задокументирован для disabled_addons, ADR-0017 §1).
    #
    # Найдено реальным прогоном — ДВЕ находки, обе критичные:
    # 1) Эндпоинт: официальный actuel для Traefik — /api/authz/forward-auth, НЕ легаси
    #    /api/verify (authelia.com/integration/proxies/traefik/). /api/verify реально принимал
    #    вызов, но игнорировал X-Forwarded-Host и авторизовывал запрос по ДОМЕНУ САМОГО ВЫЗОВА
    #    (sso.aicd.platform, policy: bypass) — то есть forwardAuth ВСЕГДА пропускал запрос
    #    независимо от реального защищаемого домена (Authelia debug-лог: "Check authorization of
    #    subject ... and object https://sso.aicd.platform/api/verify..." — не infra-panel/radar).
    #    Реальная, эксплуатируемая дыра в защите, не просто баг рендеринга.
    # 2) address — внутренний ClusterIP-сервис authelia-authelia:9091 напрямую (обычный HTTP, без
    #    TLS), а не внешний https://sso.aicd.platform (тоже по официальному примеру Traefik).
    #    Убирает разом: hairpin-петлю Traefik→сам себя через внешний домен, необходимость
    #    tls.insecureSkipVerify (было нужно только из-за HTTPS до внешнего домена) и саму
    #    возможность спутать домен вызова с доменом защищаемого ресурса.
    - name: "Authelia: Middleware authelia-forward-auth (Traefik)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: Middleware
          metadata:
            name: authelia-forward-auth
            namespace: platform
            labels:
              app.kubernetes.io/managed-by: ansible
          spec:
            forwardAuth:
              address: "http://authelia-authelia.platform.svc.cluster.local:9091/api/authz/forward-auth"
              trustForwardHeader: true
              maxResponseBodySize: 8192
              authResponseHeaders:
                - Remote-User
                - Remote-Groups
                - Remote-Name
                - Remote-Email

    # docs/adr/0017-platform-cicd-default-addons.md §3 — OpenBao слушает только TLS
    # самоподписанным bootstrap-сертификатом (openbao-server-tls), Traefik не доверяет ему по
    # умолчанию при проксировании в backend по HTTPS (appProtocol: HTTPS у Service, см.
    # helm/values/platform/namespaces/platform/openbao/values.yaml) — ServersTransport с
    # insecureSkipVerify снимает эту проверку для этого конкретного backend'а (внутренний трафик
    # кластера, не внешний periметр — внешний TLS терминируется отдельным сертификатом
    # openbao-ingress-tls из того же PKI CA, что у остальных сервисов).
    - name: "OpenBao: ServersTransport openbao-insecure-backend (Traefik)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_kubeconfig.dest }}"
        state: present
        definition:
          apiVersion: traefik.io/v1alpha1
          kind: ServersTransport
          metadata:
            name: openbao-insecure-backend
            namespace: platform
            labels:
              app.kubernetes.io/managed-by: ansible
          spec:
            insecureSkipVerify: true

    - name: Вывод helmwave up
      ansible.builtin.debug:
        var: platform_aicd_helmwave_up.stderr_lines

  handlers:
    # Ansible-хендлеры привязаны к play, а не глобальны — задача "Containerd: зеркалировать
    # docker.io через Nexus (registries.yaml)" выше в этом play не может дотянуться до хендлера,
    # объявленного в handlers: первого play (найдено реальным прогоном platform/aicd-devops-labs-ru
    # 2026-08-28: "The requested handler ... was not found"). Тот же хендлер, что там, продублирован
    # здесь для этого play.
    - name: "Перезапустить k3s (подхватить registries.yaml)"
      ansible.builtin.systemd:
        name: k3s
        state: restarted

- name: "Standalone PostgreSQL (ADR-0023): postgresql-infra-1"
  hosts: postgresql_infra_hosts
  become: true
  vars:
    postgresql_infra_postgres_exporter_password: "{{ hostvars['cicd'].platform_aicd_postgres_exporter_password }}"

  pre_tasks:
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

  roles:
    - postgresql

  # Заведение служебного пользователя мониторинга — ad hoc, на уровне playbook'а, не переменная
  # роли (см. roles/postgresql/README.md, «Границы ответственности»). Прикладные БД/пользователи
  # (litellm, grafana) в этом заходе не заводятся вовсе — см. ADR-0023 §3/«Открытые вопросы».
  tasks:
    - name: Создать служебного пользователя мониторинга postgres-exporter
      become: true
      become_user: postgres
      no_log: true
      community.postgresql.postgresql_user:
        login_unix_socket: /var/run/postgresql
        name: postgres-exporter
        password: "{{ postgresql_infra_postgres_exporter_password }}"
        role_attr_flags: LOGIN

    - name: Выдать роль pg_monitor пользователю postgres-exporter
      become: true
      become_user: postgres
      community.postgresql.postgresql_membership:
        login_unix_socket: /var/run/postgresql
        group: pg_monitor
        target_roles: postgres-exporter
        state: present

    # host, не hostssl — monitoring_agent/templates/exporters/postgres-exporter/
    # postgres_exporter.env.j2 жёстко использует sslmode=disable (переменной не параметризовано),
    # соединение только с 127.0.0.1 (экспортёр локальный, тот же хост).
    - name: "Разрешить postgres-exporter локально по TCP в pg_hba.conf (monitoring_agent, sslmode=disable)"
      community.postgresql.postgresql_pg_hba:
        dest: "{{ postgresql_config_dir }}/pg_hba.conf"
        contype: host
        databases: postgres
        users: postgres-exporter
        source: 127.0.0.1/32
        method: scram-sha-256
      notify: Reload PostgreSQL

    - name: Force notified handlers (Reload PostgreSQL) to run now
      ansible.builtin.meta: flush_handlers

    - name: "Monitoring_agent: node_exporter + postgres_exporter (systemd)"
      ansible.builtin.include_role:
        name: monitoring_agent
      vars:
        monitoring_agent_orchestrator: systemd
        monitoring_agent_node_exporter_enabled: true
        monitoring_agent_postgres_exporter_enabled: true
        monitoring_agent_postgres_exporter_password: "{{ postgresql_infra_postgres_exporter_password }}"
