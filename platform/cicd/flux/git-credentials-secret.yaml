# Basic-auth креды для GitRepository (gitrepository.yaml) — доступ к приватному репозиторию
# platform/gitops в Gitea этого же стенда. Значение — тот же admin-пользователь Gitea, что и
# везде на этом стенде (helm/values/platform/namespaces/platform/gitea/values.yaml,
# gitea.admin) — ПЛЕЙСХОЛДЕР, сменить (и завести отдельный read-only deploy-токен вместо
# admin-аккаунта) перед реальным использованием, тот же принцип, что и остальные секреты этого
# персистентного стенда (platform/cicd/README.md).
apiVersion: v1
kind: Secret
metadata:
  name: gitops-git-auth
  namespace: flux-system
type: Opaque
stringData:
  username: gitea_admin
  password: "PleAse_Change_ME!"
