---
# platform/cicd — ROADMAP.md, «Предлагаемая последовательность работ», пункт 7, Фаза 0
# (docs/adr/0014-platform-controller-architecture.md; docs/adr/0012-cicd-platform-architecture.md
# §4/§5). Одна K3s-нода, Gitea + Semaphore UI — оба Helm-релизами через Helmwave, тем же
# способом, что roles/monitoring_server/tasks/monitoring-server.k3s.yml
# (docs/adr/0007-monitoring-server-role.md §6), но без monitoring-специфичных задач
# (namespace/secret для Grafana) — здесь не нужны: helmwave.yml.tpl уже создаёт namespace на
# каждый релиз сам (create_namespace: true в .options), а bootstrap-креды Gitea/Semaphore задаются
# прямо в values (helm/values/platform/namespaces/platform/{gitea,semaphore}/values.yaml).
#
# В отличие от monitoring_server (k3s_server.disable: [local-storage] + собственный
# custom-local-storage.yaml) — здесь штатный k3s local-path provisioner НЕ переопределяется:
# причины использовать другой storage class для Gitea/Semaphore пока не было.
#
# Запуск вручную: ansible-playbook -i inventory.yml site.yml

- name: Platform CI/CD infra (K3s + Gitea + Semaphore UI)
  hosts: platform_hosts
  become: true
  pre_tasks:
    # Тот же паттерн, что demo/*/ansible/site.yml — без ожидания cloud-init apt-задачи
    # xanmanning.k3s (скачивание бинарника/checksum) могут упереться в ещё не снятую
    # cloud-init'ом блокировку.
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

  tasks:
    # Версия — тот же пин, что roles/monitoring_server/meta/main.yml, чтобы не плодить второй
    # независимый источник правды о версии k3s в коллекции.
    - name: Установить K3s (single-node)
      ansible.builtin.include_role:
        name: xanmanning.k3s
      vars:
        k3s_state: installed
        k3s_release_version: v1.35.1+k3s1
        k3s_build_cluster: false
        k3s_become: true

    - name: Снять kubeconfig с control-хоста
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/.kube-tmp/"
      register: platform_cicd_kubeconfig
      changed_when: false

    # kubeconfig, который отдаёт k3s, содержит "server: https://127.0.0.1:6443" — годится только
    # для запуска kubectl прямо на самой ноде. helmwave выполняется на control-хосте
    # (delegate_to: localhost ниже), поэтому адрес нужно подменить на реальный IP ноды — тот же
    # приём, что roles/monitoring_server/tasks/monitoring-server.k3s.yml.
    - name: Подставить реальный IP вместо 127.0.0.1 в снятый kubeconfig
      when: "'dest' in platform_cicd_kubeconfig"
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.lineinfile:
        path: "{{ platform_cicd_kubeconfig.dest }}"
        regexp: '    server: https://127.0.0.1:6443'
        line: '    server: https://{{ ansible_facts["default_ipv4"]["address"] }}:6443'

    # Найдено реальным прогоном: k3s разворачивает встроенный Traefik (и его CRD,
    # ingressroutes.traefik.io) асинхронно через собственный HelmChart-контроллер — сразу после
    # того, как xanmanning.k3s отчитывается об успехе, CRD может ещё не существовать. Chart
    # helm/localrepo/universal-chart (Semaphore) рендерит IngressRoute только если
    # $.Capabilities.APIVersions.Has "traefik.io/v1alpha1" — без ожидания релиз применяется БЕЗ
    # IngressRoute и без ошибки (Helm просто пропускает ресурс), обнаруживается только руками
    # позже. Ждём появления CRD перед helmwave up, а не просто готовности API-сервера.
    - name: Дождаться регистрации Traefik CRD (встроенный в k3s, разворачивается асинхронно)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: ingressroutes.traefik.io
      register: platform_cicd_traefik_crd
      until: platform_cicd_traefik_crd.resources | length > 0
      retries: 30
      delay: 5

    # docs/adr/0016-openbao-secrets-pki.md §2 — Gitea/Semaphore values (следующий блок ниже)
    # читают admin-пароли/TLS через gomplate-датасорс vault://, который должен достучаться до
    # УЖЕ поднятого и распечатанного OpenBao в момент рендера — helmwave/gomplate работают на
    # control-хосте до всякого apply, поэтому OpenBao поднимается и наполняется первым, отдельным
    # `helmwave up --tags openbao` (тег объявлен в helm/envs/platform.yaml), а Gitea/Semaphore/
    # Flux — вторым, уже безусловным вызовом ниже.
    - name: Helmwave up (OpenBao only, helm/envs/platform.yaml)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
        K8S_CLUSTER: platform
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      # --file helmwave.platform.yml (не дефолтный helmwave.yml) — тот дефолтный файл уже
      # закоммичен как референсный рендер для K8S_CLUSTER=k3s-monitoring
      # (roles/monitoring_server), --yml безусловно перезаписывает его под ТЕКУЩИЙ K8S_CLUSTER —
      # найдено вручную при отладке этого плейбука: ручной запуск с K8S_CLUSTER=platform
      # перезаписал чужой референс, пришлось откатывать через git checkout.
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../../../helm"
        argv:
          - helmwave
          - up
          - --build
          - --yml
          - --templater
          - gomplate
          - --file
          - helmwave.platform.yml
          - --tags
          - openbao
      register: platform_cicd_helmwave_up_openbao
      changed_when: true

    - name: Дождаться Running пода openbao-0
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: platform
        name: openbao-0
      register: platform_cicd_openbao_pod
      until: >-
        platform_cicd_openbao_pod.resources | length > 0
        and platform_cicd_openbao_pod.resources[0].status.phase == 'Running'
      retries: 30
      delay: 5

    # docs/adr/0016-openbao-secrets-pki.md §3 — control-хост не имеет маршрута к ClusterIP
    # k3s-сервисов (только к реальному IP ноды, см. подмену 127.0.0.1 выше для kube-apiserver),
    # поэтому OpenBao опубликован через NodePort (helm/values/.../openbao/values.yaml,
    # server.service.nodePort: 30820) — весь HTTP API OpenBao ниже адресуется через
    # "<реальный IP ноды>:30820", не через service DNS. Единый блок с общими delegate_to/
    # environment (NO_PROXY — тот же found, что и для kube-apiserver/helmwave: прокси
    # control-хоста иначе уводит запросы к приватному IP через себя, "connection timed out").
    - name: "OpenBao: bootstrap (init/unseal/engines/секреты/TLS)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      block:
        - name: Определить адрес OpenBao API (NodePort)
          ansible.builtin.set_fact:
            platform_cicd_openbao_addr: "http://{{ ansible_facts['default_ipv4']['address'] }}:30820"

        - name: Проверить существование Secret openbao-init (идемпотентность init)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: platform
            name: openbao-init
          register: platform_cicd_openbao_init_secret

        # Инициализация — один-единственный раз за всю жизнь стенда: повторный init на уже
        # инициализированном OpenBao необратимо ошибается ("Vault is already initialized"), а
        # Secret openbao-init — единственное место, где root token/unseal-ключ вообще существуют,
        # поэтому именно его наличие — маркер "уже инициализирован", не запрос к самому OpenBao.
        - name: Инициализировать OpenBao (только при первом прогоне)
          when: platform_cicd_openbao_init_secret.resources | length == 0
          no_log: true
          block:
            - name: "OpenBao: sys/init (secret_shares=1, secret_threshold=1 — однодольный ключ, single-node стенд)"
              ansible.builtin.uri:
                url: "{{ platform_cicd_openbao_addr }}/v1/sys/init"
                method: POST
                body_format: json
                body:
                  secret_shares: 1
                  secret_threshold: 1
                status_code: [200]
              register: platform_cicd_openbao_init

            - name: "OpenBao: сохранить root_token/unseal-ключ в Secret openbao-init"
              kubernetes.core.k8s:
                kubeconfig: "{{ platform_cicd_kubeconfig.dest }}"
                state: present
                kind: Secret
                name: openbao-init
                namespace: platform
                definition:
                  apiVersion: v1
                  metadata:
                    labels:
                      app.kubernetes.io/managed-by: ansible
                  type: Opaque
                  stringData:
                    root_token: "{{ platform_cicd_openbao_init.json.root_token }}"
                    # .json.keys[0] коллизирует с Python dict.keys() (builtin-метод, а не
                    # JSON-ключ "keys") — Jinja резолвит .keys как атрибут раньше, чем как item
                    # lookup, отсюда "builtin_function_or_method object has no element 0"; нужна
                    # явная bracket-нотация.
                    unseal_key: "{{ platform_cicd_openbao_init.json['keys'][0] }}"

            # register в отдельную переменную, НЕ platform_cicd_openbao_init_secret — задача
            # внутри when-block, пропущенная (Secret уже существовал), тоже пишет в свой register
            # skip-результат ({"skipped": true}, без .resources) и тем самым затирала бы валидное
            # значение из самой первой "Проверить существование" (реальный найденный баг: "object
            # of type 'dict' has no attribute 'resources'" в задаче ниже).
            - name: Перечитать только что созданный Secret
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Secret
                namespace: platform
                name: openbao-init
              register: platform_cicd_openbao_init_secret_fresh

        - name: Обновить Secret-результат данными после инициализации (если она выполнялась)
          when: >-
            platform_cicd_openbao_init_secret_fresh is defined
            and platform_cicd_openbao_init_secret_fresh.resources is defined
          ansible.builtin.set_fact:
            platform_cicd_openbao_init_secret: "{{ platform_cicd_openbao_init_secret_fresh }}"

        - name: Прочитать root_token/unseal-ключ из Secret
          no_log: true
          ansible.builtin.set_fact:
            platform_cicd_openbao_root_token: >-
              {{ platform_cicd_openbao_init_secret.resources[0].data.root_token | b64decode }}
            platform_cicd_openbao_unseal_key: >-
              {{ platform_cicd_openbao_init_secret.resources[0].data.unseal_key | b64decode }}

        # Безусловно на каждом прогоне — под мог перезапуститься между прогонами, raft-хранилище
        # не авто-распечатывается (нет auto-unseal), sealed-под отвечает на /v1/sys/seal-status,
        # но не на большинство остальных путей API.
        - name: "OpenBao: проверить seal-status"
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/sys/seal-status"
            method: GET
            status_code: [200]
          register: platform_cicd_openbao_seal_status

        - name: "OpenBao: распечатать (unseal), если sealed"
          when: platform_cicd_openbao_seal_status.json.sealed | bool
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/sys/unseal"
            method: POST
            body_format: json
            body:
              key: "{{ platform_cicd_openbao_unseal_key }}"
            status_code: [200]

        - name: "OpenBao: проверить включённые secrets engines"
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/sys/mounts"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
            status_code: [200]
          register: platform_cicd_openbao_mounts
          no_log: true

        - name: "OpenBao: включить KV v2 (secret/)"
          when: "'secret/' not in platform_cicd_openbao_mounts.json.data"
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/sys/mounts/secret"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
            body_format: json
            body:
              type: kv
              options:
                version: "2"
            status_code: [200, 204]
          no_log: true

        - name: "OpenBao: включить PKI (pki/) и выпустить root CA + role cicd-platform"
          when: "'pki/' not in platform_cicd_openbao_mounts.json.data"
          no_log: true
          block:
            - name: "OpenBao: sys/mounts/pki (type=pki)"
              ansible.builtin.uri:
                url: "{{ platform_cicd_openbao_addr }}/v1/sys/mounts/pki"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
                body_format: json
                body:
                  type: pki
                  config:
                    max_lease_ttl: "87600h"
                status_code: [200, 204]

            - name: "OpenBao: pki/root/generate/internal (root CA cicd.platform)"
              ansible.builtin.uri:
                url: "{{ platform_cicd_openbao_addr }}/v1/pki/root/generate/internal"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
                body_format: json
                body:
                  common_name: cicd.platform
                  ttl: "87600h"
                status_code: [200]

            - name: "OpenBao: pki/roles/cicd-platform (allowed_domains: cicd.platform)"
              ansible.builtin.uri:
                url: "{{ platform_cicd_openbao_addr }}/v1/pki/roles/cicd-platform"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
                body_format: json
                body:
                  allowed_domains: cicd.platform
                  allow_subdomains: true
                  max_ttl: "2160h"
                status_code: [200, 204]

        # Идемпотентность здесь критична — пере-генерация паролей при каждом прогоне сломала бы
        # уже созданные сессии/данные в Gitea/Semaphore (docs/adr/0016-openbao-secrets-pki.md §3).
        - name: "OpenBao: проверить наличие secret/gitea"
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/secret/data/gitea"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_cicd_openbao_secret_gitea
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/gitea (только при первом прогоне)"
          when: platform_cicd_openbao_secret_gitea.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/secret/data/gitea"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: проверить наличие secret/semaphore"
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/secret/data/semaphore"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_cicd_openbao_secret_semaphore
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/semaphore (только при первом прогоне)"
          when: platform_cicd_openbao_secret_semaphore.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_cicd_openbao_addr }}/v1/secret/data/semaphore"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
                cookie_hash: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
                cookie_encryption: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
                access_key_encryption: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
            status_code: [200, 204]

        # TLS-сертификаты — тоже только при отсутствии K8s Secret (перевыпуск ручной, см. ADR
        # «Не проработано»): TTL 2160h (90 дней) даёт запас, автоматической ротации нет.
        - name: "OpenBao: выпустить и сохранить TLS-сертификаты (gitea, semaphore)"
          no_log: true
          ansible.builtin.include_tasks: tasks/issue-tls-cert.yml
          loop:
            - {host: gitea.cicd.platform, secret: gitea-tls}
            - {host: semaphore.cicd.platform, secret: semaphore-tls}
          loop_control:
            label: "{{ item.host }}"

    - name: Helmwave up (Gitea + Semaphore + Flux, helm/envs/platform.yaml)
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
        K8S_CLUSTER: platform
        # Прокси control-хоста иначе уводит запросы к приватному IP kube-apiserver через себя —
        # таймаут "Kubernetes cluster unreachable" вместо ошибки роли/helmwave, тот же found,
        # что в roles/monitoring_server/tasks/monitoring-server.k3s.yml.
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        # Читаются gomplate-датасорсом vault:// в values.yaml Gitea/Semaphore (docs/adr/
        # 0016-openbao-secrets-pki.md §2) — root token напрямую, не scoped-политика (см. ADR,
        # «Не проработано»).
        VAULT_ADDR: "{{ platform_cicd_openbao_addr }}"
        VAULT_TOKEN: "{{ platform_cicd_openbao_root_token }}"
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../../../helm"
        argv:
          - helmwave
          - up
          - --build
          - --yml
          - --templater
          - gomplate
          - --file
          - helmwave.platform.yml
      register: platform_cicd_helmwave_up
      changed_when: true

    # gitops-git-auth (flux-system) — basic-auth для Flux GitRepository "gitops"
    # (platform/cicd/flux/gitrepository.yaml), тот же admin-аккаунт Gitea. Секрет заведён вручную
    # (platform/cicd/flux/git-credentials-secret.yaml, флейс-README «Не проработано») ДО OpenBao,
    # с плейсхолдером "PleAse_Change_ME!" — найдено реальным прогоном: при переезде
    # gitea.admin.password на OpenBao (docs/adr/0016-openbao-secrets-pki.md) этот Secret не
    # синхронизировали, GitRepository ушёл в authentication required на часы незамеченным.
    # Синхронизируется здесь безусловно на каждом прогоне (идемпотентно — Secret не меняется,
    # если пароль тот же), после helmwave up выше — только тогда гарантированно существует
    # namespace flux-system (создаётся релизом flux2, create_namespace: true).
    - name: "Flux: прочитать текущий admin_password secret/gitea (для gitops-git-auth)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.uri:
        url: "{{ platform_cicd_openbao_addr }}/v1/secret/data/gitea"
        method: GET
        headers:
          X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
        status_code: [200]
      register: platform_cicd_openbao_secret_gitea_current

    - name: "Flux: синхронизировать gitops-git-auth (flux-system) с текущим admin_password"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_cicd_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: gitops-git-auth
        namespace: flux-system
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            username: gitea_admin
            password: "{{ platform_cicd_openbao_secret_gitea_current.json.data.data.admin_password }}"

    - name: Вывод helmwave up
      ansible.builtin.debug:
        var: platform_cicd_helmwave_up.stderr_lines
