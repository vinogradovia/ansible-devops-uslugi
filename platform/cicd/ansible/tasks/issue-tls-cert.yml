---
# Один хост за вызов (item: {host, secret}) — вынесено из site.yml отдельным файлом, потому что
# ansible.builtin.include_tasks поддерживает loop, а block — нет (docs/adr/0016-openbao-secrets-pki.md
# §3, TLS-сертификаты выпускаются по одному на host). delegate_to/environment не наследуются
# надёжно через include_tasks (в отличие от block) — заданы явно в каждой задаче ниже.

- name: "Проверить существование Secret {{ item.secret }}"
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
    NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
    no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: platform
    name: "{{ item.secret }}"
  register: platform_cicd_tls_secret_check

- name: "OpenBao: pki/issue/cicd-platform для {{ item.host }}"
  when: platform_cicd_tls_secret_check.resources | length == 0
  delegate_to: localhost
  become: false
  ansible.builtin.uri:
    url: "{{ platform_cicd_openbao_addr }}/v1/pki/issue/cicd-platform"
    method: POST
    headers:
      X-Vault-Token: "{{ platform_cicd_openbao_root_token }}"
    body_format: json
    body:
      common_name: "{{ item.host }}"
      ttl: "2160h"
    status_code: [200]
  register: platform_cicd_tls_issue
  no_log: true

- name: "Сохранить сертификат в Secret {{ item.secret }}"
  when: platform_cicd_tls_secret_check.resources | length == 0
  delegate_to: localhost
  become: false
  environment:
    KUBECONFIG: "{{ platform_cicd_kubeconfig.dest }}"
    NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
    no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ platform_cicd_kubeconfig.dest }}"
    state: present
    kind: Secret
    name: "{{ item.secret }}"
    namespace: platform
    definition:
      apiVersion: v1
      metadata:
        labels:
          app.kubernetes.io/managed-by: ansible
      type: kubernetes.io/tls
      stringData:
        tls.crt: >-
          {{ platform_cicd_tls_issue.json.data.certificate }}
          {{ platform_cicd_tls_issue.json.data.ca_chain | join('\n') }}
        tls.key: "{{ platform_cicd_tls_issue.json.data.private_key }}"
  no_log: true
