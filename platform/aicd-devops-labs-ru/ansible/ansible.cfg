[defaults]
host_key_checking = False
roles_path = ../../../roles:~/.ansible/roles
diff = true

# VM на реальном Proxmox-хосте (физическая LAN, не локальная libvirt-сеть, как у platform/aicd) —
# реальным прогоном найдена периодическая обрубка SSH-соединения на длинных задачах
# (xanmanning.k3s), проявляющаяся как "Timeout waiting for privilege escalation prompt". Keepalive
# + увеличенный become_timeout — не устраняют первопричину (вероятно, промежуточный NAT/firewall
# между control-хостом и сетью 10.10.10.0/24 рвёт простаивающие TCP-сессии), но снимают симптом.
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=6

[privilege_escalation]
become_timeout = 30
