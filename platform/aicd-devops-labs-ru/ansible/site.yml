    # gitops-git-auth (flux-system) — basic-auth для Flux GitRepository "gitops"
    # (platform/aicd-devops-labs-ru/flux/gitrepository.yaml), тот же admin-аккаунт Gitea. Секрет заведён вручную
    # (platform/aicd-devops-labs-ru/flux/git-credentials-secret.yaml, флейс-README «Не проработано») ДО OpenBao,
    # с плейсхолдером "PleAse_Change_ME!" — найдено реальным прогоном: при переезде
    # gitea.admin.password на OpenBao (docs/adr/0016-openbao-secrets-pki.md) этот Secret не
    # синхронизировали, GitRepository ушёл в authentication required на часы незамеченным.
    # Синхронизируется здесь безусловно на каждом прогоне (идемпотентно — Secret не меняется,
    # если пароль тот же), после helmwave up выше — только тогда гарантированно существует
    # namespace flux-system (создаётся релизом flux2, create_namespace: true).
    - name: "Flux: прочитать текущий admin_password secret/gitea (для gitops-git-auth)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.uri:
        url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/gitea"
        ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
        status_code: [200]
      register: platform_aicd_devops_labs_ru_openbao_secret_gitea_current

    - name: "Flux: синхронизировать gitops-git-auth (flux-system) с текущим admin_password"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: gitops-git-auth
        namespace: flux-system
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            username: gitea_admin
            password: "{{ platform_aicd_devops_labs_ru_openbao_secret_gitea_current.json.data.data.admin_password }}"

    # docs/adr/0017-platform-cicd-default-addons.md — Radar сам никого не аутентифицирует
