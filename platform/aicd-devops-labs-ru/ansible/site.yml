        url: "https://nexus.aicd.devops-labs.ru/service/rest/v1/security/realms/active"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: PUT
        url_username: admin
        url_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        # НЕ NexusAuthorizingRealm — в Nexus 3.95.3 такого realmId не существует вовсе (реальный
        # прогон 2026-08-28: "Unknown realmIds: [NexusAuthorizingRealm]"; полный список доступных
        # — GET /v1/security/realms/available: AnsibleGalaxyToken, ConanToken, DefaultRole,
        # DockerToken, HuggingFaceToken, LdapRealm, NexusAuthenticatingRealm, NpmToken, NuGetApiKey,
        # OciBearerToken, PubToken, rutauth-realm, TerraformToken — устаревшая рекомендация из
        # старой документации Sonatype, актуальная схема разделяет аутентификацию и авторизацию
        # иначе).
        body: ["NexusAuthenticatingRealm", "LdapRealm"]
        status_code: [204]

