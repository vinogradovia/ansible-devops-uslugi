            strictContentTypeValidation: false
          proxy:
            remoteUrl: https://github.com/
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
        status_code: [201]

