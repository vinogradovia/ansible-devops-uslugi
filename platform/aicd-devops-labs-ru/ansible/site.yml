    - name: "Nexus: создать LDAP-сервер freeipa (если ещё нет)"
      when: "'freeipa' not in (platform_aicd_devops_labs_ru_nexus_ldap_servers.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.devops-labs.ru/service/rest/v1/security/ldap"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: freeipa
          protocol: LDAP
          host: ipa.aicd.devops-labs.ru
          port: 389
          searchBase: "DC=aicd,DC=devops-labs,DC=ru"
          authScheme: SIMPLE
          authUsername: "UID=svc-nexus,CN=users,CN=accounts,DC=aicd,DC=devops-labs,DC=ru"
          authPassword: "{{ hostvars['aicd-labs'].platform_aicd_devops_labs_ru_nexus_ldap_bind_password }}"
          connectionTimeoutSeconds: 30
          connectionRetryDelaySeconds: 30
          maxIncidentsCount: 3
          userBaseDn: "CN=users,CN=accounts"
          userSubtree: true
          userObjectClass: person
          userLdapFilter: ""
          userIdAttribute: uid
          userRealNameAttribute: cn
          userEmailAddressAttribute: mail
          userPasswordAttribute: ""
          # DYNAMIC (не dynamic) — найдено сверкой со схемой /service/rest/swagger.json:
          # CreateLdapServerXo.groupType — enum [DYNAMIC, STATIC], регистрозависимо.
          groupType: DYNAMIC
          userMemberOfAttribute: memberOf
        status_code: [201]

    - name: "Nexus: активировать LDAP-realm"
