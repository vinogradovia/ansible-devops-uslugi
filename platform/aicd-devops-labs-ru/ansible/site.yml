---
# platform/aicd-devops-labs-ru — второе, независимое окружение того же стека, что platform/aicd
# (ROADMAP.md, «Предлагаемая последовательность работ», пункт 7, Фаза 0;
# docs/adr/0014-platform-controller-architecture.md; docs/adr/0012-cicd-platform-architecture.md
# §4/§5) — на Proxmox вместо libvirt, под доменом aicd.devops-labs.ru вместо aicd.platform.
# Одна K3s-нода, Gitea + Semaphore UI — оба Helm-релизами через Helmwave, тем же
# способом, что roles/monitoring_server/tasks/monitoring-server.k3s.yml
# (docs/adr/0007-monitoring-server-role.md §6), но без monitoring-специфичных задач
# (namespace/secret для Grafana) — здесь не нужны: helmwave.yml.tpl уже создаёт namespace на
# каждый релиз сам (create_namespace: true в .options), а bootstrap-креды Gitea/Semaphore задаются
# прямо в values (helm/values/platform-devops-labs-ru/namespaces/platform/{gitea,semaphore}/values.yaml,
# K8S_CLUSTER=platform-devops-labs-ru).
#
# В отличие от monitoring_server (k3s_server.disable: [local-storage] + собственный
# custom-local-storage.yaml) — здесь штатный k3s local-path provisioner НЕ переопределяется:
# причины использовать другой storage class для Gitea/Semaphore пока не было.
#
# Запуск вручную: ansible-playbook -i inventory.yml site.yml

- name: Platform CI/CD infra (K3s + Gitea + Semaphore UI)
  hosts: platform_hosts
  become: true
  pre_tasks:
    # Тот же паттерн, что demo/*/ansible/site.yml — без ожидания cloud-init apt-задачи
    # xanmanning.k3s (скачивание бинарника/checksum) могут упереться в ещё не снятую
    # cloud-init'ом блокировку.
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

  tasks:
    # docs/adr/0018-internal-caching-proxy.md — тот же приём, что platform/aicd/ansible/site.yml.
    # status_code сознательно БЕЗ 404: реальный прогон показал, что Nexus отвечает 404 "Repository
    # not found", когда repo k3s-releases-proxy ещё не создан (bootstrap-задача Nexus ниже по этому
    # же файлу создаёт его позже, во втором play) — считать такой 404 признаком «прокси готов»
    # неверно, это признак «ещё не готов», k3s в этом случае должен идти напрямую в GitHub.
    - name: "Проверить доступность Nexus raw-proxy (для k3s-бинаря)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus-cache.aicd.devops-labs.ru"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus-cache.aicd.devops-labs.ru"
      ansible.builtin.uri:
        url: "https://nexus-cache.aicd.devops-labs.ru/repository/k3s-releases-proxy/"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        status_code: [200, 403]
        timeout: 5
      register: platform_aicd_devops_labs_ru_nexus_cache_check
      failed_when: false
      ignore_errors: true

    # Реальный прогон (2026-08-28): роль xanmanning.k3s ниже качает hashsum/бинарь k3s С САМОЙ
    # ноды aicd-labs (без delegate_to), а не с control-хоста — если k3s_github_download_url указал
    # на nexus-cache (проверка выше прошла успешно), нода должна доверять внутреннему PKI CA САМА,
    # иначе "Ensure the k3s hashsum is downloaded" падает с "self-signed certificate in certificate
    # chain". .kube-tmp/aicd-platform-ca.pem — тот же файл, что ca_path проверки выше: на повторных
    # прогонах уже оставлен предыдущим успешным проходом задачи "Записать внутренний PKI CA
    # локально..." (play ниже, после того как OpenBao становится доступен). На самом первом
    # бутстрапе (курица-яйцо — см. комментарий у k3s_github_download_url ниже) файла ещё нет:
    # проверка выше и так не прошла (Nexus ещё не поднят), а эта пара задач — no-op.
    - name: "Проверить наличие сохранённого внутреннего PKI CA (для доверия k3s-releases-proxy)"
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
      register: platform_aicd_devops_labs_ru_pki_ca_pem_cached

    - name: "Установить внутренний PKI CA в системный trust store aicd-labs (доверие к Nexus)"
      when: platform_aicd_devops_labs_ru_pki_ca_pem_cached.stat.exists
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        dest: /usr/local/share/ca-certificates/aicd-platform-ca.crt
        owner: root
        group: root
        mode: '0644'
      notify: "Обновить системный trust store aicd-labs"

    # Handler должен отработать ДО скачивания k3s несколькими задачами ниже, а не в конце play
    # (штатное время срабатывания handler'ов) — форсируем немедленно.
    - name: Применить обновление CA немедленно (нужно до загрузки k3s ниже)
      ansible.builtin.meta: flush_handlers

    # Версия — тот же пин, что roles/monitoring_server/meta/main.yml, чтобы не плодить второй
    # независимый источник правды о версии k3s в коллекции.
    - name: Установить K3s (single-node)
      ansible.builtin.include_role:
        name: xanmanning.k3s
      vars:
        k3s_state: installed
        k3s_release_version: v1.35.1+k3s1
        # k3s_binary_url/k3s_hash_url НЕ переопределяются напрямую — см. комментарий в
        # platform/aicd/ansible/site.yml (xanmanning.k3s безусловно их пересчитывает).
        #
        # Найдено реальным прогоном: "else omit" здесь НЕ работает так, как в module-параметрах —
        # omit гарантированно пропускает значение только будучи распознан как параметр модуля,
        # а не произвольная запись в vars: у include_role. На практике омит-ветка резолвилась в
        # пустую строку (не в "переменная не задана"), из-за чего роль подставляла URL без
        # хоста ("/v1.35.1+k3s1/sha256sum-amd64.txt", "unknown url type"). Фикс — явный
        # дефолт-URL (тот же https://github.com/k3s-io/k3s/releases/download, что жёстко
        # прописан как дефолт k3s_github_url+k3s_github_download_url в самой роли,
        # defaults/main.yml и vars/main.yml), а не omit.
        k3s_github_download_url: >-
          {{ 'https://nexus-cache.aicd.devops-labs.ru/repository/k3s-releases-proxy/k3s-io/k3s/releases/download'
             if (platform_aicd_devops_labs_ru_nexus_cache_check.status | default(0)) in [200, 403]
             else 'https://github.com/k3s-io/k3s/releases/download' }}
        k3s_build_cluster: false
        k3s_become: true

    # ADR-0015 (Фаза 1) — нужен, чтобы присоединить GPU-ноду llm1 как agent-узел к этому же
    # кластеру (play "GPU-нода llm1" ниже) — тот же приём (delegate_to + slurp + set_fact), что
    # уже применяется в этом репозитории для передачи секретов между хостами одного прогона
    # (например, kinit-пароли freeipa). no_log — этим токеном может присоединиться к кластеру
    # любой узел, который его получит.
    - name: Прочитать node-token control-plane (для присоединения GPU-ноды)
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: platform_aicd_devops_labs_ru_k3s_node_token_raw
      no_log: true

    - name: Сохранить node-token control-plane как факт хоста
      ansible.builtin.set_fact:
        platform_aicd_devops_labs_ru_k3s_node_token: "{{ (platform_aicd_devops_labs_ru_k3s_node_token_raw.content | b64decode).strip() }}"
      no_log: true

    - name: Снять kubeconfig с control-хоста
      ansible.builtin.fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "{{ playbook_dir }}/.kube-tmp/"
      register: platform_aicd_devops_labs_ru_kubeconfig
      changed_when: false

    # kubeconfig, который отдаёт k3s, содержит "server: https://127.0.0.1:6443" — годится только
    # для запуска kubectl прямо на самой ноде. helmwave выполняется на control-хосте
    # (delegate_to: localhost ниже), поэтому адрес нужно подменить на реальный IP ноды — тот же
    # приём, что roles/monitoring_server/tasks/monitoring-server.k3s.yml.
    - name: Подставить реальный IP вместо 127.0.0.1 в снятый kubeconfig
      when: "'dest' in platform_aicd_devops_labs_ru_kubeconfig"
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.lineinfile:
        path: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        regexp: '    server: https://127.0.0.1:6443'
        line: '    server: https://{{ ansible_facts["default_ipv4"]["address"] }}:6443'

    # Найдено реальным прогоном: k3s разворачивает встроенный Traefik (и его CRD,
    # ingressroutes.traefik.io) асинхронно через собственный HelmChart-контроллер — сразу после
    # того, как xanmanning.k3s отчитывается об успехе, CRD может ещё не существовать. Chart
    # helm/localrepo/universal-chart (Semaphore) рендерит IngressRoute только если
    # $.Capabilities.APIVersions.Has "traefik.io/v1alpha1" — без ожидания релиз применяется БЕЗ
    # IngressRoute и без ошибки (Helm просто пропускает ресурс), обнаруживается только руками
    # позже. Ждём появления CRD перед helmwave up, а не просто готовности API-сервера.
    - name: Дождаться регистрации Traefik CRD (встроенный в k3s, разворачивается асинхронно)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        name: ingressroutes.traefik.io
      register: platform_aicd_devops_labs_ru_traefik_crd
      until: platform_aicd_devops_labs_ru_traefik_crd.resources | length > 0
      retries: 30
      delay: 5

    # ADR-0013 — найдено реальным прогоном (первое подключение Authelia): под Gitea (init-контейнер
    # configure-gitea, gitea admin auth add-oauth --auto-discover-url https://sso.aicd.devops-labs.ru/...)
    # падал в CrashLoopBackOff — "dial tcp: lookup sso.aicd.devops-labs.ru on 10.43.0.10:53: no such host".
    # Хосты платформы (aicd.devops-labs.ru) существуют только во внешнем /etc/hosts операторов — внутри
    # k3s-кластера (CoreDNS) их никто не резолвит, а изнутри кластера к ним всё равно обращаются
    # (сейчас — Gitea при настройке OIDC-источника, в перспективе — Semaphore при обмене токеном).
    # Проще и надёжнее один раз научить резолвить их весь кластер, чем чинить это отдельно в каждом
    # values.yaml-потребителе (hostAliases) — используется штатный k3s-приём "coredns-custom"
    # ConfigMap (k3s Corefile уже содержит `import /etc/coredns/custom/*.override`, см. `kubectl get
    # configmap coredns -n kube-system`). IP — ClusterIP встроенного в k3s Traefik: тот же путь,
    # которым снаружи резолвятся все Ingress/IngressRoute-хосты платформы, поэтому изнутри кластера
    # запрос идёт через тот же Traefik → тот же SNI/Host-based роутинг, что и у настоящего браузера
    # (важно для Authelia — issuer в OIDC-токене вычисляется из Host-заголовка запроса, должен
    # совпадать что при discovery, что при реальном логине).
    - name: Определить ClusterIP встроенного в k3s Traefik (для coredns-custom ниже)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Service
        name: traefik
        namespace: kube-system
      register: platform_aicd_devops_labs_ru_traefik_svc
      until: platform_aicd_devops_labs_ru_traefik_svc.resources | length > 0
      retries: 30
      delay: 5

    - name: Опубликовать ClusterIP Traefik как факт
      ansible.builtin.set_fact:
        platform_aicd_devops_labs_ru_traefik_cluster_ip: "{{ platform_aicd_devops_labs_ru_traefik_svc.resources[0].spec.clusterIP }}"

    - name: "CoreDNS: резолвить хосты платформы (aicd.devops-labs.ru) внутри кластера через Traefik"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: coredns-custom
            namespace: kube-system
            labels:
              app.kubernetes.io/managed-by: ansible
          data:
            # Найдено реальным прогоном: дефолтный k3s Corefile уже содержит один плагин `hosts`
            # (/etc/coredns/NodeHosts) — второй `hosts {}` в этом же Server Block роняет CoreDNS
            # в CrashLoopBackOff ("this plugin can only be used once per Server Block", в отличие
            # от `template`, который такого ограничения не имеет).
            aicd-devops-labs-ru.override: |
              template IN A aicd.devops-labs.ru {
                match "^(gitea|semaphore|radar|infra-panel|openbao|sso)\.aicd\.devops-labs\.ru\.$"
                answer "{{ '{{' }} .Name {{ '}}' }} 60 IN A {{ platform_aicd_devops_labs_ru_traefik_cluster_ip }}"
                fallthrough
              }
              # freeipa (ADR-0013 §1) — не за Traefik, отдельная VM в той же libvirt-сети (см.
              # platform/aicd-devops-labs-ru/terraform/freeipa-target.tf); свой IP, не ClusterIP Traefik. Найдено
              # реальным прогоном: Authelia падает на startup-проверке LDAP-провайдера с той же
              # "no such host", что раньше ловили Gitea/Semaphore для sso.aicd.devops-labs.ru.
              template IN A aicd.devops-labs.ru {
                match "^ipa\.aicd\.devops-labs\.ru\.$"
                answer "{{ '{{' }} .Name {{ '}}' }} 60 IN A {{ hostvars['freeipa'].ansible_host }}"
                fallthrough
              }
              # Найдено реальным прогоном (ADR-0013, forwardAuth Authelia молча пропускал все
              # запросы без проверки): шаблоны выше отвечают только на IN A — запрос AAAA для тех
              # же имён проваливался через fallthrough в forward-плагин, который отвечал
              # авторитетным NXDOMAIN (имя вообще не существует, апстрим о aicd.devops-labs.ru не
              # слышал). NXDOMAIN — это "имени не существует", а не "нет записи такого типа" —
              # строгие резолверы (в частности, встроенный резолвер Go, которым пользуется
              # Traefik) на NXDOMAIN одной из записей выбрасывают ВЕСЬ результат целиком, включая
              # уже полученный успешный A-ответ, из-за чего исходящий HTTPS-вызов Traefik→Authelia
              # (forwardAuth) не мог подключиться вовсе — и, что опаснее всего, Traefik в этой
              # ситуации пропускал запрос к бэкенду без auth-проверки, а не блокировал его.
              # rcode NOERROR без answer — корректный пустой ответ ("имя есть, IPv6-записи нет"),
              # а не NXDOMAIN.
              template IN AAAA aicd.devops-labs.ru {
                match "^(gitea|semaphore|radar|infra-panel|openbao|sso|ipa)\.aicd\.devops-labs\.ru\.$"
                rcode NOERROR
                fallthrough
              }
      register: platform_aicd_devops_labs_ru_coredns_custom

    # kubelet синхронизирует изменённый ConfigMap-volume пода CoreDNS не мгновенно (штатный период
    # до ~60-90с), плюс собственный интервал перечитывания Corefile CoreDNS (плагин reload) — пауза
    # только при первом создании/изменении ConfigMap, чтобы Gitea/Semaphore ниже не словили тот же
    # CrashLoopBackOff на ещё не подхваченной записи.
    - name: Подождать, пока CoreDNS подхватит coredns-custom (kubelet sync + reload plugin)  # noqa: no-handler
      when: platform_aicd_devops_labs_ru_coredns_custom.changed
      ansible.builtin.pause:
        seconds: 90

    # namespace platform заводится здесь явно (а не полагаемся на create_namespace: true
    # helmwave-релиза) — Secret openbao-server-tls ниже должен существовать ДО первого
    # `helmwave up --tags openbao`, а тот намespace ещё не создан на этом шаге.
    - name: "Namespace platform (для openbao-server-tls до первого helmwave up)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Namespace
        name: platform

    # Тот же приём и причина, что у namespace platform выше — grafana-tls/nexus-tls/
    # nexus-cache-tls (TLS-цикл ниже по этому же play) сохраняются Secret'ами в monitoring/cache
    # ДО того, как Helmwave создаст эти namespace как побочный эффект релизов vm/grafana-operator/
    # nexus (реальная ошибка живого прогона 2026-08-28: "namespaces \"monitoring\" not found").
    - name: "Namespace monitoring (для grafana-tls до Helmwave up)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Namespace
        name: monitoring

    - name: "Namespace cache (для nexus-tls/nexus-cache-tls до Helmwave up)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Namespace
        name: cache

    # docs/adr/0016-openbao-secrets-pki.md §5 — bootstrap self-signed сертификат для listener'а
    # самого OpenBao (не для клиентов Gitea/Semaphore — те получают сертификаты из PKI engine
    # ПОСЛЕ инициализации, см. tasks/issue-tls-cert.yml). Курица/яйцо: чтобы выпустить
    # сертификат из pki/issue, нужен уже распечатанный OpenBao с включённым PKI, а слушать TLS
    # он обязан с самого первого старта (helm/values/.../openbao/values.yaml,
    # global.tlsDisable: false) — поэтому здесь отдельный, не связанный с PKI engine
    # самоподписанный сертификат. SAN покрывает и cluster-DNS имя (для будущего доступа изнутри
    # кластера), и реальный IP ноды (текущий способ доступа control-хоста — NodePort по IP, тот
    # же приём, что и для kube-apiserver/OpenBao API выше). Файлы — на control-хосте рядом с
    # kubeconfig, community.crypto-модули идемпотентны сами по себе (не перегенерируют
    # ключ/сертификат, если существующие уже соответствуют параметрам).
    - name: "OpenBao server TLS: приватный ключ"
      delegate_to: localhost
      become: false
      run_once: true
      community.crypto.openssl_privatekey:
        path: "{{ playbook_dir }}/.kube-tmp/openbao-server.key"
        size: 4096

    - name: "OpenBao server TLS: CSR"
      delegate_to: localhost
      become: false
      run_once: true
      community.crypto.openssl_csr:
        path: "{{ playbook_dir }}/.kube-tmp/openbao-server.csr"
        privatekey_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.key"
        common_name: openbao.platform.svc.cluster.local
        subject_alt_name:
          - DNS:openbao
          - DNS:openbao.platform
          - DNS:openbao.platform.svc
          - DNS:openbao.platform.svc.cluster.local
          - "IP:{{ ansible_facts['default_ipv4']['address'] }}"

    - name: "OpenBao server TLS: самоподписанный сертификат (10 лет)"
      delegate_to: localhost
      become: false
      run_once: true
      community.crypto.x509_certificate:
        path: "{{ playbook_dir }}/.kube-tmp/openbao-server.crt"
        privatekey_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.key"
        csr_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.csr"
        provider: selfsigned
        selfsigned_not_after: "+3650d"
      register: platform_aicd_devops_labs_ru_openbao_server_cert

    - name: "OpenBao server TLS: сохранить Secret openbao-server-tls"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: openbao-server-tls
        namespace: platform
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: kubernetes.io/tls
          stringData:
            tls.crt: "{{ lookup('ansible.builtin.file', playbook_dir + '/.kube-tmp/openbao-server.crt') }}"
            tls.key: "{{ lookup('ansible.builtin.file', playbook_dir + '/.kube-tmp/openbao-server.key') }}"
      no_log: true

    # docs/adr/0016-openbao-secrets-pki.md §2 — Gitea/Semaphore values (следующий блок ниже)
    # читают admin-пароли/TLS через gomplate-датасорс vault://, который должен достучаться до
    # УЖЕ поднятого и распечатанного OpenBao в момент рендера — helmwave/gomplate работают на
    # control-хосте до всякого apply, поэтому OpenBao поднимается и наполняется первым, отдельным
    # `helmwave up --tags openbao` (тег объявлен в helm/envs/platform.yaml), а Gitea/Semaphore/
    # Flux — вторым, уже безусловным вызовом ниже.
    - name: Helmwave up (OpenBao only, helm/envs/platform.yaml)
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        K8S_CLUSTER: platform-devops-labs-ru
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      # --file helmwave.platform-devops-labs-ru.yml (не дефолтный helmwave.yml) — тот дефолтный файл уже
      # закоммичен как референсный рендер для K8S_CLUSTER=k3s-monitoring
      # (roles/monitoring_server), --yml безусловно перезаписывает его под ТЕКУЩИЙ K8S_CLUSTER —
      # найдено вручную при отладке этого плейбука: ручной запуск с K8S_CLUSTER=platform-devops-labs-ru
      # перезаписал чужой референс, пришлось откатывать через git checkout.
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../../../helm"
        argv:
          - helmwave
          - up
          - --build
          - --yml
          - --templater
          - gomplate
          - --file
          - helmwave.platform-devops-labs-ru.yml
          - --tags
          - openbao
      register: platform_aicd_devops_labs_ru_helmwave_up_openbao
      changed_when: true

    # Найдено реальным прогоном: чарт openbao/openbao ставит StatefulSet
    # updateStrategy: OnDelete (осознанно апстримом — raft-кластеру нельзя просто
    # RollingUpdate-нуть все реплики сразу) — смена ConfigMap (например, включение TLS листенера
    # выше) НЕ перезапускает уже существующий под сама по себе, несмотря на
    # server.configAnnotation: true (та аннотация появляется в шаблоне STS, но применяется к
    # живому поду только при его пересоздании). Без этой проверки под молча продолжает работать
    # со СТАРЫМ конфигом (например, http вместо https) до ручного вмешательства.
    - name: "OpenBao: пересоздать под openbao-0 при дрейфе конфига (StatefulSet updateStrategy: OnDelete)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      block:
        - name: Прочитать checksum конфига из шаблона StatefulSet
          kubernetes.core.k8s_info:
            api_version: apps/v1
            kind: StatefulSet
            namespace: platform
            name: openbao
          register: platform_aicd_devops_labs_ru_openbao_sts

        - name: Прочитать checksum конфига из живого пода (если существует)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: platform
            name: openbao-0
          register: platform_aicd_devops_labs_ru_openbao_pod_before

        - name: Удалить под openbao-0, если его конфиг устарел
          when: >-
            platform_aicd_devops_labs_ru_openbao_pod_before.resources | length > 0
            and platform_aicd_devops_labs_ru_openbao_sts.resources | length > 0
            and (
              (platform_aicd_devops_labs_ru_openbao_pod_before.resources[0].metadata.annotations | default({}))
              .get('openbao.hashicorp.com/config-checksum', '')
            ) != (
              (platform_aicd_devops_labs_ru_openbao_sts.resources[0].spec.template.metadata.annotations | default({}))
              .get('openbao.hashicorp.com/config-checksum', '')
            )
          kubernetes.core.k8s:
            kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
            state: absent
            kind: Pod
            namespace: platform
            name: openbao-0

    - name: Дождаться Running пода openbao-0
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: platform
        name: openbao-0
      register: platform_aicd_devops_labs_ru_openbao_pod
      until: >-
        platform_aicd_devops_labs_ru_openbao_pod.resources | length > 0
        and platform_aicd_devops_labs_ru_openbao_pod.resources[0].status.phase == 'Running'
      retries: 30
      delay: 5

    # docs/adr/0016-openbao-secrets-pki.md §3 — control-хост не имеет маршрута к ClusterIP
    # k3s-сервисов (только к реальному IP ноды, см. подмену 127.0.0.1 выше для kube-apiserver),
    # поэтому OpenBao опубликован через NodePort (helm/values/.../openbao/values.yaml,
    # server.service.nodePort: 30820) — весь HTTP API OpenBao ниже адресуется через
    # "<реальный IP ноды>:30820", не через service DNS. Единый блок с общими delegate_to/
    # environment (NO_PROXY — тот же found, что и для kube-apiserver/helmwave: прокси
    # control-хоста иначе уводит запросы к приватному IP через себя, "connection timed out").
    - name: "OpenBao: bootstrap (init/unseal/engines/секреты/TLS)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      block:
        # https — docs/adr/0016-openbao-secrets-pki.md §5, bootstrap self-signed сертификат
        # (сгенерирован и смонтирован в под ДО этого блока, см. задачи "OpenBao server TLS: ..."
        # выше). ca_path указывает на тот же файл — self-signed лист используется как собственный
        # доверенный якорь (basicConstraints CA:true для этого не требуется ни одному TLS-стеку,
        # он проверяется только для промежуточных звеньев цепочки, не для самого якоря доверия).
        - name: Определить адрес OpenBao API (NodePort, TLS) и путь до его CA
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_openbao_addr: "https://{{ ansible_facts['default_ipv4']['address'] }}:30820"
            platform_aicd_devops_labs_ru_openbao_ca_path: "{{ playbook_dir }}/.kube-tmp/openbao-server.crt"

        - name: Проверить существование Secret openbao-init (идемпотентность init)
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: platform
            name: openbao-init
          register: platform_aicd_devops_labs_ru_openbao_init_secret

        # Инициализация — один-единственный раз за всю жизнь стенда: повторный init на уже
        # инициализированном OpenBao необратимо ошибается ("Vault is already initialized"), а
        # Secret openbao-init — единственное место, где root token/unseal-ключ вообще существуют,
        # поэтому именно его наличие — маркер "уже инициализирован", не запрос к самому OpenBao.
        - name: Инициализировать OpenBao (только при первом прогоне)
          when: platform_aicd_devops_labs_ru_openbao_init_secret.resources | length == 0
          no_log: true
          block:
            - name: "OpenBao: sys/init (secret_shares=1, secret_threshold=1 — однодольный ключ, single-node стенд)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/sys/init"
                ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
                method: POST
                body_format: json
                body:
                  secret_shares: 1
                  secret_threshold: 1
                status_code: [200]
              register: platform_aicd_devops_labs_ru_openbao_init

            - name: "OpenBao: сохранить root_token/unseal-ключ в Secret openbao-init"
              kubernetes.core.k8s:
                kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
                state: present
                kind: Secret
                name: openbao-init
                namespace: platform
                definition:
                  apiVersion: v1
                  metadata:
                    labels:
                      app.kubernetes.io/managed-by: ansible
                  type: Opaque
                  stringData:
                    root_token: "{{ platform_aicd_devops_labs_ru_openbao_init.json.root_token }}"
                    # .json.keys[0] коллизирует с Python dict.keys() (builtin-метод, а не
                    # JSON-ключ "keys") — Jinja резолвит .keys как атрибут раньше, чем как item
                    # lookup, отсюда "builtin_function_or_method object has no element 0"; нужна
                    # явная bracket-нотация.
                    unseal_key: "{{ platform_aicd_devops_labs_ru_openbao_init.json['keys'][0] }}"

            # register в отдельную переменную, НЕ platform_aicd_devops_labs_ru_openbao_init_secret — задача
            # внутри when-block, пропущенная (Secret уже существовал), тоже пишет в свой register
            # skip-результат ({"skipped": true}, без .resources) и тем самым затирала бы валидное
            # значение из самой первой "Проверить существование" (реальный найденный баг: "object
            # of type 'dict' has no attribute 'resources'" в задаче ниже).
            - name: Перечитать только что созданный Secret
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Secret
                namespace: platform
                name: openbao-init
              register: platform_aicd_devops_labs_ru_openbao_init_secret_fresh

        - name: Обновить Secret-результат данными после инициализации (если она выполнялась)
          when: >-
            platform_aicd_devops_labs_ru_openbao_init_secret_fresh is defined
            and platform_aicd_devops_labs_ru_openbao_init_secret_fresh.resources is defined
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_openbao_init_secret: "{{ platform_aicd_devops_labs_ru_openbao_init_secret_fresh }}"

        - name: Прочитать root_token/unseal-ключ из Secret
          no_log: true
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_openbao_root_token: >-
              {{ platform_aicd_devops_labs_ru_openbao_init_secret.resources[0].data.root_token | b64decode }}
            platform_aicd_devops_labs_ru_openbao_unseal_key: >-
              {{ platform_aicd_devops_labs_ru_openbao_init_secret.resources[0].data.unseal_key | b64decode }}

        # Безусловно на каждом прогоне — под мог перезапуститься между прогонами, raft-хранилище
        # не авто-распечатывается (нет auto-unseal), sealed-под отвечает на /v1/sys/seal-status,
        # но не на большинство остальных путей API.
        - name: "OpenBao: проверить seal-status"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/sys/seal-status"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            status_code: [200]
          register: platform_aicd_devops_labs_ru_openbao_seal_status

        - name: "OpenBao: распечатать (unseal), если sealed"
          when: platform_aicd_devops_labs_ru_openbao_seal_status.json.sealed | bool
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/sys/unseal"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            body_format: json
            body:
              key: "{{ platform_aicd_devops_labs_ru_openbao_unseal_key }}"
            status_code: [200]

        - name: "OpenBao: проверить включённые secrets engines"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/sys/mounts"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_devops_labs_ru_openbao_mounts
          no_log: true

        - name: "OpenBao: включить KV v2 (secret/)"
          when: "'secret/' not in platform_aicd_devops_labs_ru_openbao_mounts.json.data"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/sys/mounts/secret"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              type: kv
              options:
                version: "2"
            status_code: [200, 204]
          no_log: true

        - name: "OpenBao: включить PKI (pki/) и выпустить root CA + role aicd-devops-labs-ru"
          when: "'pki/' not in platform_aicd_devops_labs_ru_openbao_mounts.json.data"
          no_log: true
          block:
            - name: "OpenBao: sys/mounts/pki (type=pki)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/sys/mounts/pki"
                ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
                body_format: json
                body:
                  type: pki
                  config:
                    max_lease_ttl: "87600h"
                status_code: [200, 204]

            - name: "OpenBao: pki/root/generate/internal (root CA aicd.devops-labs.ru)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/pki/root/generate/internal"
                ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
                body_format: json
                body:
                  common_name: aicd.devops-labs.ru
                  ttl: "87600h"
                status_code: [200]

            - name: "OpenBao: pki/roles/aicd-devops-labs-ru (allowed_domains: aicd.devops-labs.ru)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/pki/roles/aicd-devops-labs-ru"
                ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
                body_format: json
                body:
                  allowed_domains: aicd.devops-labs.ru
                  allow_subdomains: true
                  max_ttl: "2160h"
                status_code: [200, 204]

        # Идемпотентность здесь критична — пере-генерация паролей при каждом прогоне сломала бы
        # уже созданные сессии/данные в Gitea/Semaphore (docs/adr/0016-openbao-secrets-pki.md §3).
        - name: "OpenBao: проверить наличие secret/gitea"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/gitea"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_gitea
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/gitea (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_gitea.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/gitea"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: проверить наличие secret/semaphore"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/semaphore"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_semaphore
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/semaphore (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_semaphore.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/semaphore"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
                cookie_hash: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
                cookie_encryption: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
                access_key_encryption: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) | b64encode }}"
            status_code: [200, 204]

        # docs/adr/0018-internal-caching-proxy.md — тот же приём, что platform/aicd/ansible/site.yml.
        - name: "OpenBao: проверить наличие secret/nexus"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_nexus
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/nexus (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_nexus.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
                ldap_bind_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/nexus (ldap_bind_password нужен play freeipa_hosts ниже)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/nexus"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_devops_labs_ru_openbao_secret_nexus_read
          no_log: true

        - name: Опубликовать ldap_bind_password Nexus как факт хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_nexus_ldap_bind_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_nexus_read.json.data.data.ldap_bind_password }}"
          no_log: true

        # docs/adr/0017-platform-cicd-default-addons.md — пароль basic-auth для Radar (первый
        # стандартный аддон), тем же идемпотентным приёмом, что secret/gitea/secret/semaphore
        # выше: генерируется только при первом прогоне, не меняется при повторных (иначе htpasswd
        # ниже перевыпускался бы на каждом прогоне без необходимости).
        - name: "OpenBao: проверить наличие secret/radar"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/radar"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_radar
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/radar (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_radar.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/radar"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        # docs/adr/0017-platform-cicd-default-addons.md §3 — пароль basic-auth для infra-panel
        # (второй стандартный аддон), тот же идемпотентный приём, что secret/radar выше.
        - name: "OpenBao: проверить наличие secret/infra-panel"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/infra-panel"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_infra_panel
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/infra-panel (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_infra_panel.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/infra-panel"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        # docs/adr/0017-platform-cicd-default-addons.md — третий аддон (мониторинг), тот же
        # приём, что platform/aicd/ansible/site.yml.
        - name: "OpenBao: проверить наличие secret/grafana"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/grafana"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_grafana
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/grafana (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_grafana.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/grafana"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                admin_user: admin
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/grafana (значение нужно ниже по playbook)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/grafana"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_devops_labs_ru_openbao_secret_grafana_read
          no_log: true

        # ADR-0013 §1 — пароли Directory Manager/admin для persistent freeipa (единый каталог
        # для Authelia), тот же идемпотентный приём, что secret/gitea/secret/radar выше.
        - name: "OpenBao: проверить наличие secret/freeipa"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/freeipa"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_freeipa
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/freeipa (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_freeipa.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/freeipa"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                dm_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
                admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24) }}"
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/freeipa (пароли нужны play freeipa_hosts ниже)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/freeipa"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_devops_labs_ru_openbao_secret_freeipa_read
          no_log: true

        - name: Опубликовать пароли freeipa как факты хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_freeipa_dm_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_freeipa_read.json.data.data.dm_password }}"
            platform_aicd_devops_labs_ru_freeipa_admin_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_freeipa_read.json.data.data.admin_password }}"
          no_log: true

        # ADR-0013 §3 — секреты Authelia: JWT/сессия/шифрование БД-хранилища, HMAC OIDC-провайдера,
        # RSA-ключ подписи OIDC-токенов (community.crypto.openssl_privatekey_pipe — генерирует в
        # памяти, не пишет на диск control-хоста, тот же принцип, что и остальные секреты этого
        # блока), пароль LDAP-bind-аккаунта svc-authelia (используется и здесь секретом Authelia, и
        # play freeipa_hosts ниже для реального создания аккаунта в каталоге), и client secret на
        # каждого нативного OIDC-потребителя (Semaphore, Gitea, §5). Один check-404-then-generate
        # блок на все поля сразу — секрет должен быть создан атомарно один раз, иначе повторный
        # прогон подставил бы новые OIDC/LDAP секреты поверх уже настроенных потребителей.
        - name: "OpenBao: проверить наличие secret/authelia"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200, 404]
          register: platform_aicd_devops_labs_ru_openbao_secret_authelia
          no_log: true

        - name: "Сгенерировать RSA-ключ подписи OIDC (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_authelia.status == 404
          community.crypto.openssl_privatekey_pipe:
            size: 4096
            type: RSA
          register: platform_aicd_devops_labs_ru_authelia_oidc_issuer_key
          no_log: true

        - name: "OpenBao: сгенерировать и записать secret/authelia (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_secret_authelia.status == 404
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data:
                jwt_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                session_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                storage_encryption_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                oidc_hmac_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=64) }}"
                oidc_issuer_private_key: "{{ platform_aicd_devops_labs_ru_authelia_oidc_issuer_key.privatekey }}"
                ldap_bind_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=32) }}"
                gitea_client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48) }}"
                semaphore_client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48) }}"
                grafana_client_secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=48) }}"
            status_code: [200, 204]

        # Ретрофит для уже забутстрапленного secret/authelia — тот же приём, что
        # platform/aicd/ansible/site.yml.
        - name: "OpenBao: добавить grafana_client_secret в существующий secret/authelia (docs/adr/0017)"
          when: >-
            platform_aicd_devops_labs_ru_openbao_secret_authelia.status == 200
            and 'grafana_client_secret' not in platform_aicd_devops_labs_ru_openbao_secret_authelia.json.data.data
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data: >-
                {{
                  platform_aicd_devops_labs_ru_openbao_secret_authelia.json.data.data
                  | combine({'grafana_client_secret': lookup('ansible.builtin.password', '/dev/null', length=48)})
                }}
            status_code: [200, 204]

        - name: "OpenBao: прочитать secret/authelia (значения нужны ниже по playbook)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: GET
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            status_code: [200]
          register: platform_aicd_devops_labs_ru_openbao_secret_authelia_read
          no_log: true

        - name: Опубликовать секреты Authelia как факты хоста (для play freeipa_hosts, hostvars)
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_authelia_ldap_bind_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data.ldap_bind_password }}"
          no_log: true

        # Authelia требует client_secret OIDC-клиента в конфиге в ВИДЕ ХЭША (pbkdf2-sha512), не
        # plaintext — сервис отказывается стартовать с plaintext-значением в этом поле (проверено
        # по офиц. интеграционным примерам authelia.com/integration/openid-connect/clients/
        # {semaphore,gitea}/). Plaintext-значения (gitea_client_secret/semaphore_client_secret,
        # уже сгенерированы выше) отдаются самим потребителям (Gitea CLI, SEMAPHORE_OIDC_PROVIDERS)
        # как есть — хэш нужен только в конфиге Authelia. Считается тем же бинарём/образом, что и
        # сама Authelia (`authelia crypto hash generate`), на control-хосте через docker (тот же
        # принцип "не писать секрет на диск" — вывод команды сразу разбирается в память, не
        # сохраняется в файл). Требует Docker на control-хосте (см. README, «Требования»).
        - name: "Authelia: посчитать pbkdf2-хэши client_secret для Gitea/Semaphore (только при первом прогоне)"
          when: "'gitea_client_secret_hash' not in platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - "authelia/authelia:4.39.20"
              - authelia
              - crypto
              - hash
              - generate
              - pbkdf2
              - --variant
              - sha512
              - --password
              - "{{ item }}"
          register: platform_aicd_devops_labs_ru_authelia_client_secret_hash_raw
          changed_when: false
          loop:
            - "{{ platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data.gitea_client_secret }}"
            - "{{ platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data.semaphore_client_secret }}"

        - name: "Authelia: сохранить посчитанные хэши в secret/authelia (только при первом прогоне)"
          when: "'gitea_client_secret_hash' not in platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              # regex_search с lookbehind вместо backreference-группы ('\1') — избегает
              # неоднозначности экранирования backslash внутри YAML block scalar + Jinja-строки
              # одновременно (полноценная capture-группа потребовала бы '\\1', легко перепутать).
              data: >-
                {{
                  platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data
                  | combine({
                      'gitea_client_secret_hash': platform_aicd_devops_labs_ru_authelia_client_secret_hash_raw.results[0].stdout | regex_search('(?<=Digest: ).+'),
                      'semaphore_client_secret_hash': platform_aicd_devops_labs_ru_authelia_client_secret_hash_raw.results[1].stdout | regex_search('(?<=Digest: ).+'),
                  })
                }}
            status_code: [200, 204]

        # Ретрофит для Grafana (docs/adr/0017) — тот же приём, что platform/aicd/ansible/site.yml.
        - name: "Authelia: посчитать pbkdf2-хэш client_secret для Grafana (только пока его нет)"
          when: "'grafana_client_secret_hash' not in platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - "authelia/authelia:4.39.20"
              - authelia
              - crypto
              - hash
              - generate
              - pbkdf2
              - --variant
              - sha512
              - --password
              - "{{ platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data.grafana_client_secret }}"
          register: platform_aicd_devops_labs_ru_authelia_grafana_client_secret_hash_raw
          changed_when: false

        - name: "Authelia: сохранить посчитанный хэш Grafana в secret/authelia (только пока его нет)"
          when: "'grafana_client_secret_hash' not in platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data"
          no_log: true
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/secret/data/authelia"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              data: >-
                {{
                  platform_aicd_devops_labs_ru_openbao_secret_authelia_read.json.data.data
                  | combine({
                      'grafana_client_secret_hash': platform_aicd_devops_labs_ru_authelia_grafana_client_secret_hash_raw.stdout | regex_search('(?<=Digest: ).+'),
                  })
                }}
            status_code: [200, 204]

        # TLS-сертификаты — перевыпускаются автоматически при приближении к сроку истечения
        # (docs/adr/0016-openbao-secrets-pki.md §4, аннотация renew-after-epoch в
        # tasks/issue-tls-cert.yml), TTL 2160h (90 дней), renew за 30 дней до истечения.
        # openbao.aicd.devops-labs.ru/openbao-ingress-tls — docs/adr/0017-platform-cicd-default-addons.md
        # §3, внешний Ingress-сертификат OpenBao (отдельный от внутреннего bootstrap-сертификата
        # openbao-server-tls самого listener'а).
        - name: "OpenBao: выпустить/перевыпустить TLS-сертификаты (gitea, semaphore, radar, infra-panel, openbao, authelia, grafana, nexus)"
          no_log: true
          ansible.builtin.include_tasks: tasks/issue-tls-cert.yml
          loop:
            - {host: gitea.aicd.devops-labs.ru, secret: gitea-tls}
            - {host: semaphore.aicd.devops-labs.ru, secret: semaphore-tls}
            - {host: radar.aicd.devops-labs.ru, secret: radar-tls}
            - {host: infra-panel.aicd.devops-labs.ru, secret: infra-panel-tls}
            - {host: openbao.aicd.devops-labs.ru, secret: openbao-ingress-tls}
            - {host: sso.aicd.devops-labs.ru, secret: authelia-tls}
            # namespace: monitoring/cache — тот же фикс, что platform/aicd/ansible/site.yml
            # (Secret обязан жить там же, где IngressRoute/Ingress, который его использует).
            - {host: grafana.aicd.devops-labs.ru, secret: grafana-tls, namespace: monitoring}
            - {host: nexus.aicd.devops-labs.ru, secret: nexus-tls, namespace: cache}
            - {host: nexus-cache.aicd.devops-labs.ru, secret: nexus-cache-tls, namespace: cache}
          loop_control:
            label: "{{ item.host }}"

        # Scoped VAULT_TOKEN вместо root — docs/adr/0016-openbao-secrets-pki.md §5, «Не
        # проработано» (первая итерация ADR-0016). Только read на секреты, которые реально нужны
        # gomplate-датасорсу vault:// в values.yaml Gitea/Semaphore — ни sys/*, ни pki/*, ни
        # write. Root token остаётся только внутри самого этого ansible-блока (init/unseal/
        # engines/PKI/генерация секретов), наружу (в environment внешнего процесса helmwave) не
        # передаётся.
        # ADR-0013 — найдено реальным прогоном: Authelia values.yaml тоже читает секреты через
        # gomplate vault:// (тот же приём, что gitea/semaphore) — без отдельного path здесь
        # scoped render-token получал 403 Permission denied на secret/data/authelia (Radar/
        # infra-panel сюда не входят — их пароли передаются иначе, через ansible/htpasswd, а не
        # напрямую через vault:// в их values.yaml).
        - name: "OpenBao: policy aicd-devops-labs-ru-render (read-only secret/gitea, secret/semaphore, secret/authelia)"
          ansible.builtin.uri:
            url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/sys/policies/acl/aicd-devops-labs-ru-render"
            ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
            method: PUT
            headers:
              X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
            body_format: json
            body:
              policy: |
                path "secret/data/gitea" {
                  capabilities = ["read"]
                }
                path "secret/data/semaphore" {
                  capabilities = ["read"]
                }
                path "secret/data/authelia" {
                  capabilities = ["read"]
                }
            status_code: [200, 204]

        - name: "OpenBao: проверить наличие Secret openbao-render-token (идемпотентность выпуска)"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            namespace: platform
            name: openbao-render-token
          register: platform_aicd_devops_labs_ru_openbao_render_token_secret

        # Токен выпускается один раз — повторный прогон не должен плодить новые токены (старые
        # не отзываются автоматически, это был бы утечка токенов при каждом ansible-playbook).
        - name: "OpenBao: выпустить render-token (только при первом прогоне)"
          when: platform_aicd_devops_labs_ru_openbao_render_token_secret.resources | length == 0
          no_log: true
          block:
            - name: "OpenBao: auth/token/create (policy aicd-devops-labs-ru-render)"
              ansible.builtin.uri:
                url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/auth/token/create"
                ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
                method: POST
                headers:
                  X-Vault-Token: "{{ platform_aicd_devops_labs_ru_openbao_root_token }}"
                body_format: json
                body:
                  policies: [aicd-devops-labs-ru-render]
                  ttl: "87600h"
                  renewable: true
                  display_name: aicd-devops-labs-ru-render
                status_code: [200]
              register: platform_aicd_devops_labs_ru_openbao_render_token

            - name: "OpenBao: сохранить render-token в Secret openbao-render-token"
              kubernetes.core.k8s:
                kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
                state: present
                kind: Secret
                name: openbao-render-token
                namespace: platform
                definition:
                  apiVersion: v1
                  metadata:
                    labels:
                      app.kubernetes.io/managed-by: ansible
                  type: Opaque
                  stringData:
                    token: "{{ platform_aicd_devops_labs_ru_openbao_render_token.json.auth.client_token }}"

            # Отдельное имя register + промежуточный set_fact — тот же приём, что уже применён
            # выше для openbao-init (найденный реальным прогоном баг: register в то же имя
            # переменной внутри пропущенного when-блока затирает валидный более ранний результат).
            - name: Перечитать только что созданный Secret с render-token
              kubernetes.core.k8s_info:
                api_version: v1
                kind: Secret
                namespace: platform
                name: openbao-render-token
              register: platform_aicd_devops_labs_ru_openbao_render_token_secret_fresh

        - name: Обновить Secret-результат render-token данными после выпуска (если он выполнялся)
          when: >-
            platform_aicd_devops_labs_ru_openbao_render_token_secret_fresh is defined
            and platform_aicd_devops_labs_ru_openbao_render_token_secret_fresh.resources is defined
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_openbao_render_token_secret: "{{ platform_aicd_devops_labs_ru_openbao_render_token_secret_fresh }}"

        - name: Прочитать render-token из Secret
          no_log: true
          ansible.builtin.set_fact:
            platform_aicd_devops_labs_ru_openbao_render_token_value: >-
              {{ platform_aicd_devops_labs_ru_openbao_render_token_secret.resources[0].data.token | b64decode }}

  handlers:
    # docs/adr/0018-internal-caching-proxy.md — тот же приём, что platform/aicd/ansible/site.yml.
    - name: "Перезапустить k3s (подхватить registries.yaml)"
      ansible.builtin.systemd:
        name: k3s
        state: restarted

    - name: "Обновить системный trust store aicd-labs"
      ansible.builtin.command: update-ca-certificates
      changed_when: true

# ADR-0013 §1 — persistent freeipa, единый каталог для Authelia. Отдельный play (не часть play
# выше): другой хост (freeipa_hosts, не platform_hosts). Намеренно идёт СРАЗУ ПОСЛЕ play выше (не
# в конце файла) — найдено реальным прогоном: Authelia (устанавливается в следующем play,
# "...продолжение: Helmwave up потребителей Authelia") на старте делает LDAP startup-check к
# freeipa, поэтому каталог и bind-аккаунт svc-authelia обязаны существовать уже к этому моменту.
# Пароли (secret/freeipa, secret/authelia) уже сгенерированы и опубликованы как факты хоста "aicd-labs"
# в блоке "OpenBao: bootstrap" play выше, читаются здесь через hostvars.
- name: "Единая авторизация (ADR-0013): persistent freeipa"
  hosts: freeipa_hosts
  become: true
  vars:
    freeipa_dm_password: "{{ hostvars['aicd-labs'].platform_aicd_devops_labs_ru_freeipa_dm_password }}"
    freeipa_admin_password: "{{ hostvars['aicd-labs'].platform_aicd_devops_labs_ru_freeipa_admin_password }}"

  pre_tasks:
    - name: Дождаться завершения cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

  roles:
    - freeipa

  tasks:
    # Найдено реальным прогоном на этом окружении: в отличие от platform/aicd (Packer-образ Rocky
    # 9, где firewalld уже установлен, просто не запущен), Proxmox-шаблон VMID 9001 не содержит
    # пакет firewalld вовсе ("Could not find the requested service firewalld: host" при попытке
    # ansible.builtin.systemd его завести) — ставим явно, прежде чем включать/стартовать.
    - name: "Firewalld: установить пакет (на этом шаблоне отсутствует по умолчанию)"
      ansible.builtin.dnf:
        name: firewalld
        state: present

    # Найдено реальным прогоном: firewalld на этом образе Rocky 9 не запущен и не enabled по
    # умолчанию (systemctl is-active firewalld → inactive) — ansible.posix.firewalld с
    # immediate: true требует реально работающий демон, иначе падает "firewall is not currently
    # running". Раз уж на persistent-хосте (не одноразовая molecule-VM) заводим сервис,
    # разумнее сначала включить сам firewalld, чем оставлять хост вовсе без файрвола.
    - name: "Firewalld: запустить и включить автозапуск"
      ansible.builtin.systemd:
        name: firewalld
        state: started
        enabled: true

    # ipa-server-install не открывает LDAP-порты в firewalld сам (roles/freeipa/README.md,
    # подтверждённое поведение апстрима) — роль тоже этого не делает, открывается здесь,
    # оркестрацией окружения (не размывает границы роли, ADR-0011 §3).
    - name: "Firewalld: разрешить LDAP/LDAPS для клиентов каталога (Authelia)"
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - freeipa-ldap
        - freeipa-ldaps

    - name: "Kinit admin (нужен валидный тикет Kerberos для ipa CLI ниже)"
      ansible.builtin.command:
        cmd: kinit admin
        stdin: "{{ freeipa_admin_password }}\n"
      changed_when: false
      no_log: true

    - name: "Проверить наличие сервисного bind-аккаунта svc-authelia"
      ansible.builtin.command: ipa user-show svc-authelia
      register: platform_aicd_devops_labs_ru_ipa_svc_authelia_check
      changed_when: false
      failed_when: false

    # ADR-0011 §3 — заведение пользователей каталога сознательно не входит в саму роль freeipa
    # (только провижининг сервера), поэтому bind-аккаунт для Authelia заводится здесь,
    # оркестрацией окружения. Обычный непривилегированный IPA-пользователь — этого достаточно
    # для simple bind + чтения атрибутов пользователей/групп (дефолтные ACI FreeIPA разрешают это
    # любому аутентифицированному пользователю каталога, отдельные права не нужны).
    # --password-expiration далеко в будущем — без этого FreeIPA помечает пароль, заданный
    # админом при создании, как "требует смены при первом входе" (обычное поведение для
    # интерактивных пользователей); для сервисного аккаунта, который никогда не логинится
    # интерактивно, это привело бы к тому, что Authelia перестала бы проходить bind сразу после
    # первой примененной политики истечения пароля.
    - name: "Создать сервисный bind-аккаунт svc-authelia (только при первом прогоне)"
      when: platform_aicd_devops_labs_ru_ipa_svc_authelia_check.rc != 0
      ansible.builtin.command:
        cmd: >-
          ipa user-add svc-authelia
          --first=Service --last=Authelia
          --password-expiration=20351231235959Z
          --password
        # Двойные кавычки обязательны: только в них YAML раскрывает \n как настоящий перенос
        # строки (в folded ">-"/литеральном "|" стиле \n остался бы буквальным текстом) — ipa
        # user-add --password интерактивно запрашивает пароль дважды, оба раза читает из stdin.
        stdin: "{{ hostvars['aicd-labs'].platform_aicd_devops_labs_ru_authelia_ldap_bind_password }}\n{{ hostvars['aicd-labs'].platform_aicd_devops_labs_ru_authelia_ldap_bind_password }}\n"
      # Задача только под when: ...rc != 0 (только первый прогон, реально создаёт аккаунт) —
      # changed_when: true корректен, тот же приём, что helmwave up (always-changed по design).
      changed_when: true
      no_log: true

    # docs/adr/0018-internal-caching-proxy.md — тот же приём, что platform/aicd/ansible/site.yml.
    - name: "Проверить наличие сервисного bind-аккаунта svc-nexus"
      ansible.builtin.command: ipa user-show svc-nexus
      register: platform_aicd_devops_labs_ru_ipa_svc_nexus_check
      changed_when: false
      failed_when: false

    - name: "Создать сервисный bind-аккаунт svc-nexus (только при первом прогоне)"
      when: platform_aicd_devops_labs_ru_ipa_svc_nexus_check.rc != 0
      ansible.builtin.command:
        cmd: >-
          ipa user-add svc-nexus
          --first=Service --last=Nexus
          --password-expiration=20351231235959Z
          --password
        stdin: "{{ hostvars['aicd-labs'].platform_aicd_devops_labs_ru_nexus_ldap_bind_password }}\n{{ hostvars['aicd-labs'].platform_aicd_devops_labs_ru_nexus_ldap_bind_password }}\n"
      changed_when: true
      no_log: true

# Play-продолжение (тот же хост platform_hosts/aicd-labs, но ОТДЕЛЬНЫЙ play) — намеренно идёт
# ПОСЛЕ play freeipa_hosts ниже: Authelia (первый релиз, который поднимает Helmwave up тут)
# на старте делает LDAP startup-check к freeipa — каталог и bind-аккаунт svc-authelia должны
# существовать уже к этому моменту, не позже. Факты, установленные set_fact в предыдущем play
# на этом же хосте (platform_aicd_devops_labs_ru_kubeconfig, platform_aicd_devops_labs_ru_openbao_*, ...), остаются доступны
# как обычные переменные — hostvars персистентны для хоста в рамках всего прогона плейбука,
# независимо от границ между play.
- name: "Platform CI/CD infra (продолжение): Helmwave up потребителей Authelia"
  hosts: platform_hosts
  become: true

  tasks:

    # ADR-0013 — найдено реальным прогоном: init-контейнер configure-gitea (gitea admin auth
    # add-oauth --auto-discover-url https://sso.aicd.devops-labs.ru/...) падал с "certificate signed by
    # unknown authority" — Go-клиент внутри образа Gitea не доверяет внутреннему PKI CA OpenBao
    # (тот же CA, из которого выпущен authelia-tls). CA-сертификат публичный (не секрет) —
    # pki/ca/pem отдаёт его без токена, но токен передаём — не мешает. Secret с CA монтируется в
    # Gitea (values.yaml, extraVolumes/extraInit/ContainerVolumeMounts) — и в init-контейнер (где
    # настраивается OAuth-источник), и в основной контейнер (реальный обмен токеном при логине
    # пользователя тоже идёт через HTTPS к Authelia).
    - name: "OpenBao: получить PEM внутреннего Root CA (для доверия Gitea к Authelia)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      ansible.builtin.uri:
        url: "{{ platform_aicd_devops_labs_ru_openbao_addr }}/v1/pki/ca/pem"
        ca_path: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
        method: GET
        return_content: true
        status_code: [200]
      register: platform_aicd_devops_labs_ru_pki_ca_pem

    # Имя Secret'а намеренно НЕ переименовано в aicd-devops-labs-ru-ca при переносе с platform/aicd
    # (см. helm/values/platform-devops-labs-ru/namespaces/platform/{gitea,semaphore}/values.yaml —
    # оба ссылаются на буквальное имя aicd-platform-ca ради единообразия имени ресурса между
    # окружениями, по аналогии с platform/aicd). Реальным прогоном найдено: механическая
    # sed-замена при переносе задела и эту строку, из-за чего Gitea/Semaphore зависали в
    # Init/ContainerCreating на несуществующем Secret — исправлено обратно на aicd-platform-ca.
    - name: "Secret aicd-platform-ca (CA сертификат для доверия Gitea к Authelia)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: aicd-platform-ca
        namespace: platform
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            ca.pem: "{{ platform_aicd_devops_labs_ru_pki_ca_pem.content }}"

    # docs/adr/0017-platform-cicd-default-addons.md — третий аддон (мониторинг). Namespace
    # monitoring создаётся раньше (см. "Namespace monitoring (для grafana-tls до Helmwave up)"
    # в начале play выше) — здесь только Secret'ы.
    - name: "Secret aicd-platform-ca в namespace monitoring (для OIDC-обмена Grafana с Authelia)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: aicd-platform-ca
        namespace: monitoring
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            ca.pem: "{{ platform_aicd_devops_labs_ru_pki_ca_pem.content }}"

    - name: "Secret grafana-admin-credentials-custom (пароль из secret/grafana в OpenBao)"
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
      kubernetes.core.k8s:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        state: present
        kind: Secret
        name: grafana-admin-credentials-custom
        namespace: monitoring
        definition:
          apiVersion: v1
          metadata:
            labels:
              app.kubernetes.io/managed-by: ansible
          type: Opaque
          stringData:
            GF_SECURITY_ADMIN_USER: "{{ platform_aicd_devops_labs_ru_openbao_secret_grafana_read.json.data.data.admin_user }}"
            GF_SECURITY_ADMIN_PASSWORD: "{{ platform_aicd_devops_labs_ru_openbao_secret_grafana_read.json.data.data.admin_password }}"

    # docs/adr/0017-platform-cicd-default-addons.md — --tags ограничивает второй helmwave up
    # обязательными релизами (platform_aicd_devops_labs_ru_core_releases) плюс включённым набором аддонов
    # (platform_aicd_devops_labs_ru_default_addons/_extra_addons/_disabled_addons,
    # platform/aicd-devops-labs-ru/ansible/group_vars/platform_hosts.yml). Каждый релиз в helmwave уже
    # автоматически тегируется своим именем (helm/helmwave.yml.tpl:76-78) — отдельный tags: в
    # envs/platform.yaml не нужен.
    - name: Helmwave up (Gitea + Semaphore + Flux + аддоны, helm/envs/platform.yaml)
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true
      environment:
        KUBECONFIG: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        K8S_CLUSTER: platform-devops-labs-ru
        # Прокси control-хоста иначе уводит запросы к приватному IP kube-apiserver через себя —
        # таймаут "Kubernetes cluster unreachable" вместо ошибки роли/helmwave, тот же found,
        # что в roles/monitoring_server/tasks/monitoring-server.k3s.yml.
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }}"
        # Читаются gomplate-датасорсом vault:// в values.yaml Gitea/Semaphore (docs/adr/
        # 0016-openbao-secrets-pki.md §2) — scoped render-token (policy aicd-devops-labs-ru-render,
        # только read secret/gitea|semaphore), не root token (§5).
        VAULT_ADDR: "{{ platform_aicd_devops_labs_ru_openbao_addr }}"
        VAULT_TOKEN: "{{ platform_aicd_devops_labs_ru_openbao_render_token_value }}"
        # Найдено реальным прогоном после включения TLS на самом OpenBao (§5): datasource
        # vault:// внутри gomplate использует свой собственный HTTP-клиент (hashicorp/vault/api),
        # не ansible.builtin.uri — ca_path, заданный для ansible-задач, на него не действует.
        # Клиент честно проверяет сертификат и падает ("x509: certificate signed by unknown
        # authority") без явного доверенного CA — VAULT_CACERT это тот же стандартный env var,
        # что понимает Vault/OpenBao CLI.
        VAULT_CACERT: "{{ platform_aicd_devops_labs_ru_openbao_ca_path }}"
      ansible.builtin.command:
        chdir: "{{ playbook_dir }}/../../../helm"
        argv:
          - helmwave
          - up
          - --build
          - --yml
          - --templater
          - gomplate
          - --file
          - helmwave.platform-devops-labs-ru.yml
          - --tags
          - "{{ (platform_aicd_devops_labs_ru_core_releases + platform_aicd_devops_labs_ru_enabled_addons) | join(',') }}"
      register: platform_aicd_devops_labs_ru_helmwave_up
      changed_when: true

    # docs/adr/0018-internal-caching-proxy.md — bootstrap Nexus, тот же приём, что
    # platform/aicd/ansible/site.yml.
    - name: "Записать внутренний PKI CA локально (для запросов к REST API Nexus)"
      delegate_to: localhost
      become: false
      run_once: true
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        content: "{{ platform_aicd_devops_labs_ru_pki_ca_pem.content }}"
        mode: '0644'

    - name: "Дождаться готовности пода Nexus"
      delegate_to: localhost
      become: false
      run_once: true
      kubernetes.core.k8s_info:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        api_version: v1
        kind: Pod
        namespace: cache
        label_selectors:
          - "app.kubernetes.io/instance=nexus"
      register: platform_aicd_devops_labs_ru_nexus_pod
      until: >-
        platform_aicd_devops_labs_ru_nexus_pod.resources | length > 0 and
        (platform_aicd_devops_labs_ru_nexus_pod.resources[0].status.containerStatuses | default([])
          | selectattr('ready', 'equalto', true) | list | length > 0)
      retries: 60
      delay: 10

    - name: "Nexus: проверить, актуален ли admin-пароль"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
      ansible.builtin.uri:
        url: "https://nexus.aicd.devops-labs.ru/service/rest/v1/repositories"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # Без force_basic_auth модуль сперва шлёт запрос БЕЗ Basic Auth и добавляет его только
        # увидев 401 (штатное поведение ansible.builtin.uri). GET на анонимно читаемые эндпоинты
        # Nexus (например, этот) из-за этого "проходит" 200 ещё до реальной проверки пароля — сам
        # факт успеха такого GET ничего не доказывает про корректность admin_password. Хуже того,
        # POST/PUT с телом в этой схеме падали 401 Unauthorized (повторная отправка запроса с
        # телом после challenge ненадёжна) — живой прогон 2026-08-28. force_basic_auth здесь и во
        # всех остальных Nexus REST-задачах ниже заставляет слать креды сразу, при первой попытке.
        force_basic_auth: true
        status_code: [200, 401]
      register: platform_aicd_devops_labs_ru_nexus_auth_check
      no_log: true

    - name: "Nexus: прочитать сгенерированный при первом старте admin-пароль"
      when: platform_aicd_devops_labs_ru_nexus_auth_check.status == 401
      delegate_to: localhost
      become: false
      run_once: true
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ platform_aicd_devops_labs_ru_kubeconfig.dest }}"
        namespace: cache
        pod: "{{ platform_aicd_devops_labs_ru_nexus_pod.resources[0].metadata.name }}"
        command: cat /nexus-data/admin.password
      register: platform_aicd_devops_labs_ru_nexus_initial_password
      no_log: true

    - name: "Nexus: сменить admin-пароль на сгенерированный в secret/nexus"
      when: platform_aicd_devops_labs_ru_nexus_auth_check.status == 401
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.devops-labs.ru/service/rest/v1/security/users/admin/change-password"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: PUT
        url_username: admin
        url_password: "{{ platform_aicd_devops_labs_ru_nexus_initial_password.stdout }}"
        force_basic_auth: true
        body_format: raw
        headers:
          Content-Type: text/plain
        body: "{{ platform_aicd_devops_labs_ru_openbao_secret_nexus_read.json.data.data.admin_password }}"
        status_code: [204]

    - name: "Nexus: получить список существующих repositories"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
      ansible.builtin.uri:
        url: "https://nexus.aicd.devops-labs.ru/service/rest/v1/repositories"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: GET
        url_username: admin
        url_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: platform_aicd_devops_labs_ru_nexus_repos
      no_log: true

    - name: "Nexus: создать docker-hub-proxy (если ещё нет)"
      when: "'docker-hub-proxy' not in (platform_aicd_devops_labs_ru_nexus_repos.json | map(attribute='name') | list)"
      delegate_to: localhost
      become: false
      run_once: true
      environment:
        NO_PROXY: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
        no_proxy: "127.0.0.1,localhost,{{ ansible_facts['default_ipv4']['address'] }},nexus.aicd.devops-labs.ru"
      no_log: true
      ansible.builtin.uri:
        url: "https://nexus.aicd.devops-labs.ru/service/rest/v1/repositories/docker/proxy"
        ca_path: "{{ playbook_dir }}/.kube-tmp/aicd-platform-ca.pem"
        method: POST
        url_username: admin
        url_password: "{{ platform_aicd_devops_labs_ru_openbao_secret_nexus_read.json.data.data.admin_password }}"
        # См. комментарий у первой Nexus REST-задачи выше — без force_basic_auth POST/PUT с телом
        # реально падали 401 Unauthorized.
        force_basic_auth: true
        body_format: json
        body:
          name: docker-hub-proxy
          online: true
          storage:
            blobStoreName: default
            strictContentTypeValidation: true
          docker:
            v1Enabled: false
            forceBasicAuth: false
            httpPort: 8083
          # dockerProxy — обязательный блок специально для docker-формата proxy-repo (в отличие
          # от docker hosted/group), найдено реальным прогоном (400 Bad Request без него) через
          # схему /service/rest/swagger.json самого Nexus: DockerProxyRepositoryApiRequest
          # требует dockerProxy.indexType. HUB — тип индекса для Docker Hub (remoteUrl ниже),
          # Nexus сам подставляет индекс-URL Docker Hub, indexUrl не нужен.
          dockerProxy:
            indexType: HUB
          proxy:
            remoteUrl: https://registry-1.docker.io
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          httpClient:
            blocked: false
            autoBlock: true
        status_code: [201]

    - name: "Nexus: создать k3s-releases-proxy (если ещё нет)"
      when: "'k3s-releases-proxy' not in (platform_aicd_devops_labs_ru_nexus_repos.json | map(attribute='name') | list)"
