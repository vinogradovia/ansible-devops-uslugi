# infra-panel (homer) — второй стандартный аддон (docs/adr/0017-platform-cicd-default-addons.md
# §3), тот же, что helm/values/platform/namespaces/platform/infra-panel/values.yaml — разница
# только в домене (aicd.devops-labs.ru вместо aicd.platform). См. тот файл для полного контекста
# решений (basic-auth/TLS через ansible, не через values чарта).

configMaps:
  config:
    data:
      config.yml: |
        title: "Infra Panel"
        subtitle: "aicd.devops-labs.ru"
        columns: "3"
        connectivityCheck: false
        # Gitea/Semaphore — ссылки ведут сразу на эндпоинт, инициирующий OIDC-флоу через Authelia,
        # минуя промежуточный клик по кнопке "Sign in with Authelia" на странице логина сервиса —
        # см. helm/values/platform/namespaces/platform/infra-panel/values.yaml (первый стенд) для
        # разбора, откуда взяты эти пути.
        services:
          - name: Platform
            items:
              - name: Gitea
                url: https://gitea.aicd.devops-labs.ru/user/oauth2/authelia
                target: _blank
              - name: Semaphore
                url: https://semaphore.aicd.devops-labs.ru/api/auth/oidc/authelia/login
                target: _blank
              - name: Radar
                url: https://radar.aicd.devops-labs.ru
                target: _blank
              # docs/adr/0024-platform-docs-site.md
              - name: Docs
                url: https://docs.aicd.devops-labs.ru
                target: _blank
              - name: OpenBao
                url: https://openbao.aicd.devops-labs.ru
                target: _blank
              - name: FreeIPA
                url: https://ipa.aicd.devops-labs.ru/ipa/ui/
                target: _blank
              - name: SSO (Authelia)
                url: https://sso.aicd.devops-labs.ru/
                target: _blank
              # docs/adr/0017 §4 — тот же приём auto-redirect на OIDC-логин, что Gitea/Semaphore
              # выше (Grafana login route generic_oauth инициирует OIDC-флоу через Authelia сразу).
              - name: Grafana
                url: https://grafana.aicd.devops-labs.ru/login/generic_oauth
                target: _blank
              # docs/adr/0018 — Nexus логинится по LDAP собственной формой (не OIDC-редирект, как
              # Gitea/Semaphore/Grafana выше) — ссылка на обычный корень UI.
              - name: Nexus
                url: https://nexus.aicd.devops-labs.ru/
                target: _blank
              # ROADMAP.md №59 — LiteLLM тоже заведён OIDC-клиентом Authelia. /sso/key/generate —
              # найденный живым прогоном прямой redirect URL (303 → .../api/oidc/authorization →
              # логин Authelia), тот же однокликовый паттерн, что Gitea/Semaphore/Grafana выше —
              # не /ui (та требовала бы отдельного клика по кнопке SSO на странице логина
              # LiteLLM, см. ADR-0022 §3). Доступ к самой сети (forwardAuth) — только
              # platform-admins/platform-engineers, без platform-viewers.
              - name: LiteLLM
                url: https://litellm.aicd.devops-labs.ru/sso/key/generate
                target: _blank
              # ROADMAP.md №65 — Open WebUI. OAUTH_AUTO_REDIRECT=true (values/.../platform/
              # openwebui/values.yaml) уводит с корня прямо на sso.aicd.devops-labs.ru — тот же
              # однокликовый паттерн, что остальные ссылки выше, без отдельного клика по кнопке
              # SSO на странице логина.
              - name: Open WebUI
                url: https://openwebui.aicd.devops-labs.ru/
                target: _blank

deployments:
  infra-panel:
    # config.yml монтируется ниже через configMap + subPath — kubelet НЕ перемонтирует
    # subPath-файл живому поду при изменении ConfigMap (в отличие от обычного volume mount на
    # директорию), поэтому без принудительного рестарта уже работающий под продолжает работать
    # со старым конфигом сколько угодно после `helmwave up`, который сам покажет "changed" и
    # ничего не заподозрит (найдено живым прогоном — под пропустил новую ссылку "Docs" из
    # docs/adr/0024-platform-docs-site.md, пришлось пересоздавать вручную). Тот же фикс, что уже
    # применён к authelia/litellm — checksum-аннотация форсирует rolling restart при любом
    # изменении содержимого configMaps.config.data.
    podAnnotations:
      checksum/config: '{{ include "helpers.workload.checksum" $.Values.configMaps.config.data }}'
    containers:
      - name: homer
        image: b4bz/homer
        imageTag: v26.4.2
        env:
          - name: INIT_ASSETS
            value: "0"
        ports:
          - name: http
            containerPort: 8080
        volumeMounts:
          - name: config
            mountPath: /www/assets/config.yml
            subPath: config.yml
    volumes:
      - name: config
        type: configMap

services:
  infra-panel:
    ports:
      - name: http
        port: 8080

ingressroutes:
  infra-panel:
    entryPoints:
      - websecure
    routes:
      "Host(`infra-panel.aicd.devops-labs.ru`)":
        middlewares:
          - name: authelia-forward-auth
        services:
          infra-panel-infra-panel:
            port: 8080
    tls:
      secretName: infra-panel-tls
