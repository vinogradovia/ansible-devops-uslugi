# Gitea (https://gitea.com) — self-hosted git, источник Module-манифестов/inventory для
# платформенного контроллера (docs/adr/0014-platform-controller-architecture.md §4,
# docs/adr/0012-cicd-platform-architecture.md §4). Официальный чарт gitea-charts/gitea.
# Второе окружение платформы (platform/aicd-devops-labs-ru) — те же решения, что
# helm/values/platform/namespaces/platform/gitea/values.yaml (первый стенд), другой домен.
#
# admin.password — читается из OpenBao (docs/adr/0016-openbao-secrets-pki.md) через gomplate
# datasource vault://, а не задан прямым текстом — сгенерирован один раз
# platform/aicd-devops-labs-ru/ansible/site.yml при первом прогоне, при повторных прогонах не
# меняется. ВНИМАНИЕ: этот файл целиком — gomplate-шаблон с делимитерами "квадратная скобка
# дважды" вместо Jinja-фигурных (см. helm/helmwave.yml.tpl, delimiter_left/right для
# values-файлов релизов), рендерится helmwave/gomplate, не ansible — не используйте парные
# квадратные скобки нигде в этом файле, даже в комментариях (gomplate шаблонизирует файл
# целиком, включая комментарии).
#
# defineDatasource/ds, не двухаргументный datasource("имя", "путь") — helmwave не регистрирует
# алиасы датасорсов через CLI-флаг (в отличие от чистого gomplate-бинаря), их нужно объявить
# прямо в шаблоне (docs.helmwave.app, «HashiCorp Vault»). Путь — "secret/data/gitea" (не
# "secret/gitea") — обязательный префикс "data/" для KV v2 engine, тот же путь на низком уровне
# API, что platform/aicd-devops-labs-ru/ansible/site.yml использует в /v1/secret/data/gitea.
[[ defineDatasource "vault" "vault:///secret/data/gitea" ]]
# Найдено реальным прогоном (клик-тест логина): gitea_client_secret живёт в secret/authelia
# (ADR-0013 §3), а не в secret/gitea — "vault" датасорс выше указывает на secret/gitea, поэтому
# `(ds "vault").data.gitea_client_secret` резолвился в отсутствующее поле и молча рендерился
# как литеральная строка Go-шаблонов "<no value>" (10 символов) вместо реального секрета —
# Gitea отправляла эту строку как OAuth2 client secret, Authelia не находила соответствия.
# Отдельный именованный датасорс — единственный способ прочитать поле из ДРУГОГО пути в рамках
# одного gomplate-рендера (см. комментарий про defineDatasource/ds чуть выше).
[[ defineDatasource "vault_authelia" "vault:///secret/data/authelia" ]]
gitea:
  admin:
    username: gitea_admin
    password: '[[ (ds "vault").data.admin_password ]]'
    email: gitea_admin@aicd.devops-labs.ru
  config:
    # LEVEL: Info — явный дефолт. Найдено реальным прогоном: официальный чарт Gitea
    # идемпотентно ДОБАВЛЯЕТ/ОБНОВЛЯЕТ ключи в persisted app.ini, но не удаляет их при простом
    # убирании из values.yaml — временный LEVEL: Debug (диагностика §11 ADR-0013) остался бы в
    # app.ini навсегда без явного отката значением.
    log:
      LEVEL: Info
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    # Найдено реальным прогоном: без ENABLE_AUTO_REGISTRATION (дефолт Gitea — false) первый
    # логин через OIDC для личности, у которой ещё нет локального аккаунта Gitea, молча
    # проваливается (редирект на /user/login без единой строки ошибки в логах) — freeipa не
    # заводит пользователей заранее (ADR-0011), поэтому без этого флага OIDC-вход неюзабелен
    # ни для одного реального пользователя каталога, только для заранее вручную привязанных.
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
  # ADR-0013 §5 — нативный OIDC-логин через Authelia, декларативно, штатным механизмом чарта
  # (см. helm/values/platform/namespaces/platform/gitea/values.yaml, первый стенд, для разбора).
  oauth:
    - name: authelia
      provider: openidConnect
      key: gitea
      secret: '[[ (ds "vault_authelia").data.gitea_client_secret ]]'
      autoDiscoverUrl: https://sso.aicd.devops-labs.ru/.well-known/openid-configuration
      # Найдено реальным прогоном: без явного scopes Gitea запрашивает у Authelia только
      # 'openid' (подтверждено экраном согласия — одна строка "OpenID для подтверждения
      # личности" вместо трёх, как у Semaphore) — Auto Registration падает ("returned missing
      # fields: email,nickname"), т.к. Authelia не выдаёт claim'ы, на которые у клиента нет
      # разрешённого scope. 'nickname' — custom scope Authelia (см. authelia/values.yaml,
      # claims_policies.gitea_claims), не стандартный OIDC scope.
      # 'groups' — ADR-0019 §6/§8 шаг 4, тем же приёмом: platform-admins → Gitea admin,
      # platform-viewers → restricted user, platform-engineers — обычный пользователь (дефолт).
      # Полный разбор — эталон, helm/values/platform/namespaces/platform/gitea/values.yaml.
      scopes: "profile email nickname groups"
      groupClaimName: groups
      adminGroup: platform-admins
      restrictedGroup: platform-viewers

# strategy.type: Recreate — найдено реальным прогоном на первом стенде (platform/aicd) — дефолтный
# RollingUpdate чарта создаёт новый под ДО остановки старого, а оба пода делят один PVC и один и
# тот же on-disk leveldb-файл очереди (config.queue.TYPE: level выше) — гарантированный deadlock.
strategy:
  type: Recreate

# ADR-0013 §5/§7 — доверие к внутреннему PKI CA OpenBao (тот же CA, из которого выпущен
# authelia-tls) — без этого HTTPS-вызовы к Authelia падают на "certificate signed by unknown
# authority" (см. helm/values/platform/namespaces/platform/gitea/values.yaml, первый стенд).
extraVolumes:
  - name: aicd-platform-ca
    secret:
      secretName: aicd-platform-ca
extraInitVolumeMounts:
  - name: aicd-platform-ca
    mountPath: /etc/ssl/certs/aicd-platform-ca.pem
    subPath: ca.pem
extraContainerVolumeMounts:
  - name: aicd-platform-ca
    mountPath: /etc/ssl/certs/aicd-platform-ca.pem
    subPath: ca.pem
deployment:
  env:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/aicd-platform-ca.pem

# SQLite — минимальная схема (нет отдельного требования к консистентности между несколькими
# подами Gitea, single-node k3s), без bundled Postgres/Redis subchart.
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
redis-cluster:
  enabled: false

persistence:
  enabled: true
  size: 10Gi
  storageClass: local-path

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

# Штатный k3s Traefik как ingress controller. TLS — сертификат из внутреннего PKI CA OpenBao
# (docs/adr/0016-openbao-secrets-pki.md §4), Secret gitea-tls создан
# platform/aicd-devops-labs-ru/ansible/site.yml (pki/issue/aicd-devops-labs-ru).
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: gitea.aicd.devops-labs.ru
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitea-tls
      hosts:
        - gitea.aicd.devops-labs.ru
