---
# platform/aicd-devops-labs-ru — второе, независимое окружение того же стека, что platform/aicd
# (ROADMAP.md, «Предлагаемая последовательность работ», пункт 7, Фаза 0;
# docs/adr/0012-cicd-platform-architecture.md §4/§5): K3s + OpenBao + Gitea + Semaphore UI + Flux
# + стандартные аддоны (docs/adr/0017-platform-cicd-default-addons.md), на Proxmox вместо
# libvirt, домен aicd.devops-labs.ru вместо aicd.platform. Тот же набор релизов/версий чартов,
# что helm/envs/platform.yaml — разница только в values (см.
# helm/values/platform-devops-labs-ru/namespaces/), которые резолвятся helmwave по
# K8S_CLUSTER=platform-devops-labs-ru (platform/aicd-devops-labs-ru/ansible/site.yml). Namespace
# "platform" — helmwave options.create_namespace: true создаёт его сам.
repositories: []
registries: []

releases:
  # docs/adr/0016-openbao-secrets-pki.md — секреты (KV) и внутренний PKI CA стенда. tags:
  # [openbao] — platform/aicd-devops-labs-ru/ansible/site.yml поднимает его первым отдельным
  # `helmwave up --tags openbao`, и только затем безусловным `helmwave up` — Gitea/Semaphore/Flux.
  - name: openbao
    namespace: platform
    chart: openbao/openbao
    tags: [openbao]
    version: 0.29.2

  # docs/adr/0018-internal-caching-proxy.md — кеширующий прокси (Nexus Repository OSS), тот же
  # приём, что helm/envs/platform.yaml.
  - name: nexus
    namespace: cache
    chart: localrepo/universal-chart
    version: 2.8.1

  # depends_on: authelia — ADR-0013 §7: init-контейнер configure-gitea делает HTTPS-вызов к
  # Authelia на каждом старте, нужна её готовность (Pod Ready) раньше.
  - name: gitea
    namespace: platform
    chart: gitea-charts/gitea
    depends_on:
      - name: authelia
    version: 11.0.0

  # depends_on: authelia — тот же принцип, что у gitea выше (обмен OIDC-токеном при логине).
  - name: semaphore
    namespace: platform
    chart: localrepo/universal-chart
    depends_on:
      - name: authelia
    version: 2.8.1

  # docs/adr/0012-cicd-platform-architecture.md §4, docs/adr/0022-new-component-requirements.md
  # §12 — тот же приём и то же обоснование, что helm/envs/platform.yaml (первый стенд):
  # применяется отдельным поздним `helmwave up --tags gitea-actions-runner`
  # (platform_aicd_devops_labs_ru_gitea_actions_runner_enabled), не в общем combined-вызове.
  - name: gitea-actions-runner
    namespace: platform
    chart: localrepo/universal-chart
    depends_on:
      - name: gitea
    version: 2.8.1

  - name: flux2
    namespace: flux-system
    chart: fluxcd-community/flux2
    version: 2.19.0

  # docs/adr/0017-platform-cicd-default-addons.md — стандартный набор аддонов, тот же, что
  # platform/aicd (без расхождений между окружениями).
  - name: radar
    namespace: platform
    chart: skyhook/radar
    version: 1.11.0

  # docs/adr/0017-platform-cicd-default-addons.md §3 — второй стандартный аддон, тот же, что
  # helm/envs/platform.yaml (без расхождений между окружениями).
  - name: infra-panel
    namespace: platform
    chart: localrepo/universal-chart
    version: 2.8.1

  # docs/adr/0024-platform-docs-site.md — тот же приём, что helm/envs/platform.yaml (без
  # расхождений между окружениями, кроме домена в values.yaml).
  - name: docs-site
    namespace: platform
    chart: localrepo/universal-chart
    version: 2.8.1

  # ADR-0013 — единая авторизация, тот же приём, что helm/envs/platform.yaml (без расхождений
  # между окружениями).
  - name: authelia
    namespace: platform
    chart: localrepo/universal-chart
    version: 2.8.1

  # docs/adr/0017-platform-cicd-default-addons.md — третий стандартный аддон, тот же приём, что
  # helm/envs/platform.yaml. extra-objects.yaml — единственное расхождение между окружениями:
  # VMPodScrape на dcgm-exporter (ADR-0015, GPU-нода llm1 существует только здесь).
  - name: vm
    namespace: monitoring
    chart: vm/victoria-metrics-k8s-stack
    version: 0.69.0
    depends_on:
      - name: grafana-operator
    values:
      - vmsingle.yaml
      - grafana.yaml
      - extra-objects.yaml

  # grafana-operator + Grafana CR, тот же приём, что helm/envs/platform.yaml (без расхождений
  # между окружениями).
  - name: grafana-operator
    namespace: monitoring
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.22.0

  # ADR-0015 §6/§7, ADR-0021 §8 — LiteLLM-гейтвей перед локальным инференсом (llama-server/TEI
  # в namespace llm, ADR-0021, нода llm1). Тот же generic-чарт, что nexus/semaphore/authelia/
  # infra-panel выше — у LiteLLM нет официального чарта, подходящего под этот же паттерн
  # (values.yaml собирает ConfigMap/Deployment/Service из простых декларативных полей, секрет —
  # тем же gomplate vault:// приёмом). tags: [litellm] в отдельном `helmwave up` (см. site.yml,
  # play "ADR-0021" в конце файла) — ПОСЛЕ того, как llama-server/TEI подняты задачами того же
  # play, а не вместе с безусловным `helmwave up` Gitea/Semaphore/... выше по этому файлу (тот
  # раньше во времени прогона, чем существуют namespace llm и его сервисы).
  - name: litellm
    namespace: gateway
    chart: localrepo/universal-chart
    tags: [litellm]
    version: 2.8.1

  # ROADMAP.md №65 — Open WebUI, чат-фронтенд человека-оператора поверх уже работающего
  # LiteLLM-гейтвея. Тот же generic-чарт, что nexus/semaphore/authelia/infra-panel/litellm выше —
  # у Open WebUI тоже нет официального чарта под этот паттерн, применимого без нарушения ADR-0022
  # §1 (Nexus helm-proxy всё ещё не включён). tags: [openwebui] в отдельном `helmwave up` (play
  # "ROADMAP.md №65 — Open WebUI" в конце site.yml) — ПОСЛЕ того, как litellm-под готов (минтинг
  # virtual key через k8s_exec зависит от него), не вместе с безусловным `helmwave up` выше.
  - name: openwebui
    namespace: platform
    chart: localrepo/universal-chart
    tags: [openwebui]
    version: 2.8.1
