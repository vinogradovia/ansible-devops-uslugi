---
# platform/aicd (ROADMAP.md, «Предлагаемая последовательность работ», пункт 7, Фаза 0;
# docs/adr/0012-cicd-platform-architecture.md §4/§5) — Gitea (self-hosted git, источник
# Module-манифестов) + Semaphore UI (исполнитель Task Template) на одной K3s-ноде. Namespace
# "platform" для всех релизов ниже — helmwave options.create_namespace: true (helmwave.yml.tpl)
# создаёт его сам, отдельная задача в site.yml не нужна (в отличие от roles/monitoring_server, где
# namespace создаётся явно через kubernetes.core.k8s — там же заводится Grafana-секрет, здесь
# эквивалента нет).
repositories: []
registries: []

releases:
  # docs/adr/0016-openbao-secrets-pki.md — секреты (KV) и внутренний PKI CA стенда. Admin-креды
  # Gitea/Semaphore ниже читаются gomplate-датасорсом vault:// из этого релиза, а не заданы
  # прямо в values — поэтому tags: [openbao] и первым в списке: platform/aicd/ansible/site.yml
  # поднимает его отдельным `helmwave up --tags openbao` (init/unseal/наполнение секретов через
  # ansible), и только затем — безусловным `helmwave up` разворачивает Gitea/Semaphore/Flux,
  # которым к этому моменту OpenBao уже отвечает.
  - name: openbao
    namespace: platform
    chart: openbao/openbao
    tags: [openbao]
    version: 0.29.2

  # docs/adr/0018-internal-caching-proxy.md — кеширующий прокси (Nexus Repository OSS),
  # инфраструктурная зависимость для остальных релизов (снижает частоту обращений наружу за
  # Docker/OCI-образами), поэтому в platform_aicd_core_releases, а не в опциональных аддонах, и
  # намеренно перед gitea/semaphore ниже — их собственные образы уже могут пойти через кеш
  # (registries.yaml настраивается тем же прогоном site.yml, что и этот релиз).
  - name: nexus
    namespace: cache
    chart: localrepo/universal-chart
    version: 2.8.1

  # depends_on: authelia — найдено реальным прогоном (ADR-0013): init-контейнер configure-gitea
  # делает `gitea admin auth add-oauth --auto-discover-url https://sso.aicd.platform/...` при
  # каждом старте; без явного depends_on helmwave не гарантирует, что Authelia (и её
  # IngressRoute у Traefik) уже готова к этому моменту — Gitea уходил в CrashLoopBackOff
  # (пробовал резолвить ещё не задеплоенный sso.aicd.platform / получал TLS-сертификат
  # дефолтного хоста Traefik, если у него ещё нет маршрута на этот Host). helmwave.yml.tpl уже
  # ставит wait: true каждому релизу — depends_on гарантирует, что Authelia будет не просто
  # применена, а полностью готова (Pod Ready) раньше, чем стартует Gitea.
  - name: gitea
    namespace: platform
    chart: gitea-charts/gitea
    depends_on:
      - name: authelia
    # Версия не проверена реальным прогоном (нет ещё поднятой VM на момент написания) — сверить
    # актуальную стабильную версию чарта на https://gitea.com/gitea/helm-gitea перед первым
    # applyем и поправить при необходимости.
    version: 11.0.0

  # Официального Helm-чарта Semaphore UI (semaphoreui.com) на момент написания не найдено —
  # используем тот же приём, что уже применён для homer (envs/k3s-monitoring.yaml): голый
  # Deployment/Service/PVC/IngressRoute через nxs-universal-chart, распакованный локально в
  # helm/localrepo/universal-chart/ (packed .tgz не годится — helmwave безусловно прогоняет
  # `helm dependency update`, а Helm отказывается делать это для запакованных чартов).
  # depends_on: authelia — тот же принцип, что у gitea выше: Semaphore обменивается OIDC-токеном
  # с Authelia при логине (server-to-server, из своего пода), тоже нуждается в уже готовом
  # sso.aicd.platform.
  - name: semaphore
    namespace: platform
    chart: localrepo/universal-chart
    depends_on:
      - name: authelia
    version: 2.8.1

  # Фаза 2 (ROADMAP.md, пункт 7; docs/adr/0014-platform-controller-architecture.md §4) — Flux
  # выбран вместо ArgoCD (CRD-first, без второго web UI, легче для одной ноды). Namespace
  # flux-system — конвенция апстрима (не "platform", в отличие от Gitea/Semaphore выше), чтобы
  # не расходиться с документацией/CLI flux при последующей отладке.
  - name: flux2
    namespace: flux-system
    chart: fluxcd-community/flux2
    version: 2.19.0

  # docs/adr/0017-platform-cicd-default-addons.md — первый стандартный аддон k3s-стенда,
  # набор которых по умолчанию управляется platform_aicd_default_addons/_extra_addons/
  # _disabled_addons (platform/aicd/ansible/group_vars/platform_hosts.yml) и передаётся в
  # `helmwave up --tags` вторым вызовом (platform/aicd/ansible/site.yml). Radar
  # (https://github.com/skyhook-io/radar) — open-source Kubernetes UI: топология, ресурсы,
  # Helm/GitOps-диагностика. Basic-auth и TLS — не встроены в чарт, заводятся ansible'ом
  # (site.yml) тем же приёмом, что уже применён для infra_panel/reverse_proxy_traefik.
  - name: radar
    namespace: platform
    chart: skyhook/radar
    version: 1.11.0

  # docs/adr/0017-platform-cicd-default-addons.md §3 — второй стандартный аддон: дашборд-стартовая
  # страница со ссылками на все веб-UI платформы (Gitea/Semaphore/Radar/OpenBao). Официального
  # чарта homer нет — тот же приём localrepo/universal-chart, что уже применён для Semaphore выше
  # и для примера в envs/k3s-monitoring.yaml. Release name — "infra-panel" (дефис, не "infra_panel"
  # как называется одноимённая роль/ADR-0008) — подчёркивание сломало бы RFC-1123 имена k8s-объектов,
  # которые universal-chart генерирует как "<release>-<key>".
  - name: infra-panel
    namespace: platform
    chart: localrepo/universal-chart
    version: 2.8.1

  # ADR-0013 — единая авторизация: Authelia (OIDC-провайдер + forwardAuth перед infra-panel/radar),
  # федерирована с persistent freeipa этого же окружения по LDAP (platform/aicd/terraform/
  # freeipa-target.tf, platform/aicd/ansible/site.yml). Официального Helm-чарта Authelia нет —
  # тот же приём localrepo/universal-chart, что уже применён для Semaphore/infra-panel выше (ADR-0013
  # ревизия §3 фиксирует отход от изначально предполагавшейся отдельной ansible-роли в пользу этого,
  # уже устоявшегося для платформенной инфраструктуры паттерна). Release name — "authelia" (без
  # изменений, RFC-1123-совместим как есть).
  - name: authelia
    namespace: platform
    chart: localrepo/universal-chart
    version: 2.8.1

  # docs/adr/0017-platform-cicd-default-addons.md — третий стандартный аддон: мониторинг
  # (VictoriaMetrics Operator + VMSingle/VMAgent), урезанная версия референсного стека
  # helm/envs/k3s-monitoring.yaml (docs/adr/0007-monitoring-server-role.md §6/§11) — без
  # vmalert/alertmanager/Loki/grafana-alloy (см. ADR-0017 «Почему не roles/monitoring_server» —
  # тот стек рассчитан на приём метрик с внешних agent-хостов, здесь нужен только
  # self-мониторинг этого же кластера). grafana-operator должен быть готов раньше — этот релиз
  # через defaultDatasources.grafanaOperator создаёт GrafanaDatasource (CRD grafana.integreatly.org,
  # см. ADR-0007 §6 про гонку на CRD без depends_on).
  - name: vm
    namespace: monitoring
    chart: vm/victoria-metrics-k8s-stack
    version: 0.69.0
    depends_on:
      - name: grafana-operator
    values:
      - vmsingle.yaml
      - grafana.yaml
      - extra-objects.yaml

  # grafana-operator + Grafana CR — native OIDC через Authelia (не forwardAuth, Grafana умеет
  # OIDC сама, ADR-0017). client_secret читается gomplate vault:// из secret/authelia
  # (grafana_client_secret) — тот же путь, что уже открыт scoped-политике
  # aicd-platform-render для gitea/semaphore выше, менять политику не нужно.
  - name: grafana-operator
    namespace: monitoring
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.22.0
