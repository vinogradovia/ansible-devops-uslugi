---
# platform/aicd (ROADMAP.md, «Предлагаемая последовательность работ», пункт 7, Фаза 0;
# docs/adr/0012-cicd-platform-architecture.md §4/§5) — Gitea (self-hosted git, источник
# Module-манифестов) + Semaphore UI (исполнитель Task Template) на одной K3s-ноде. Namespace
# "platform" для всех релизов ниже — helmwave options.create_namespace: true (helmwave.yml.tpl)
# создаёт его сам, отдельная задача в site.yml не нужна (в отличие от roles/monitoring_server, где
# namespace создаётся явно через kubernetes.core.k8s — там же заводится Grafana-секрет, здесь
# эквивалента нет).
repositories: []
registries: []

releases:
  # docs/adr/0016-openbao-secrets-pki.md — секреты (KV) и внутренний PKI CA стенда. Admin-креды
  # Gitea/Semaphore ниже читаются gomplate-датасорсом vault:// из этого релиза, а не заданы
  # прямо в values — поэтому tags: [openbao] и первым в списке: platform/aicd/ansible/site.yml
  # поднимает его отдельным `helmwave up --tags openbao` (init/unseal/наполнение секретов через
  # ansible), и только затем — безусловным `helmwave up` разворачивает Gitea/Semaphore/Flux,
  # которым к этому моменту OpenBao уже отвечает.
  - name: openbao
    namespace: platform
    chart: openbao/openbao
    tags: [openbao]
    version: 0.29.2

  - name: gitea
    namespace: platform
    chart: gitea-charts/gitea
    # Версия не проверена реальным прогоном (нет ещё поднятой VM на момент написания) — сверить
    # актуальную стабильную версию чарта на https://gitea.com/gitea/helm-gitea перед первым
    # applyем и поправить при необходимости.
    version: 11.0.0

  # Официального Helm-чарта Semaphore UI (semaphoreui.com) на момент написания не найдено —
  # используем тот же приём, что уже применён для homer (envs/k3s-monitoring.yaml): голый
  # Deployment/Service/PVC/IngressRoute через nxs-universal-chart, распакованный локально в
  # helm/localrepo/universal-chart/ (packed .tgz не годится — helmwave безусловно прогоняет
  # `helm dependency update`, а Helm отказывается делать это для запакованных чартов).
  - name: semaphore
    namespace: platform
    chart: localrepo/universal-chart
    version: 2.8.1

  # Фаза 2 (ROADMAP.md, пункт 7; docs/adr/0014-platform-controller-architecture.md §4) — Flux
  # выбран вместо ArgoCD (CRD-first, без второго web UI, легче для одной ноды). Namespace
  # flux-system — конвенция апстрима (не "platform", в отличие от Gitea/Semaphore выше), чтобы
  # не расходиться с документацией/CLI flux при последующей отладке.
  - name: flux2
    namespace: flux-system
    chart: fluxcd-community/flux2
    version: 2.19.0

  # docs/adr/0017-platform-cicd-default-addons.md — первый стандартный аддон k3s-стенда,
  # набор которых по умолчанию управляется platform_aicd_default_addons/_extra_addons/
  # _disabled_addons (platform/aicd/ansible/group_vars/platform_hosts.yml) и передаётся в
  # `helmwave up --tags` вторым вызовом (platform/aicd/ansible/site.yml). Radar
  # (https://github.com/skyhook-io/radar) — open-source Kubernetes UI: топология, ресурсы,
  # Helm/GitOps-диагностика. Basic-auth и TLS — не встроены в чарт, заводятся ansible'ом
  # (site.yml) тем же приёмом, что уже применён для infra_panel/reverse_proxy_traefik.
  - name: radar
    namespace: platform
    chart: skyhook/radar
    version: 1.11.0
