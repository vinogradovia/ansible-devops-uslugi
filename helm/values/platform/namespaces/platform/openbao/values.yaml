# OpenBao (docs/adr/0016-openbao-secrets-pki.md) — секреты (KV v2) и внутренний PKI CA стенда
# platform/aicd. Официальный чарт openbao/openbao — https://openbao.github.io/openbao-helm.
#
# integrated storage (raft), НЕ dev-режим (server.dev.enabled — все данные в памяти, исчезают
# при каждом рестарте пода, неприемлемо для персистентной инфраструктуры). server.ha.raft с
# replicas: 1 — единственный способ чарта включить raft integrated storage (исторически
# унаследовано из upstream Vault Helm chart: "HA-режим" здесь означает "raft backend", а не
# обязательно несколько реплик) — тот же масштаб, что весь стенд (одна K3s-нода).
#
# service.type: NodePort — control-хост (где запускается helmwave/gomplate, delegate_to:
# localhost в platform/aicd/ansible/site.yml) не имеет маршрута к ClusterIP-адресам сервисов
# k3s (только к реальному IP ноды, как и kube-apiserver, см. подмену 127.0.0.1 на реальный IP в
# site.yml) — NodePort даёт стабильный `<node-ip>:30820` для VAULT_ADDR/ansible.builtin.uri.
#
# TLS на самом listener'е OpenBao (docs/adr/0016-openbao-secrets-pki.md §5) — bootstrap
# self-signed сертификат (community.crypto, генерируется в site.yml до первого `helmwave up`,
# т.к. монтируется в под через Secret openbao-server-tls/server.extraVolumes), НЕ сертификат,
# выпущенный собственным PKI engine самого OpenBao — на момент старта пода PKI ещё не
# инициализирован (курица/яйцо: чтобы выпустить сертификат из pki/issue, нужен уже
# распечатанный OpenBao с включённым PKI, а слушать TLS-порт он должен с самого первого старта).
# global.tlsDisable: false переключает и listener, и readinessProbe/livenessProbe (helper
# openbao.scheme), и BAO_ADDR/BAO_API_ADDR внутри пода на https — правки runtime-кода не нужны.
# configAnnotation: true — иначе смена server.ha.raft.config (ConfigMap) не перезапускает под
# автоматически (под каждый раз читает конфиг только при старте).
#
# server.ingress / server.service.annotations (docs/adr/0017-platform-cicd-default-addons.md §3)
# — публикация UI OpenBao через Traefik (openbao.aicd.platform), в дополнение к уже существующему
# NodePort (тот остаётся единственным маршрутом для control-хоста, helmwave/gomplate/ansible.uri в
# site.yml его не заменяют). Backend слушает TLS без alternative-плейна (global.tlsDisable: false)
# самоподписанным bootstrap-сертификатом openbao-server-tls — Service уже проставляет
# appProtocol: HTTPS на этот порт (чарт, openbao.scheme), поэтому Traefik сам решает идти в
# backend по HTTPS, но не доверяет самоподписанному сертификату без явного ServersTransport.
# ServersTransport openbao-insecure-backend (insecureSkipVerify: true) заводится
# platform/aicd/ansible/site.yml (kubernetes.core.k8s, тот же приём, что Middleware
# radar-basic-auth) — аннотация ссылается на него по имени
# "<namespace>-<имя>@kubernetescrd", как и router.middlewares у Radar/infra-panel, но здесь это
# аннотация SERVICE, а не Ingress (так documented для service.serverstransport в Traefik).
#
# Basic-auth перед OpenBao НЕ заводится — OpenBao аутентифицирует сам себя (root token/policy),
# тот же принцип, что уже применён к Gitea/Semaphore (см. их values.yaml).
#
# Secret openbao-ingress-tls — отдельный от openbao-server-tls (тот остаётся внутренним
# bootstrap-сертификатом самого listener'а) сертификат из внутреннего PKI CA, выпущенный тем же
# циклом tasks/issue-tls-cert.yml, что gitea-tls/semaphore-tls/radar-tls/infra-panel-tls.
#
# Известный bootstrap-нюанс: server.ingress применяется первым `helmwave up --tags openbao` — ДО
# того, как в рамках блока "OpenBao: bootstrap" в site.yml будет выпущен openbao-ingress-tls. На
# самом первом прогоне Ingress на несколько секунд ссылается на ещё не существующий Secret —
# Traefik сам подхватывает его, как только тот появляется в рамках того же прогона (тот же класс
# "eventually consistent", что уже документирован для Traefik CRD/IngressRoute выше по коллекции).

injector:
  enabled: false

global:
  tlsDisable: false

server:
  configAnnotation: true

  service:
    type: NodePort
    nodePort: 30820
    annotations:
      traefik.ingress.kubernetes.io/service.serverstransport: platform-openbao-insecure-backend@kubernetescrd

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: openbao.aicd.platform
        paths:
          - /
    tls:
      - secretName: openbao-ingress-tls
        hosts:
          - openbao.aicd.platform

  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path

  # Secret openbao-server-tls (kubernetes.io/tls) создаётся ansible ДО первого `helmwave up
  # --tags openbao` (namespace platform создаётся тем же ansible, ещё до релиза чарта) —
  # монтируется чартом в /openbao/userconfig/openbao-server-tls/{tls.crt,tls.key}.
  extraVolumes:
    - type: secret
      name: openbao-server-tls

  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      # Полная замена дефолтного конфига чарта (только listener отличается — добавлены
      # tls_cert_file/tls_key_file, убран tls_disable) — остальное 1:1 с upstream-дефолтом
      # (ui, storage "raft", service_registration "kubernetes").
      config: |
        ui = true

        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/openbao/userconfig/openbao-server-tls/tls.crt"
          tls_key_file = "/openbao/userconfig/openbao-server-tls/tls.key"
        }

        storage "raft" {
          path = "/openbao/data"
        }

        service_registration "kubernetes" {}
