# infra-panel (homer, https://github.com/bastienwirtz/homer) — второй стандартный аддон
# (docs/adr/0017-platform-cicd-default-addons.md §3): дашборд-стартовая страница со ссылками на
# все веб-UI платформы. Официального чарта homer нет — развёрнут через nxs-universal-chart
# (helm/localrepo/universal-chart), тем же приёмом, что уже применён для Semaphore
# (helm/values/platform/namespaces/platform/semaphore/values.yaml) и для иллюстративного примера
# в helm/values/k3s-monitoring/namespaces/monitoring/homer/values.yaml.
#
# Вход защищён forwardAuth-Middleware Authelia (ADR-0013 §4, authelia-forward-auth,
# platform/aicd/ansible/site.yml) — заменяет прежний basic-auth Middleware
# (infra-panel-basic-auth/secret/infra-panel не удалены, просто больше ни на что не влияют,
# ADR-0017 §1). В отличие от иллюстративного примера в
# helm/values/k3s-monitoring/namespaces/monitoring/homer/values.yaml — basic-auth здесь никогда
# не хардкодился в values (там `admin:admin` — намеренно небезопасный плейсхолдер для демонстрации).
#
# TLS — Secret infra-panel-tls, выпущен из внутреннего PKI CA OpenBao тем же циклом
# (tasks/issue-tls-cert.yml), что gitea-tls/semaphore-tls/radar-tls.

configMaps:
  config:
    data:
      config.yml: |
        title: "Infra Panel"
        subtitle: "aicd.platform"
        columns: "3"
        connectivityCheck: false
        # Gitea/Semaphore — ссылки ведут не на обычную страницу логина сервиса, а сразу на
        # эндпоинт, инициирующий OIDC-флоу через Authelia, минуя промежуточный клик по кнопке
        # "Sign in with Authelia" (найдено чтением исходников — свой login-роут у каждого сервиса,
        # эндпоинт callback в identity_providers.oidc.clients[].redirect_uris у authelia/values.yaml
        # уже был настроен именно на этот же путь):
        #   Gitea: routers/web/web.go, m.Group("/oauth2", ...).Get("/{provider}", auth.SignInOAuth)
        #     — provider здесь имя auth source ("authelia" из gitea admin auth add-oauth --name).
        #   Semaphore: api/router.go, publicAPIRouter.HandleFunc("/auth/oidc/{provider}/login", ...)
        #     — provider здесь id клиента ("authelia" из SEMAPHORE_OIDC_PROVIDERS).
        # Если пользователь ещё не залогинен в Authelia, редирект на форму логина SSO происходит
        # автоматически на этом же шаге — отдельно нажимать что-либо на самом Gitea/Semaphore не
        # нужно.
        services:
          - name: Platform
            items:
              - name: Gitea
                url: https://gitea.aicd.platform/user/oauth2/authelia
                target: _blank
              - name: Semaphore
                url: https://semaphore.aicd.platform/api/auth/oidc/authelia/login
                target: _blank
              - name: Radar
                url: https://radar.aicd.platform
                target: _blank
              # docs/adr/0024-platform-docs-site.md
              - name: Docs
                url: https://docs.aicd.platform
                target: _blank
              - name: OpenBao
                url: https://openbao.aicd.platform
                target: _blank
              - name: FreeIPA
                url: https://ipa.aicd.platform/ipa/ui/
                target: _blank
              - name: SSO (Authelia)
                url: https://sso.aicd.platform/
                target: _blank
              # docs/adr/0017 §4 — тот же приём auto-redirect на OIDC-логин, что Gitea/Semaphore
              # выше (Grafana login route generic_oauth инициирует OIDC-флоу через Authelia сразу).
              - name: Grafana
                url: https://grafana.aicd.platform/login/generic_oauth
                target: _blank
              # docs/adr/0018 — Nexus логинится по LDAP собственной формой (не OIDC-редирект, как
              # Gitea/Semaphore/Grafana выше) — ссылка на обычный корень UI.
              - name: Nexus
                url: https://nexus.aicd.platform/
                target: _blank

deployments:
  infra-panel:
    # config.yml монтируется ниже через configMap + subPath — kubelet НЕ перемонтирует
    # subPath-файл живому поду при изменении ConfigMap (в отличие от обычного volume mount на
    # директорию), поэтому без принудительного рестарта уже работающий под продолжает работать
    # со старым конфигом сколько угодно после `helmwave up`, который сам покажет "changed" и
    # ничего не заподозрит (найдено живым прогоном — под пропустил новую ссылку "Docs" из
    # docs/adr/0024-platform-docs-site.md, пришлось пересоздавать вручную). Тот же фикс, что уже
    # применён к authelia/litellm — checksum-аннотация форсирует rolling restart при любом
    # изменении содержимого configMaps.config.data.
    podAnnotations:
      checksum/config: '{{ include "helpers.workload.checksum" $.Values.configMaps.config.data }}'
    containers:
      - name: homer
        image: b4bz/homer
        imageTag: v26.4.2
        env:
          # config.yml уже приходит через ConfigMap (volumeMounts ниже) — отключаем
          # entrypoint-скрипт образа, который иначе при пустом /www/assets разворачивает туда
          # набор примеров.
          - name: INIT_ASSETS
            value: "0"
        ports:
          - name: http
            containerPort: 8080
        volumeMounts:
          # subPath, а не монтирование всего /www/assets — иначе перекрывается остальное
          # содержимое каталога (кастомные иконки и т.п.), нужен только сам файл.
          - name: config
            mountPath: /www/assets/config.yml
            subPath: config.yml
    volumes:
      - name: config
        type: configMap

services:
  infra-panel:
    ports:
      - name: http
        port: 8080

ingressroutes:
  infra-panel:
    entryPoints:
      - websecure
    routes:
      "Host(`infra-panel.aicd.platform`)":
        middlewares:
          - name: authelia-forward-auth
        services:
          infra-panel-infra-panel:
            port: 8080
    tls:
      secretName: infra-panel-tls
