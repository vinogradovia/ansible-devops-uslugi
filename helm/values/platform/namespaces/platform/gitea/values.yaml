# Gitea (https://gitea.com) — self-hosted git, источник Module-манифестов/inventory для
# платформенного контроллера (docs/adr/0014-platform-controller-architecture.md §4,
# docs/adr/0012-cicd-platform-architecture.md §4). Официальный чарт gitea-charts/gitea.
#
# Проверено реальным прогоном (platform/aicd/README.md, «Проверено реальным прогоном»): под
# Running, PVC Bound, HTTP 200 через встроенный k3s Traefik.
#
# admin.password — читается из OpenBao (docs/adr/0016-openbao-secrets-pki.md) через gomplate
# datasource vault://, а не задан прямым текстом — сгенерирован один раз
# platform/aicd/ansible/site.yml при первом прогоне, при повторных прогонах не меняется. ВНИМАНИЕ:
# этот файл целиком — gomplate-шаблон с делимитерами "квадратная скобка дважды" вместо Jinja-фигурных
# (см. helm/helmwave.yml.tpl, delimiter_left/right для values-файлов релизов), рендерится
# helmwave/gomplate, не ansible — не используйте парные квадратные скобки нигде в этом файле, даже
# в комментариях (gomplate шаблонизирует файл целиком, включая комментарии).
#
# defineDatasource/ds, не двухаргументный datasource("имя", "путь") — helmwave не регистрирует
# алиасы датасорсов через CLI-флаг (в отличие от чистого gomplate-бинаря), их нужно объявить
# прямо в шаблоне (docs.helmwave.app, «HashiCorp Vault»). Путь — "secret/data/gitea" (не
# "secret/gitea") — обязательный префикс "data/" для KV v2 engine, тот же путь на низком уровне
# API, что platform/aicd/ansible/site.yml использует в /v1/secret/data/gitea.
[[ defineDatasource "vault" "vault:///secret/data/gitea" ]]
gitea:
  admin:
    username: gitea_admin
    password: '[[ (ds "vault").data.admin_password ]]'
    email: gitea_admin@aicd.platform
  config:
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    # Найдено реальным прогоном (platform/aicd-devops-labs-ru): без ENABLE_AUTO_REGISTRATION
    # (дефолт Gitea — false) первый логин через OIDC для личности, у которой ещё нет локального
    # аккаунта Gitea, молча проваливается (редирект на /user/login без единой строки ошибки в
    # логах) — freeipa не заводит пользователей заранее (ADR-0011), поэтому без этого флага
    # OIDC-вход неюзабелен ни для одного реального пользователя каталога.
    oauth2_client:
      ENABLE_AUTO_REGISTRATION: true
  # ADR-0013 §5 — нативный OIDC-логин через Authelia. Декларативно, штатным механизмом самого
  # чарта (templates/gitea/init.yaml, function configure_oauth) — идемпотентно, чарт сам проверяет
  # `gitea admin auth list` и делает add-oauth/update-oauth в зависимости от результата, отдельный
  # ansible-код не нужен. secret — plaintext (gitea_client_secret из secret/authelia, отдельное
  # поле от gitea_client_secret_hash, который нужен только конфигу самой Authelia).
  oauth:
    - name: authelia
      provider: openidConnect
      key: gitea
      secret: '[[ (ds "vault").data.gitea_client_secret ]]'
      autoDiscoverUrl: https://sso.aicd.platform/.well-known/openid-configuration

# strategy.type: Recreate — найдено реальным прогоном (первый helm upgrade Gitea после Фазы 0,
# смена admin.password/ingress.tls): дефолтный RollingUpdate чарта создаёт новый под ДО остановки
# старого, а оба пода делят один PVC (gitea-shared-storage, RWO) и один и тот же on-disk
# leveldb-файл очереди (config.queue.TYPE: level выше) — новый под падает в CrashLoopBackOff
# ("unable to lock level db at /data/queues/common: resource temporarily unavailable"), а старый
# не завершается, пока новый не станет Ready — гарантированный deadlock при любом будущем
# изменении values, не специфично для OpenBao/этого коммита.
strategy:
  type: Recreate

# ADR-0013 §5 — доверие к внутреннему PKI CA OpenBao (тот же CA, из которого выпущен
# authelia-tls). Найдено реальным прогоном: без этого init-контейнер configure-gitea падал на
# "certificate signed by unknown authority" при HTTPS-обращении к https://sso.aicd.platform для
# настройки OIDC-источника — Go-клиент внутри образа не знает о внутреннем CA. Secret
# aicd-platform-ca заведён platform/aicd/ansible/site.yml (pki/ca/pem, публичный, не секрет).
# SSL_CERT_FILE указывает ТОЛЬКО на наш CA (не объединён с системным бандлом) — сознательное
# упрощение: у этого инстанса Gitea сейчас нет других внешних HTTPS-обращений, для которых
# понадобилось бы доверие публичным CA.
extraVolumes:
  - name: aicd-platform-ca
    secret:
      secretName: aicd-platform-ca
extraInitVolumeMounts:
  - name: aicd-platform-ca
    mountPath: /etc/ssl/certs/aicd-platform-ca.pem
    subPath: ca.pem
extraContainerVolumeMounts:
  - name: aicd-platform-ca
    mountPath: /etc/ssl/certs/aicd-platform-ca.pem
    subPath: ca.pem
deployment:
  env:
    - name: SSL_CERT_FILE
      value: /etc/ssl/certs/aicd-platform-ca.pem

# SQLite — минимальная схема для Фазы 0 (нет отдельного требования к консистентности между
# несколькими подами Gitea, single-node k3s), без bundled Postgres/Redis subchart.
postgresql:
  enabled: false
postgresql-ha:
  enabled: false
redis-cluster:
  enabled: false

persistence:
  enabled: true
  size: 10Gi
  storageClass: local-path

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
    port: 22

# Штатный k3s Traefik как ingress controller (не reverse_proxy_traefik этой коллекции — тот
# работает в Docker на других стендах, это другой физический инстанс внутри k8s-кластера).
# TLS — сертификат из внутреннего PKI CA OpenBao (docs/adr/0016-openbao-secrets-pki.md §4),
# Secret gitea-tls создан platform/aicd/ansible/site.yml (pki/issue/aicd-platform).
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: gitea.aicd.platform
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: gitea-tls
      hosts:
        - gitea.aicd.platform
