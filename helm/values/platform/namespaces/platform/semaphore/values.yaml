# Semaphore UI (https://semaphoreui.com) — исполнитель Task Template
# (docs/adr/0012-cicd-platform-architecture.md §5, docs/adr/0014-platform-controller-architecture.md
# §2). Официального Helm-чарта на момент написания не найдено — развёрнут через
# nxs-universal-chart (helm/localrepo/universal-chart), тем же приёмом, что уже применён для
# homer в helm/envs/k3s-monitoring.yaml (helm/values/k3s-monitoring/namespaces/monitoring/homer/
# values.yaml) — голый Deployment/PVC/Service/IngressRoute вместо отдельного чарта.
#
# Проверено реальным прогоном (platform/aicd/README.md, «Проверено реальным прогоном»): под
# Running, PVC Bound, HTTP 200 через IngressRoute (встроенный k3s Traefik). ЗНАЧИМАЯ находка
# этого прогона: IngressRoute рендерится только если Traefik CRD уже зарегистрирован в
# кластере — при первом `helmwave up` сразу после установки k3s CRD ещё не существовал (k3s
# разворачивает встроенный Traefik асинхронно), и Helm молча пропустил ресурс. Исправлено на
# уровне плейбука (platform/aicd/ansible/site.yml ждёт CRD перед helmwave up), не здесь.
#
# БД — bolt (встроенная, файл на persistent volume) — минимальная схема для Фазы 0, без
# отдельного Postgres. Admin-пароль и cookie/access-key секреты ниже читаются из OpenBao
# (docs/adr/0016-openbao-secrets-pki.md) через gomplate datasource vault:// — сгенерированы один
# раз platform/aicd/ansible/site.yml при первом прогоне, не меняются при повторных. ВНИМАНИЕ: этот
# файл целиком — gomplate-шаблон с делимитерами "квадратная скобка дважды" вместо Jinja-фигурных
# (см. helm/helmwave.yml.tpl, delimiter_left/right для values-файлов релизов), рендерится
# helmwave/gomplate, не ansible — не используйте парные квадратные скобки нигде в этом файле, даже
# в комментариях (gomplate шаблонизирует файл целиком, включая комментарии).
#
# imageTag v2.10.30 (Фаза 0) содержал апстрим-баг клонирования git-репозиториев по HTTP —
# "fatal: bad boolean environment value '0\n' for 'GIT_TERMINAL_PROMPT'" (semaphoreui/semaphore
# issue #3344/#982, исправлено PR #3343 "No newline after GIT_TERMINAL_PROMPT when constructing
# env vars"), из-за чего ЛЮБОЙ Task Template падал уже на этапе git clone, до запуска самого
# ansible-playbook — найдено реальным прогоном при отладке Фазы 3/4
# (platform-controller/README.md): даже тривиальный playbook без внешних зависимостей падал
# идентично. Обновлено на v2.19.8 (актуальная стабильная на момент находки).
#
# BoltDB (dialect "bolt") убран апстримом в этом промежутке версий ("BoltDB removed —
# SQLite/MySQL/Postgres only", semaphoreui.com changelog) — заменено на sqlite (dialect
# "sqlite", путь к файлу — SEMAPHORE_DB_HOST, а не SEMAPHORE_DB_PATH). Данные пилотного прогона
# (Фазы 0-4) при этом не мигрированы — старый bolt-файл на PVC просто не читается новой версией,
# для пилота это приемлемо (тестовые Project/Template/Task заводились по новой на sqlite), но
# заметьте при повторении: это потеря данных, а не просто смена драйвера.
#
# defineDatasource/ds, не двухаргументный datasource("имя", "путь") — helmwave не регистрирует
# алиасы датасорсов через CLI-флаг (в отличие от чистого gomplate-бинаря), их нужно объявить
# прямо в шаблоне (docs.helmwave.app, «HashiCorp Vault»). Путь — "secret/data/semaphore" (не
# "secret/semaphore") — обязательный префикс "data/" для KV v2 engine, тот же путь на низком
# уровне API, что platform/aicd/ansible/site.yml использует в /v1/secret/data/semaphore.
[[ defineDatasource "vault" "vault:///secret/data/semaphore" ]]

pvcs:
  data:
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: local-path

deployments:
  semaphore:
    containers:
      - name: semaphore
        image: semaphoreui/semaphore
        imageTag: v2.19.8
        env:
          - name: SEMAPHORE_DB_DIALECT
            value: sqlite
          - name: SEMAPHORE_DB_HOST
            value: /var/lib/semaphore/database.db
          - name: SEMAPHORE_ADMIN
            value: admin
          - name: SEMAPHORE_ADMIN_EMAIL
            value: admin@aicd.platform
          - name: SEMAPHORE_ADMIN_NAME
            value: Administrator
          - name: SEMAPHORE_ADMIN_PASSWORD
            value: '[[ (ds "vault").data.admin_password ]]'
          # Semaphore требует непустые валидные base64-значения при первом старте — сгенерированы
          # platform/aicd/ansible/site.yml один раз, хранятся в OpenBao (secret/semaphore).
          - name: SEMAPHORE_COOKIE_HASH
            value: '[[ (ds "vault").data.cookie_hash ]]'
          - name: SEMAPHORE_COOKIE_ENCRYPTION
            value: '[[ (ds "vault").data.cookie_encryption ]]'
          - name: SEMAPHORE_ACCESS_KEY_ENCRYPTION
            value: '[[ (ds "vault").data.access_key_encryption ]]'
        ports:
          - name: http
            containerPort: 3000
        volumeMounts:
          - name: data
            mountPath: /var/lib/semaphore
    volumes:
      - name: data
        type: pvc

services:
  semaphore:
    ports:
      - name: http
        port: 3000

# Semaphore аутентифицирует пользователей сам (встроенный логин, в отличие от homer — статической
# страницы без какой-либо аутентификации) — дополнительный basicAuth middleware здесь избыточен,
# в отличие от homer/values.yaml, где он обязателен.
#
# tls.secretName — сертификат из внутреннего PKI CA OpenBao (docs/adr/0016-openbao-secrets-pki.md
# §4), Secret semaphore-tls создан platform/aicd/ansible/site.yml (pki/issue/aicd-platform),
# вместо дефолтного самоподписанного `TRAEFIK DEFAULT CERT` (пустой tls: {} раньше).
ingressroutes:
  semaphore:
    entryPoints:
      - websecure
    routes:
      "Host(`semaphore.aicd.platform`)":
        services:
          semaphore-semaphore:
            port: 3000
    tls:
      secretName: semaphore-tls
