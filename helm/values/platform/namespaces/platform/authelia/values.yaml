# Authelia (https://www.authelia.com) — единая авторизация платформы (ADR-0013): OIDC-провайдер
# для сервисов, умеющих OIDC нативно (Semaphore, Gitea), и forwardAuth-шлюз перед панелями без
# собственного логина (infra-panel, radar). Официального Helm-чарта нет — развёрнут через
# nxs-universal-chart (helm/localrepo/universal-chart), тем же приёмом, что уже применён для
# Semaphore/infra-panel/radar (ADR-0013 ревизия §3 — Helm-релиз вместо изначально предполагавшейся
# отдельной ansible-роли, тот же принцип, что уже устоялся для остальной платформенной
# инфраструктуры этого стенда).
#
# Единый каталог — persistent freeipa этого же окружения (platform/aicd/terraform/freeipa-target.tf,
# platform/aicd/ansible/site.yml, play "Единая авторизация (ADR-0013): persistent freeipa") — LDAP
# implementation: freeipa (готовый пресет Authelia под FreeIPA, минимальный набор полей — см.
# https://www.authelia.com/integration/ldap/freeipa/). Bind-аккаунт svc-authelia создан тем же
# play'ем — обычный непривилегированный IPA-пользователь (ADR-0011 §3 — заведение пользователей
# каталога не входит в саму роль freeipa, поэтому bind-аккаунт заводится оркестрацией окружения).
#
# Секреты (jwt/session/storage-encryption/OIDC HMAC+RSA-ключ подписи/LDAP bind password/OIDC
# client secrets Gitea и Semaphore) — идемпотентно сгенерированы в OpenBao (secret/authelia,
# platform/aicd/ansible/site.yml, блок "OpenBao: bootstrap"), читаются через тот же gomplate
# datasource vault://, что уже применяется в semaphore/values.yaml и gitea/values.yaml. ВНИМАНИЕ:
# этот файл целиком — gomplate-шаблон с делимитерами "квадратная скобка дважды" вместо
# Jinja-фигурных (см. helm/helmwave.yml.tpl) — не используйте парные квадратные скобки нигде в
# этом файле, даже в комментариях.
#
# client_secret в identity_providers.oidc.clients — ОБЯЗАН быть pbkdf2-sha512-хэшем, не plaintext
# (Authelia отказывается стартовать с plaintext-значением в этом поле) — хэш посчитан тем же
# play'ем ("Authelia: посчитать pbkdf2-хэши client_secret...", authelia crypto hash generate) и
# сохранён в тот же secret/authelia отдельными полями (*_client_secret_hash) — сами потребители
# (Gitea CLI, SEMAPHORE_OIDC_PROVIDERS) получают plaintext-версию, не хэш.
#
# authorization_policy/access_control — one_factor (не two_factor): TOTP/WebAuthn enrollment
# потребовал бы интерактивной само-регистрации пользователя перед первым входом, что не
# автоматизировано этим ansible-контуром — задокументированный сознательный выбор MVP-охвата
# (см. docs/adr/0013-unified-auth-architecture.md), не забытая настройка.
#
# password_reset.disable: true — LDAP-backend Authelia умеет менять пароль пользователя через bind
# аккаунт, но svc-authelia (обычный непривилегированный IPA-пользователь, не выделенная
# password-change-политика) не имеет права менять чужие пароли в FreeIPA — предлагать
# "забыли пароль" пользователю, для которого это гарантированно не сработает, хуже, чем не
# предлагать вовсе.

[[ defineDatasource "vault" "vault:///secret/data/authelia" ]]

pvcs:
  data:
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: local-path

configMaps:
  config:
    data:
      configuration.yml: |
        theme: light
        default_2fa_method: totp

        server:
          address: 'tcp://:9091'

        log:
          level: info

        totp:
          issuer: aicd.platform

        authentication_backend:
          password_reset:
            disable: true
          ldap:
            implementation: 'freeipa'
            address: 'ldap://ipa.aicd.platform:389'
            base_dn: 'DC=aicd,DC=platform'
            user: 'UID=svc-authelia,CN=users,CN=accounts,DC=aicd,DC=platform'
            password: '[[ (ds "vault").data.ldap_bind_password ]]'

        access_control:
          default_policy: deny
          rules:
            - domain: 'sso.aicd.platform'
              policy: bypass
            - domain: 'infra-panel.aicd.platform'
              policy: one_factor
            - domain: 'radar.aicd.platform'
              policy: one_factor

        # default_redirection_url НЕ может совпадать с authelia_url (найдено реальным прогоном —
        # Authelia отказывается стартовать: "which is not permitted", иначе после логина
        # пользователя редиректило бы обратно на сам портал логина) — infra-panel как логичная
        # стартовая страница платформы после входа.
        session:
          secret: '[[ (ds "vault").data.session_secret ]]'
          cookies:
            - domain: 'aicd.platform'
              authelia_url: 'https://sso.aicd.platform'
              default_redirection_url: 'https://infra-panel.aicd.platform'

        storage:
          encryption_key: '[[ (ds "vault").data.storage_encryption_key ]]'
          local:
            path: /data/db.sqlite3

        notifier:
          disable_startup_check: true
          filesystem:
            filename: /data/notification.txt

        identity_validation:
          reset_password:
            jwt_secret: '[[ (ds "vault").data.jwt_secret ]]'

        identity_providers:
          oidc:
            hmac_secret: '[[ (ds "vault").data.oidc_hmac_secret ]]'
            jwks:
              # key — найдено реальным прогоном: strings.Indent непредсказуемо индентирует первую
              # строку многострочного PEM иначе, чем остальные (первая строка получала на 18
              # пробелов больше нужного) — YAML внутри вложенного "key: |" ломался. Вместо
              # индентации многострочного блока — конвертация в one-line double-quoted строку
              # (strings.ReplaceAll реальных переносов строк на литеральные "\n"), которую YAML
              # разворачивает обратно в настоящие переносы при парсинге — тот же результат, но без
              # риска несовпадения отступов.
              - key_id: 'main'
                algorithm: 'RS256'
                use: 'sig'
                key: "[[ (ds "vault").data.oidc_issuer_private_key | strings.ReplaceAll "\n" "\\n" ]]"
            # Найдено реальным прогоном (клик-тест логина, platform/aicd-devops-labs-ru): по
            # спецификации OIDC claims scope 'email' (email/email_verified) по умолчанию доступны
            # только через /userinfo, НЕ встраиваются в сам ID Token — и Semaphore (v2.19.8), и
            # Gitea читают claim 'email' именно из ID Token, не делают отдельный запрос к
            # userinfo, поэтому получали ошибку "claim 'email' missing or has bad format" несмотря
            # на то, что LDAP-атрибут mail реально существует и виден bind-аккаунту svc-authelia
            # (проверено ldapsearch). claims_policies — официальный механизм Authelia
            # (authelia.com/configuration/identity-providers/openid-connect/claims/) принудительно
            # скопировать claim'ы в ID Token сверх стандартного поведения.
            # docs/adr/0019-platform-rbac-model.md §4/§8 шаг 2 — claim 'groups' тем же приёмом,
            # что email/nickname выше: 'groups' — уже готовый common-атрибут (populated из LDAP
            # groups_filter пресета freeipa, authelia.com/integration/ldap/freeipa/ — memberOf/cn,
            # работает и без этого блока для access_control subject: ['group:...'], §5), но в
            # ID Token сам по себе не попадает — нужен custom_claims.groups.attribute: 'groups' в
            # каждой релевантной claims_policy (копирует уже вычисленный список групп в claim,
            # ничего заново не ищет в LDAP) + сам claim в id_token: ниже. Политики допуска
            # (authorization_policy/access_control) на этом шаге НЕ меняются — остаются
            # 'one_factor' (ADR-0019 §8, шаг 2 из 5: сначала данные видны в токене, ужесточение —
            # отдельным, последним шагом).
            claims_policies:
              email_in_id_token:
                custom_claims:
                  groups:
                    attribute: 'groups'
                id_token: ['email', 'email_verified', 'groups']
              # Найдено реальным прогоном (platform/aicd-devops-labs-ru): Gitea
              # (goth/openidConnect) требует ОБА claim'а email и nickname в ID Token, иначе
              # "Auto Registration ... returned missing fields: email,nickname". "nickname" не
              # входит в стандартный набор claim'ов, который отдаёт Authelia (в отличие от
              # email/profile) — заводится через custom_claims как алиас на
              # "preferred_username" (стандартный claim scope 'profile', который Authelia УЖЕ
              # производит из LDAP-атрибута uid). custom-claim должен быть явно перечислен в
              # scopes ниже, иначе Authelia не разрешит его запросить (claims_policy сам по себе
              # не выдаёт права на claim, только переносит УЖЕ разрешённые scope'ом claim'ы в
              # ID Token).
              gitea_claims:
                custom_claims:
                  nickname:
                    attribute: 'username'
                  groups:
                    attribute: 'groups'
                id_token: ['email', 'email_verified', 'nickname', 'groups']
            # 'groups' — НЕ регистрируется здесь как custom scope (в отличие от 'nickname') —
            # живым прогоном найдено: Authelia отказывается стартовать ("scope with name 'groups'
            # can't be used as a custom scope because it's a standard scope") — 'groups' уже
            # встроенный scope (виден в дефолте authelia debug oidc claims --scopes, включает его
            # автоматически), клиентам достаточно перечислить 'groups' в своих scopes: ниже.
            scopes:
              nickname:
                claims: ['nickname']
            clients:
              - client_id: 'semaphore'
                client_name: 'Semaphore'
                client_secret: '[[ (ds "vault").data.semaphore_client_secret_hash ]]'
                public: false
                authorization_policy: 'one_factor'
                require_pkce: false
                # consent_mode: 'pre-configured' — без него дефолт 'explicit' запрашивает согласие
                # заново при КАЖДОМ входе (Authelia хранит consent-сессию только на время самого
                # OIDC-обмена, не переживает logout/новую сессию). pre-configured сохраняет решение
                # пользователя (привязано к subject+client_id+scopes+audience — при их изменении
                # согласие запросится заново один раз) на pre_configured_consent_duration.
                consent_mode: 'pre-configured'
                pre_configured_consent_duration: '1 year'
                # Найдено реальным прогоном (platform/aicd-devops-labs-ru): без явного
                # token_endpoint_auth_method Authelia регистрирует клиент с дефолтным
                # client_secret_basic — Semaphore (v2.19.8) при обмене authorization code на
                # токен отправляет client_secret_post, Authelia отвечает invalid_client
                # ("token_endpoint_auth_method... does not allow this method"). Логин зависал на
                # редиректе после успешной аутентификации в Authelia — тот же баг здесь.
                token_endpoint_auth_method: 'client_secret_post'
                claims_policy: 'email_in_id_token'
                redirect_uris:
                  - 'https://semaphore.aicd.platform/api/auth/oidc/authelia/redirect'
                scopes: ['openid', 'profile', 'email', 'groups']
                response_types: ['code']
                grant_types: ['authorization_code']
              - client_id: 'gitea'
                client_name: 'Gitea'
                client_secret: '[[ (ds "vault").data.gitea_client_secret_hash ]]'
                public: false
                authorization_policy: 'one_factor'
                require_pkce: false
                consent_mode: 'pre-configured'
                pre_configured_consent_duration: '1 year'
                claims_policy: 'gitea_claims'
                redirect_uris:
                  - 'https://gitea.aicd.platform/user/oauth2/authelia/callback'
                scopes: ['openid', 'profile', 'email', 'nickname', 'groups']
                response_types: ['code']
                grant_types: ['authorization_code']
              # docs/adr/0017-platform-cicd-default-addons.md — третий аддон (мониторинг),
              # native OIDC (Grafana умеет сама, см. helm/values/.../monitoring/grafana-operator/
              # values.yaml) — тот же принцип, что Semaphore/Gitea выше, не forwardAuth.
              # token_endpoint_auth_method: client_secret_basic — задокументированный дефолт
              # Grafana для auth.generic_oauth (в отличие от Semaphore выше, который явно нуждался
              # в client_secret_post) — сверить реальным логином, поправить при invalid_client.
              - client_id: 'grafana'
                client_name: 'Grafana'
                client_secret: '[[ (ds "vault").data.grafana_client_secret_hash ]]'
                public: false
                authorization_policy: 'one_factor'
                require_pkce: false
                consent_mode: 'pre-configured'
                pre_configured_consent_duration: '1 year'
                token_endpoint_auth_method: 'client_secret_basic'
                claims_policy: 'email_in_id_token'
                redirect_uris:
                  - 'https://grafana.aicd.platform/login/generic_oauth'
                scopes: ['openid', 'profile', 'email', 'groups']
                response_types: ['code']
                grant_types: ['authorization_code']

deployments:
  authelia:
    # Найдено живым прогоном (ADR-0019 §8 шаг 2, добавление claim 'groups'): configuration.yml
    # монтируется ниже через configMap + subPath — kubelet НЕ перемонтирует subPath-файл живому
    # поду при изменении ConfigMap (в отличие от обычного volume mount на директорию), поэтому
    # без принудительного рестарта уже работающий под продолжает работать со старым конфигом
    # сколько угодно долго после `helmwave up`, который сам по себе покажет "changed" и ничего не
    # заподозрит — тот же класс бага, что htpasswd/subPath в infra_panel (ADR-0008 §2). checksum
    # аннотация форсирует rolling restart при любом изменении содержимого configMaps.config.data.
    podAnnotations:
      checksum/config: '{{ include "helpers.workload.checksum" $.Values.configMaps.config.data }}'
    containers:
      - name: authelia
        image: authelia/authelia
        imageTag: "4.39.20"
        ports:
          - name: http
            containerPort: 9091
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /config/configuration.yml
            subPath: configuration.yml
    volumes:
      - name: data
        type: pvc
      - name: config
        type: configMap

services:
  authelia:
    ports:
      - name: http
        port: 9091

# Basic-auth перед самой Authelia не нужен — это и есть auth-портал, обязан быть доступен без
# предварительной авторизации (тот же принцип, что уже применён к OpenBao/Gitea/Semaphore —
# self-auth, дополнительный middleware избыточен).
ingressroutes:
  authelia:
    entryPoints:
      - websecure
    routes:
      "Host(`sso.aicd.platform`)":
        services:
          authelia-authelia:
            port: 9091
    tls:
      secretName: authelia-tls
