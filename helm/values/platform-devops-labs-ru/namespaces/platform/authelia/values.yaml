# Authelia — единая авторизация, тот же приём, что helm/values/platform/namespaces/platform/authelia/
# values.yaml (platform/aicd), домен aicd.devops-labs.ru вместо aicd.platform. Полный разбор
# решений/находок реального прогона — docs/adr/0013-unified-auth-architecture.md §7 (комментарии
# здесь сокращены до различий, полный текст — в файле-эталоне первого окружения).
#
# ВНИМАНИЕ: этот файл целиком — gomplate-шаблон (см. helm/helmwave.yml.tpl) — не используйте
# парные квадратные скобки нигде в этом файле, даже в комментариях.

[[ defineDatasource "vault" "vault:///secret/data/authelia" ]]

pvcs:
  data:
    accessModes:
      - ReadWriteOnce
    size: 1Gi
    storageClassName: local-path

configMaps:
  config:
    data:
      configuration.yml: |
        theme: light
        default_2fa_method: totp

        server:
          address: 'tcp://:9091'

        log:
          level: info

        totp:
          issuer: aicd.devops-labs.ru

        authentication_backend:
          password_reset:
            disable: true
          ldap:
            implementation: 'freeipa'
            address: 'ldap://ipa.aicd.devops-labs.ru:389'
            base_dn: 'DC=aicd,DC=devops-labs,DC=ru'
            user: 'UID=svc-authelia,CN=users,CN=accounts,DC=aicd,DC=devops-labs,DC=ru'
            password: '[[ (ds "vault").data.ldap_bind_password ]]'

        access_control:
          default_policy: deny
          rules:
            - domain: 'sso.aicd.devops-labs.ru'
              policy: bypass
            # docs/adr/0019-platform-rbac-model.md §8 шаг 5 — group-gated вместо плоского
            # one_factor, тем же приёмом, что platform/aicd (эталон, живо проверено там же).
            # subject — плоский список = OR (authelia.com/configuration/security/access-control/).
            - domain: 'infra-panel.aicd.devops-labs.ru'
              policy: one_factor
              subject:
                - 'group:platform-admins'
                - 'group:platform-engineers'
                - 'group:platform-viewers'
            - domain: 'radar.aicd.devops-labs.ru'
              policy: one_factor
              subject:
                - 'group:platform-admins'
                - 'group:platform-engineers'
                - 'group:platform-viewers'

        session:
          secret: '[[ (ds "vault").data.session_secret ]]'
          cookies:
            - domain: 'aicd.devops-labs.ru'
              authelia_url: 'https://sso.aicd.devops-labs.ru'
              default_redirection_url: 'https://infra-panel.aicd.devops-labs.ru'

        storage:
          encryption_key: '[[ (ds "vault").data.storage_encryption_key ]]'
          local:
            path: /data/db.sqlite3

        notifier:
          disable_startup_check: true
          filesystem:
            filename: /data/notification.txt

        identity_validation:
          reset_password:
            jwt_secret: '[[ (ds "vault").data.jwt_secret ]]'

        identity_providers:
          oidc:
            hmac_secret: '[[ (ds "vault").data.oidc_hmac_secret ]]'
            jwks:
              - key_id: 'main'
                algorithm: 'RS256'
                use: 'sig'
                key: "[[ (ds "vault").data.oidc_issuer_private_key | strings.ReplaceAll "\n" "\\n" ]]"
            # Найдено реальным прогоном (клик-тест логина): по спецификации OIDC claims scope
            # 'email' (email/email_verified) по умолчанию доступны только через /userinfo, НЕ
            # встраиваются в сам ID Token — и Semaphore (v2.19.8), и Gitea читают claim 'email'
            # именно из ID Token, не делают отдельный запрос к userinfo, поэтому получали ошибку
            # "claim 'email' missing or has bad format" несмотря на то, что LDAP-атрибут mail
            # реально существует и виден bind-аккаунту svc-authelia (проверено ldapsearch).
            # claims_policies — официальный механизм Authelia (authelia.com/configuration/
            # identity-providers/openid-connect/claims/) принудительно скопировать claim'ы в
            # ID Token сверх стандартного поведения.
            # docs/adr/0019-platform-rbac-model.md §4/§8 шаг 2 — claim 'groups' тем же приёмом,
            # что email/nickname ниже. 'groups' — НЕ регистрируется как custom scope в scopes:
            # (в отличие от 'nickname') — живым прогоном на platform/aicd найдено: Authelia
            # отказывается стартовать ("scope with name 'groups' can't be used as a custom scope
            # because it's a standard scope") — 'groups' уже встроенный scope. custom_claims.
            # groups.attribute: 'groups' всё равно нужен — сам claim в ID Token без него не
            # попадает, хотя в userinfo уже виден (тот же паттерн, что email/nickname). Полный
            # разбор — helm/values/platform/namespaces/platform/authelia/values.yaml (эталон).
            claims_policies:
              email_in_id_token:
                custom_claims:
                  groups:
                    attribute: 'groups'
                id_token: ['email', 'email_verified', 'groups']
              # Найдено реальным прогоном: Gitea (goth/openidConnect) требует ОБА claim'а
              # email и nickname в ID Token, иначе "Auto Registration ... returned missing
              # fields: email,nickname". "nickname" не входит в стандартный набор claim'ов,
              # который отдаёт Authelia (в отличие от email/profile) — заводится через
              # custom_claims как алиас на "preferred_username" (стандартный claim scope
              # 'profile', который Authelia УЖЕ производит из LDAP-атрибута uid). custom-claim
              # должен быть явно перечислен в scopes ниже, иначе Authelia не разрешит его
              # запросить (claims_policy сам по себе не выдаёт права на claim, только
              # переносит УЖЕ разрешённые scope'ом claim'ы в ID Token).
              gitea_claims:
                custom_claims:
                  nickname:
                    attribute: 'username'
                  groups:
                    attribute: 'groups'
                id_token: ['email', 'email_verified', 'nickname', 'groups']
            scopes:
              nickname:
                claims: ['nickname']
            # docs/adr/0019-platform-rbac-model.md §5/§8 шаг 5 — тем же приёмом, что platform/aicd
            # (эталон, живо проверено там же). Две политики по матрице §6: platform_all_groups
            # (все три группы) для Grafana/Gitea, platform_engineers_admins (без viewers) для
            # Semaphore — единственный сервис, куда platform-viewers осознанно не допускаются.
            authorization_policies:
              platform_all_groups:
                default_policy: deny
                rules:
                  - policy: one_factor
                    subject:
                      - 'group:platform-admins'
                      - 'group:platform-engineers'
                      - 'group:platform-viewers'
              platform_engineers_admins:
                default_policy: deny
                rules:
                  - policy: one_factor
                    subject:
                      - 'group:platform-admins'
                      - 'group:platform-engineers'
            clients:
              - client_id: 'semaphore'
                client_name: 'Semaphore'
                client_secret: '[[ (ds "vault").data.semaphore_client_secret_hash ]]'
                public: false
                authorization_policy: 'platform_engineers_admins'
                require_pkce: false
                # consent_mode: 'pre-configured' — без него дефолт 'explicit' запрашивает согласие
                # заново при каждом входе, см. полный разбор в файле-эталоне первого окружения
                # (helm/values/platform/namespaces/platform/authelia/values.yaml).
                consent_mode: 'pre-configured'
                pre_configured_consent_duration: '1 year'
                # Найдено реальным прогоном: без явного token_endpoint_auth_method Authelia
                # регистрирует клиент с дефолтным client_secret_basic — Semaphore (v2.19.8) при
                # обмене authorization code на токен отправляет client_secret_post, Authelia
                # отвечает invalid_client ("token_endpoint_auth_method... does not allow this
                # method"). Логин зависал на редиректе после успешной аутентификации в Authelia.
                token_endpoint_auth_method: 'client_secret_post'
                claims_policy: 'email_in_id_token'
                redirect_uris:
                  - 'https://semaphore.aicd.devops-labs.ru/api/auth/oidc/authelia/redirect'
                scopes: ['openid', 'profile', 'email', 'groups']
                response_types: ['code']
                grant_types: ['authorization_code']
              - client_id: 'gitea'
                client_name: 'Gitea'
                client_secret: '[[ (ds "vault").data.gitea_client_secret_hash ]]'
                public: false
                authorization_policy: 'platform_all_groups'
                require_pkce: false
                consent_mode: 'pre-configured'
                pre_configured_consent_duration: '1 year'
                claims_policy: 'gitea_claims'
                redirect_uris:
                  - 'https://gitea.aicd.devops-labs.ru/user/oauth2/authelia/callback'
                scopes: ['openid', 'profile', 'email', 'nickname', 'groups']
                response_types: ['code']
                grant_types: ['authorization_code']
              # docs/adr/0017-platform-cicd-default-addons.md — третий аддон, тот же принцип, что
              # helm/values/platform/namespaces/platform/authelia/values.yaml.
              - client_id: 'grafana'
                client_name: 'Grafana'
                client_secret: '[[ (ds "vault").data.grafana_client_secret_hash ]]'
                public: false
                authorization_policy: 'platform_all_groups'
                require_pkce: false
                consent_mode: 'pre-configured'
                pre_configured_consent_duration: '1 year'
                token_endpoint_auth_method: 'client_secret_basic'
                claims_policy: 'email_in_id_token'
                redirect_uris:
                  - 'https://grafana.aicd.devops-labs.ru/login/generic_oauth'
                scopes: ['openid', 'profile', 'email', 'groups']
                response_types: ['code']
                grant_types: ['authorization_code']

deployments:
  authelia:
    # Найдено живым прогоном на platform/aicd (ADR-0019 §8 шаг 2): configuration.yml монтируется
    # ниже через configMap + subPath, который kubelet НЕ перемонтирует живому поду при изменении
    # ConfigMap — helmwave up показывает "changed", но уже запущенный под молча продолжает
    # работать со старым конфигом без единой ошибки. checksum-аннотация форсирует rolling restart
    # при любом изменении configMaps.config.data. Применяется здесь превентивно (тот же чарт, та
    # же subPath-схема, что на platform/aicd) — см. эталон,
    # helm/values/platform/namespaces/platform/authelia/values.yaml.
    podAnnotations:
      checksum/config: '{{ include "helpers.workload.checksum" $.Values.configMaps.config.data }}'
    containers:
      - name: authelia
        image: authelia/authelia
        imageTag: "4.39.20"
        ports:
          - name: http
            containerPort: 9091
        volumeMounts:
          - name: data
            mountPath: /data
          - name: config
            mountPath: /config/configuration.yml
            subPath: configuration.yml
    volumes:
      - name: data
        type: pvc
      - name: config
        type: configMap

services:
  authelia:
    ports:
      - name: http
        port: 9091

ingressroutes:
  authelia:
    entryPoints:
      - websecure
    routes:
      "Host(`sso.aicd.devops-labs.ru`)":
        services:
          authelia-authelia:
            port: 9091
    tls:
      secretName: authelia-tls
