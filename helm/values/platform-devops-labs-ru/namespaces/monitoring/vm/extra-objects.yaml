# Только platform-devops-labs-ru — GPU-нода llm1 (ADR-0015) существует только в этом окружении.
# VMPodScrape (CRD victoria-metrics-operator) вместо vmScrape встроенного в чарт механизма —
# dcgm-exporter не часть ни одного под-чарта vm/victoria-metrics-k8s-stack, разворачивается
# отдельным DaemonSet в site.yml (по образцу nvidia-device-plugin, kube-system, nodeSelector
# llm1) — нужен явный scrape-объект, ссылающийся на его pod-label.
extraObjects:
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMPodScrape
    metadata:
      name: dcgm-exporter
      namespace: monitoring
    spec:
      namespaceSelector:
        matchNames:
          - kube-system
      selector:
        matchLabels:
          app.kubernetes.io/name: dcgm-exporter
      podMetricsEndpoints:
        - port: metrics
          path: /metrics
          interval: 30s

  # roles/monitoring_agent — экспортёры на хосте freeipa (вне k3s-кластера вовсе, обычный
  # k8s-native scrape этого чарта его не покрывает). Только freeipa — на llm1 (в кластере)
  # отдельный systemd node_exporter НЕ ставится: живым прогоном (2026-08-29) найдено, что
  # DaemonSet prometheus-node-exporter чарта реально работает и там (wildcard toleration
  # operator: Exists без key толерирует любой NoSchedule-taint, включая dedicated=agents) — этот
  # хост уже покрыт штатным механизмом чарта, отдельная запись была бы дублирующим таргетом на
  # тот же порт 9100. VMScrapeConfig/staticConfigs — аналог file_sd/static_configs для целей без
  # собственного k8s-объекта для селектора. vmagent этого релиза поднят с
  # selectAllByDefault: true (проверено на живом стенде, kubectl get vmagent -o jsonpath — тот же
  # режим, что уже подхватывает VMPodScrape выше), явный scrapeConfigSelector не нужен.
  #
  # job: "node-exporter" (через дефис, не "node_exporter") — намеренно совпадает с именем job у
  # штатного in-cluster DaemonSet'а чарта (jobLabel-механизм prometheus-node-exporter subchart'а,
  # см. ../vm/values.yaml). Найдено живым прогоном (2026-09-03, дашборд "Node Exporter Full",
  # docs/adr/0017-platform-cicd-default-addons.md §5): при разных именах job'ов freeipa и
  # in-cluster нода оказывались в РАЗНЫХ пунктах выпадающего списка "Job" одного и того же
  # дашборда — не баг, но лишний шаг для оператора и разделение того, что по сути один и тот же
  # тип экспортёра. Общий job делает freeipa обычным выбираемым хостом в уже существующем
  # бандловом дашборде без отдельной записи/дублирования.
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMScrapeConfig
    metadata:
      name: monitoring-agent-hosts
      namespace: monitoring
    spec:
      staticConfigs:
        - targets:
            - "10.10.10.248:9100"
          labels:
            job: node-exporter
            instance: freeipa
        - targets:
            - "10.10.10.248:9189"
          labels:
            job: ipa_exporter
            instance: freeipa
        # docs/adr/0023-postgresql-standalone-role.md — standalone PostgreSQL, тот же паттерн
        # static target, что freeipa выше.
        - targets:
            - "10.10.10.246:9100"
          labels:
            job: node-exporter
            instance: postgresql-infra-1
        - targets:
            - "10.10.10.246:9187"
          labels:
            # job: postgres-exporter (дефис, не postgres_exporter) — намеренно совпадает с тем,
            # что ожидает дашборд ADDONS/grafana_dashboards/postgres_exporter_12485.json
            # (label_values({job="postgres-exporter"}, instance)), тот же принцип, что node-exporter
            # выше.
            job: postgres-exporter
            instance: postgresql-infra-1

  # docs/adr/0022-new-component-requirements.md §4 — нативные метрики Gitea, эталон разбора —
  # helm/values/platform/namespaces/monitoring/vm/extra-objects.yaml, первый стенд.
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMServiceScrape
    metadata:
      name: gitea
      namespace: monitoring
    spec:
      namespaceSelector:
        matchNames:
          - platform
      selector:
        matchLabels:
          app.kubernetes.io/instance: gitea
      endpoints:
        - port: http
          path: /metrics
          interval: 30s

  # docs/adr/0022-new-component-requirements.md §4 — аудит litellm нашёл этот пробел (2026-09-13):
  # /metrics был включён (litellm_settings.callbacks: ["prometheus"] выше в этом же коммите), но
  # ничего его не скрейпило и дашборда не было — тот же класс проблемы, что уже описан этим
  # требованием (экспортёр без дашборда). Тот же порт (http, 4000), что и сам API — LiteLLM
  # отдаёт /metrics с того же процесса, отдельного экспортёра не требуется. bearerTokenSecret —
  # найдено живой проверкой: LiteLLM требует Authorization для ЛЮБОГО эндпоинта, включая /metrics
  # (401 без токена, не открытый по умолчанию, как у большинства экспортёров). Секрет
  # litellm-metrics-token — в namespace monitoring (site.yml, play "ADR-0015 §6/§7 —
  # LiteLLM-гейтвей"): kubectl explain подтверждает, что bearerTokenSecret обязан лежать в том же
  # namespace, что сам VMServiceScrape, а не в namespace таргета.
  - apiVersion: operator.victoriametrics.com/v1beta1
    kind: VMServiceScrape
    metadata:
      name: litellm
      namespace: monitoring
    spec:
      namespaceSelector:
        matchNames:
          - gateway
      selector:
        matchLabels:
          app.kubernetes.io/instance: litellm
      endpoints:
        - port: http
          path: /metrics
          interval: 30s
          bearerTokenSecret:
            name: litellm-metrics-token
            key: token
