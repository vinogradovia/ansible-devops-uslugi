
image:
  # -- grafana operator image registry
  registry: ghcr.io
  # -- grafana operator image repository
  repository: grafana/grafana-operator
  # -- The image pull policy to use in grafana operator container
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: "v5.22.0"

dashboard:
  # -- Whether to create a ConfigMap containing a dashboard monitoring the operator metrics.
  # Consider enabling this if you are enabling the ServiceMonitor.
  # Optionally, a GrafanaDashboard CR can be manually created pointing to the Grafana.com dashboard ID 22785
  # https://grafana.com/grafana/dashboards/22785-grafana-operator/
  # The Grafana.com dashboard is maintained by the community and does not necessarily match the JSON definition in this repository.
  enabled: true
  # -- Annotations to add to the Grafana dashboard ConfigMap
  annotations: {}
  # -- Labels to add to the Grafana dashboard ConfigMap
  labels: {}

# -- Array of extra K8s objects to deploy
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: grafana-ldap-config
    data:
      ldap.toml: |
        verbose_logging = true
        [[ print "[[" ]]servers[[ print "]]" ]]
        host = "sl-ldap-01.in.example.com"
        port = 389
        use_ssl = true
        start_tls = true
        ssl_skip_verify = false
        root_ca_cert = "/etc/grafana-ldap-configmaps/ldap-ca.crt"
        bind_dn = "uid=grafana-client,cn=users,cn=accounts,dc=in,dc=example,dc=com"
        bind_password = 'CHANGEME_LDAP_BIND_PASSWORD'
        search_filter = "(uid=%s)"
        search_base_dns = ["cn=users,cn=accounts,dc=in,dc=example,dc=com"]
        group_search_base_dns = ["cn=groups,cn=accounts,dc=in,dc=example,dc=com"]
        [servers.attributes]
        name = "givenName"
        surname = "sn"
        username = "uid"
        member_of = "memberOf"
        email =  "mail"
        [[ print "[[" ]]servers.group_mappings[[ print "]]" ]]
        group_dn = "cn=admins,cn=groups,cn=accounts,dc=in,dc=example,dc=com"
        org_role = "Admin"
        grafana_admin = true
        [[ print "[[" ]]servers.group_mappings[[ print "]]" ]]
        group_dn = "cn=dev,cn=groups,cn=accounts,dc=in,dc=example,dc=com"
        org_role = "Editor"
        [[ print "[[" ]]servers.group_mappings[[ print "]]" ]]
        group_dn = "*"
        org_role = "Viewer"
