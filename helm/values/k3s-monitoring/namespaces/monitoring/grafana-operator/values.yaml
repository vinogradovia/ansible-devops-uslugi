  - apiVersion: grafana.integreatly.org/v1beta1
    kind: GrafanaDatasource
    metadata:
      name: loki-infra
    spec:
      instanceSelector:
        matchLabels:
          dashboards: "grafana"
      datasource:
        name: Loki-infra
        type: loki
        access: proxy
        # Grafana и Loki (release "loki", chart grafana/loki) — в одном namespace одного кластера,
        # поэтому обращаемся по внутреннему cluster-DNS сервиса "loki-gateway", а не через внешний
        # Ingress/DNS ("logs.in.example.com" из ../loki/values.yaml — используется только для
        # внешнего доступа monitoring_agent/Promtail, не для этого server-side запроса Grafana).
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: false
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "infra"

  - apiVersion: grafana.integreatly.org/v1beta1
    kind: GrafanaDatasource
    metadata:
      name: loki
    spec:
      instanceSelector:
        matchLabels:
          dashboards: "grafana"
      datasource:
        name: Loki
        type: loki
        access: proxy
        # Grafana и Loki (release "loki", chart grafana/loki) — в одном namespace одного кластера,
        # поэтому обращаемся по внутреннему cluster-DNS сервиса "loki-gateway", а не через внешний
        # Ingress/DNS ("logs.in.example.com" из ../loki/values.yaml — используется только для
        # внешнего доступа monitoring_agent/Promtail, не для этого server-side запроса Grafana).
        url: http://loki-gateway.monitoring.svc.cluster.local
        isDefault: true
        jsonData:
          httpHeaderName1: "X-Scope-OrgID"
        secureJsonData:
          httpHeaderValue1: "tenant1"

  - apiVersion: grafana.integreatly.org/v1beta1
    kind: GrafanaFolder
    metadata:
      name: addons
    spec:
      instanceSelector:
        matchLabels:
          dashboards: "grafana"
      # If title is not defined, the value will be taken from metadata.name
      title: ADDONS

  - apiVersion: grafana.integreatly.org/v1beta1
    kind: GrafanaFolder
    metadata:
      name: nginx
    spec:
      instanceSelector:
        matchLabels:
          dashboards: "grafana"
      # If title is not defined, the value will be taken from metadata.name
      title: Nginx

