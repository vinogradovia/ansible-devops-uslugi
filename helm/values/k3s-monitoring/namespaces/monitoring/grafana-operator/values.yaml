  - apiVersion: grafana.integreatly.org/v1beta1
    kind: Grafana
    metadata:
      name: grafana
      labels:
        dashboards: "grafana"
    spec:
      config:
        auth.ldap:
          enabled: "true"
          config_file: /etc/grafana-ldap-configmaps/ldap.toml
        log:
          mode: "console"
      disableDefaultAdminSecret: true
        # security:
        #   admin_user: root
        #   admin_password: secret
      ingress:
        spec:
          ingressClassName: traefik
          rules:
            - host: grafana.in.example.com
              http:
                paths:
                  - backend:
                      service:
                        name: grafana-service
                        port:
                          number: 3000
                    path: /
                    pathType: Prefix
      persistentVolumeClaim:
        spec:
          storageClassName: local-monitoring-storage
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
      deployment:
        spec:
          template:
            spec:
              containers:
                - name: grafana
                  readinessProbe:
                    failureThreshold: 3
                  env:
                    - name: GF_SECURITY_ADMIN_USER
                      valueFrom:
                        secretKeyRef:
                          key: GF_SECURITY_ADMIN_USER
                          name: grafana-admin-credentials-custom
                    - name: GF_SECURITY_ADMIN_PASSWORD
                      valueFrom:
                        secretKeyRef:
                          key: GF_SECURITY_ADMIN_PASSWORD
                          name: grafana-admin-credentials-custom
                  volumeMounts:
                    - mountPath: /etc/grafana-ldap-configmaps
                      name: grafana-ldap-configmaps
                      readOnly: false
              volumes:
                - name: grafana-ldap-configmaps
                  configMap:
                    name: grafana-ldap-config
                - name: grafana-data
                  persistentVolumeClaim:
                    claimName: grafana-pvc
          strategy:
            type: Recreate

